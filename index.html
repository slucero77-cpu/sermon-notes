 es una democracia, y no hay necesidad de apresurarse. Espera en el Señor.<\/p><p><b>Las tres D del diablo:<\/b> busca <i>engañar<\/i>, luego <i>desanimar<\/i> y luego <i>destruir<\/i>. Si estamos desanimados, probablemente estamos engañados en algo. A medida que aprendemos a obedecer, dejamos de soltar palabras hirientes y los demás notan una paz en nosotros.<\/p>"},{"t":"El botón de pausa","h":"<p>Aísla cada pensamiento: ¿podría ser nuestro, del enemigo o de Dios? Pregúntale si conservarlo, descartarlo o examinarlo más.<\/p><p>Al principio abruma, como aprender a andar en bicicleta. Zac cuenta cómo su nieto pidió que le quitaran las ruedas de entrenamiento y aprendió con perseverancia.<\/p><div class='key'>Es como el botón de pausa del control remoto. La imagen se congela y podemos estudiarla, cuestionarla y hablar con el Señor sobre ella antes de actuar.<\/div><p>Eva pudo haberlo hecho. Llevar los pensamientos a la luz de Cristo hace real la salvación y nos hace sal y luz en nuestras esferas de influencia.<\/p>"},{"t":"Elige hoy: Josué 24","h":"<p>Dios busca personas que lo busquen con corazón humilde. Zac nos urge a no ser como las cinco vírgenes insensatas, porque una vez cerrada la puerta ya no hay más oportunidades.<\/p><p>Lee Josué 24:14–25. Josué advierte al pueblo que no puede servir al Señor con sus propias fuerzas, y ellos prometen servirlo de todos modos.<\/p><div class='key'>“Yo y mi casa serviremos al Señor.” Ese debería ser nuestro lema.<\/div><p>Esta noche: “Señor, quiero servirte mañana.” Mañana: “Señor, quiero servirte hoy.” Cierra en oración antes de la comunión, pidiéndole a Dios que escudriñe nuestros corazones.<\/p>"}],"qs":["Zac dice que la obediencia solo ocurre dentro de una relación íntima. ¿Cómo describirías tu cercanía con Dios ahora mismo y qué la profundizaría?","¿Cómo distingues si un pensamiento es tuyo, del enemigo o de Dios? ¿Qué prácticas te ayudan a contrastarlo con la Escritura?","¿Dónde tiendes a reaccionar en lugar de responder? ¿Cómo se vería hacer una pausa y orar antes de hablar o actuar?","¿Tienes un lugar y un momento en que silencias las distracciones para escuchar a Dios? ¿Qué te lo impide?","¿Cuál de las excusas que nombra Zac te toca más de cerca: racionalizar, echar culpas, quejarse, pereza o complacencia?","Josué dijo “escojan hoy”. ¿Qué cosa vas a llevar cautiva y obedecer esta semana?"]},"eoh1":{"tab":"El fin de la historia 1","title":"El fin de la historia","meta":"Andrew Kelley · 17 may 2026 · Hope Chapel","ref":"Lucas 21:25–28","verse":"“Habrá señales en el sol, en la luna y en las estrellas… hombres desfallecidos de terror por la expectación de las cosas que vendrán sobre el mundo… Entonces verán al Hijo del Hombre venir en una nube con poder y gran gloria. Cuando estas cosas comiencen a suceder, enderécense y levanten la cabeza, porque su redención se acerca.” (Lucas 21:25–28, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Como la historia avanza hacia un fin fijo (el regreso de Cristo en poder y gloria), su pueblo puede ponerse de pie y levantar la cabeza con alegre expectativa, aun cuando el mundo tiembla y se desmorona.","take":["El cristianismo sostiene que la historia tiene un <i>telos<\/i> (una meta) y que la alcanzará.","El mundo que se siente seguro y fuerte será expuesto en el juicio como confundido y frágil; tanto la sabiduría mundana como la fuerza humana se derrumban.","Jesús no es solo un profeta: es Yahvé mismo, el Hijo del Hombre de Daniel 7, que regresará en una nube con poder y gran gloria.","Primera venida: humilde y oscura. Segunda venida: inconfundible y gloriosa.","Los que están en Cristo no tienen juicio que temer, pues cayó sobre Cristo, y por eso reciben su regreso con gozo.","La demora del juicio no es indiferencia ni aprobación de Dios; es su misericordia."],"scr":[["Lucas 21:25–28","La sacudida del mundo, la venida del Hijo del Hombre y “enderécense y levanten la cabeza”."],["1 Corintios 1:19–21","Dios hace necia la sabiduría del mundo."],["Santiago 3:13–15","“Sabiduría” terrenal, natural y demoníaca."],["Isaías 13:6–8","El día del Señor: todas las manos se debilitarán, todo corazón humano se derretirá."],["Jeremías 17:5–6","Maldito el hombre que confía en el hombre y hace de la carne su fortaleza."],["Salmos 33:16–17","El rey no se salva por su gran ejército."],["2 Pedro 3:8–10","El Señor es paciente, no queriendo que nadie perezca."],["Éxodo 34:5–7; Salmos 104:1–3","Las nubes como la presencia del mismo Dios."],["Daniel 7:13–14","Uno como hijo de hombre viene con las nubes del cielo."],["Marcos 14:61–64","Jesús: “Yo soy, y verán al Hijo del Hombre… viniendo con las nubes del cielo.”"],["1 Corintios 15:24–25","La autoridad de Cristo sobre todo."],["Apocalipsis 19:11–16","Fiel y Verdadero sobre un caballo blanco; Rey de reyes y Señor de señores."],["2 Timoteo 1:8–12","“Yo sé a quién he creído.”"],["Apocalipsis 21:1–6","Cielo nuevo y tierra nueva; “He aquí, yo hago nuevas todas las cosas.”"]],"secs":[{"t":"Apertura: Monopolio sin reglas","h":"<p>Los niños que juegan Monopolio antes de conocer las reglas inventan las suyas, los mayores abusan de los menores, el dinero no vale nada y el juego nunca termina porque nadie tiene una meta final. Andrew hizo que sus propios hijos jugaran bien… y los aplastó. El punto: nuestra cultura piensa la historia así, sin un fin a la vista.<\/p><div class='q'>“El juego nunca termina porque no hay metas en mente. El dinero es dinero de mentira. No saben cómo usarlo.”<\/div><p>El cristianismo tiene otra visión: la palabra griega <i>telos<\/i>: la historia apunta en una dirección y encontrará un fin.<\/p>"},{"t":"El desafío interpretativo: tres posturas","h":"<p>La semana pasada se trató la destrucción de Jerusalén (vv. 20–24). El versículo 25 parece pasar a la segunda venida, pero el versículo 32 dice “no pasará esta generación hasta que todo suceda”. Andrew leyó unos cincuenta comentarios y encontró cerca de cien respuestas.<\/p><ul><li><b>Preterista pleno:<\/b> todo se cumplió en el año 70 d. C.; la “venida” es el juicio de Dios mediante el ejército romano.<\/li><li><b>Cumplimiento múltiple (la postura de Andrew):<\/b> primero el 70 d. C., luego el patrón repetido de tribulación a lo largo de la historia, y finalmente el regreso de Cristo. “Es la que mejor explica los datos.”<\/li><li><b>Tipo generacional:<\/b> “esta generación” es un tipo de gente (malvada, justa, creyente), no un período de tiempo.<\/li><\/ul><div class='key'>“Sea cual sea tu postura, la aplicación para nuestras vidas es la misma: pase lo que pase, debemos anticipar con gozo el regreso de Cristo.”<\/div>"},{"t":"El mundo se sacude (vv. 25–26)","h":"<p>Este es un pasaje sobre el juicio, y es incómodo. El blanco es “el mundo”: el sistema de personas que se niegan persistentemente a recibir a Cristo, con sus hábitos, comodidades, promesas y esperanzas.<\/p><div class='q'>“Una advertencia siempre es un acto de misericordia.”<\/div><p>(Como los avisos de alerta por tornado en las puertas de los hoteles de Misuri: misericordia, no enojo.)<\/p><p><b>El mundo está confundido.<\/b> Nuestra cultura ha “firmado los papeles de divorcio con la verdad”: miente sobre los cuerpos, el dinero, el tiempo, la felicidad, y aun así afirmará conocer la verdad cuando llegue el juicio (1 Corintios 1:19–21; Santiago 3:13–15).<\/p><p><b>El mundo se debilita de miedo.<\/b> Construir sociedades es bueno (el dominio de Génesis 1), pero derivamos a pensar que lo hicimos solos, como releer un correo que creías afiladísimo. Entonces el juicio de Dios se encuentra con lo que pensábamos que era grandioso (Isaías 13; Jeremías 17; Salmos 33). Los castillos de Europa albergaron alguna vez a personas que se creían importantísimas; ahora son piedras en un itinerario turístico.<\/p><div class='key'>Si te apoyas en tu propio poder y logros, el juicio vendrá sobre ellos por fuertes que parezcan, si no te has vuelto a Cristo.<\/div><p><b>La demora es misericordia<\/b> (2 Pedro 3:8–10): “La demora del juicio no es aprobación de tu vida. No es indiferencia… No es pereza de parte de Dios. Es misericordia.”<\/p>"},{"t":"El Hijo regresa (v. 27)","h":"<p><b>En las nubes.<\/b> Las nubes marcan la presencia de Dios (Éxodo 34; Salmos 104). Daniel 7:13–14 es la fuente del “Hijo del Hombre” de Jesús, y el sumo sacerdote lo entendió: cuando Jesús dijo “Yo soy”, rasgó sus vestiduras (Marcos 14:61–64). Adoramos al Señor del universo, encarnado en Jesús, que regresará en ese cuerpo.<\/p><p><b>Con poder.<\/b> Él hizo el mundo, lo salva y lo juzgará y restaurará (1 Corintios 15:24–25). Andrew pregunta con ironía quién cree que los políticos cumplirán:<\/p><div class='q'>“Cuando Cristo regrese, puede hacerlo todo. No necesita tu voto. No necesita tu dinero. De verdad puede enderezar todo lo torcido.”<\/div><p><b>Con gloria<\/b> (<i>doxa<\/i>: reputación, el peso de quién eres). Primera venida: un bebé en un pesebre, sin ejército, sin hogar, rechazado, traicionado, golpeado, crucificado. “La segunda vez no se verá así.” (Apocalipsis 19:11–16)<\/p><div class='key'>Cuando aparezca, todos estarán de rodillas, ya sea en adoración o bajo el peso del juicio.<\/div>"},{"t":"La iglesia anticipa (v. 28)","h":"<p>Seguidores y no seguidores ven los mismos acontecimientos y responden de manera completamente distinta: los que se arrepintieron y confiaron en Cristo ya tienen su juicio pagado (Cristo lo cargó), así que él no tiene ninguno que darles.<\/p><p>A quien piensa “haz el bien, ve al cielo; haz el mal, ve al infierno”: la Biblia enseña que eras completamente incapaz de ganar el favor de Dios y necesitabas que alguien lo hiciera por ti. Cristo vivió perfectamente, murió bajo la ira en nuestro lugar y todos los que se vuelven y confían son declarados justos. Hoy es el día de salvación.<\/p><p><b>Doblados pero no quebrados.<\/b> Pablo escribiendo desde la cárcel (2 Timoteo 1:8–12). Para quienes pasan por enfermedad, dolor en las relaciones, apuros económicos o las pérdidas que trae la edad (cosas que se llevan y no vuelven), el regreso de Cristo no es una interrupción sino un rescate (Apocalipsis 21:1–6).<\/p>"},{"t":"Cierre: Shackleton en la isla Elefante","h":"<p>Del libro <i>Endurance<\/i>: el intento de Shackleton de cruzar la Antártida fracasa; el barco queda atrapado en el hielo. Sus hombres llegan a la isla Elefante y él deja a veintidós mientras se lleva a cinco a buscar ayuda. Los veintidós construyen toda una sociedad (botes salvavidas volcados como refugio, partidas de caza, guardias) y sobreviven cuatro meses. Todo lo que hicieron era esencial para sobrevivir.<\/p><div class='key'>“Ven a Shackleton y de inmediato todo eso no vale nada. Pueden abandonar el campamento. Pueden subir al bote.”<\/div><div class='q'>“Me tienta quedarme aquí, construir una vida permanente. Y las cosas de aquí sí importan. Pero creo, como estos hombres, que cuando vea a Cristo todo lo demás perderá su valor.”<\/div><p><b>“Enderézate. Enderézate. Mira a Cristo. Va a regresar.”<\/b><\/p>"}],"qs":["Andrew dice que nuestra cultura piensa la historia como niños jugando Monopolio sin reglas: sin fin, sin telos. ¿Cómo ha moldeado esa suposición tu manera de vivir día a día?","¿Cuál de las tres posturas interpretativas resuena más contigo, y cambia la aplicación que hace Andrew?","“La demora del juicio no es aprobación de tu vida: es misericordia.” ¿Cómo replantea eso la paciencia de Dios en este momento?","¿Dónde te tienta más confiar en el consejo del mundo antes que en el de la Escritura?","Andrew contrasta una primera venida humilde con una segunda gloriosa. ¿Qué te dice eso sobre cómo obra Cristo y cómo lo esperas ahora?","Para los que están en Cristo, su regreso es redención, no juicio. ¿Dónde lo sigues viviendo como una amenaza? ¿Cómo se vería darle la bienvenida?","Los hombres de la isla Elefante abandonaron su infraestructura de supervivencia en cuanto llegó su rescatista. ¿Qué es lo más difícil de soltar en tu vida?"]},"eoh2":{"tab":"El fin de la historia 2","title":"El fin de la historia, Parte 2","meta":"Zac Nazarian · Hope Chapel","ref":"Lucas 21:29–36","verse":"“Miren la higuera y todos los árboles. Cuando ya brotan, ustedes mismos lo ven y saben que el verano ya está cerca. Así también ustedes, cuando vean que suceden estas cosas, sepan que el reino de Dios está cerca… El cielo y la tierra pasarán, pero mis palabras no pasarán.” (Lucas 21:29–33, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Como Jesús regresa, cumpliendo cada promesa bíblica, los creyentes fijan sus ojos en él a través de las señales, se mantienen firmes sobre su Palabra inconmovible y viven en una expectativa ansiosa y vigilante.","take":["La segunda venida es “la más importante de todas las verdades bíblicas”, porque todas las demás encuentran allí su cumplimiento.","Las señales no están para alarmar sino para enfocar nuestros ojos en Jesús.","“Esta generación” probablemente se refiere a los que estén vivos cuando ocurran las señales finales: ellos sabrán que el fin está cerca.","Zac se inclina por la postura pretribulacional y premilenial, e invita a un desacuerdo caritativo.","El rapto y la segunda venida son dos acontecimientos distintos.","El cielo y la tierra pasarán, pero la Palabra de Jesús permanece para siempre."],"scr":[["Juan 14:15","“Si me aman, guardarán mis mandamientos.”"],["Romanos 8:18–23","La creación gime, esperando con anhelo la manifestación de los hijos de Dios."],["Salmos 141:8; Hebreos 12:2","Fijar los ojos en el Señor / en Jesús."],["2 Timoteo 3:1–4","Tiempos difíciles en los últimos días: amadores de sí mismos, del dinero, de los placeres."],["Daniel 11:31; 2 Tesalonicenses 2:3–4","La abominación desoladora; el hombre de pecado en el templo de Dios."],["Apocalipsis 5:9–10","El cántico nuevo de la redención en el cielo."],["Juan 14:1–3","Jesús volverá y llevará a su pueblo para que esté con él."],["1 Corintios 15:51–52","Transformados “en un abrir y cerrar de ojos”."],["1 Tesalonicenses 4:16–18; 5:9","Arrebatados en las nubes; Dios no nos destinó para ira."],["Zacarías 14:4","En la segunda venida el monte de los Olivos se parte."],["2 Pedro 3:10–13","Los cielos pasarán; esperamos cielos nuevos y tierra nueva."],["Apocalipsis 21:1; Isaías 65:17","Cielos nuevos y tierra nueva."]],"secs":[{"t":"Apertura: ¿Amas a Jesús?","h":"<p>Zac abre con preguntas directas: ¿Amas a Jesús? ¿Cómo lo sabes? ¿Cómo lo sabe <i>él<\/i>? Jesús mismo dio la prueba.<\/p><div class='q'>“Solo hay una prueba. ¿Qué dice él? Si me aman, ustedes… obedecerán.”<\/div><p>El amor a Jesús no es un sentimiento cálido sino fidelidad expresada en obediencia. ¿Te importa su gloria? ¿Esperas con ansias su regreso? Lo ancla en Romanos 8:18–23: toda la creación gime por lo que viene.<\/p>"},{"t":"La verdad bíblica más importante","h":"<div class='key'>“Les propongo que es la segunda venida de Jesucristo… todas las demás verdades bíblicas encuentran su cumplimiento en su segunda venida. Si no regresa, no tenemos nada.”<\/div><p>El regreso es la consumación de la historia redentora y del plan eterno de Dios. La enseñanza más completa de Jesús sobre esto es el Discurso del Monte de los Olivos (Mateo 24, Marcos 13, Lucas 21), dado el miércoles de su última semana desde el monte de los Olivos.<\/p>"},{"t":"La higuera: lo que hacen las señales","h":"<ul><li><b>Las señales se pueden ver.<\/b> Las hojas anuncian el verano. “Si no estamos mirando y pensando… perderemos la verdad.” Jesús usa <i>sepan<\/i> (v. 31) deliberadamente: no quiere que su pueblo dude ni se aparte.<\/li><li><b>Las señales ocurren dentro de una generación.<\/b> La generación del año 70 d. C. fue advertida, huyó y vio que sucedió exactamente como se dijo.<\/li><li><b>Las señales son seguras.<\/b> Sus palabras no pasarán.<\/li><\/ul><p><b>Las señales enfocan nuestra mirada<\/b> (Salmos 141:8; Hebreos 12:2): no para asustarnos sino para dirigirnos a Jesús.<\/p><p>Señales repasadas: falsos maestros y mesías, guerras, desastres que se intensifican, persecución, ejércitos alrededor de Jerusalén, fenómenos astronómicos: todo creciendo en gravedad. 2 Timoteo 3:1–4 muestra el panorama moral. <i>“Las cosas están empeorando. Es una señal.”<\/i><\/p>"},{"t":"La abominación desoladora","h":"<p>Dos señales específicas marcan la tribulación. La primera: a la mitad, el Anticristo, antes protector de Israel, profana un templo reconstruido (Daniel 11:31; 2 Tesalonicenses 2:3–4). Todavía no existe tal templo; Zac está atento a cualquier movimiento hacia uno.<\/p><p>La segunda mitad es el derramamiento más severo de la ira de Dios que el mundo haya visto; el Anticristo exige adoración a su imagen bajo pena de muerte, pero los que obedecen enfrentan la ira de Dios.<\/p>"},{"t":"“Esta generación”: ¿quién es?","h":"<p>Zac no es categórico, pero lo lee como la generación que esté viva cuando comiencen las señales finales, no solo el año 70 d. C. Así como la generación del primer siglo fue advertida de huir de Jerusalén, la generación final verá las señales y sabrá que el regreso del Hijo del Hombre es inminente. Cree que esa generación serán en su mayoría los salvos después del rapto de la iglesia.<\/p>"},{"t":"Hacia dónde se inclina Zac: rapto pretribulacional","h":"<p>Ha estudiado unos 25 comentarios y libros y se inclina por la postura premilenial y pretribulacional.<\/p><div class='q'>“No lo estoy poniendo en cemento. Si tienes una postura distinta, que Dios te bendiga. De todos modos no lo sabremos realmente hasta que todo termine.”<\/div><ul><li><b>1. El flujo del Apocalipsis.<\/b> La iglesia aparece en los capítulos 1–3; en el 4–5 la escena es el cielo, con los 24 ancianos cantando la redención (5:9–10); la iglesia está ausente de los capítulos 6–18 (la tribulación); regresa con Cristo en el capítulo 19.<\/li><li><b>2. No hay instrucciones sobre la tribulación para la iglesia.<\/b><\/li><li><b>3. Pasajes clave del rapto:<\/b> Juan 14:1–3; 1 Corintios 15:51–52; 1 Tesalonicenses 4:16–18; 1 Tesalonicenses 5:9.<\/li><li><b>4. Prefiguraciones del Antiguo Testamento:<\/b> Enoc (llevado), Noé (librado a través del diluvio), Lot (rescatado antes del juicio de Sodoma), Elías (llevado en un torbellino). <i>“Solo se los ofrezco para su consideración.”<\/i><\/li><li><b>5. Dos acontecimientos distintos:<\/b> en el rapto la iglesia se encuentra con Jesús en el aire; en la segunda venida regresa con él. El monte de los Olivos intacto vs. partido (Zacarías 14:4). El rapto es sin señales e inminente; la segunda venida tiene señales previas. El rapto involucra solo a los salvos; la segunda venida, a salvos y perdidos.<\/li><\/ul>"},{"t":"El cielo y la tierra pasarán; su Palabra no","h":"<p>El versículo 33 no es hipérbole: los cielos y la tierra actuales serán destruidos; su Palabra permanece para siempre.<\/p><div class='q'>“Yo me paro sobre su palabra. No sobre esa voz de allá. No sobre aquella filosofía. No sobre aquella persona. Me paro sobre su palabra. Es todo lo que necesito.”<\/div><p>2 Pedro 3: la misma palabra que hizo los cielos e inundó el mundo reserva ahora los cielos y la tierra presentes para el fuego. Después del milenio, el reinado de mil años de Jesús, Dios hace una nueva creación (Apocalipsis 21:1; Isaías 65:17).<\/p>"},{"t":"Cierre","h":"<p>Zac vuelve a la cadena de oro de Romanos 8: a los que predestinó, llamó; a los que llamó, justificó; a los que justificó, glorificó. Ya cumplido.<\/p><div class='key'>“Él lo hace todo. Nuestra parte es confiar en él. Nuestra parte es andar con él. Nuestra parte es seguirlo. Él es fiel y lo cumplirá.”<\/div><p>Luego guía a la iglesia a la Mesa del Señor.<\/p>"}],"qs":["Zac dice que la obediencia es la única prueba verdadera del amor a Jesús. ¿Dónde te llama Dios a confiar y obedecer aun cuando es incómodo?","Él llama a la segunda venida “la más importante de todas las verdades bíblicas”. ¿Te sorprende? ¿Cuánto moldea tu vida diaria el regreso de Cristo?","Las señales están para fijar nuestra mirada en Jesús, no para asustarnos. Cuando oyes noticias perturbadoras, ¿te acercan a Cristo o a la ansiedad?","Zac repasa a Enoc, Noé, Lot y Elías como posibles prefiguraciones del rapto. ¿Qué tienen en común y qué sugiere eso sobre aquellos a quienes Dios rescata?","De las tres (disipación, embriaguez, afanes de esta vida), ¿cuál es tu tentación más presente?","“El cielo y la tierra pasarán, pero mis palabras jamás pasarán.” ¿Cómo se vería edificar tu vida con más firmeza sobre eso?","Zac termina: “Nuestra parte es confiar en él… andar con él… seguirlo.” ¿Cuál es un paso concreto que podrías dar esta semana?"]},"eoh3":{"tab":"El fin de la historia 3","title":"El fin de la historia, Parte 3","meta":"Zac Nazarian · Hope Chapel","ref":"Lucas 21:34–36","verse":"“Pero estén alerta, no sea que sus corazones se carguen de disipación, de embriaguez y de las preocupaciones de la vida, y aquel día venga de improviso sobre ustedes como un lazo… Velen en todo tiempo, orando para que tengan fuerzas para escapar de todas estas cosas que están por suceder y para comparecer delante del Hijo del Hombre.” (Lucas 21:34–36, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Como el regreso de Jesús es inminente y su juicio seguro, los creyentes viven en constante preparación: vigilantes, orando y compartiendo con urgencia el evangelio con quienes aún no están listos.","take":["Jesús no dijo cuándo viene, solo que viene, y debemos estar vestidos y listos.","El rapto es el próximo acontecimiento en el calendario de Jesús: inminente, podría ocurrir sin aviso.","Tres cosas cargan el corazón y roban la preparación: la disipación, la embriaguez y la ansiedad.","La preocupación no es solo comprensible: Jesús nos manda no afanarnos y confiar en el plan perfecto de Dios.","Anticipar su regreso debe producir santidad de vida y evangelización urgente, no una espera pasiva.","Evangelismo cotidiano: oración diaria, una lista de oración de amigos perdidos y tiempo real con los no creyentes."],"scr":[["Apocalipsis 18:21–23","La caída de Babilonia: nunca más música, luz ni voz de novio y novia."],["Romanos 1:7; 1 Tesalonicenses 1:10; 2 Tesalonicenses 2:1","Esperando al Hijo desde los cielos; reunidos con él."],["Apocalipsis 22:20","“Sí, vengo pronto. Amén. Ven, Señor Jesús.”"],["Lucas 12:39–40","El ladrón viene a una hora que no esperan."],["Gálatas 5:19–21","Obras de la carne: los que viven así no heredarán el reino."],["Efesios 5:18","“No se embriaguen con vino… sean llenos del Espíritu.”"],["Mateo 6:25, 31–34","“No se afanen por su vida… busquen primero su reino.”"],["Filipenses 4:4–7","No se afanen por nada; la paz de Dios guardará sus corazones."],["Mateo 9","Las multitudes, agobiadas y desamparadas como ovejas sin pastor."],["Colosenses 1:21–23","Presentados santos “si en verdad permanecen en la fe”."],["Hebreos 3:6, 14","Participamos de Cristo si retenemos firme hasta el fin."]],"secs":[{"t":"Apertura: La Navidad y el regreso de Cristo","h":"<p>¿De qué trata realmente la Navidad? Del nacimiento de Jesús, enterrado bajo las compras, Santa Claus y las fiestas de oficina. El mundo abraza a un niño en un pesebre pero no tolera al mismo Jesús regresando con poder, gloria y juicio.<\/p><div class='q'>“El mundo está ansioso por abrazar a un niño en un pesebre… Pero el mundo no tiene ninguna tolerancia para un Señor soberano que regresa con poder, gloria y juicio.”<\/div><p>Apocalipsis 18:21–23 pinta lo que su regreso significa para los sistemas y las fiestas del mundo: se acabaron las parrandas. Jesús vino la primera vez con humildad para salvar a pecadores; regresa con la plena manifestación de su deidad para juzgar y, por fin, poblar el cielo y el infierno.<\/p>"},{"t":"El regreso de Jesús es inminente","h":"<p>Después de semanas en el Discurso del Monte de los Olivos: Jesús describió señales pero guardó el <i>cuándo<\/i>. En lugar de una fecha dio un mandato: <b>estén listos.<\/b><\/p><p>Zac se inclina por la postura pretribulacional: ninguna señal precede al rapto, solo la aparición repentina de Cristo. Es el siguiente acontecimiento en el calendario de Jesús: podría ocurrir ahora mismo. <i>“Mi gran sueño es ser raptado mientras predico, no mientras hago tonterías.”<\/i><\/p><p>Apoyo: creyentes que esperan con ansias (Romanos 1:7; 1 Tesalonicenses 1:10; 2 Tesalonicenses 2:1) y los tres “vengo pronto” de Jesús en Apocalipsis 22. La respuesta de Juan es la de la iglesia: <b>“Ven, Señor Jesús.”<\/b><\/p>"},{"t":"Estén vestidos y listos: vivan con expectativa","h":"<p>Zac creció viendo Disneylandia en la tele cada miércoles mientras su papá prometía “Vamos a ir a Disneylandia”: una anticipación constante y vibrante. Esa es la postura ante el regreso de Cristo.<\/p><div class='q'>“Casi no puedo esperar. Casi no puedo esperar. Pero sé que debo esperar, y voy a esperar con expectativa.”<\/div><p>Examínate: ¿estoy atento, en guardia? Un ladrón no avisa (Lucas 12:39–40). Como en los días de Noé y de Lot, la gente comía, bebía, compraba, vendía, plantaba, edificaba… hasta que cayó el juicio.<\/p>"},{"t":"No dejes que tu corazón se cargue","h":"<p><b>Disipación<\/b>: inmoralidad, corrupción, autoindulgencia, sensualidad, libertinaje. Gálatas 5:19–21 enumera las marcas de quienes no heredarán el reino; decir que eres de Jesús mientras vives así no te hace cristiano.<\/p><p><b>Embriaguez<\/b>: Zac se niega a suavizarlo: “Lo llamamos la enfermedad del alcoholismo. Yo solo les digo lo que dice la Biblia: es pecado.” La alternativa no es la moderación sino otra plenitud (Efesios 5:18).<\/p><div class='q'>“Quiero embriagarme de Dios… ¿Puede llenarte de gozo y paz y de todo lo que tu corazón desea?”<\/div><p><b>Ansiedad<\/b>: la preocupación no es solo comprensible; Jesús nos manda no afanarnos (Mateo 6). Si Dios tiene un plan bueno, agradable y perfecto, ¿para qué preocuparse? El remedio de Pablo (Filipenses 4:4–7): la paz de Dios guarda el corazón y la mente. <i>“Por fin te encuentras exhalando.”<\/i><\/p>"},{"t":"Impulsados a advertir a otros","h":"<p>La preparación tiene un lado hacia afuera. Si entiendes lo que viene, ¿cómo puedes callar ante personas que quieres? Si su casa estuviera en llamas, golpearías la puerta.<\/p><p>Mateo 9: las multitudes están agobiadas y desamparadas; los creyentes son los enviados. La Gran Comisión no es la Gran Sugerencia. Dios no se complace en la muerte del impío, y la evangelización eficaz puede apresurar la venida de Cristo.<\/p><div class='q'>“Preferiría traer a un pecador a Jesucristo que desentrañar todos los misterios de la palabra divina.” <cite>— Charles Spurgeon<\/cite><\/div><p><b>Testimonio de Zac:<\/b> llenó su vida de educación, dinero, autos, y sabía que algo faltaba. Unos amigos compartieron su testimonio en su peor momento y él dijo: “Necesito a Jesús en mi vida. Jesús nunca falla.”<\/p>"},{"t":"Tres hábitos para el evangelismo cotidiano","h":"<p>El reto de Zac: treinta días de evangelismo intencional.<\/p><ul><li><b>1. Orar a diario<\/b> por puertas abiertas, valentía (“hazme valiente; sabes lo tímido que soy”) y citas divinas. Dios convence y convierte; nuestra tarea es sembrar. <i>“Te vas a sorprender.”<\/i><\/li><li><b>2. Llevar una lista de oración<\/b>: de tres a cinco nombres de personas que no conocen a Jesús. Cerca del 75 % de los cristianos llegaron a la fe por medio de un amigo o pariente. <i>“Las conversaciones incómodas cambian vidas.”<\/i><\/li><li><b>3. Pasar tiempo con amigos no creyentes<\/b>: mientras más tiempo llevan siendo cristianos, menos amigos no creyentes tienen. Jesús comía con recaudadores de impuestos y pecadores. Hospitalidad: presupuesta para ella; “la gente se desarma ante la comida”.<\/li><\/ul><p>Su sueño: que cada miembro de Hope Chapel lleve a una persona a Cristo y comience a discipularla.<\/p>"},{"t":"Cierre: Perseverar hasta el fin","h":"<p>Lucas 21:36 manda velar y orar. Dos promesas para quienes perseveran: escaparán de los juicios venideros (Zac lo aplica a la iglesia raptada) y comparecerán ante el Hijo del Hombre: aprobados, no avergonzados.<\/p><div class='key'>Colosenses 1:21–23 y Hebreos 3:6, 14: presentados “si permanecen en la fe”. — “Sé quién soy y sé de quién soy.”<\/div><p>La meta: oír “Bien, siervo bueno y fiel”. <i>Va a regresar. Sé fiel. Él es fiel. Mantente firme.<\/i><\/p>"}],"qs":["El mundo da la bienvenida al bebé del pesebre pero resiste al Rey que regresa. ¿Dónde sientes presión para suavizar la segunda venida?","¿Vives con una expectativa como la de Disneylandia los miércoles por el regreso de Cristo? ¿Qué la aumentaría?","De la disipación, la embriaguez y la ansiedad, ¿cuál carga más tu corazón ahora? ¿Cuál es la alternativa de ser “llenos del Espíritu”?","Jesús nos manda no afanarnos. ¿Qué haces con la preocupación que has llamado “ser responsable”?","¿Quiénes son tres a cinco personas que podrías poner en una lista de oración esta semana?","¿Dónde podrías pasar tiempo regular con un amigo no creyente, y qué comida podrías ofrecer?"]},"king":{"tab":"El Rey traicionado","title":"El Rey es traicionado","meta":"Mike Nazarian · 7 jun 2026 · Hope Chapel","ref":"Lucas 21:37–22:6","verse":"“Entonces Satanás entró en Judas, llamado Iscariote, que era del número de los doce. Y este fue y habló con los principales sacerdotes y con los oficiales sobre cómo entregárselo. Ellos se alegraron y convinieron en darle dinero. Él aceptó y buscaba una oportunidad para entregárselo sin que hubiera multitud.” (Lucas 22:3–6, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"La traición nunca comienza en el huerto: comienza con un corazón que va cambiando poco a poco de lealtad mediante pequeños compromisos no confesados; pero el Rey que fue traicionado es el Rey que perdona a todos los que caen hacia él.","take":["Aun con la cruz a la vista, Jesús se negó a esconderse: “Un buen rey no se esconde”.","El hambre de las multitudes por Jesús era la puerta que sus enemigos no podían abrir.","Satanás no forzó la cerradura de Judas: Judas le entregó la llave con años de silenciosos compromisos con el dinero.","Satanás no necesita tu peor pecado, solo tu pecado pequeño y regular. Los pequeños compromisos nunca anuncian su destino.","Remordimiento y arrepentimiento no son lo mismo. La diferencia entre Pedro y Judas fue la dirección de la caída.","Cuando caiga sobre ti el peso de tu pecado, cae hacia Jesús."],"scr":[["Lucas 4:13","El diablo se apartó de él “hasta un tiempo oportuno”."],["Santiago 4:7","Sométanse a Dios. Resistan al diablo y huirá de ustedes."],["Efesios 4:27","“Ni den oportunidad al diablo.” (La palabra significa “lugar”.)"],["Juan 12:6","Judas “sacaba de lo que se echaba” en la bolsa."],["Mateo 27:3–5","El remordimiento y la muerte de Judas."],["Lucas 23:34","“Padre, perdónalos, porque no saben lo que hacen.”"]],"secs":[{"t":"Apertura: La traición comienza mucho antes","h":"<p>Toda traición comienza mucho antes de la traición misma. El beso no empezó en el huerto. Comienza con un corazón que ha ido cambiando de lealtad poco a poco (un compromiso aquí, una puerta entreabierta) hasta que lo impensable se vuelve posible.<\/p><div class='q'>“La traición siempre comienza con un corazón que ha cambiado muy lentamente su lealtad. No sucede de una vez.”<\/div><p>Lucas quiere que veamos cómo un corazón puede cambiar hasta poder traicionar a un rey buenísimo. (Nota la desafortunada división de capítulo: lee 21:37–22:6 juntos.) El tema del reinado en Lucas culmina en la Semana de la Pasión: Jesús es el verdadero rey, que cumple cada promesa hecha a David, y antes de reinar debe sufrir y morir para abrir su reino a los pecadores.<\/p>"},{"t":"El Rey no se esconde; el pueblo no se va","h":"<p><b>El rey no se esconde (v. 37).<\/b> La última semana, con la cruz a la vista y los buitres rondando, todo instinto dice: baja el perfil. La gramática de Lucas subraya un patrón diario establecido: Jesús volvía al templo, el lugar más público de la ciudad más llena, para estar presente para la gente.<\/p><div class='key'>“Un buen rey no se esconde.”<\/div><p><b>El pueblo no se va (v. 38).<\/b> Al despuntar el alba, todo el pueblo venía a él. <i>“La gente puso su alarma para Jesús.”<\/i> ¿Cuándo fue la última vez que tuviste hambre de levantarte temprano a encontrarte con Jesús? Si te levantas temprano, él ya está esperando.<\/p>"},{"t":"Los líderes no pueden llegar a él","h":"<p>Lucas menciona la Pascua: redención mediante sangre, un sustituto que muere para que otros vivan. La historia se mueve en dos planos: la acción humana abajo, la soberanía de Dios arriba. Los líderes traman; Dios está poniendo la mesa.<\/p><p><b>La decisión está tomada.<\/b> Buscaban <i>cómo<\/i> matarlo, no si debían. <i>“Si rechazas la verdad de Dios el tiempo suficiente, no te quedarás neutral ante ella. Te volverás hostil.”<\/i> Cuanto más claro se vuelve Jesús, más difícil es seguir indeciso. ¿Dónde estás tú con Jesús hoy?<\/p><p><b>La puerta no cede.<\/b> Los hombres más poderosos de Jerusalén temían al pueblo. Tenían la voluntad pero no el camino.<\/p><div class='key'>“La puerta que protege a Jesús no es de hierro. Es de hambre.”<\/div>"},{"t":"Satanás encuentra la llave","h":"<p>“Entonces Satanás entró en Judas.” No es una posesión de película: Lucas apila verbos: Judas <i>va, conversa, consiente, negocia, busca.<\/i> “Esas no son las acciones de un hombre que perdió la razón. Son las acciones de un hombre que tomó una decisión.” Judas cedió; no resistió (Santiago 4:7).<\/p><p>Vuelve a Lucas 4:13: después del desierto, Satanás se fue “hasta un tiempo oportuno”. Dieciocho capítulos después, ha llegado.<\/p><div class='q'>“Satanás es real y nunca tiene prisa. Es paciente y calculador y nunca desperdicia sus jugadas.”<\/div><p>Judas era “del número de los doce”, escogido a mano, con la bolsa confiada a él, presente en cada milagro.<\/p><div class='key'>“Satanás no forzó la cerradura: Judas le entregó la llave.”<\/div><p>Juan nos dice que Judas era un ladrón discreto: una moneda aquí, otra allá. <i>“No necesita una puerta abierta de par en par en tu vida… No necesita tu peor pecado. Solo necesita tu pecado pequeño y regular.”<\/i> La Biblia dice que no le des <i>lugar<\/i> (Efesios 4:27).<\/p><p><b>“Los pequeños compromisos nunca anuncian su destino final.”<\/b> ¿Qué lugar le has dado: una lujuria secreta, amor al dinero, amargura, falta de perdón, engaño, una adicción contra la que dejaste de luchar? No lo escondas; confiésalo a alguien (los ancianos están disponibles para orar). “El pecado prospera en la oscuridad… la luz es la mejor quimioterapia, espiritualmente hablando.” El Salvador que perdona tu pecado también rompe su poder.<\/p>"},{"t":"Judas traiciona a Jesús","h":"<p>Judas va, habla con los principales sacerdotes y los oficiales, y ellos se <i>alegraron<\/i>: una palabra del evangelio (los ángeles se alegran por un pecador que se arrepiente) secuestrada para la traición. Se acuerda un precio; el rey es vendido. Judas busca una oportunidad “sin que hubiera multitud”: solo él sabe dónde duerme Jesús y dónde encontrarlo cuando la gente no está para protegerlo.<\/p><div class='q'>“El pueblo tiene hambre de Jesús. Los líderes tienen hambre de sangre. Judas tiene hambre de dinero y Satanás tiene hambre de gloria. Y cuando todas esas hambres chocan, el rey es traicionado.”<\/div>"},{"t":"Cierre: ¿Hacia dónde caes?","h":"<p>Es tentador mirar a Judas con desprecio. Pero cada uno de nosotros ha elegido algo antes que a Jesús: una relación, la reputación, un secreto, un hábito. Quizá no treinta monedas de plata, pero algo.<\/p><p>Cuando el peso cayó sobre Judas, lo sintió (Mateo 27:3–5). <b>Remordimiento y arrepentimiento no son lo mismo.<\/b> Su mayor tragedia fue creer que no había camino de regreso: una visión pequeña de Jesús. La cruz cubre cada pecado que lo clavó allí (Lucas 23:34); muchos de los que gritaron “¡Crucifícalo!” fueron salvos en Pentecostés.<\/p><p>Pedro hizo esencialmente lo mismo: negó a Jesús tres veces con maldiciones y lloró amargamente. No pudo regresar corriendo de inmediato, pero tampoco huyó; cuando oyó que la tumba estaba vacía, corrió hacia ella, y Jesús lo restauró.<\/p><div class='key'>“La diferencia entre Pedro y Judas no es la magnitud del pecado, sino la dirección de la caída. Pedro cayó hacia Jesús, y Judas cayó lejos de él.”<\/div><p>¿Corres hacia ti mismo, hacia el mundo, castigándote, o caes en los brazos de Jesús? <b>“El rey que fue traicionado es el rey que perdona. Lo hizo por Pedro. Lo hará por ti.”<\/b><\/p>"}],"qs":["Mike dice que la traición comienza con un corazón que cambia lentamente su lealtad. ¿Dónde has notado pequeños compromisos o “puertas ligeramente abiertas”?","Las multitudes “pusieron su alarma para Jesús”. ¿Cuándo fue la última vez que tuviste tanta hambre de encontrarte con él? ¿Qué la reavivaría?","Los líderes vieron la enseñanza, la compasión y los milagros de Jesús, y se volvieron hostiles, no neutrales. ¿Por qué conocer más a Jesús obliga a decidir? ¿Dónde estás tú con él?","¿Cuál es la diferencia entre que Satanás “fuerce la cerradura” y que Judas “le entregue la llave”? ¿Cómo cambia eso tu manera de pensar sobre la tentación y la responsabilidad?","¿Qué “lugar” podrías estar dándole al enemigo: un pecado pequeño y regular que crees poder manejar? ¿Cómo se vería llevarlo a la luz esta semana?","¿Por qué remordimiento y arrepentimiento no son lo mismo? ¿Cómo ilustran la diferencia Judas y Pedro?","“La diferencia entre Pedro y Judas es la dirección de la caída.” Cuando te cae el peso de tu pecado, ¿hacia dónde tiendes a caer?","¿Cómo cambia tu manera de acercarte a Jesús después de fallar saber que “el rey que fue traicionado es el rey que perdona”?"]},"arrest":{"tab":"El arresto","title":"El arresto","meta":"Andrew Kelley · 19 jul 2026 · Hope Chapel","ref":"Lucas 22:47–53","verse":"“Mientras él todavía hablaba, llegó una multitud, y el que se llamaba Judas, uno de los doce, iba delante de ellos. Se acercó a Jesús para besarlo, pero Jesús le dijo: ‘Judas, ¿con un beso entregas al Hijo del Hombre?’… Pero Jesús respondió: ‘¡Basta de esto!’ Y tocándole la oreja, lo sanó… ‘Pero esta es la hora de ustedes y el poder de las tinieblas.’” (Lucas 22:47–53, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Tres personas, tres decisiones: un beso, una espada y una copa. Judas rechazó el plan de Dios, Pedro lo malinterpretó, Jesús lo cumplió. Nadie puede quedar indiferente ante Jesús; no elegir es elegir.","take":["Nos encanta tener opciones pero nos resistimos a elegir; sin embargo, la Escritura no nos deja quedar indecisos ante Jesús.","Judas tenía conocimiento teológico, reputación religiosa, cercanía a lo santo y obediencia externa: nada de eso era confianza.","“El problema de Judas no fue la falta de esfuerzo. Fue la falta de confianza.”","La fe de Pedro vaciló pero no falló; la de Judas falló. Pedro fue restaurado.","Jesús tenía el control total y era genuinamente inocente: bebió la copa voluntariamente.","“El inocente va a la cruz porque el culpable no puede.”"],"scr":[["Juan 6:64","Jesús sabía desde el principio quién lo traicionaría."],["Santiago 2:18–19","Hasta los demonios creen, y tiemblan."],["Lucas 6:16; Efesios 2:19–20; Apocalipsis 21:14","El título de Judas entre los doce, y el fundamento de la iglesia."],["Juan 12:4–6","Judas “era ladrón y, teniendo la bolsa, sacaba de lo que se echaba en ella”."],["Lucas 9:22","Jesús ya les había dicho lo que iba a suceder."],["Salmos 27:14; Santiago 5:7–8; Isaías 30:15","Espera en el Señor; en quietud y confianza está tu fortaleza."],["Mateo 26:53","“Más de doce legiones de ángeles.”"],["Lucas 22:52–53","“Vinieron de noche… esta es la hora de ustedes.”"]],"secs":[{"t":"Introducción: Demasiadas opciones, una sola decisión","h":"<p>El sermón abre en un 7-Eleven: un hijo paralizado tratando de escoger una golosina entre demasiadas opciones: parálisis de elección, lágrimas, ninguna golosina. Nos encantan las opciones; nos resistimos a elegir. Estamos cerca del final de Lucas; el ministerio de Jesús terminó y este es su último momento libre antes de la cruz. La semana pasada: su humanidad en el huerto (“no mi voluntad, sino la tuya”).<\/p><p><b>Olla de presión:<\/b> la Jerusalén del primer siglo: facciones judías rivales, una población multiplicada por diez por la Pascua, una brutal ocupación romana y el hijo de un carpintero que hacía afirmaciones divinas y obraba milagros. Todo el que se encuentra con Jesús debe responder.<\/p><div class='key'>“No podemos ser indiferentes ante la persona de Jesús… no elegir también es, de hecho, elegir.” Un beso, una espada, una copa. Judas rechazó el plan de Dios; Pedro lo malinterpretó; Jesús lo cumplió.<\/div>"},{"t":"I. El beso: la hipocresía de Judas (vv. 47–48)","h":"<p>Un beso era señal de honra; Judas lo convierte en arma. Fue escogido a mano y estuvo presente en cada milagro: en cuerpo pero nunca en espíritu. Cuatro cosas eran ciertas de él, cada una capaz de hacerse pasar por fe salvadora:<\/p><ul><li><b>Conocimiento teológico.<\/b> Enseñado por Jesús mismo, pero se le quedó en la cabeza, no en el corazón (Santiago 2:18–19). El conocimiento es el comienzo de la fe, no el final.<\/li><li><b>Reputación religiosa.<\/b> Uno de los Doce, fundamento de la iglesia, pero un título que no se ejerce está vacío. Lucas 6:16 ya lo señala: “que llegó a ser traidor”.<\/li><li><b>Cercanía a lo santo.<\/b> Vio a Jesús sanar, calmar tormentas, resucitar muertos. Estar cerca no es estar unido. <i>“No sobrevivirás con la fe de tus padres… de tu cónyuge o de tus amigos… Hay un solo abogado y tienes que conocerlo.”<\/i><\/li><li><b>Obediencia externa.<\/b> Objetó la unción: “¿Por qué no se vendió este perfume… y se dio a los pobres?”, pero era ladrón (Juan 12:6). Un personaje piadoso ocultaba un dios privado: el dinero.<\/li><\/ul><div class='key'>“El problema de Judas no fue la falta de esfuerzo. Fue la falta de confianza.” Mírate en Judas; lo único que nos separa es la misericordia de Dios.<\/div><p>Cuando Judas llega, Jesús no se enfurece: hace una pregunta: “Judas, ¿con un beso entregas al Hijo del Hombre?”<\/p>"},{"t":"II. La espada: la autosuficiencia de Pedro (vv. 49–51)","h":"<p>Los cuatro Evangelios lo cuentan; solo Juan (escribiendo después de la muerte de Pedro) lo nombra.<\/p><ul><li><b>Iniciativa en lugar de dependencia.<\/b> Pedro blande la espada antes de que Jesús responda, aunque Jesús había dicho con claridad lo que sucedería (Lucas 9:22).<\/li><li><b>Acción impaciente en lugar de espera paciente.<\/b> La acción no es el problema; adelantarse al plan de Dios sí lo es (Salmos 27:14; Santiago 5:7–8; Isaías 30:15).<\/li><li><b>Fuerza en lugar de fe.<\/b> <i>“Es mucho más fácil ser cruzado que ser mártir… Nadie ha tenido jamás una conversión genuina en la punta de una pistola o en el filo de una espada. Si usamos la violencia para promover el cristianismo, no hacemos conversos, hacemos víctimas.”<\/i><\/li><\/ul><p>Con seres queridos que no son salvos: habla la verdad, pero confía en que Dios (no la manipulación ni la fuerza) los salve.<\/p><div class='key'>“Judas eligió un beso. Pedro eligió una espada. Mientras que la fe de Judas falló, la de Pedro vaciló, pero no falló. Al final de su autosuficiencia, se encuentra con Cristo, que lo restaura.”<\/div>"},{"t":"III. La copa: el sacrificio de Jesús (vv. 52–53)","h":"<ul><li><b>Control total.<\/b> No es una víctima; podría detenerlo en cualquier momento (Mateo 26:53: doce legiones de ángeles). Sana la oreja que su discípulo acaba de cortar: misericordia hacia quienes lo arrestan.<\/li><li><b>Genuinamente inocente.<\/b> Vienen con espadas y palos, de noche, como contra un ladrón (un insurrecto: el término usado de Barrabás y los hombres crucificados a su lado) cuando él enseñaba públicamente día tras día. Roma crucificaba las amenazas percibidas al poder, no a maestros religiosos. La oscuridad de la noche delata el pretexto. <i>Ninguno de nosotros es inocente. Él sí lo es.<\/i><\/li><\/ul>"},{"t":"El evangelio: por qué era necesaria la copa","h":"<ul><li><b>Malas noticias:<\/b> por naturaleza somos enemigos de Dios (“todos pecaron”; “no hay quien haga el bien, ni siquiera uno”). Como Dios es justo, debe tratar con el pecado; el subproducto de su justicia es la ira.<\/li><li><b>Buenas noticias:<\/b> Dios se hizo hombre, vivió sin pecado, no cargó ningún pecado propio. En la cruz la ira de Dios se derrama sobre el Hijo: plenamente hombre para pagar, plenamente Dios para soportarla y agotarla.<\/li><li><b>El veredicto:<\/b> a todos los que lo invocan con fe y arrepentimiento se les concede su justicia. “A él le costó la vida. A ti no te cuesta nada.”<\/li><\/ul><div class='key'>“El inocente va a la cruz porque el culpable no puede. No había nadie capaz. Ningún amigo, ningún familiar… Solo el Uno.”<\/div><p>No puedes mirar a Jesús en el huerto, pensar “qué gran historia, quiero ser más como Jesús” y seguir adelante. <b>Tienes que decidir.<\/b> “La ansiedad que sientes en respuesta a la palabra de Dios es una misericordia… Hoy es el día de salvación.”<\/p>"}],"qs":["¿Qué fue lo que más se te quedó de este sermón? ¿Hubo algo que oíste por primera vez o que te desafió?","Judas fue escogido a mano y vio todo lo que vieron los demás apóstoles, y aun así Jesús sabía desde el principio que lo traicionaría. ¿Qué hace de Judas una advertencia tan seria para quienes han pasado años cerca de Jesús y de su iglesia? (Ver: Juan 6:64)","Creer es el comienzo de la fe, no el final; hasta los demonios creen y tiemblan. ¿Cómo se ve cuando la teología realmente ha penetrado el corazón de alguien y no solo su cabeza? (Ver: Santiago 2:18–19)","Judas tuvo al mejor maestro y el mejor título, pero la Escritura lo recuerda como el que “llegó a ser traidor”. ¿Por qué es peligroso descansar en títulos y reputación? ¿Cómo debemos vivir el título de cristiano? (Ver: Lucas 6:16; Efesios 2:19–21)","El problema de Judas no fue la falta de esfuerzo sino la falta de confianza. ¿En qué confía la gente para su seguridad en lugar de Dios, y cuándo has visto que eso le falle a alguien, incluido tú? (Ver: Juan 12:4–6)","Pedro blande la espada antes de esperar una respuesta, aunque Jesús les había dicho el plan de Dios una y otra vez. ¿Por qué tan a menudo recurrimos a nuestra propia iniciativa en vez de depender de Dios?","¿Cuándo actuaste antes de haber orado de verdad por algo, y qué pasó? (Ver: Salmos 27:14; Santiago 5:7–8; Isaías 30:15)","Es más fácil ser cruzado que mártir. ¿Cómo cambia nuestra manera de hablar de Jesús con la gente de nuestra vida confiar en que solo Dios convierte los corazones?","Jesús tiene el control y es inocente, y aun así denuncia con valentía la cobardía de los hombres que vinieron de noche y va con ellos voluntariamente. ¿Cómo redefine él el valor? (Ver: Mateo 26:53; Lucas 22:52–53)","Estar cerca de Cristo no es estar unido a Cristo. ¿Cómo sabemos que nuestra fe es propia? ¿Cuándo se volvió fe verdadera para ti? ¿Cuáles son las marcas de la fe salvadora?"]},"faith":{"tab":"Fe u orgullo","title":"¿Fe u orgullo?","meta":"Andrew Kelley · 1 nov 2026 · Hope Chapel","ref":"Habacuc 2:2–5","verse":"“Escribe la visión, grábala claramente sobre tablas, para que corra el que la lea… Aunque parezca tardar, espérala; porque ciertamente vendrá, no tardará. He aquí, el orgulloso: su alma no es recta dentro de él; pero el justo por su fe vivirá.” (Habacuc 2:2–4, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Como la palabra de Dios es pública, clara, segura y siempre puntual, el justo vive por la fe: una fe que recibe la obra terminada de Cristo, descansa en ella y persevera hasta el fin; mientras que el orgullo confía en sí mismo, se hincha hasta una codicia insaciable y termina en muerte.","take":["Habacuc 2 pone la fe y el orgullo lado a lado, como Caín y Abel, Moisés y Faraón, Saúl y David, los dos ladrones.","La fe necesita un buen objeto, y la palabra de Dios es ese objeto: pública, clara, segura, siempre puntual.","“El justo por su fe vivirá” se cita en tres lugares del Nuevo Testamento, y cada uno muestra lo que hace la fe: recibe (Romanos), descansa (Gálatas), persevera (Hebreos).","Prueba: cuando estés ante el juez, ¿qué te tentará a mostrarle? El único alegato es Cristo crucificado.","El orgullo es peligroso porque nos hace sentir más seguros; engendra una codicia que nunca se sacia y se parece a la muerte.","Cristo regresará: vindicación para los que están en él, juicio para los que están fuera. Vivir por la fe valdrá la pena."],"scr":[["Habacuc 2:1","“Me pondré en mi puesto de guardia.”"],["Lucas 23:39–43","Los dos ladrones: uno se burla, otro pide que se acuerden de él."],["Deuteronomio 29:29","Las cosas secretas pertenecen al Señor; las reveladas, a nosotros."],["Romanos 1:16–17","“El justo por la fe vivirá.”"],["Romanos 3:21–26","Justicia por medio de la fe en Jesús; propiciación por su sangre."],["Gálatas 3:10–14","Nadie es justificado por la ley; Cristo se hizo maldición por nosotros."],["Hebreos 10:32–39","No desechen su confianza; nosotros no somos de los que retroceden."]],"secs":[{"t":"Dos actitudes, dos contextos","h":"<div class='q'>“En mi vida es cierto que la fe nunca me ha fallado y el orgullo nunca me ha preservado.”<\/div><p>(Cuando eso no se siente cierto, por lo general solo necesita esperar: el tiempo lo comprueba.)<\/p><p><b>Primer contexto: Habacuc, siglo VI a. C.<\/b> A diferencia de la mayoría de los profetas, Habacuc conversa con Dios. Clama que su pueblo es injusto y corrupto; Dios responde que lo corregirá levantando a los brutales caldeos paganos (Babilonia). Habacuc objeta con honestidad (Babilonia arrasa naciones como pescadores) y luego se pone en su puesto de guardia a esperar (2:1).<\/p><p><b>Segundo contexto: la era del Nuevo Testamento.<\/b> Los autores del Nuevo Testamento citan a Habacuc repetidamente. Habacuc pregunta qué hará Dios con el mal que viene sobre su pueblo; el Nuevo Testamento pregunta lo mismo sobre todo el mal humano a lo largo de la historia. Ambas respuestas: ve al puesto de guardia y espera. En la espera se contrastan dos disposiciones: el orgullo y la fe.<\/p>"},{"t":"Los dos ladrones (Lucas 23:39–43)","h":"<p>Ambos culpables, ambos clavados a una cruz, ambos en sus últimas horas, ambos frente al mismo Jesús, y respuestas opuestas. Uno exige con burla una demostración de poder; el otro simplemente le pide a Jesús que se acuerde de él. Orgullo y fe.<\/p><p>¿Cuál es la disposición principal de mi corazón día tras día: una confianza humilde, con una opinión más baja de mí mismo y una visión más alta de Cristo, o el orgullo, que me condena?<\/p><div class='key'>“Nadie ha venido nunca a Cristo y ha traído su orgullo consigo. Requiere fe.”<\/div>"},{"t":"I. La naturaleza de la Palabra: la fe necesita un buen objeto","h":"<p>En los vv. 2–3 Dios describe su palabra de cuatro maneras:<\/p><ul><li><b>Pública<\/b>: escrita en tablas como carteleras, no notas secretas. No esperes a que personas espirituales te transmitan lo que Dios les dijo sobre ti, ni una voz esquiva sobre qué trabajo tomar o con quién salir. <i>“Dios no tiene un plan para tu vida que te esté escondiendo.”<\/i> (Deuteronomio 29:29)<\/li><li><b>Clara<\/b>: “grábala claramente… para que corra el que la lea”: un letrero de la calle, no la letra pequeña de un mapa. Algunos pasajes son más claros que otros; los cristianos a veces discrepan (ojalá con amabilidad, humildad y paciencia); lo más importante es lo más claro. <i>“No delegues tu estudio bíblico en alguien más. Depende de ti.”<\/i><\/li><li><b>Segura<\/b>: “no mentirá”. Confiamos en el piloto, en el conductor del autobús, en las reseñas en línea, hasta en un restaurante con una C en la ventana (“No deberían, amigos”), en la gravedad y en el amanecer. <i>“Las cosas en las que más confías son menos confiables que Dios.”<\/i><\/li><li><b>Siempre puntual<\/b>: “no tardará”. Las hijas pequeñas de Andrew lo hacen poner Google Maps solo para ver la cuenta regresiva de los minutos: 15, 14, 13, otra vez 14, de verde a rojo. Ha hecho ese trayecto cientos de veces y nunca ha dejado de llegar.<\/li><\/ul><div class='key'>“Si dejas de fijarte en el contador de minutos, tendrías un mejor viaje. Confía en mí, te voy a llevar.” No sé cuándo ni cómo, ni qué obstáculos. Pero Dios hará lo que dice.<\/div>"},{"t":"II-A. La fe recibe (Romanos)","h":"<p>Romanos 1:16–17: “El justo por la fe vivirá.” Pablo, escribiendo a iglesias que no fundó, esperando apoyo para ir a España, pasa luego dos capítulos y medio diciéndoles lo malvados que son: primero los griegos (los judíos aplaudiendo, como un niño cuya mamá regaña a su hermana) y luego los judíos, que tenían la ley y deshonraron a Dios. Todos sin excusa.<\/p><p>Luego Romanos 3:21–26: justicia por medio de la fe en Jesús, un regalo, sin lista de cosas que hacer. Toda otra cosmovisión tiene un estado deseado (cielo, nirvana) y cosas que debes hacer; el cristianismo dice que Dios lo hizo por ti, lo cual va contra nuestros instintos occidentales.<\/p><div class='q'>“Jesús no solo murió a manos de los romanos. Murió a manos de Dios, que derramó su ira sobre él.” <cite>— sobre la <i>propiciación<\/i><\/cite><\/div><p>De vuelta con los ladrones: el que pide que se acuerden de él no tiene oportunidad de hacer ningún bien, y aun así: “Hoy estarás conmigo en el paraíso.” La fe recibe.<\/p>"},{"t":"II-B. La fe descansa (Gálatas)","h":"<p>Pablo predicó a gente mayormente pagana en Galacia, que confió en un Mesías judío. Cuando se fue, otros les dijeron que la fe en Jesús no bastaba: había que obedecer la ley judía. Con miedo, añadieron al evangelio (los hombres se circuncidaron). La respuesta de Pablo, probablemente su “carta más dura”: añadir al evangelio es desviarse de él. La fe en Cristo puede descansar en Cristo.<\/p><p>Pocos se sienten tentados a dejar los mariscos, pero por más firmes que sean los protestantes en cuanto a la fe sola, lo más fácil es no descansar en la obra terminada de Cristo. Andrew conoce a muchos que confiaron en Cristo y siguen con miedo, él mismo incluido.<\/p><div class='key'>“Cuando estés ante el juez, ¿qué te tentará a mostrarle para que tenga misericordia de ti?”<\/div><p>Su propia tentación: ser un esposo dedicado y un padre fiel. Otros: una Biblia gastada, terribles pecados nunca cometidos, el voluntariado en la iglesia: una lista de credenciales sudorosa y en pánico.<\/p><div class='q'>“Solo tengo un alegato cuando esté allí. Solo uno. Cristo crucificado.”<\/div><p><b>La fe descansa:<\/b> mata tu orgullo y calma tus miedos.<\/p>"},{"t":"II-C. La fe persevera (Hebreos)","h":"<p>Hebreos 10:32–39: la fe fortalece la resistencia y produce obediencia.<\/p><div class='q'>“La obediencia no es la base de tu salvación. La obediencia de Cristo no es la tuya. Pero tu obediencia es la evidencia de tu salvación.”<\/div><p>Un corazón nuevo lleva a una vida nueva; un árbol nuevo da fruto nuevo. El sufrimiento no es prueba de que pecaste, pero es el terremoto que sacude el edificio y muestra con qué se sostiene. <i>“El sufrimiento es un maestro que nos enseña sobre nosotros mismos.”<\/i><\/p><p>No es un creer fácil (“firma una tarjeta… ahora diviértete hasta que mueras”). La Biblia enseña una resistencia imperfecta y gradual: cinco pasos adelante, cuatro atrás; un pecado derrotado que se cuela de nuevo; confesar las mismas cosas dos veces. (“Soy un hombre joven” es menos cierto estos días: su esposa le regaló hace poco un champú para el crecimiento del cabello.) Pero a medida que la vida trae temporadas menos favorables, Cristo llena más de su campo de visión.<\/p><p>A los que están en la oscuridad: salgan un momento a tomar aire y, cuando vuelvan al valle, miren a Cristo.<\/p><div class='key'>“Cuando estés en el valle, mira a Cristo. Te prometo que él te llevará a través.”<\/div>"},{"t":"III. El rechazo de la Palabra: el orgullo (v. 5)","h":"<p>Aparte: muchas Biblias dicen “vino”, algunas “riqueza”. Tras una semana de investigación Andrew no sabe cuál es: pero ambas transmiten un apetito insaciable que te mata.<\/p><ul><li><b>El orgullo confía en sí mismo.<\/b> “Su alma está hinchada.” Babilonia es el pescador con anzuelo, red y red de arrastre, y luego construyendo un altar a su equipo de pesca (como un vendedor que le hace un altar a su iPhone; “haz una cita con el pastor Mike”). <i>El orgullo te adormece con una sensación de seguridad<\/i>: uno de los pocos pecados que no nos hace sentir en peligro.<\/li><li><b>El orgullo engendra una codicia que nunca se sacia.<\/b> <b>Riqueza:<\/b> cada dólar que estás por recibir por fin te hará feliz; la vocación se vuelve un medio para el dinero; las personas se vuelven clientes; recortas camino. Las cuentas de retiro te hacen sentir seguro pero no pueden salvarte, y puedes ser esclavo de la riqueza aun sin tenerla. <b>Aprobación:<\/b> una sonrisa, un asentimiento: insaciable de la aprobación de otros, te vacías de convicciones y terminas más solo que nunca, la sombra de una persona.<\/li><li><b>La codicia se parece a la muerte.<\/b> “Ensancha como el Seol su garganta; como la muerte nunca se sacia.”<\/li><\/ul><div class='key'>Si no estás en Cristo, no estás a salvo. Estás en peligro del justo juicio que Cristo traerá cuando regrese. No demores.<\/div><p>Para los que están en Cristo, su regreso es vindicación, gozo, renovación, reencuentro, glorificación: un cielo nuevo, una tierra nueva, un cuerpo nuevo. Para los de afuera, juicio.<\/p>"},{"t":"Cierre: Vivir por la fe valdrá la pena","h":"<div class='q'>“Vivir por la fe valdrá la pena. Valdrá la pena. Dios cumplirá sus promesas.”<\/div><p>Andrew lo cree algunos días más que otros. La iglesia se acerca entonces a la mesa para la comunión.<\/p>"}],"qa":[{"q":"¿Qué fue lo que más se te quedó del sermón del domingo esta semana: una pregunta, una convicción o algo especialmente impactante?"},{"q":"<b>La naturaleza de la Palabra (vv. 2–3)<\/b><br>El pastor Andrew dijo que la fe nunca le ha fallado y el orgullo nunca lo ha preservado, y que cuando no se siente así, espera. ¿Recuerdas un momento en que la fe parecía fallarte pero después resultó cierta? ¿Qué cambió? (Ver: Lamentaciones 3:25–26)"},{"q":"La visión fue escrita en tablas para que cualquiera la leyera (v. 2). Aun así, muchas veces esperamos un susurro privado sobre una decisión importante en lugar de la sabiduría que Dios ya ha revelado. Piensa en una gran decisión que enfrentaste. ¿Cómo buscaste la dirección de Dios? (Ver: Deuteronomio 29:29)"},{"q":"La palabra de Dios es lo bastante clara para leerse al correr, como un letrero de carretera (v. 2). No toda es igual de clara, pero fuiste hecho para entenderla. ¿Qué pasaje te confundía antes y ahora tiene sentido? ¿Qué marcó la diferencia? (Ver: Salmos 119:130)"},{"q":"El consejo sabio es bueno, pero nadie debe dejar que un pastor u otra persona haga su lectura bíblica por él. ¿Recuerdas una temporada en que te apoyaste más en sermones, etc., que en tu propia lectura? ¿Qué fue distinto cuando la abriste tú mismo? (Ver: Hechos 17:11)"},{"q":"<b>La recepción de la Palabra (v. 4)<\/b><br>La gente añade al evangelio, dijo el pastor Andrew, “porque tenemos miedo de que quizá Jesús no sea suficiente”. Pero ante el juez, “tienes un solo alegato. Cristo crucificado”. ¿Cuándo has sentido que tenías que ganarte la aceptación de Dios? ¿Qué te ayudó a descansar en Cristo? (Ver: Gálatas 3:10–14)"},{"q":"El “creer fácil” dice: haz una oración y luego vive como quieras. La Escritura dice otra cosa: la obediencia no es la base de la salvación, pero es la evidencia de ella. Si la obediencia no nos salva, ¿por qué una fe sin ella está muerta? (Ver: Santiago 2:14–17; Hebreos 10:36–39)"},{"q":"<b>El rechazo de la Palabra (v. 5)<\/b><br>Babilonia adoraba su propia red (Habacuc 1:16). El orgullo funciona igual: una habilidad, posesión o posición nos hincha y nos hace sentir seguros mientras nos deja en mayor peligro. ¿Cuándo cedió algo en lo que te apoyabas para sentirte seguro? ¿Qué te enseñó? (Ver: Jeremías 17:5–8)"},{"q":"El versículo 5 dice que la codicia, como la muerte, nunca tiene suficiente. Para muchos de nosotros la codicia no es de dinero sino de aprobación: “una sonrisa más, un amigo más”. ¿Recuerdas haber conseguido por fin algo que perseguías? ¿Cuánto tiempo te satisfizo? (Ver: Eclesiastés 5:10)"},{"q":"El versículo 4 pone el orgullo junto a la fe, y el sermón preguntó cuál de los dos gobierna tu corazón. Piensa en una temporada en que tus búsquedas y deseos estaban alineados con tu fe y en otra en que no. ¿Qué fue distinto entre ambas? (Ver: Lucas 23:39–43)"}]},"money1":{"tab":"Dios y el dinero 1","title":"Dios y el dinero, Parte 1","meta":"Andrew Kelley · 17 ago 2025 · Hope Chapel","ref":"Lucas 16:1–13","verse":"“Había un hombre rico que tenía un administrador, y le acusaron de que estaba derrochando sus bienes… Y yo les digo: háganse amigos por medio de las riquezas injustas, para que cuando estas falten, los reciban en las moradas eternas.” (Lucas 16:1–9, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Todo pertenece a Dios y nosotros solo somos sus administradores, así que usamos nuestro dinero con la astucia del administrador deshonesto: no para asegurar esta vida, sino para invertir en la eternidad.","take":["Jesús habla del dinero más de cien veces, y como un tercio de sus parábolas tratan del dinero. Seguirlo incluye cómo lo usamos.","Se la llama la parábola más difícil de interpretar. La clave es que vivimos en dos mundos: el mundo despiadado de antes de Cristo y el nuevo reino al que ahora pertenecemos.","Conoce tu lugar: hay diferencia entre un dueño y un administrador. Todo pertenece a Dios, incluidas las habilidades que nos permiten ganar.","Creer que todo es de Dios mata el orgullo, mata el miedo y produce responsabilidad, porque daremos cuentas.","Jesús no nos dice que seamos deshonestos. Nos dice que seamos astutos: que actuemos con sabiduría y urgencia con el futuro a la vista.","Invierte en la eternidad. La riqueza terrenal nos fallará, y la única manera de conservarla es ponerla en la causa de Cristo.","Repetir las promesas de Dios sobre el futuro nos ayuda a obedecerlo ahora. “No es necio el que da lo que no puede conservar para ganar lo que no puede perder.”"],"scr":[["Lucas 16:1–13","La parábola del administrador deshonesto y el llamado a servir a Dios y no al dinero."],["Colosenses 1:13–14","Dios nos libró del dominio de las tinieblas y nos trasladó al reino de su Hijo."],["Salmos 24:1","“Del Señor es la tierra y todo lo que hay en ella.”"],["Deuteronomio 10:14","El cielo y la tierra con todo lo que hay en ella pertenecen al Señor."],["Hageo 2:8","“Mía es la plata y mío es el oro, declara el Señor de los ejércitos.”"],["Juan 14:1–3","En la casa de mi Padre hay muchas moradas; voy a preparar lugar para ustedes."],["1 Pedro 1:3–9","Una esperanza viva y una herencia incorruptible, incontaminada e inmarchitable."],["Mateo 6:19–21","Acumulen tesoros en el cielo, porque donde esté su tesoro, allí estará también su corazón."]],"secs":[{"t":"Apertura: Lectura de Lucas 16:1–13","h":"<p>Andrew lee toda la parábola y anuncia que la dividirá en dos semanas. Hoy cubre la primera mitad; la Parte 2 termina el pasaje.<\/p>"},{"t":"¿Por qué hablar del dinero?","h":"<p>Nos gusta oír del dinero ajeno, pero no nos gusta hablar del propio. Parte de eso viene de iglesias y predicadores que han explotado a la gente.<\/p><div class='key'>Jesús habla del dinero más de cien veces, y como un tercio de sus parábolas involucran transacciones financieras.<\/div><p>El dinero forma parte de cada día, así que obedecer a Jesús incluye cómo lo usamos.<\/p>"},{"t":"Una parábola difícil y dos mundos","h":"<p>Los comentaristas la llaman la parábola más difícil del Nuevo Testamento de interpretar. Un administrador es despedido, hace trampa para asegurar su futuro y aun así el dueño lo elogia.<\/p><p>La respuesta es que vivimos en dos mundos: el mundo brutal y materialista de antes de Cristo, y el nuevo reino al que hemos sido trasladados (Colosenses 1:13–14). Jesús toma lecciones del mundo despiadado y las aplica a nuestro nuevo mundo.<\/p><p>El evangelio: comenzamos como enemigos de Dios, Cristo vive perfectamente y toma la ira de Dios en la cruz, y a todos los que se arrepienten y creen se les da su justicia.<\/p>"},{"t":"I. Conoce tu lugar (vv. 1–2)","h":"<p>El dueño vive lejos y contrata a un administrador (un <i>oikonomos<\/i>) para manejar su propiedad. El administrador no es dueño de nada. Todo lo que maneja pertenece al dueño.<\/p><div class='q'>“Todo pertenece a Dios. Todo. Cada dólar que tengo en cualquier cuenta, en cualquier inversión, en realidad le pertenece a Dios.”<\/div><p>Andrew lo respalda con Salmos 24:1, Deuteronomio 10:14 y Hageo 2:8. También abarca las habilidades que usamos para trabajar duro: los músculos, la inteligencia y los certificados fueron dados por Dios.<\/p>"},{"t":"La ilustración de las gallinas","h":"<p>Imagina armar un gallinero, irte unos días y volver a una “economía de huevos” con casinos de huevos y tiendas departamentales de huevos. Las gallinas dicen que los huevos son suyos, pero no lo son. El dueño hizo y dispuso todo.<\/p><p>Dios hizo todo, sostiene todo (Colosenses 1:17) y dirige adónde va cada dólar.<\/p>"},{"t":"Lo que esta verdad hace por nosotros","h":"<p>Si todo es de Dios y somos administradores, se siguen tres cosas:<\/p><ul><li><b>Mata el orgullo.<\/b> Atamos el dinero al estatus y queremos parecer ganadores. Si se nos dio para administrarlo, no hay nada de qué presumir.<\/li><li><b>Mata el miedo.<\/b> Tememos que nos falte dinero. Dios puede dar más con tanta facilidad como preparar un sándwich, y ya ha provisto lo que necesitamos. Podemos obedecer cueste lo que cueste.<\/li><li><b>Produce responsabilidad.<\/b> Como el administrador frente a la reunión del viernes, se nos pedirán cuentas y se nos quitará la administración. No administraremos dinero terrenal en los cielos nuevos y la tierra nueva.<\/li><\/ul>"},{"t":"II. Invierte en la eternidad (vv. 3–9)","h":"<p>Andrew vuelve a leer los versículos 3–9 y explica lo que sucede. El administrador sabe que su tiempo se acabó. Es muy débil para cavar y muy orgulloso para mendigar. Así que reduce lo que deben los deudores para hacerse amigos antes de que lo despidan. Las cantidades son enormes, como años de salario.<\/p><div class='key'>Actúa con astucia, urgencia y decisión para asegurar su futuro.<\/div><p>La sorpresa no es como la del hijo pródigo. El dueño dice “buen trabajo”, como si él hubiera hecho lo mismo.<\/p>"},{"t":"Astutos, no deshonestos","h":"<p>Debemos usar la mentalidad y los métodos del administrador, pero no su moral. Jesús nos dice que seamos sabios, ingeniosos y conscientes de la urgencia de la vida.<\/p><div class='q'>“Toma las cosas materiales que tienes ahora a tu disposición e inviértelas en la eternidad. Está diciendo que tu dinero, de hecho, te fallará.”<\/div><p>Las presiones diarias nos empujan de vuelta al mundo presente, y por eso cuesta ver el futuro en el que estamos invirtiendo.<\/p>"},{"t":"Creer las promesas","h":"<p>Andrew lee Juan 14:1–3 y 1 Pedro 1:3–9, y dice que necesitamos repetir las promesas de Dios sobre nuestro futuro para poder obedecer ahora.<\/p><p>Es difícil actuar pensando en un futuro que se siente lejano. Cuenta cómo ignoró consejos de ahorrar para el retiro en su adolescencia, sus veinte y sus treinta. El villano no soy yo ahora, sino yo hace veinte años.<\/p><p>Creer que seremos resucitados y que todo será restaurado nos permite invertir en el cielo y no solo en la tierra.<\/p>"},{"t":"¿Adónde va la riqueza? Los egipcios y Mateo 6","h":"<p>Los egipcios enterraban su oro con sus reyes, pero las tumbas fueron saqueadas y las momias molidas. Aferrarse a la riqueza hasta el final fracasa.<\/p><p>Jesús dice que acumulemos tesoro en el cielo (Mateo 6:19–21).<\/p><div class='key'>“La única manera de ver tu inversión material al otro lado de la eternidad es colocarla dentro de la causa de Cristo.”<\/div><p>Eso significa obra del evangelio, enseñanza, misiones, discipulado y la iglesia local. Algunas personas estarán allí porque tú diste y te sacrificaste. No puedes comprar tu entrada al cielo, pero puedes entregarte a los propósitos celestiales.<\/p>"},{"t":"Cierre: Jim Elliot","h":"<p>Jim Elliot fue asesinado por la gente a la que fue a alcanzar. Su esposa y sus hijos regresaron después y bautizaron a algunos de ellos.<\/p><div class='q'>“No es necio el que da lo que no puede conservar para ganar lo que no puede perder.”<\/div><p>Andrew cierra preguntando si creemos las promesas de Dios sobre la resurrección y los cielos nuevos y la tierra nueva, y ora para que usemos nuestro dinero, tiempo y talentos para los propósitos de Dios.<\/p>"}],"qs":["¿Piensas en tu dinero como tuyo o como de Dios? ¿Qué cambia en un día si es de él?","¿A cuál le habla más saber que todo pertenece a Dios en este momento: el orgullo, el miedo o la responsabilidad? ¿Por qué?","El administrador actuó con astucia pensando en el futuro. ¿Cómo se vería ser así de astuto con tu dinero para la eternidad?","¿Por qué es tan difícil actuar pensando en un futuro que se siente lejano? ¿Qué te ayuda a mantener a la vista las promesas de Dios?","¿Dónde podrías invertir en la causa de Cristo con lo que él te ha dado: obra del evangelio, misiones, discipulado, tu iglesia?"]},"money":{"tab":"Dios y el dinero 2","title":"Dios y el dinero, Parte 2","meta":"Andrew Kelley · 24 ago 2025 · Hope Chapel","ref":"Lucas 16:1–13","verse":"“El que es fiel en lo muy poco, también es fiel en lo mucho; y el que es injusto en lo muy poco, también es injusto en lo mucho… Ningún siervo puede servir a dos señores… No pueden servir a Dios y al dinero.” (Lucas 16:10–13, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Tu dirección determina tu destino. Pasamos por un mundo para llegar a otro, así que usamos el dinero ahora (con fidelidad, sabiduría y generosidad) con la eternidad a la vista, y adoramos a Dios y no al dinero.","take":["La dirección determina el destino: pasamos por un mundo para llegar a otro.","Jesús elogia la visión de futuro del administrador, no su deshonestidad: aprovecha lo que tienes ahora para el futuro.","El dinero es una prueba de administración y de carácter (Lucas 16:10).","Tres enfoques equivocados: prosperidad, pobreza, pasividad. El correcto es la administración con principios.","La generosidad revela el corazón ahora: empieza poco a poco y gana fuerza.","La mayor recompensa no es el dinero sino el evangelio: la profunda generosidad de Dios hacia nosotros en Cristo.","El dinero compite con Dios por la adoración; en Cristo ya tienes consuelo, estatus, seguridad y aprobación."],"scr":[["Lucas 16:1–13","La parábola del administrador deshonesto y el llamado a la fidelidad."],["Lucas 16:10","“El que es fiel en lo muy poco, también es fiel en lo mucho.”"],["Lucas 6:38","“Den, y se les dará.”"],["Proverbios 3:9–10","Honra al Señor con tus bienes; tus graneros se llenarán."],["Malaquías 3:10","“Abriré las ventanas de los cielos.”"],["1 Timoteo 6:17–19","Atesorando un buen fundamento para el futuro."],["Lucas 16:13","“No pueden servir a Dios y al dinero.”"],["Mateo 11:28–30","Vengan a mí y yo les daré descanso."],["Filipenses 2:9–11","Cristo exaltado sobre todo nombre."],["Romanos 8:38–39","Nada nos podrá separar del amor de Dios en Cristo."]],"secs":[{"t":"Introducción: La dirección determina el destino","h":"<p>La ilustración de Andrew: seguir el campanario equivocado en Alemania lo llevó al lugar equivocado.<\/p><div class='key'>“Tu dirección determina tu destino. Estamos pasando por un mundo para llegar a otro.”<\/div><p>La parábola de Jesús nos reorienta a vivir ahora con la eternidad a la vista.<\/p>"},{"t":"I. El administrador deshonesto (vv. 1–8)","h":"<p>El administrador desperdició recursos, enfrentó el despido y actuó con astucia para preparar su futuro. Jesús elogió su <i>previsión<\/i>, no su deshonestidad.<\/p><div class='q'>“Está aprovechando todo lo que tiene en el presente para el futuro.”<\/div><p><b>Aplicación:<\/b> los cristianos deben aprovechar los recursos ahora con la eternidad en mente.<\/p>"},{"t":"II. La fidelidad y el dinero como prueba (vv. 10–12)","h":"<p>Lucas 16:10: fiel en lo poco, fiel en lo mucho. El dinero es una prueba de administración y de carácter. Tres enfoques equivocados:<\/p><ul><li><b>Prosperidad<\/b>: equipara la riqueza con el amor de Dios. <i>“Cuánto dinero tienes no te dice cuánto te ama Dios.”<\/i><\/li><li><b>Pobreza<\/b>: ve el dinero mismo como malo. <i>“El dinero no es malo, pero es peligroso, como una herramienta eléctrica.”<\/i><\/li><li><b>Pasividad<\/b>: evitar la responsabilidad. <i>“Jóvenes, no desperdicien sus veintes. Están llamados a trabajar, a proveer, a ser generosos.”<\/i><\/li><\/ul><p>El enfoque correcto: <b>administración con principios<\/b>: sabia, honesta, generosa y centrada en Cristo.<\/p>"},{"t":"III. La generosidad revela el corazón","h":"<div class='key'>“Lo que hacemos con nuestro dinero nos revela ahora mismo.”<\/div><p>Levantamiento de pesas: empieza con poco, gana fuerza. <i>“Decir que seré generoso cuando tenga más es como decir que levantaré pesas pesadas cuando tenga músculos más grandes.”<\/i> La fidelidad con poco te prepara para una mayor generosidad después.<\/p>"},{"t":"IV. Las recompensas de la generosidad fiel","h":"<p>Recompensas en esta vida y en la venidera: Lucas 6:38; Proverbios 3:9–10; Malaquías 3:10; 1 Timoteo 6:17–19. <i>“Cuando somos generosos ahora, de alguna manera se nos acredita en la resurrección.”<\/i><\/p><div class='key'>“La mayor recompensa no es el dinero. La mayor recompensa es el evangelio: que Dios ha sido profundamente generoso con nosotros en Cristo.”<\/div>"},{"t":"V. ¿A quién adoras? (v. 13)","h":"<p>“No pueden servir a Dios y al dinero.” El dinero compite con Dios por la adoración.<\/p><div class='q'>“Tiramos dinero al altar de la comodidad, el estatus, la seguridad, la aprobación. Pero en Cristo ya tienes comodidad, estatus, seguridad y aprobación.”<\/div>"},{"t":"Conclusión: Vivir con perspectiva eterna","h":"<p>Recordatorios de la Escritura: Cristo da descanso (Mateo 11:28–30); Cristo es exaltado (Filipenses 2:9–11); nada nos separa del amor de Dios (Romanos 8:38–39).<\/p><div class='key'>“No tenemos que adorar a otros dioses. Podemos usar nuestro dinero para adorar al único Dios verdadero.”<\/div>"}],"qs":["¿Hacia qué dirección te apunta tu uso del dinero? ¿Hacia el destino que quieres?","¿Hacia cuál enfoque equivocado del dinero te inclinas: prosperidad, pobreza o pasividad? ¿Cómo se vería la administración con principios?","¿Qué revelan tu manera de dar y de gastar sobre tu corazón en este momento?","¿Cuál es un pequeño paso fiel de generosidad que podrías dar ahora en lugar de esperar a tener más?","¿A qué “altar” le tiras dinero: comodidad, estatus, seguridad, aprobación? ¿Qué te da ya Cristo en su lugar?"]},"judgment":{"tab":"Juicio","title":"Cuando llega el juicio","meta":"Mike Nazarian · 10 may 2026 · Hope Chapel","ref":"Lucas 21:20–24","verse":"“Pero cuando vean a Jerusalén rodeada de ejércitos, sepan entonces que su desolación está cerca. Entonces los que estén en Judea huyan a los montes… ¡Ay de las que estén encintas y de las que estén criando en aquellos días!… Jerusalén será pisoteada por los gentiles hasta que los tiempos de los gentiles se cumplan.” (Lucas 21:20–24, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Como Jesús ve con claridad, advierte con fidelidad y se duele con sinceridad, podemos confiar aun en sus palabras más duras, y debemos huir a él como nuestro único refugio verdadero cuando llegue el juicio.","take":["Jesús hizo una predicción precisa y verificable históricamente sobre la caída de Jerusalén, y la historia la confirmó cuarenta años después.","El año 70 d. C. fue Dios cumpliendo cada advertencia del pacto que había emitido por los profetas.","El juicio de Dios fluye de su santidad: un Dios perfectamente bueno no puede dejar la rebelión sin respuesta para siempre.","Los cristianos que sobrevivieron al sitio confiaron en las palabras de Jesús más que en sus propios instintos y su cultura.","Jesús no solo advirtió del juicio: absorbió el juicio mayor en la cruz, convirtiéndose en el único refugio verdadero.","Cualesquiera murallas en las que confiemos para estar a salvo antes del juicio final no resistirán; solo Cristo resistirá."],"scr":[["Lucas 21:20–24","Jerusalén rodeada; huyan; “ay”; pisoteada hasta que se cumplan los tiempos de los gentiles."],["Isaías 34:8","“El Señor tiene un día de venganza, un año de retribución en el pleito de Sión.”"],["Isaías 6:3","“Santo, santo, santo es el Señor de los ejércitos.”"]],"secs":[{"t":"Apertura: Un texto inesperado para el Día de las Madres","h":"<p>En el Día de las Madres la serie llega al juicio, y sin embargo, en medio de él Jesús se detiene a dolerse por las madres. Muchas iglesias pasan en silencio la página de pasajes como este; la fidelidad significa abrirnos a los filos más agudos de su palabra.<\/p><div class='q'>“Si vamos a ser fieles a Jesús, no podemos fingir que somos sus editores. Tenemos que ser sus discípulos.”<\/div><p><i>“El evangelio sigue siendo buena noticia. Es buena noticia en este texto y es buena noticia hoy.”<\/i><\/p>"},{"t":"1. Jesús vio venir el juicio","h":"<p>Los versículos 10–19 describieron una conmoción amplia; ahora Jesús se concentra en una ciudad, una señal y un pueblo específicos: una <b>predicción precisa y falsable.<\/b> La señal: Jerusalén rodeada de ejércitos. Mateo y Marcos usan “abominación desoladora” para lectores judíos; Lucas la descifra para los gentiles. “Desolación” significa destrucción donde había construcción, muerte donde había vida.<\/p><p>En griego, “rodeada” es un participio presente: ya se está desarrollando. “Sepan” es un imperativo.<\/p><div class='q'>“Dice: cuando vean, sepan. Y la implicación es muévanse. Cuando lo veas, reconócelo, muévete.”<\/div><p><b>Tres mandatos (v. 21):<\/b> los de Judea, que huyan; los de dentro de la ciudad, que salgan; los de fuera, que no entren. El tercero iba contra la intuición: lo mismo que creen que los salvará los sepultará.<\/p><p><b>La historia lo confirma.<\/b> Josefo: falsos profetas dijeron a la gente que se refugiara en el templo; miles entraron y Roma los quemó. Eusebio: los cristianos huyeron a Pela, al este del Jordán, la ruta que Jesús describió.<\/p><div class='key'>“Sobrevivieron porque confiaron en el Hijo de Dios y no en sus propios instintos, sus propias intuiciones, su propia cultura.”<\/div>"},{"t":"Lo que significó: días de venganza","h":"<p>Versículo 22: “días de venganza, para que se cumplan todas las cosas que están escritas”: lenguaje de juicio del pacto (Isaías 34:8). Durante siglos Dios envió profeta tras profeta; ahora Israel ha rechazado no a otro profeta sino al Hijo de Dios. Jesús traza una línea desde Moisés por los profetas: “todo está aterrizando aquí mismo, ahora mismo, sobre esta ciudad, en esta generación”.<\/p><p>El pasaje trata, en última instancia, de la aterradora fiabilidad del Dios que habla en serio: “Todo lo que está escrito. No algo. No la mayoría. Todo.” Si Jesús pudo hablar con tanta precisión sobre el año 70 d. C., ve con claridad, incluso tu futuro.<\/p>"},{"t":"2. Jesús vio a través de todo: “Ay”","h":"<p>Versículo 23: <i>ouai<\/i>, un grito de dolor. Jesús se duele no por la ciudad ni por el templo sino por las <b>madres y los bebés que amamantan.<\/b> “Este grito no es el de un juez frío, distante e indiferente. Es el grito de un salvador.”<\/p><p><b>¿No es esto cruel?<\/b> Mike responde: no es crueldad, es santidad. Si el juicio se siente duro, el problema es que hemos perdido de vista la santidad de Dios (Isaías 6:3: el superlativo triple).<\/p><div class='q'>“¿Por qué un Dios bueno castiga el pecado humano? Porque es bueno. Ama la bondad. Y aborrece lo malo. Porque es bueno, es justo.”<\/div><p>El versículo 24 nombra espada, cautiverio, exilio; Josefo registra más de un millón de muertos y casi
