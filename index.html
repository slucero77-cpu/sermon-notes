 cien mil llevados cautivos.<\/p>"},{"t":"Palabras duras para cada generación","h":"<p>Algunos quieren un Jesús que solo hable de amor y paz. Él es todo eso, pero también el Jesús de Lucas 21, que todavía nos llama a alejarnos de lo que creemos que nos salvará. Palabras duras que sigue diciendo: huyan de la inmoralidad sexual; perdonen como yo los he perdonado; si no se arrepienten, todos perecerán igualmente.<\/p><div class='key'>“Nos dice palabras duras porque quiere rescatarnos. Quiere rescatarnos de nosotros mismos. Quiere rescatarnos de la ira venidera.”<\/div>"},{"t":"Jesús vio el otro lado","h":"<p>El versículo 24 termina con una bisagra: <b>hasta.<\/b> Dos horizontes recorren Lucas 21: el cercano (año 70 d. C., cumplido) y el lejano (la consumación final). La era de los gentiles es cuando el evangelio llega a toda lengua, tribu y nación; se cerrará, y entonces viene el Hijo del Hombre en una nube con poder y gran gloria.<\/p><div class='q'>“Ve más allá del horizonte cercano. Ve más allá del juicio por venir. Y lo que ve al final es a sí mismo.”<\/div>"},{"t":"Cierre: Caminó hacia ello por nosotros","h":"<p>A los pocos días de estas palabras Jesús caminó directo hacia el juicio en una cruz. La ira que cayó sobre Jerusalén fue un susurro comparada con la que cayó sobre él en el Calvario: absorbida como nuestro sustituto, “sin que quedara nada para derramarse sobre nosotros”. Se nos llama a confiar no solo en su palabra sino en su obra.<\/p><div class='key'>“La cruz no es nuestra advertencia. Jesús dio una advertencia, pero luego fue a la cruz. La cruz es nuestro rescate.”<\/div><p>La invitación es la misma que Jesús dio a Jerusalén: cuando viene el juicio, huye; ahora, hacia él, el refugio verdadero y mejor.<\/p><div class='q'>“Las personas que sobrevivieron a Jerusalén no fueron las que tenían las murallas más fuertes. Fueron las que confiaron en Jesús… Tus murallas no resistirán, ni las mías. Solo Jesús resistirá.”<\/div>"}],"qs":["Mike dice que muchas iglesias pasan la página de los pasajes duros sobre el juicio. ¿Por qué el juicio es tan incómodo y qué podríamos perder al evitarlo?","Los cristianos que sobrevivieron confiaron en las palabras de Jesús más que en sus instintos y su cultura. ¿Dónde te llama Jesús hacia algo que va contra la intuición o contra la cultura?","¿Cómo cambia tu manera de pensar sobre su juicio entender la santidad de Dios?","¿Qué te dicen siglos de paciente advertencia del pacto sobre el carácter de Dios y sobre cómo oyes hoy sus advertencias?","Jesús gritó “Ay” con dolor aun al pronunciar el juicio. ¿Qué revelan juntos el dolor y el juicio sobre su corazón?","¿Detrás de qué “murallas” te tienta esconderte cuando piensas en presentarte ante Dios: tu historial, tu esfuerzo, tu decencia?","¿Hay una palabra dura de Jesús que has estado evitando o suavizando? ¿Cómo se vería confiar en ella?","Detente un momento en la cruz como el lugar donde cayó la ira mayor para que ninguna cayera sobre nosotros. ¿Qué despierta eso en ti?"]},"hab1":{"tab":"Habacuc 1","title":"Fe cuando no entendemos","meta":"Mike Nazarian · 11 oct 2026 · Hope Chapel","ref":"Habacuc 1:1–11","verse":"“¿Hasta cuándo, Señor, clamaré por ayuda y no escucharás? ¿Hasta cuándo clamaré a ti: ‘¡Violencia!’ y no salvarás? ¿Por qué me haces ver iniquidad y miras con indiferencia la opresión?… Miren entre las naciones, observen, asómbrense, maravíllense. Porque haré una obra en sus días que no la creerían si se les contara.” (Habacuc 1:2–5, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Fe significa confiar en el carácter de Dios cuando no entendemos los caminos de Dios: el mal golpea cerca de casa, Dios puede parecer dolorosamente callado, y sin embargo siempre está obrando, muchas veces de maneras que jamás esperaríamos, y la cruz prueba que él no ignora el mal.","take":["Nueva serie, <i>Fe cuando no entendemos<\/i>, a través del breve libro de Habacuc, de tres capítulos. A diferencia de la mayoría de los profetas, Habacuc le habla a Dios en nombre del pueblo (y en el suyo propio).","Punto 1: el mal muchas veces golpea cerca de casa. A Habacuc lo entristecen la violencia, la contienda, la ley paralizada y la justicia pervertida entre el pueblo del pacto de Dios.","Punto 2: Dios puede parecer dolorosamente callado cuando golpea el mal. El “¿hasta cuándo?” de Habacuc es un <b>lamento<\/b>: fe que habla con honestidad cuando no entiende del todo. Dios lo recibe con agrado, y estuvo escuchando todo el tiempo.","Punto 3: Dios siempre está obrando, muchas veces de maneras que jamás esperaríamos. Responde a cada queja, pero con una sorpresa: está levantando a los babilonios.","Vivimos “a mil kilómetros por hora”, así que un cuadro pequeño se vuelve toda la historia. Habacuc nos dice que miremos hacia arriba: Dios dirige las naciones y nuestras vidas.","En la cruz parecía que el mal había ganado, cuando Dios estaba logrando su mayor victoria. La cruz muestra que Dios trata con el mal “allá afuera” y con el mal que hay en nosotros, cuando Jesús cargó nuestro juicio."],"scr":[["Habacuc 1:1–11","La queja de Habacuc (vv. 2–4) y la respuesta del Señor (vv. 5–11)."],["Habacuc 1:5–6","“Miren entre las naciones y observen… estoy levantando a los caldeos.”"],["Salmos 22:1","El grito de Jesús desde la cruz: “Dios mío, Dios mío, ¿por qué me has abandonado?”"],["2 Reyes 23:36–37","El rey que hizo lo malo en Judá después de Josías."],["Salmos 13:1–2","“¿Hasta cuándo, Señor?”: lamento honesto."],["Isaías 55:8–9","Los caminos y pensamientos de Dios son más altos que los nuestros."],["Génesis 50:20; Isaías 10:5–7; Hechos 2:23","La soberanía de Dios y la responsabilidad humana."],["Romanos 8:28; 2 Pedro 3:9","Dios obra para bien; paciencia hacia los pecadores."],["Hechos 13:38–41","Pablo usa Habacuc 1:5 para predicar a Cristo."]],"secs":[{"t":"Bienvenidos a Habacuc","h":"<p>Un breve recorrido por uno de los libros más cortos del Antiguo Testamento, un profeta menor (no menos importante, solo corto), entre Nahúm y Sofonías.<\/p><p>La mayoría de los profetas le hablan al pueblo <i>de parte de Dios<\/i>. Habacuc le habla <i>a Dios<\/i> en nombre del pueblo y de sí mismo. Mira una cultura que no tiene sentido para él y pregunta lo que muchos de nosotros preguntamos: <i>Dios, ¿dónde estás? ¿Por qué pasa esto? ¿Por qué no haces nada con el mal que veo?<\/i><\/p><div class='key'>Habacuc muestra cómo se ve confiar en el carácter de Dios cuando no entendemos del todo los caminos de Dios.<\/div>"},{"t":"Ubicándonos: la gran historia","h":"<p>La Biblia es la historia de Dios desde la creación hasta la nueva creación: <b>creación, caída, redención, nueva creación<\/b>. Dios promete la redención justo después de la caída; ese plan pasa por Israel hasta Jesús, quien establece el reino, da paso a la era de la iglesia en la que vivimos ahora y regresará para hacer nuevas todas las cosas.<\/p><p><b>Israel en pocas palabras:<\/b> Abraham → Isaac → Jacob (Israel) y las 12 tribus → Egipto → Moisés y el desierto → la tierra prometida y los jueces → Saúl (fracasa) → David (promesa de un trono eterno) → Salomón (sabio, luego necio) → el reino se divide en Israel (norte) y Judá (sur), ambos deslizándose hacia la idolatría.<\/p><p><b>722 a. C.:<\/b> Asiria conquista y dispersa el norte. <b>136 años después:<\/b> Babilonia saquea Jerusalén y exilia a Judá. Habacuc está en medio de ambos hechos.<\/p><p><b>Justo antes de que escriba:<\/b> el buen rey Josías encabeza una reforma; se repara el templo y se redescubre y se lee en voz alta el libro perdido de la ley; Josías rasga sus vestiduras y llama a la nación al arrepentimiento: un breve avivamiento. Luego Josías muere, un hijo malvado toma el trono y Judá retrocede. Mientras tanto el mundo se agita: Asiria se derrumba, Egipto presiona desde el sur, Babilonia se levanta.<\/p><p>Pero la mayor preocupación de Habacuc no está allá afuera: es lo que sucede en casa.<\/p>"},{"t":"I. El mal muchas veces golpea cerca de casa (vv. 3–4)","h":"<p>Habacuc dice <b>“delante de mí”<\/b>: no un mal lejano, sino un mal de cerca, entre personas en pacto con el Dios que las libró y proveyó para ellas. Fíjate cómo se extiende hacia afuera y se intensifica:<\/p><ul><li><b>Destrucción y violencia<\/b>: abuso y asesinato abiertos, a plena vista.<\/li><li><b>Contienda y pleito<\/b>: la gente se explota y se mata, así que se divide, se vuelve hostil y desconfiada; se fracturan familias, amistades y vecindarios; la confianza se erosiona.<\/li><li><b>La ley se paraliza<\/b>: la “Torá”, la propia instrucción de Dios. Redescubierta bajo Josías, ahora enterrada de nuevo; ya no gobierna ni moldea la cultura.<\/li><li><b>La justicia sale torcida<\/b>: no desaparece, sale chueca: lo mismo que debía corregir el mal produce un resultado peor.<\/li><\/ul><div class='key'>Esto es lo que sucede cuando una cultura empuja a Dios a los márgenes: le dice a su Creador: “Ya no eres bienvenido aquí.”<\/div><p>El mal lejano podemos reconocerlo sin sentirlo. Es distinto cuando alguien en quien confías te mira a los ojos y miente, un amigo te traiciona, un líder abusa de su poder, o un hermano o hermana en Cristo peca contra ti; o cuando ves a tu ciudad, estado o nación descender a la corrupción y la necedad. Eso nos duele de otra manera porque golpea cerca de casa. Pero para Habacuc, eso es solo la mitad del problema.<\/p>"},{"t":"II. Dios puede parecer dolorosamente callado (vv. 1–2)","h":"<p>Desde donde Habacuc está, Dios parece estar de brazos cruzados. ¿Qué hacemos cuando Dios parece callado? ¿Podemos seguir confiando en él cuando no entendemos?<\/p><ul><li><b>“¿Hasta cuándo?”<\/b>: no es su primera oración; lleva mucho tiempo clamando.<\/li><li><b>“No escucharás”<\/b>: en la poesía hebrea, que Dios “oiga” es reconocer <i>y actuar<\/i>. “Tu negativa a actuar habla más fuerte que cualquier otra voz.”<\/li><li><b>“¡Violencia!” … “no salvarás”<\/b>: como presenciar un crimen violento durante un paseo y gritar: “¡Que alguien haga algo!” No quiere una explicación; quiere una <i>intervención<\/i>.<\/li><li><b>“¿Por qué me haces ver?”<\/b>: yo lo veo, tú lo ves, yo no puedo hacer nada, tú puedes hacerlo todo, y sin embargo miras con indiferencia.<\/li><\/ul><p><b>Aun así, sigue hablando con Dios.<\/b> La respuesta de Dios, el doble de larga que la queja, muestra que estaba escuchando. Frustrado, enojado, herido, confundido, Habacuc sigue orando. Esto es <b>lamento: fe que habla con honestidad cuando no entiende del todo.<\/b><\/p><div class='key'>A Dios no lo ofende tu lamento; lo recibe con agrado. Puedes venir a él precisamente porque no entiendes, y él nos ha dado palabras en la Escritura cuando las nuestras faltan.<\/div><p><b>Jesús mismo oró un lamento<\/b> en la cruz: “Dios mío, Dios mío, ¿por qué me has abandonado?” (del Salmo 22): el mal no solo en la puerta sino irrumpiendo por la entrada principal. Y en la cruz parecía que el mal había ganado, cuando Dios acababa de derrotarlo.<\/p><div class='q'>“A veces Dios está haciendo su mayor obra cuando parece que no está haciendo nada.”<\/div>"},{"t":"III. Dios siempre está obrando (vv. 5–6)","h":"<p>El Señor responde: <i>“Miren entre las naciones y observen. Asómbrense, maravíllense. Porque haré una obra en sus días que no la creerían si se les contara. Pues he aquí, yo levanto a los caldeos…”<\/i> (caldeos = babilonios).<\/p><p><b>1. Dios amplía el campo de visión de Habacuc.<\/b> Habacuc ha estado mirando a Judá; Dios dice: “Aléjate mucho… mira más amplio.” Dios dirige el movimiento de la historia humana.<\/p><p><b>2. Dios responde cada queja, categoría por categoría:<\/b><\/p><ul><li>“¿Hasta cuándo?” → “En sus días actuaré.”<\/li><li>“No estás haciendo nada.” → “Estoy haciendo una obra.”<\/li><li>“¿Por qué me haces ver?” → “Miren entre las naciones y observen.”<\/li><li>“¡Violencia!” → “Traigo una violencia mayor para juzgar la violencia que ves.”<\/li><\/ul><p><b>3. Pero no la respuesta que Habacuc esperaba.<\/b> Dios tratará con la maldad de Judá levantando a Babilonia: brutal, despiadada, sedienta de sangre, movida por la conquista; “juntan cautivos como arena” y su “poder es su dios”. Eso crea un nuevo problema: <i>¿puede Dios ser bueno si usa un mal mayor para juzgar uno menor?<\/i> El pastor Mike dejó ese profundo dilema para el pastor Andrew, que predica la próxima vez.<\/p>"},{"t":"Aplicación: Mira hacia arriba","h":"<p>El pastor Mike admitió que un martes por la noche estaba despierto pensando: <i>“¿En qué nos he metido? Predicar Habacuc”<\/i>, pero para el viernes encontró el libro “muy cercano” y profundamente alentador para los cristianos de hoy.<\/p><p>Vivimos a mil por hora, así que nuestro campo de visión se encoge: la tensión en el matrimonio, un hijo descarriado, problemas en el trabajo se vuelven toda la historia. Habacuc nos recuerda <b>mirar hacia arriba<\/b>: Dios dirige las naciones y, si dirigió el mundo de Habacuc, dirige nuestras vidas. Lo mismo vale para nuestras ciudades, estado y nación, aun con elecciones intermedias en camino y la frustración que despierta la política: <i>“¿Hasta cuándo, Señor?”<\/i><\/p><div class='key'>“Mi pequeño cuadro no es toda la historia.” Dios es soberano; tratará con todo gobernante malvado y toda injusticia. Puede que no entienda, puede que ni me guste, lo que Dios está haciendo, pero la fe no juzgará el carácter de Dios por la pequeña pieza de la historia que cabe en mi cuadro.<\/div>"},{"t":"La cruz y la invitación","h":"<p>Cuando el mal derriba tu puerta y te tienta preguntar <i>¿Ves? ¿Te importa? ¿Eres bueno? ¿Siquiera existes?<\/i>, <b>recuerda la cruz.<\/b> Allí vemos con más claridad que Dios no ignora el mal; lo trató, lo juzgó y lo derrotó. Todo mal enfrentará un ajuste de cuentas.<\/p><p>La cruz también muestra que el problema no es solo el mal <i>allá afuera<\/i> sino el mal <i>aquí adentro<\/i>. “Puede que no seamos tan pecadores como podríamos, pero somos lo bastante pecadores” para merecer el juicio de Dios. ¿Cómo puede Dios juzgar el mal de allá afuera sin juzgarnos a nosotros? Jesús tomó todo nuestro pecado y cargó el juicio completo, pagándolo por entero. <b>O Jesús paga por mi pecado o lo pago yo.<\/b><\/p><p><b>Invitación:<\/b> si nunca te has vuelto a Jesús, vuélvete a él con fe, apártate del pecado, confía en su obra perfecta como tu sustituto y clama a él, ahí mismo en tu asiento. Luego el servicio pasó a la comunión.<\/p>"}],"qa":[{"q":"¿Qué fue lo que más se te quedó del sermón del domingo esta semana: una pregunta, una convicción o algo especialmente impactante?"},{"q":"<b>Entendiendo el texto<\/b><br>Habacuc vivió en los últimos años de Judá, justo antes de que Babilonia invadiera. El buen rey Josías había muerto y el pueblo había vuelto a sus viejos pecados. Lee los versículos 2–4: ¿quién comete la violencia y la injusticia que condena Habacuc? (Ver: 2 Reyes 23:36–37)"},{"q":"<b>Entendiendo el texto<\/b><br>Habacuc le habla con audacia a Dios, acusándolo de no oír ni intervenir (vv. 2–3). Aun así, lleva sus quejas a Dios en lugar de apartarse. ¿Qué nos enseña esto sobre la diferencia entre el lamento honesto y la incredulidad? (Ver: Salmos 13:1–2)"},{"q":"<b>Entendiendo el texto<\/b><br>Dios responde a Habacuc, pero no como él esperaba: está levantando a los caldeos (babilonios), una nación aún más malvada, para juzgar a Judá (vv. 5–11). ¿Qué revela la respuesta de Dios sobre las suposiciones que a veces hacemos sobre cómo debería actuar Dios?"},{"q":"<b>Aplicando el sermón<\/b><br>El primer punto del pastor Mike: el mal muchas veces golpea cerca de casa. A Habacuc lo entristece la maldad entre el pueblo de Dios (v. 4). ¿Por qué podría ser especialmente doloroso la injusticia y la infidelidad entre el pueblo de Dios? ¿Cómo debemos responder cuando la encontramos en la iglesia?"},{"q":"<b>Aplicando el sermón<\/b><br>El segundo punto del pastor Mike: Dios puede parecer dolorosamente callado cuando golpea el mal. Habacuc sigue clamando a Dios aun cuando el cielo parece callado. ¿Has vivido una temporada en que Dios parecía no responder a tus oraciones? ¿Cómo afectó eso tu relación con él y qué podemos aprender de la respuesta de Habacuc?"},{"q":"<b>Aplicando el sermón<\/b><br>El tercer punto del pastor Mike: Dios siempre está obrando, muchas veces de maneras que jamás esperaríamos. Habacuc sabía que Dios era justo y recto, pero sus circunstancias parecían contradecir lo que sabía de Dios. ¿Qué debe gobernar nuestro entendimiento de Dios cuando las circunstancias parecen contradecir lo que él ha revelado de sí mismo? (Ver: Isaías 55:8–9)"},{"q":"<b>Conociendo la doctrina<\/b><br>Dios levanta a los caldeos para cumplir sus propósitos, y aun así los tiene por culpables de su maldad (vv. 6, 11). ¿Cómo sostiene la Escritura tanto la soberanía absoluta de Dios como la responsabilidad del hombre por el mal? ¿Por qué es importante que nunca renunciemos a ninguna de las dos verdades? (Ver: Génesis 50:20; Isaías 10:5–7; Hechos 2:23)"},{"q":"<b>Compartiendo la verdad<\/b><br>Un amigo dice: “Si Dios es bueno y poderoso, ¿por qué no detiene el mal?” ¿Cómo podría ayudarte Habacuc 1 a responder? ¿Qué podemos afirmar con confianza sobre Dios aun cuando no podamos explicar sus propósitos particulares? (Ver: Romanos 8:28; 2 Pedro 3:9)"},{"q":"<b>Compartiendo la verdad<\/b><br>Años después, Pablo usó Habacuc 1:5 al predicar a Cristo (Hechos 13:38–41). En la cruz, el mal pareció triunfar, pero Dios estaba logrando nuestra salvación. ¿Quién en tu vida está luchando por confiar en Dios, y cómo podrías animarlo esta semana con la esperanza del evangelio?"}]},"hab2":{"tab":"¿Por qué, Dios?","title":"¿Por qué, Dios?","meta":"Andrew Kelley · 18 oct 2026 · Hope Chapel","ref":"Habacuc 1:12–2:1","verse":"“¿No eres tú desde la eternidad, Señor, Dios mío, Santo mío? No moriremos… ¿Seguirá vaciando su red y matando naciones sin piedad para siempre? Me pondré en mi puesto de guardia, me colocaré sobre la torre, y velaré para ver lo que me dice.” (Habacuc 1:12–2:1, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"“¿Por qué, Dios?” es una pregunta peligrosa pero invitada, y Habacuc muestra cómo hacerla bien: confiar primero en la bondad de Dios, luchar con honestidad con su providencia y luego esperar en su liberación desde la torre de vigilancia.","take":["Dios no prohíbe el “¿Por qué, Dios?”: nos invita a llevarle nuestras quejas, con humildad.","La Biblia reconoce el mal real y afirma que Dios es bueno, sosteniendo ambas cosas en tensión. Rechaza la salida intelectual (“Dios no existe”) y la salida emocional (“que se quede en su rincón”).","Confía primero en la bondad de Dios (v. 12): eterno, el Señor del pacto (Yahvé), santo, guardador de promesas (“No moriremos”), con planes que son correctos y con propósito. Habacuc parte del carácter de Dios y luego trata de entender su situación.","Lucha con la providencia de Dios (vv. 13–17): sufrir sin abandonar a Dios y tener éxito sin reemplazar a Dios. La soberanía de Dios sobre el pecado no es aprobación del pecado; el éxito no prueba favor, el fracaso no prueba juicio; Dios usa el mal para bien (José, la cruz); el éxito puede engendrar idolatría: exaltar el regalo y no al dador.","La magnitud de un pecado o una prueba no significa que sea permanente. En Cristo, “tus mejores días están por delante”: termina en gloria.","Espera en la liberación de Dios (2:1) con paciencia, anhelo (no indiferencia) y escucha: Dios ha hablado en su palabra."],"scr":[["Habacuc 1:12–2:1","La segunda queja de Habacuc y su torre de vigilancia."],["Habacuc 1:5–6","La primera respuesta de Dios: levantar a los caldeos."],["Éxodo 3:13–15","“Yo soy el que soy… el Señor… este es mi nombre para siempre.”"],["Levítico 26:44; Deuteronomio 4:31","Dios no destruirá del todo ni olvidará su pacto."],["Romanos 8:28","Todas las cosas cooperan para bien de los que aman a Dios."],["Génesis 50:20","“Ustedes pensaron hacerme mal, pero Dios lo tornó en bien.”"],["2 Corintios 4:16–18","Una aflicción leve y momentánea que prepara un eterno peso de gloria."],["Génesis 1:26–28","La humanidad hecha para gobernar: el orden de la creación."],["Santiago 1:17; Gálatas 6:9","Toda buena dádiva viene de lo alto; no nos cansemos de hacer el bien."],["Romanos 5:1; Romanos 8:1","Paz con Dios; ninguna condenación en Cristo."],["Salmos 13; 2 Corintios 5:21","Lamento y confianza; Cristo hecho pecado por nosotros."]],"secs":[{"t":"Apertura: Una pregunta peligrosa","h":"<p>El pastor Andrew abrió con su primera sierra de vaivén: una herramienta útil y peligrosa (conoció a un hombre que se cortó los dedos). Así es la pregunta <b>“¿Por qué, Dios?”<\/b> Nos lleva al borde de la fe, estira nuestros límites emocionales y nos pone cara a cara con la duda: un sendero alto y angosto con la desesperación de un lado y el resentimiento del otro.<\/p><p>Todos la han hecho: por cosas pequeñas (un lugar de estacionamiento, sin Wi-Fi) y por cosas que nadie cuestionaría: un matrimonio que fracasa, un hijo descarriado, un empleo perdido, una pérdida, un diagnóstico. En una sola sala hay suficiente sufrimiento combinado para aplastar a una persona. Es una misericordia divina que no conozcamos nuestras dificultades futuras.<\/p><div class='key'>Lo notable del cristianismo es que Dios no prohíbe la pregunta: la invita. Podemos llevar a Dios nuestras quejas sobre Dios (con humildad, no con arrogancia).<\/div>"},{"t":"Contexto y el problema del mal","h":"<p>Josías fue un buen rey; se halló la ley; el pueblo fue renovado. Luego sus hijos fueron malos reyes y las cosas fueron cuesta abajo, con los babilonios a punto de llevar a los judíos al exilio. Habacuc clamó por el mal entre su propio pueblo (violencia, contienda, ley paralizada, justicia pervertida). Dios respondió (1:5–6): está levantando a los caldeos, <i>una nación más destructiva, más violenta, más pecaminosa<\/i>. No una renovación rápida, sino ruina y juicio. Habacuc enfrenta ahora el problema del mal.<\/p><p><b>El problema, expuesto:<\/b> Dios es totalmente bueno, todopoderoso y el mal existe, y las tres cosas no pueden ser ciertas a la vez.<\/p><ul><li><b>La salida intelectual:<\/b> “obviamente Dios no existe” (al menos no como lo describe la Biblia).<\/li><li><b>La salida emocional<\/b> (más común): “Mi vida es un naufragio… Quizá Dios existe, pero ya no confío en él. Que se quede en su rincón y yo en el mío.”<\/li><li>Otros redefinen el mal o aprenden a sobrellevarlo.<\/li><\/ul><p><b>La Biblia hace dos cosas a la vez:<\/b> reconoce el mal grave y flagrante (sin endulzarlo) y afirma que Dios es bueno, sosteniendo ambas cosas en tensión. Habacuc muestra cómo se ve hacer bien la pregunta “¿Por qué, Dios?”. (El pastor Andrew notó que no resolvería el problema de inmediato; la respuesta del texto es útil pero no la que esperan nuestras mentes occidentales. Habrá una sesión sobre esto en la Conferencia de Apologética del próximo fin de semana.)<\/p>"},{"t":"I. Confía en la bondad de Dios (v. 12)","h":"<p><i>“¿No eres tú desde la eternidad, Señor, Dios mío, Santo mío? No moriremos. Señor, tú lo has puesto para juicio; tú, oh Roca, lo has establecido para castigo.”<\/i> Habacuc se inclina <b>hacia<\/b> la bondad de Dios, no se aleja: la sustancia de la fe no es entender todos los planes de Dios sino <b>conocer el carácter de Dios.<\/b> Repasa:<\/p><ul><li><b>Eterno<\/b>: Dios siempre ha existido, es todopoderoso y omnisciente; nada está fuera de su control. El sufrimiento puede agotarnos; no agotará ni dominará a Dios, y cuando el sufrimiento termine Dios sigue allí. Esto afloja el agarre del sufrimiento.<\/li><li><b>Señor (Yahvé)<\/b>: el nombre del pacto que Dios dio a Moisés (Éxodo 3: “Yo soy el que soy… este es mi nombre para siempre”). No una construcción filosófica sino el Dios que llamó a Abraham, envió a Moisés, levantó a David: comprometido con su pueblo, cercano, ligado a ellos y obrando por ellos.<\/li><li><b>Santo<\/b>: apartado, en una categoría propia; sus caminos más altos que los nuestros; nada malo hay en él; todo lo que hace es correcto.<\/li><li><b>Sus promesas son seguras: “No moriremos”.<\/b> No “no sufriremos, no seremos dañados, oprimidos, exiliados ni dispersados”, sino que el juicio no será final y la destrucción no será total. (Levítico 26:44; Deuteronomio 4:31.) En el sufrimiento recordamos que Dios cumple sus promesas.<\/li><li><b>Sus planes son correctos<\/b>: “puesto… para castigo” (corrección). Una palabra dura: los planes difíciles son con propósito. Tu vida no es un accidente ni algo improvisado; él no desperdiciará lo que te ha dado. Mirando atrás, la mayoría ve cómo usó el sufrimiento para moldearlos para bien (Romanos 8:28).<\/li><\/ul><div class='key'>Cuando sufro, mi corazón dice: “Demuéstrame otra vez que eres bueno… muéstrame tu currículum.” Habacuc hace lo contrario: afirma que Dios es bueno y <i>luego<\/i> trata de entender su situación.<\/div>"},{"t":"II. Lucha con la providencia de Dios (vv. 13–17)","h":"<p>Habacuc presenta una queja real: Dios es demasiado puro para mirar el mal, entonces ¿por qué mira con indiferencia a los traidores y calla cuando el impío se traga al más justo? El pastor Andrew quiere ambos filos de la espada: <b>aprender a sufrir sin abandonar a Dios y a tener éxito sin reemplazar a Dios.<\/b> Primero, las imágenes:<\/p><ul><li><b>Peces sin gobernante (v. 14)<\/b>: un eco de la creación: humanos hechos para gobernar como vicerregentes de Dios en una creación ordenada. La devastación de Babilonia se siente como una creación desordenada; el pueblo de Dios tratado como algo tan insignificante como peces, sin gobernante, vulnerable (Génesis 1:26–28).<\/li><li><b>Anzuelo, red, red barredera (v. 15)<\/b>: un anzuelo atrapa un pez; una red unos cuantos más; una barredera arrasa con todo. Devastación progresiva y ninguna escapatoria del juicio que viene.<\/li><\/ul><p><b>Lecciones de la sección:<\/b><\/p><ol><li><b>La soberanía de Dios sobre el pecado no es aprobación del pecado.<\/b> Los malos a veces ganan: naciones crueles, malas ideas políticas, el compañero deshonesto ascendido por encima de ti. No supongas que el problema significa que Dios te odia ni que la comodidad significa que te ama; éxito ≠ aprobación, fracaso ≠ odio. Esto mata a la vez el orgullo y los celos, porque Dios mira el interior. Pregunta: ¿mi éxito me lleva a creer que tengo favor cuando no soy obediente?<\/li><li><b>Dios usa el mal para bien.<\/b> José: “Ustedes pensaron hacerme mal, pero Dios lo tornó en bien” (Génesis 50:20): no llama al mal “algo sin importancia”. Más grande aún: <b>el evangelio.<\/b> Los humanos son rebeldes culpables en un tribunal cósmico; Dios se hizo hombre, vivió perfectamente y nosotros lo matamos: traición, juicios injustos, golpes, corona de espinas, cruz. ¡Qué gran mal! Y sin embargo, en la cruz, en la muerte de Cristo, vemos la muerte de la muerte. Jesús no cargaba ningún pecado propio, así que pudo cargar el nuestro; “fue hecho pecado por nosotros”; nosotros recibimos su justicia.<div class='key'>Ante el juez, el único abogado que podrías tener es Cristo, no tu mamá, tu cónyuge, tus hijos ni tu pastor. Si te has arrepentido y vuelto a él, presentas su perfecto certificado de salud y escapas de la ira. Si no, no estás a salvo. Hoy es el día de salvación (había ancianos disponibles para orar).<\/div><\/li><li><b>El éxito puede producir idolatría (v. 16).<\/b> Babilonia sacrifica a su red, adorando las herramientas que le dieron lujo: “exaltando el regalo y no al dador”. Como su hija agradeciendo a la casa de muñecas en vez de a sus abuelos. Adoramos el dinero (revisando la cuenta bancaria), la familia (el gozo sube y baja con su salud), la vocación, las tarjetas de crédito, los logros, las medallas: confundiendo la creación con el Creador. El pastor Andrew quiere tener éxito sin reemplazar a Dios.<\/li><li><b>La magnitud de un pecado no significa que sea permanente (v. 17).<\/b> El hombre vacía sin fin su red sobre la playa: “¿para siempre?” Cuando sufrimos, siempre se siente a largo plazo, sin esperanza, como si nunca fuera a dejar de llover. Tenemos una visión limitada de la vida y la historia. Todos los que han perseverado en el sufrimiento miran atrás y dicen que eso era lo que necesitaban oír: Dios es bueno, cumple sus promesas y el sufrimiento no dura para siempre.<div class='key'>Por oscura que se ponga la vida, si estás en Cristo termina en gloria (2 Corintios 4:16–18): “tus mejores días están por delante”.<\/div><\/li><\/ol>"},{"t":"III. Espera en la liberación de Dios (2:1)","h":"<p><i>“Me pondré en mi puesto de guardia y me colocaré sobre la torre, y velaré para ver lo que me dice, y qué responderé ante mi queja.”<\/i> El movimiento: afirmar la bondad de Dios → exponer la queja → volver a la torre de vigilancia a esperar. Tres posturas de esperanza:<\/p><ul><li><b>Paciencia.<\/b> Un vigía no controla cuándo llega lo que vigila. Dios sacó gran bien de la destrucción de Babilonia, aunque Habacuc nunca lo vio: el exilio → <b>sinagogas<\/b> en cada ciudad importante (adonde Pablo iba primero, hallando temerosos de Dios receptivos); Alejandro y Grecia → un idioma común (el Nuevo Testamento se escribió en griego); Roma → caminos. Imperios brutales, y aun así Dios los usó. Debemos confiar en él aunque no veamos el fruto en nuestra vida: al discipular a nuestros hijos, evangelizar nuestras ciudades, mantenernos obedientes al único Dios verdadero.<\/li><li><b>Anhelo, no indiferencia.<\/b> No te desapegues ni te niegues a esperar para no quedar en ridículo. “No tienes que cubrir tus apuestas emocionales”: puedes esperar de todo corazón y con riesgo en el regreso de Cristo. No te defraudará.<\/li><li><b>Escucha.<\/b> Habacuc está listo para oír hablar a Dios. Necesitamos que Dios hable, y lo ha hecho en su palabra.<\/li><\/ul>"}],"qa":[{"q":"¿Qué fue lo que más se te quedó del sermón del domingo esta semana: una pregunta, una convicción o algo especialmente impactante?"},{"q":"<b>Entendiendo el texto<\/b><br>Lee el versículo 12. Habacuc está a punto de derramar una queja, pero comienza nombrando quién es Dios. ¿Qué verdades sobre Dios encontramos en este versículo?"},{"q":"<b>Entendiendo el texto<\/b><br>En el versículo 12 Habacuc dice: “No moriremos.” No dice: no sufriremos, no seremos dispersados ni exiliados. ¿Cuál es la diferencia entre que Dios nos libre del sufrimiento y que nos preserve a través de él? (Ver: Levítico 26:44; Deuteronomio 4:31)"},{"q":"<b>Entendiendo el texto<\/b><br>Lee los versículos 14–15. Habacuc retrata a las personas como peces sin gobernante, atrapados primero con un anzuelo, luego con una red y luego con una red barredera que arrasa con todo el mar. ¿Qué muestran estas imágenes sobre cómo se sienten el mal y la injusticia para quienes viven bajo ellos? (Ver: Génesis 1:26–28)"},{"q":"<b>Aplicando el sermón<\/b><br>El pastor Andrew admitió que cuando algo sale mal, su corazón dice: “Dios, tienes que explicarte.” Habacuc hizo lo contrario: partió de la bondad de Dios y luego expresó su queja. Cuando la vida no tiene sentido, ¿qué te ayuda a confiar en el carácter inmutable de Dios en lugar de exigir respuestas?"},{"q":"<b>Aplicando el sermón<\/b><br>Babilonia adora las herramientas que lo enriquecieron (v. 16). El pastor Andrew dijo que hacemos lo mismo cuando “descansamos en el regalo y no en el dador”, como su hija agradeciendo a la casa de muñecas en vez de a sus abuelos. ¿Cómo puedes saber cuándo un buen regalo ha empezado a ocupar el lugar de Dios en tu vida? (Ver: Santiago 1:17)"},{"q":"<b>Aplicando el sermón<\/b><br>Habacuc nunca lo vio, pero Dios usó el mal de Babilonia para difundir el evangelio: el exilio creó las sinagogas, Grecia difundió un idioma común y Roma construyó los caminos. Dios puede sacar de tu obediencia un bien que nunca verás. ¿Dónde te llama Dios a permanecer fiel aun sin resultados visibles? (Ver: Gálatas 6:9)"},{"q":"<b>Conociendo la doctrina<\/b><br>El pastor Andrew dijo que no debemos leer el éxito como favor de Dios ni el fracaso como su juicio. Pero todos quieren saber dónde están con Dios. Si nuestras circunstancias no pueden decírnoslo, ¿qué puede? (Ver: Romanos 5:1; Romanos 8:1)"},{"q":"<b>Compartiendo la verdad<\/b><br>Mucha gente puede alejarse poco a poco y dejar de confiar en Dios después de que la vida la decepciona: “Que se quede en su rincón. Yo me quedo en el mío.” ¿Cómo responderías a un amigo que se siente así? (Ver: Salmos 13)"},{"q":"<b>Compartiendo la verdad<\/b><br>El pastor Andrew dijo que la Biblia no enseña que los buenos van al cielo y los malos al infierno. Enseña que en la cruz “se hace un intercambio”: Jesús toma nuestro pecado y nosotros recibimos su justicia. ¿Cómo explicarías este intercambio con tus propias palabras a un amigo que piensa que ser bueno es suficiente? (Ver: 2 Corintios 5:21)"}]},"story":{"tab":"La historia de la realidad","title":"La historia de la realidad","meta":"Greg Koukl (invitado) · 25 oct 2026 · Hope Chapel","ref":"La gran historia: de Génesis a Apocalipsis","vref":"Génesis 1:1; Juan 1:1–14","verse":"“En el principio creó Dios los cielos y la tierra.” … “En el principio era el Verbo… Y el Verbo se hizo carne y habitó entre nosotros.” (Génesis 1:1; Juan 1:1–14, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"El cristianismo no es una fantasía espiritual privada sino una imagen de la realidad: una sola historia verdadera que se puede contar en cinco palabras: Dios, hombre, Jesús, cruz, resurrección. Comienza con Dios, explica por qué el mundo está roto y muestra por qué solo Jesús es el rescate.","take":["El cristianismo es más que una religión, un estilo de vida o una relación interior: es <b>una imagen de la realidad<\/b>, una cosmovisión, una descripción de cómo son realmente las cosas. No “verdadero para mí”, sino verdadero según cómo es el mundo; historia, no ficción.","Muchos cristianos tienen una <b>pila de piezas de rompecabezas<\/b> (Jesús, Moisés, el nuevo pacto, la segunda venida…). Mira la <b>tapa del rompecabezas<\/b>, la gran historia, para no perderte entre las piezas.","Las cinco palabras: <b>Dios, hombre, Jesús, cruz, resurrección<\/b>. Tiene todas las partes de una buena historia: principio, conflicto, resolución, restauración. En esta historia el hombre no puede rescatarse a sí mismo; Dios tiene que hacerlo.","<b>Dios<\/b>: la historia trata de él, no de nosotros (“nuestras vidas para el maravilloso plan de Dios”, no el maravilloso plan de Dios para nuestras vidas); todo le pertenece (somos inquilinos, él es el casero); es un reino; la realidad es material <i>e<\/i> inmaterial; y el problema del mal es un problema para el ateísmo, no para los cristianos.","<b>El hombre<\/b>: cuerpo y alma, hecho a imagen de Dios, así que toda persona es “magnífica”. El hombre usó su libertad moral para rebelarse (“haz lo tuyo”) y rompió todo: culpable, espiritualmente muerto, esclavo de Satanás y de la carne. Dios se enoja <i>porque<\/i> es bueno.","<b>Jesús, cruz, resurrección<\/b>: el Dios-hombre vino a rescatarnos, incluso de la justa ira del Padre. En la cruz vivió la vida que nosotros debimos vivir e hizo un intercambio: <i>“Llévame a mí en su lugar.”<\/i> “Tetelestai: consumado es.” Jesús toma nuestra culpa; nosotros recibimos su bondad. En la resurrección final habrá o justicia perfecta o misericordia perfecta: o Jesús paga o pagas tú."],"scr":[["Génesis 1:1","“En el principio creó Dios los cielos y la tierra.”"],["Juan 1:1–3, 14","El Verbo que estaba con Dios y era Dios se hizo carne."],["Filipenses 2:6–8","Se despojó a sí mismo, tomando forma de siervo, hasta la muerte en una cruz."],["Mateo 10:28","Teman al que puede destruir cuerpo y alma en el infierno: el Padre."],["Colosenses 2:13–14","El acta de los decretos contra nosotros, clavada en la cruz."],["Lucas 5:32; Mateo 20:28; Lucas 19:10; Juan 3:17","Por qué vino Jesús: a llamar a pecadores, dar su vida en rescate, buscar y salvar lo perdido, salvar al mundo."],["Salmos 24:1; 1 Corintios 6:19–20","De Dios es la tierra; ustedes no se pertenecen a sí mismos."],["Génesis 1:26–27; Santiago 3:9","Hechos a imagen de Dios."],["Génesis 3:4–5; Juan 8:34","La mentira de la serpiente; todo el que comete pecado es esclavo del pecado."]],"secs":[{"t":"Bienvenida y el problema de la “religión”","h":"<p>Greg Koukl (fundador de Stand to Reason), que habló por primera vez en Hope Chapel en 1976 y estuvo ausente unos 30 años, dijo que quería contar una historia conocida que pocos entienden aunque la llamen suya: cómo comenzó el mundo, cómo termina y todo lo importante en medio: <b>la historia de la realidad.<\/b><\/p><p>El problema: en un avión, un corredor de bolsa que pregunta a qué se dedica supondrá con cortesía que la religión es una “fantasía espiritual”: cada quien tiene la suya, lo que le funcione. Greg no quiere que sus convicciones se escuchen así, y muchos cristianos, influidos por la cultura, no han captado del todo la alternativa.<\/p>"},{"t":"¿Qué es el cristianismo? Una imagen de la realidad","h":"<p>Una pregunta retórica: <b>¿Qué es el cristianismo?<\/b> Respuestas comunes: una religión; una manera satisfactoria de vivir; una estructura moral; una relación. Son buenas pero no profundas, y todas tratan del <i>interior<\/i>.<\/p><div class='key'>La respuesta correcta: el cristianismo es una imagen de la realidad: un relato de cómo son realmente las cosas. Por eso se llama cosmovisión.<\/div><p><b>El rompecabezas:<\/b> para muchos cristianos es una <i>pila de piezas<\/i>: Jesús, Moisés, el nuevo pacto, Josué, el mar Rojo, la segunda venida, los discípulos. Si nunca lo has armado de manera coherente, no sabes si tienes todas las piezas ni si se han colado piezas de otras cosmovisiones (como la reencarnación: un carburador en una computadora). El truco de un rompecabezas es <b>mirar la imagen de la caja<\/b>; hoy Greg muestra la tapa.<\/p><p><b>También es una historia<\/b>: una paz destrozada por la rebelión, amor y traición, conflicto, sacrificio, redención, con un principio (personajes y mundo), conflicto, resolución, restauración (“desenlace”). Y no comienza con “érase una vez”: no es un mito ni fantasía al estilo de Narnia, sino historia. “No es mi fantasía. Es la realidad.”<\/p>"},{"t":"Por qué importa la historia: dos grandes desafíos","h":"<ul><li><b>El problema del mal<\/b>: ¿por qué el mundo es un desastre si Dios es bueno y poderoso? Visto en la historia, no es un problema para los cristianos como la gente piensa. Es un problema para los ateos (ver abajo).<\/li><li><b>“¿Por qué Jesús es el único camino?”<\/b>: políticamente incorrecto, pero los problemas singulares suelen tener soluciones singulares (cáncer: cirugía, quimioterapia, radiación).<\/li><\/ul><p><b>La columna vertebral: cinco palabras:<\/b> <b>Dios, hombre, Jesús, cruz, resurrección<\/b> (la resurrección final para recompensa o juicio). Dios comienza todo y lo hace de la nada; crea al hombre para la amistad; el hombre se mete en problemas; Dios inicia un rescate, único en esta historia, porque el hombre no puede rescatarse a sí mismo. Dios desciende en Jesús, y cómo vive y muere Jesús determina lo que sucede con todos en la resurrección final. (La hija de 6 años de Greg podía contar las palabras con los dedos.)<\/p>"},{"t":"1. Dios: “En el principio, Dios…”","h":"<ul><li><b>La historia comienza con Dios porque trata de Dios<\/b>, no de mí. “No se trata tanto del maravilloso plan de Dios para nuestras vidas como de nuestras vidas para el maravilloso plan de Dios.” Cuando preguntamos “¿Cómo pudo Dios permitir esto <i>a mí<\/i>?” suponemos que la historia trata de nosotros. “La cola no debe mover al perro.”<\/li><li><b>Todo pertenece a Dios<\/b> porque él lo hizo. Contra “mi cuerpo, mi decisión”: quizá tú eres el inquilino y él es el casero (C. S. Lewis).<\/li><li><b>Es un reino<\/b>: un rey y su dominio; viene una guerra civil, pero él sigue siendo rey. Juan, Jesús y los discípulos proclaman el reino para hacer volver a la gente bajo el gobernante legítimo: Dios está al mando.<\/li><li><b>La realidad es material e inmaterial<\/b>: visible e invisible. Agua en vino, resurrección, nacimiento virginal “no suceden” solo si tu imagen de la realidad es la historia atea (“el cosmos es todo lo que hay”). En esta historia es un mundo encantado.<\/li><li><b>El mal es una derrota para el ateísmo, no para el cristianismo.<\/b> Todos saben que el mundo está roto, “no como se supone que debe ser”; así que hay una manera en que se supone que debe ser, lo que implica alguien que lo “supone”. Sin Dios → sin reglas morales trascendentes → sin reglas rotas → sin mal real. Pero hay mal real, así que hay un legislador.<\/li><li><b>Todo lo que Dios hizo era bueno<\/b>: exactamente como su mente lo concibió.<\/li><\/ul>"},{"t":"2. El hombre: hecho a imagen de Dios, luego rebelión","h":"<p><b>Lo que somos:<\/b> físicos (contingentes, mortales; nunca “pequeños dioses”) <i>y<\/i> no físicos: un alma, el yo invisible unido al cuerpo. Los animales también tienen alma (“Fido tiene un alma muy pequeña”), pero solo los humanos son hechos a la <b>imagen de Dios<\/b>, así que toda persona, de cualquier tamaño, edad, capacidad o atractivo, es <b>magnífica<\/b>. (C. S. Lewis: si vieras la verdadera esencia de un humano, te tentaría adorarlo; cf. 2 Corintios 4, “eterno peso de gloria”.) La imagen de Dios fundamenta nuestras obligaciones morales unos con otros (somos animales, pero no <i>meros<\/i> animales) y hace posible la amistad con Dios. Dios también dio un lugar maravilloso y, sobre todo, a sí mismo.<\/p><p><b>La rebelión:<\/b> el hombre podía vivir en armonía bajo el gobierno de Dios, o traicionarlo. Eso es libertad moral, y el hombre la usó para traicionar. “Haz lo tuyo” no es nuevo: viene desde el principio: lo que yo quiero dicta mi “yo auténtico” en lugar de la ley de Dios y el orden creado. Un enemigo le dice a Adán y Eva que no se puede confiar en el rey, que les está ocultando algo, “sean como Dios”. Un acto de desobediencia lo cambia todo.<\/p><p><b>El resultado:<\/b> la rebelión no trae libertad sino quebranto, deshonra, culpa, esclavitud y lucha. Aún hermosos a imagen de Dios, los humanos ahora están torcidos, en rebelión, espiritualmente muertos y doblemente esclavizados: a Satanás (un ser real y peligroso, no un hombre de rojo con tridente; “el mundo entero está bajo el maligno”) y a su propia naturaleza corrompida (“la carne”). La humanidad es culpable de sedición y el rey está airado.<\/p><div class='key'>“¿Por qué se enoja Dios si es amor?” Porque es bueno. La misma bondad y santidad que producen su amor fundamentan también su justicia: no sería bueno si dejara libres a los culpables.<\/div><p>Como los límites de un padre, Dios sabe cómo funciona el mundo y nos hizo para florecer. Romper su regla rompió nuestra relación con Dios, entre nosotros y con la creación (que gime por redención). Un mundo roto produce personas y circunstancias rotas. Dos cosas sobre el problema del mal: <b>es parte de la historia<\/b> (comienza en Génesis 3 y no termina durante 66 libros), y <b>la historia aún no ha terminado<\/b>: El Señor de los Anillos se ve sombrío en la cueva, pero sigue leyendo.<\/p>"},{"t":"3. Jesús: quién era y a qué vino","h":"<p>Con el hombre perdido y sin ayuda, Dios interviene. Dos puntos esenciales: <b>quién era Jesús<\/b> y <b>a qué vino<\/b> (la persona y la obra de Cristo).<\/p><p><b>Quién era:<\/b> plenamente humano (cuerpo, alma, mente, sentimientos, límites: hambriento, cansado, doliente, gozoso, sufriente) <i>y más<\/i>. Juan 1 comienza como Génesis: “En el principio era el Verbo… el Verbo era Dios… todas las cosas fueron hechas por medio de él”: el Creador no creado. Luego: “el Verbo se hizo carne y habitó entre nosotros.” Lo favorito de Greg: <b>sublime<\/b>: Dios se hizo bajo y pequeño, como un padre que se arrodilla para consolar a un niño. Nunca dejó de ser Dios; dejó a un lado sus privilegios, se despojó a sí mismo, tomó forma de siervo y murió la muerte de un criminal (Filipenses 2): la definición de humildad. Este no es el Jesús del islam, los testigos de Jehová, los mormones ni de Oprah/la Nueva Era; ellos lo admitirían.<\/p><p><b>A qué vino: no<\/b> a difundir paz y amor ni a restaurar la justicia social. (Los artículos de Greg: “The Legend of Jesus the Social Justice Warrior” y “Why the Blood?” en str.org; todo el evangelio de Juan nunca plantea así su misión. No es que a Jesús no le importara.) En sus propias palabras: <i>“No he venido a llamar a justos sino a pecadores al arrepentimiento… a dar su vida en rescate por muchos… a buscar y a salvar lo que se había perdido… para que el mundo sea salvo.”<\/i> “Salvar” significa rescatar de un peligro inminente. ¿De qué? De <b>quién<\/b>: del Padre. Es el rey contra quien nos hemos rebelado (Mateo 10:28: teman al que puede arrojar cuerpo y alma al infierno; ese es el Padre, no el diablo). Esas son las malas noticias; ahora las buenas.<\/p>"},{"t":"4. La cruz: el intercambio","h":"<p>Jesús hizo dos cosas: <b>vivió la vida que nosotros debimos vivir<\/b> y luego <b>hizo un intercambio<\/b> por la manera en que murió.<\/p><div class='q'>La conversación en el avión: una mujer musulmana, insatisfecha con el islam dados los acontecimientos actuales. Greg: imagina que unos terroristas vienen por el pasillo a sacarte a rastras; yo pongo mis brazos delante de ti y digo: “No se la lleven. Llévenme a mí en su lugar.” Ella dijo: “No puedo imaginar que alguien hiciera eso por mí.” Eso fue lo que Dios hizo en Jesús: no Alá sino Yahvé, no Mahoma sino Jesús: Dios descendió y le dijo al Padre: “Llévame a mí en su lugar.”<cite>— el Gólgota, “el lugar de la Calavera”; el Calvario<\/cite><\/div><ul><li>La crucifixión normalmente mata por asfixia (les quebraban las piernas a los ladrones para acelerar la muerte), pero hubo una agonía más profunda e invisible: Dios el Padre descargando su furia sobre su Hijo sin pecado como si fuera culpable de todo pecado.<\/li><li><b>El título<\/b>: “El Rey de los judíos”: el delito declarado (sedición bajo Roma). En el mundo antiguo una deuda pagada se marcaba <i>tetelestai<\/i> (“pagado, cancelado, consumado”). Pero el verdadero documento clavado en la cruz es el de <b>Colosenses 2<\/b>: nuestra “acta de decretos contra nosotros”: cada pecado que cada uno cometió, nuestro expediente. Entre la hora sexta y la novena se realizó el intercambio.<\/li><li><b>“O Jesús paga, o pagas tú.”<\/b> El grito de Jesús, <i>Tetelestai<\/i>, “consumado es”, es un <b>grito de victoria<\/b>, no un “qué bueno que ya acabó”: la deuda de todos los que confían en él está pagada por completo. <b>Jesús toma nuestra culpa; nosotros recibimos su bondad.<\/b><\/li><\/ul><div class='key'>Por eso Jesús es el único camino: solo él resolvió el problema. Nadie más lo hizo; nadie más podía. Es un regalo: no se puede ganar ni comprar, solo recibir confiando en él. Eso es lo que la historia llama <b>fe<\/b>.<\/div>"},{"t":"5. Resurrección: justicia o misericordia","h":"<p>Tu decisión sobre este rescate determina lo que sucede con todos en la resurrección final. El último acontecimiento de la historia trae una de dos cosas:<\/p><ul><li><b>Justicia perfecta<\/b>: castigo por cada crimen que cometiste; Jesús no se pierde nada (“darán cuenta de toda palabra ociosa”). Los que rechazan la misericordia de Dios en Cristo son juzgados por sus obras y desterrados de la presencia de Dios para siempre.<\/li><li><b>Misericordia perfecta<\/b>: perdón por todo lo que has hecho mal; Jesús no se pierde nada. Los que cesan su rebelión y reciben el perdón de Dios se hacen miembros de su familia y viven con él en un mundo nuevo, la vida perfecta que él concibió, para siempre.<\/li><\/ul>"},{"t":"La historia en una oración y cierre","h":"<div class='key'>Dios, el creador del universo, para rescatar al hombre del castigo por su rebelión, asumió la humanidad en Jesús, el salvador, para morir en una cruz y resucitar de entre los muertos, de modo que en la resurrección final pudiéramos disfrutar de una maravillosa amistad con nuestro Señor soberano en el tipo de mundo perfecto que nuestro corazón siempre ha anhelado.<\/div><p>La historia de cómo comenzó y termina el mundo: bondad → rebelión y quebranto → rescate → el intercambio → misericordia y justicia final → el fin del mal → restauración plena y, para quienes confían en el rescatador, una amistad sin fin con un Padre que satisface los anhelos más profundos del corazón. “Como dijo Lewis, la puerta a la que hemos tocado toda la vida finalmente se abrirá.” Si eres cristiano, esta es tu historia; si no, <b>esta sigue siendo tu historia<\/b>: es como las cosas realmente son. “No solo una historia… la historia verdadera.”<\/p><p>Luego el servicio pasó a la comunión.<\/p>"}],"qa":[{"q":"¿Cuál fue la parte más impactante de la charla del domingo: una pregunta que despertó, una convicción o algo en lo que has seguido pensando?"},{"q":"<b>Entendiendo la historia<\/b><br>Greg abrió su charla con una pregunta: ¿Qué es el cristianismo? ¿Cómo responderías normalmente si te lo preguntaran?"},{"q":"<b>Entendiendo la historia<\/b><br>La respuesta de Greg fue que el cristianismo es “una imagen de la realidad”, una descripción de cómo es realmente el mundo. La mayoría de la gente, dijo, trata las creencias religiosas como algo personal, no como hechos sobre el mundo. ¿En qué se diferencia su respuesta de las que acabamos de dar?"},{"q":"<b>Entendiendo la historia<\/b><br>Greg dijo que toda la historia se puede contar en cinco palabras, en orden: Dios, hombre, Jesús, cruz, resurrección. También dijo que toda buena historia tiene cuatro partes: un principio, un conflicto, una resolución y una restauración. ¿Cuáles de las cinco palabras pertenecen a cada parte?"},{"q":"<b>Aplicando la charla<\/b><br>La historia comienza con Dios, no con nosotros. Greg dijo que todo pertenece a Dios porque él lo hizo: somos inquilinos; él es el casero. ¿Dónde en tu vida te cuesta más vivir como inquilino y no como dueño? (Ver: Salmos 24:1; 1 Corintios 6:19-20)"},{"q":"<b>Aplicando la charla<\/b><br>Luego Dios hizo al hombre. Greg dijo que algo es cierto de toda persona: cada una está hecha a imagen de Dios, lo que hace a todo ser humano “magnífico”. ¿Cómo cambia o debería cambiar ver así a las personas la manera en que tratas a quienes te cuesta más amar? (Ver: Génesis 1:26-27; Santiago 3:9)"},{"q":"<b>Aplicando la charla<\/b><br>Luego el hombre se rebeló. Greg rastreó el “haz lo tuyo” hasta el huerto: haz tus propias reglas, “te espera la libertad”. Pero la revuelta trajo “quebranto, deshonra, culpa y esclavitud” en su lugar. ¿Dónde has visto que “haz lo tuyo” prometa libertad y entregue lo contrario? (Ver: Génesis 3:4-5; Juan 8:34)"},{"q":"<b>Conociendo la doctrina<\/b><br>Entonces Dios intervino. Greg dijo que las dos cosas que debemos saber sobre Jesús son quién era y a qué vino. ¿Cuál es la respuesta a cada una con tus propias palabras? (Quién era: Juan 1:1-3, 14; Filipenses 2:6-8. A qué vino: Lucas 5:32; Mateo 20:28; Lucas 19:10; Juan 3:17) ¿Por qué lo que Jesús vino a hacer depende de quién es?"},{"q":"<b>Compartiendo la verdad<\/b><br>Un amigo pregunta: “¿Por qué Jesús es el único camino?” ¿Cómo responderías?"},{"q":"<b>Compartiendo la verdad<\/b><br>La historia termina en la resurrección final: “o justicia perfecta o misericordia perfecta”. Greg dijo que si no eres cristiano, “esta sigue siendo tu historia”. Tomen el tiempo que les queda. Usando las cinco palabras, cuenten juntos la historia: ¿qué es el evangelio?"}]},"wins":{"tab":"Dios gana","title":"Dios gana","meta":"Mike Nazarian · 8 nov 2026 · Hope Chapel","ref":"Habacuc 2:6–14","verse":"“Porque la tierra se llenará del conocimiento de la gloria del Señor, como las aguas cubren el mar.” (Habacuc 2:14, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Se puede ganar una batalla y aun así perder la guerra. El éxito temporal no es la victoria final: la gloria del hombre fracasará en esta tierra, pero al final la gloria del Señor llenará la tierra, y esa gloria se revela en Jesús. Al final, Dios gana.","take":["Hay una gran diferencia entre ganar una batalla y ganar la guerra. A veces los enemigos de Dios parecen prosperar, pero <b>el éxito temporal no es lo mismo que la victoria final.<\/b>","Puede que Habacuc no entienda lo que Dios está haciendo, pero puede conocer y confiar en el Dios que lo está haciendo: “el justo por su fe vivirá” (2:4).","Tres de los cinco ayes de Babilonia: <b>lo que el hombre saquea perecerá<\/b> (codicia); <b>lo que el hombre asegura se desvanecerá<\/b> (ningún nido está lo bastante alto); <b>lo que el hombre construye caerá<\/b> (los imperios se afanan “para el fuego”).","Estos ayes se ponen en labios de las naciones que Babilonia pisoteó: una gran inversión. La ganancia injusta nunca puede dar seguridad duradera; siempre hay un ajuste de cuentas.","La promesa de Dios (v. 14): la tierra se llenará del <b>conocimiento<\/b> de su <b>gloria<\/b> “como las aguas cubren el mar”, cumplida mediante el reinado de Jesús (Números 14:21; Isaías 11; 2 Corintios 4:6).","Babilonia quería adquirir, asegurar y exaltarse aplastando a otros. Jesús se humilló para salvar a otros. Toda rodilla se doblará, y Jesús tomó el juicio que merecíamos."],"scr":[["Habacuc 2:6–14","Cinco ayes sobre Babilonia (se tratan tres) y la promesa del v. 14."],["Habacuc 2:4","“El justo por su fe vivirá”, citado en Romanos, Gálatas y Hebreos."],["2 Reyes 25:6–7","La brutalidad de Nabucodonosor: los hijos de Sedequías ejecutados ante sus ojos."],["Números 14:21","“Toda la tierra será llena de la gloria del Señor.”"],["Isaías 11:1–5, 9","El rey venidero del tronco de Isaí; la tierra llena del conocimiento del Señor."],["2 Corintios 4:6","El conocimiento de la gloria de Dios en el rostro de Jesucristo."],["Filipenses 2:5–11","Jesús se humilló; toda rodilla se doblará."]],"secs":[{"t":"Apertura: Ganar la batalla vs. la guerra","h":"<p>El pastor Mike abrió con una breve oración confesando: “tú eres Dios y nosotros no”, y luego una reflexión al preparar este mensaje: en la vida puedes ganar una batalla y aun así perder la guerra: experimentar éxito temporal y sufrir de todos modos una derrota final.<\/p><p>A veces parece que los enemigos de Dios están ganando: los que se oponen a Dios prosperan, la oscuridad tiene poder, y nos preguntamos: <i>Señor, ¿dónde estás? ¿Por qué permites esto?<\/i><\/p><div class='key'>El éxito temporal no es lo mismo que la victoria final, y eso es lo que Dios nos muestra en Habacuc 2:6–14.<\/div><p><b>Dos verdades:<\/b> (1) la gloria del hombre fracasará en esta tierra; (2) la gloria del Señor llenará la tierra.<\/p>"},{"t":"Ubicándonos","h":"<p>Confesión honesta: gravitamos hacia Juan, Proverbios o Efesios, no hacia Habacuc o Sofonías: leemos tres líneas y tenemos que volver a leerlas. El pastor Mike reforzó el mensaje de Andrew de la semana pasada sobre <b>la claridad de la Escritura<\/b>: de veras se puede leer y entender con un poco de esfuerzo.<\/p><ul><li><b>Habacuc<\/b> se duele por la decadencia espiritual, moral y social de Judá: rebelión contra Dios y hostilidad entre las personas.<\/li><li>Vive entre la caída de Asiria (que Dios usó para juzgar al reino del norte) y el ascenso de Babilonia (que Dios usaría para juzgar a Judá), justo después de las reformas y la renovación de Josías; luego Josías fue muerto y los reyes hundieron a la nación de nuevo en la idolatría.<\/li><li>La respuesta de Dios: está levantando a los babilonios. Eso crea un problema mayor: son <i>más<\/i> malvados. Así que Habacuc se pone en la torre de vigilancia (2:1).<\/li><li><b>2:4: “El justo por su fe vivirá.”<\/b> Citado en Romanos, Gálatas y Hebreos, en el corazón del evangelio. Puede que Habacuc no entienda lo que Dios está haciendo, pero puede conocer y confiar en el Dios que lo está haciendo. Nosotros también.<\/li><\/ul><p>Entonces Dios se vuelve a Babilonia, un hombre arrogante cuyo apetito de conquista nunca se sacia, y anuncia <b>cinco ayes<\/b>. “Ay” señala juicio venidero: una declaración solemne de que Dios actuará con decisión (la NTV: “¡Qué tristeza les espera!”). Sorprendentemente, Dios pone estos ayes en labios de las naciones que Babilonia pisoteó: un día se burlarán de Babilonia porque Dios la ha humillado. Juntos, los ayes exponen la futilidad del intento del hombre de establecer su propia gloria y permanencia en oposición a Dios.<\/p>"},{"t":"I. La gloria del hombre fracasará: Ay 1: lo que el hombre saquea perecerá (vv. 6–8)","h":"<p><i>“¡Ay del que acumula lo que no es suyo (¿hasta cuándo?) y se carga de prendas!”<\/i><\/p><p>Babilonia era notoria por su brutalidad. Cuando conquistó Judá, Nabucodonosor hizo ejecutar a los hijos del rey Sedequías delante de él y luego le sacó los ojos, para que lo último que viera fuera la ejecución de sus hijos. Babilonia se enriquecía conquistando naciones, brutalizando personas y saqueando riquezas.<\/p><p><b>Cómo se relaciona con nosotros:<\/b> la mayoría no estamos saqueando nuestra calle sin salida, pero la tentación bajo la lujuria de conquista de Babilonia no nos es ajena: <b>la codicia: el deseo implacable de más.<\/b><\/p><ul><li>A John D. Rockefeller, al preguntarle cuánto dinero es suficiente, se le atribuye haber dicho: “solo un poquito más”.<\/li><li>La codicia nunca se satisface. Nos tienta a justificar lo que sabemos que está mal: recortar camino, comprometer la integridad, aprovecharnos de otros.<\/li><li><b>La codicia deshumaniza:<\/b> valoramos lo que podemos sacar de las personas más que a las personas mismas. Babilonia veía a las naciones no como pueblos que cuidar sino como pueblos que saquear.<\/li><\/ul><p><b>La inversión (vv. 7–8):<\/b> tus deudores se levantarán de repente; “porque has saqueado a muchas naciones, todo el resto de los pueblos te saqueará”. El saqueador se vuelve saqueado.<\/p><div class='key'>La ganancia injusta nunca puede dar seguridad duradera. Siempre hay un ajuste de cuentas. Dios ve, Dios sabe, Dios juzgará y lo pondrá todo en orden; así que lo que el hombre saquea perecerá.<\/div><p>Esto debería asustar a quienes se sienten tentados así, y animar a quienes se desalientan por cuánto de esto ven.<\/p>"},{"t":"Ay 2: lo que el hombre asegura se desvanecerá (vv. 9–11)","h":"<p>Los ayes se apilan: el primero expone la lujuria de Babilonia por <i>adquirir<\/i>; el segundo, su deseo de <i>asegurar<\/i> lo que ha almacenado.<\/p><p><i>“¡Ay del que obtiene ganancia injusta para su casa, para poner en alto su nido y librarse del poder del mal!”<\/i> Como un águila que construye su nido en lo alto de un risco, fuera del alcance de los depredadores: Babilonia saqueó y se protegió para ser intocable. (Versículos 10–11: vergüenza, una vida perdida y las piedras clamando desde el muro.)<\/p><p><b>Llevándolo a casa:<\/b> “Trabaja duro, invierte, acumula, ahorra, planea.” Nada malo hay en eso; la Biblia recomienda una vida sabia y prudente. Pero podemos creer que si acumulo suficiente dinero y seguridad, por fin estaré a salvo. Entonces, ¿dónde he puesto mi fe última?<\/p><ul><li>¿Cuánto es suficiente? “Solo un poquito más.”<\/li><li>¿Cuánto dinero garantizaría que nada pudiera salir mal, que tu salud nunca fallara o tus hijos nunca sufrieran? No hay cantidad.<\/li><li>Seguimos construyendo nuestro nido un poco más alto en el risco, buscando en graneros, cuentas de ahorro y portafolios una seguridad que solo Dios puede dar.<\/li><\/ul><div class='key'>No hay nada malo en construir algo de seguridad material. La pregunta es cuál es mi seguridad <i>última<\/i>, dónde está invertido mi corazón. Es malo hacer de la seguridad mi dios, sobre todo si pisoteo o uso a otros para conseguirla. Ninguna cantidad de riqueza o poder terrenal nos protege del juicio de Dios; ningún nido está construido lo bastante alto para ponerte fuera del alcance de su justicia.<\/div>"},{"t":"Ay 3: lo que el hombre construye caerá (vv. 12–13)","h":"<p>Babilonia quería adquirir, asegurar y un tercer paso: <b>exaltarse a sí misma<\/b>. <i>“¡Ay del que edifica una ciudad con sangre y funda un pueblo con iniquidad!”<\/i> “Babilonia la Grande”: una ciudad magnífica construida con la sangre de otras civilizaciones, un monumento a su propia grandeza.<\/p><p><b>Versículo 13:<\/b> “¿No viene del Señor de los ejércitos que los pueblos trabajen solo para el fuego y las naciones se fatiguen en vano?” En otras palabras, Dios mismo ha determinado que todo el trabajo, la ambición, la conquista, el almacenar y el construir nidos de Babilonia está destinado al fuego. La NTV: <i>“La riqueza de las naciones se convertirá en cenizas. Trabajan tanto, pero todo es en vano.”<\/i> Los imperios tratan de ser imperios, pero Dios se sienta en los cielos y se ríe.<\/p><p><b>Cumplido:<\/b> unos 70 años después de Habacuc, Dios levantó a Ciro el Grande de Persia para aplastar a los babilonios, que quedaron relegados a los anales de la historia. “Dios hizo exactamente lo que dijo que haría.”<\/p><p><b>Una palabra oportuna:<\/b> el pastor Mike (sin tomar partido ni abogar por ningún candidato) reconoció que muchos están preocupados por el rumbo de nuestra nación y del mundo (los titulares y las redes sociales muestran cosas contrarias a la palabra de Dios) y clamamos como Habacuc: <i>¿Hasta cuándo, Señor?<\/i><\/p><div class='key'>La respuesta de Dios a Habacuc no fue que la maldad nunca ganaría poder (Babilonia lo ganó), sino que la maldad <b>nunca tendría la última palabra<\/b>, porque la tendría él. Dios no ha perdido su soberanía; Cristo sigue en su trono, dirigiendo la historia hacia sus fines prescritos. Cuando te desanimes, mira hacia arriba y recuerda: el justo por su fe vivirá, confiando en el Dios que está obrando aun cuando no puedas ver cómo.<\/div><p><b>Las advertencias son también para nosotros.<\/b> Desmontan nuestras ilusiones naturales: que <i>más nos satisfará<\/i>, que <i>la seguridad nos protegerá<\/i>, que <i>el logro nos dará significado<\/i>. Babilonia persiguió las tres por medios malvados y ninguna duró: Dios siempre tiene la última palabra. Así que la gloria del hombre acabará fracasando.<\/p>"},{"t":"II. La gloria del Señor llenará la tierra (v. 14)","h":"<p><i>“Porque la tierra se llenará del conocimiento de la gloria del Señor, como las aguas cubren el mar.”<\/i> Cuatro observaciones:<\/p><ol><li><b>Es una promesa.<\/b> Los imperios suben y caen (egipcios, asirios, babilonios, persas, griegos, romanos, otomanos), pero aquí Dios promete algo que nunca pasará a la historia: “la tierra se llenará”.<\/li><li><b>Es el <i>conocimiento<\/i> de su gloria.<\/b> No todos conocen a Dios hoy; “conocer” también significa reconocer. Algunos lo ignoran, lo rechazan o adoran dioses de su propia fabricación. Viene un día en que toda la tierra observará, reconocerá y admitirá su gloria: por completo, “como las aguas cubren el mar”.<\/li><li><b>¿Qué es la gloria de Dios?<\/b> Su suprema grandeza; la magnífica manifestación de todo lo que él es: santidad, justicia, bondad, sabiduría, poder (la gloria shekinah del Antiguo Testamento). El hebreo <i>kabod<\/i> lleva la idea de peso y valor: no hay nadie más grande ni más digno que Dios.<\/li><li><b>Se cumplirá mediante el reinado de Jesús.<\/b> Números 14:21: “Toda la tierra será llena de la gloria del Señor.” Isaías 11:9: “La tierra estará llena del conocimiento del Señor como las aguas cubren el mar.” Habacuc junta ambas. Isaías 11 describe a un rey venidero del tronco de Isaí, con el Espíritu del Señor sobre él, que juzga al pobre con justicia y decide con equidad a favor de los mansos: <i>ese es Jesús.<\/i> Y 2 Corintios 4:6: “el conocimiento de la gloria de Dios en el rostro de Jesucristo”. Cuando miramos a Jesús, vemos a Dios; la tierra se llenará del reconocimiento de que Jesús es Señor.<\/li><\/ol>"},{"t":"Babilonia vs. Jesús","h":"<p><b>Babilonia:<\/b> adquirir, asegurar, exaltarse a sí misma: “Tomo lo que quiero. Protejo lo que he ganado. Me hago un nombre. Imperio.” Estaba dispuesta a aplastar y asesinar a pueblos enteros para perseguir su propia gloria. Por eso Babilonia se convierte en un tipo de la rebelión humana contra Dios a lo largo de la Biblia, especialmente en Apocalipsis.<\/p><p><b>Jesús<\/b> (Filipenses 2): aunque existía en forma de Dios, no consideró el ser igual a Dios como algo a qué aferrarse; se despojó a sí mismo, tomó forma de siervo y se hizo obediente hasta la muerte en una cruz.<\/p><ul><li>Babilonia se exalta aplastando a otros; <b>Jesús se humilla para salvar a otros.<\/b><\/li><li>Babilonia derramó la sangre de pueblos enteros para establecer su reino; <b>Jesús derramó su propia sangre<\/b> para rescatar a personas de toda lengua, tribu y nación.<\/li><li>Babilonia quería un nombre para sí; a Jesús se le ha dado <b>el nombre sobre todo nombre<\/b>: toda rodilla se doblará y toda lengua confesará que Jesucristo es Señor, para gloria de Dios Padre.<\/li><li>Babilonia quería una gloria que durara para siempre; la gloria de Jesús nunca se desvanecerá: llenará la tierra como las aguas cubren el mar.<\/li><\/ul><div class='key'>Por mal que se vea allá afuera, por incierto que se sienta el futuro: al final, Dios gana. Lo único que importa es que estés de ese lado cuando suceda.<\/div>"},{"t":"El evangelio y la invitación","h":"<p>El pastor Mike estaba agradecido: así como Dios pronunció ayes sobre Babilonia, tendría razón en pronunciar ayes sobre <i>mí<\/i> por mi pecado y rebelión, pero no tengo que temerlo, porque <b>Jesús ha tomado mi juicio por mí.<\/b> Esa es la esperanza del evangelio.<\/p><p><b>Si no conoces a Jesús,<\/b> no estás aquí por casualidad: el Señor de los ejércitos del cielo te trajo para confrontarte con su Hijo. Dios es bueno, así que no excusará el pecado de nadie ni mostrará parcialidad. “Alguien pagará por tu pecado. O tú, o Jesús ya lo ha hecho.” Si no te has vuelto de tu propio camino a Jesús en arrepentimiento y fe, invoca su nombre ahora y recibe el regalo gratuito de la salvación que solo él puede dar.<\/p>"}],"qa":[{"q":"¿Qué fue lo que más se te quedó del sermón del domingo esta semana: una pregunta, una convicción o algo especialmente impactante?"},{"q":"<b>Entendiendo el texto<\/b><br>Lee los versículos 6-8. Un “ay” es el anuncio de un juicio venidero. Aquí son las naciones que Babilonia robó las que lo anuncian. ¿Qué dicen que le sucederá a Babilonia? Seguimiento: También preguntan “¿Hasta cuándo?” Babilonia se salió con la suya durante años. ¿Por qué crees que Dios a veces espera antes de traer justicia? (Ver: Gálatas 6:7; 2 Pedro 3:9)"},{"q":"<b>Entendiendo el texto<\/b><br>Lee los versículos 9-11. Babilonia es como un águila que construye su nido en lo alto de un risco para estar a salvo del daño. ¿Qué dice Dios que obtuvo Babilonia en lugar de seguridad? Seguimiento: Ahorrar y planear es sabio. Pero ¿cómo podemos saber cuándo confiamos más en nuestros ahorros y planes que en Dios? (Ver: Abdías 1:3-4; Proverbios 18:10-11)"},{"q":"<b>Entendiendo el texto<\/b><br>Lee los versículos 12-14. La gran ciudad de Babilonia no durará. Pero Dios promete que un día toda la tierra conocerá su gloria, tan por completo como el agua cubre el mar. ¿Cómo crees que será el mundo ese día? Seguimiento: ¿Dónde ves que eso ya empieza a suceder? (Ver: Números 14:21; Isaías 11:1-9)"},{"q":"<b>Aplicando el sermón<\/b><br>La codicia empieza pequeña. Pronto nos importa más lo que podemos sacar de las personas que las personas mismas. ¿Cuándo has visto que un “deseo de más” cambie la manera en que alguien trataba a los demás? Seguimiento: ¿Por qué es tan difícil ver la codicia en nosotros mismos? (Ver: Lucas 12:15; 1 Timoteo 6:9-10)"},{"q":"<b>Aplicando el sermón<\/b><br>El versículo 13 dice que las naciones se fatigan trabajando y todo termina en fuego. Piensa en aquello por lo que más te esforzabas hace diez años. ¿Cuánto de eso todavía importa hoy? Seguimiento: ¿Qué clase de trabajo perdura? (Ver: Salmos 127:1; 1 Corintios 3:11-15)"},{"q":"<b>Aplicando el sermón<\/b><br>El pastor Mike dijo que el mal puede ganar una batalla y aun así perder la guerra. Recuerda una ocasión en que las noticias o la cultura te dejaron desanimado… ¿Qué te ayudó a volver a tener esperanza? (Ver: Salmos 73:16-17; 1 Corintios 15:58)"},{"q":"<b>Conociendo la doctrina<\/b><br>La Biblia dice que vemos la gloria de Dios con más claridad en Jesús. Babilonia alcanzó la gloria aplastando a otros. Jesús se humilló y murió en una cruz para salvar a otros. ¿Qué nos dice eso sobre la clase de Dios que adoramos? (Ver: 2 Corintios 4:6; Filipenses 2:5-11)"},{"q":"<b>Compartiendo la verdad<\/b><br>Imagina que un amigo dice: “Yo nunca podría creer en un Dios que juzga a las personas.” Piensa en las naciones que Babilonia aplastó. ¿Por qué el juicio de Dios sería una buena noticia para ellas? Seguimiento: ¿Cómo podría eso ayudarte a responder a tu amigo? (Ver: Salmos 96:10-13; Romanos 12:19)"},{"q":"<b>Compartiendo la verdad<\/b><br>Un día toda rodilla se doblará ante Jesús. El pastor Mike dijo que agradece no tener que temer el juicio de Dios, porque Jesús lo tomó en su lugar. ¿Cómo explicarías esa buena noticia a un amigo con tus propias palabras? (Ver: Isaías 53:5-6; Romanos 8:1)"}]}};/*ESX-END*/
