scribe como una copa de ira que pueblos, naciones y personas tendrán que beber: guardada y luego derramada (Salmo 75:8: todos los impíos de la tierra “la beberán hasta el fondo”). Ahora esa copa se le entrega a Babilonia.</p><p>El pastor Mike hizo una pausa para decir que <b>la Biblia nos da un retrato honesto y sin maquillaje del mundo en que vivimos.</b> No disimula las atrocidades de la historia ni ignora el mal terrible, porque Dios aborrece el mal: es santo, perfectamente puro en lo moral, y no dejará impune la maldad humana.</p><div class=\"key\">Dios no es cruel. Es moralmente serio. Un juez que dicta sentencia a un criminal endurecido y culpable no es cruel: ese juez es bueno.</div>"},{"t":"El temor del Señor","h":"<p>Esto nos lleva a una realidad bíblica que nuestra cultura ha olvidado en gran parte, y con la que hasta muchos cristianos se sienten incómodos: <b>debemos temer al Señor.</b></p><ul><li><b>Lo que no es:</b> Dios no es caprichoso ni de mal genio, listo para fulminarte si lo provocas de la manera equivocada.</li><li><b>Lo que sí es:</b> reconocer su asombrosa santidad y majestad y su autoridad suprema sobre todas las cosas, incluyéndonos a nosotros. Es acercarse a él con <b>reverencia y humildad</b>, escuchar sus advertencias y tomarlas en serio de verdad, y entender que no es alguien con quien se juega ni a quien se trata con ligereza.</li><li>Nos encanta decir que Dios es misericordioso, clemente, lento para la ira y grande en amor firme, y todo eso es verdad, fruto de su bondad. Pero <b>porque Dios es bueno, también es justo</b> y no dejará impune al culpable. El Dios rico en misericordia también es rico en justicia.</li><li>Por eso “el principio de la sabiduría es el temor del Señor”: la sabiduría es vivir con destreza, a favor de la corriente de la realidad tal como Dios la diseñó.</li></ul>"},{"t":"Una advertencia para nosotros: ¿qué clase de gloria estoy persiguiendo?","h":"<p>La mayoría de nosotros no persigue los extremos malvados de Babilonia (“yo solo voy a Starbucks”), pero el pastor Mike dijo que aun así hay una advertencia: <b>siempre que buscamos nuestra propia gloria a costa de otros, nos ponemos en oposición a Dios.</b></p><ul><li>Cuando derribamos a alguien para sentirnos superiores.</li><li>Cuando explotamos la vulnerabilidad de alguien para avanzar nuestra propia agenda.</li><li>Cuando usamos nuestra influencia para manipular a alguien en beneficio propio.</li></ul><p><i>¿De verdad quieres encontrarte oponiéndote a Dios? ¿Quién va a ganar esa contienda?</i></p><div class=\"key\">Babilonia persiguió su propia gloria. ¿Qué clase de gloria estoy persiguiendo en mi vida, y qué estoy dispuesto a hacer para obtenerla?</div>"},{"t":"II. Los dioses que fabricamos — Ay 5 (vv. 18–19)","h":"<p>El último ay expone lo que está debajo de todos los demás: <b>la idolatría de Babilonia.</b> Su problema principal no era cómo trataba a los demás, aunque eso era malvado, sino cómo consideraba a Dios. <b>Cómo tratamos a los demás es siempre reflejo de cómo consideramos a Dios.</b></p><ul><li>El capítulo 1 decía que la “propia fuerza” de Babilonia era su dios (Marduk, Istar y otros), y creía poder invocar o manipular a esos dioses para su beneficio.</li><li>Los babilonios tallaban ídolos de madera, los cincelaban en piedra o los fundían en metal, los recubrían de oro y plata, y creían que mediante elaborados rituales los dioses habitaban esas imágenes y recibían ofrendas.</li><li>Dios casi se burla: el artesano da forma al ídolo… y luego <b>confía en lo que hizo.</b> El ídolo es “maestro de mentiras” porque promete lo que no puede cumplir. Los estudiosos han documentado esa misma práctica de decir “despierta, levántate” a estos objetos. Pero “no hay espíritu en su interior.”</li></ul>"},{"t":"La idolatría hoy: ¿de verdad somos tan distintos?","h":"<p>Suena primitivo y ridículo, y lo es: ese es el punto de Dios. Pero el pastor Mike nos pidió no descartarlos con una mirada condescendiente, posterior a la ciencia moderna. Eran personas como nosotros, en un mundo impredecible y peligroso de enfermedades, hambre, guerra y muerte. Querían <b>seguridad, protección y algo de control sobre sus resultados.</b></p><p><i>¿De verdad somos tan distintos?</i> La mayoría no tiene estatuas, pero queremos manejar nuestra vida y controlar los resultados, y nos hemos vuelto buenos para mantener la ilusión. <b>No hemos dejado de hacer ídolos; solo se han vuelto más sofisticados.</b></p><ul><li><b>Idolatría es poner tu esperanza y tu confianza en algo que no sea el Dios vivo y verdadero:</b> aquello en lo que tu corazón está puesto, para lo que vives y alrededor de lo cual organizas tu vida. “Si tan solo tuviera eso… entonces mi vida sería lo que necesita ser.” Si eso no es Dios mismo, es un ídolo.</li><li>Los corazones caídos prefieren <b>dioses que podamos controlar</b>, dioses que sirvan a nuestros propósitos. El pastor Mike señaló como una versión moderna cierta predicación superficial en la que Dios te ayuda a “subir de nivel y vivir tu mejor vida”: convertir al Dios vivo en un diosecito con minúscula. El Dios vivo no existe para servir a nuestros propósitos; <b>nosotros existimos para servir a los suyos.</b></li><li>En un lugar próspero como el South Bay es fácil construir una vida bien cuidada: cuerpos sanos, espacios bellos, seguridad económica, carreras impresionantes. Pueden ser buenos regalos del Señor, pero <b>son pésimos dioses.</b> “El que lo hizo confía en su obra”: confiamos en nuestro dinero para sentirnos seguros, en nuestra educación para sentirnos importantes, en nuestros logros para ser lo que creemos que necesitamos ser y en nuestras vidas cuidadosamente diseñadas para sentirnos satisfechos.</li></ul>"},{"t":"Cómo saber si algo bueno se ha vuelto un ídolo","h":"<div class=\"key\">Algo bueno se ha vuelto un ídolo cuando pone en peligro tu seguir a Jesús: cuando te tienta a elegirlo por encima de él.</div><p>Las preguntas del pastor Mike para comprobarlo: ¿Cuándo me cuesta la obediencia a Cristo, en lo personal o en lo profesional? ¿Cuándo la fidelidad a su iglesia choca con mis prioridades? (Bromeó con los deportes del fin de semana.) Ahí es cuando nuestros ídolos empiezan a mostrarse.</p><p>En resumen: Jesús nos llama: “Sígueme.” No nos llama a encajarlo en los diseños bien cuidados en los que tanto hemos trabajado. <b>Nos llama a rendir esas vidas</b>, no solo a hacerle un lugar.</p>"},{"t":"III. El Dios que reina (v. 20)","h":"<p>El adorador de ídolos del versículo 19 le ruega a su dios con minúscula que “despierte” y “se levante.” El Dios vivo no necesita que lo despierten: <i>“Mas Jehová está en su santo templo; calle delante de él toda la tierra.”</i> El pastor Mike hizo tres observaciones, como la semana pasada:</p><ul><li><b>Dios está entronizado.</b> En su santo templo, su morada celestial. Habacuc empezó el libro luchando con la aparente inactividad de Dios, como si se hubiera ido. El versículo 20 declara que nunca abandonó su trono ni su puesto. Así que la maldad de Judá, de Babilonia, de nuestro país, de China o de Irán: <b>ninguna maldad humana lo toma por sorpresa.</b></li><li><b>Dios es soberano.</b> “Calle delante de él <i>toda la tierra</i>”: no solo Judá o Babilonia. Es el creador de todos y de todo (como le enseñó a decir a sus hijos), y toda nación, gobernante y ser humano responderá ante él algún día.</li><li><b>Dios debe ser reverenciado.</b> Esto no es una invitación a meditar; es una <b>convocatoria a temer al Señor</b>: silencio reverente ante el Dios santo que juzgará a todos y que reina ahora sobre toda la creación.</li></ul>"},{"t":"Nuestra necesidad: recuperar una visión de Dios","h":"<p>Aquí hay una especie de respuesta a Habacuc. Él abrió el libro exigiendo saber qué hacía Dios; Dios fue paciente y le respondió de varias maneras. Pero al final del capítulo 2, Dios simplemente llama a toda la tierra a callar delante de él, y tiene derecho a hacerlo. <b>En última instancia, no necesitamos entender todo lo que Dios hace; necesitamos recordar quién es Dios.</b></p><p>Como creyentes hoy, necesitamos desesperadamente recuperar una visión de un Dios <b>santo</b>, <b>soberano</b>, que <b>no existe para acomodarse a nuestros propósitos</b> y que merece nuestro asombro: un Dios a quien tememos con razón y humildad, ante quien algún día nos postraremos.</p><p>Los cinco ayes han expuesto cómo el corazón humano quiere vivir a su manera (“no eres mi jefe”) o, a lo sumo, quiere un Dios que bendiga la vida que hemos diseñado con tanto cuidado. Pero él no recibe instrucciones de nosotros: él nos convoca a servir a sus propósitos: <b>a confiar en él, temerle, obedecerle y adorarle.</b></p>"},{"t":"El pecado arruina; solo Jesús restaura","h":"<p>Babilonia muestra lo que corre río abajo cuando una cultura rechaza el buen reinado de Dios: consecuencias catastróficas para sus semejantes. El patrón recorre la historia —en culturas, imperios, pueblos, personas y en nuestras propias vidas—: <b>el pecado arruina. Solo Jesús restaura.</b></p><p>Eso nos devuelve a la copa del juicio del versículo 16. Unos 600 años después de Habacuc, Jesús se arrodilló en Getsemaní y oró: “Padre mío, si es posible, pase de mí esta copa… si no puede pasar sin que yo la beba, hágase tu voluntad.” Sabía lo que le esperaba: mucho más que la agonía física de la crucifixión: <b>la copa del juicio de Dios, que bebería para pagar por los pecados de la humanidad.</b> Su muerte física correspondió a la fealdad del pecado humano, pero lo que soportó espiritualmente fue mucho peor.</p><div class=\"key\">Babilonia bebería la copa del juicio de Dios por su propia maldad, pero Jesús bebió la copa del juicio de Dios por la nuestra.</div>"},{"t":"El evangelio y la invitación","h":"<p>He aquí un Dios santo que no excusará el pecado, que es justo y debe ser temido, que por ser bueno es justo y castigará la rebelión humana y derribará la maldad. Y, sin embargo, este mismo Dios <b>abrió un camino para que los pecadores se salven</b>: no con atajos espirituales, no comprometiendo su santidad, no barriendo el pecado debajo de la alfombra “como un conserje sin escrúpulos”, sino entregando a su propio Hijo para llevar el juicio que merecemos.</p><p>Por la muerte y resurrección de Jesús, todo el que se aparta de su pecado y pone su confianza, su esperanza y su seguridad en él puede recibir perdón y vida eterna.</p><div class=\"key\">La invitación: deja de perseguir tu propia gloria, deja de hacer dioses pequeños que sirvan a tus propósitos y ríndete al Dios que reina. Vuélvete a él por la obra de su Hijo Jesús: arrepiéntete y cree en él hoy.</div><p>El pastor Mike cerró en oración, dando gracias a Dios por este “librito oscuro” y por enviar a su Hijo, y orando en especial por quienes escuchaban por primera vez que Jesús bebió la amarga copa del juicio como su sustituto; luego pasó a la comunión.</p>"}],"qa":[{"q":"¿Qué fue lo que más se te quedó del sermón del domingo esta semana: una pregunta, una convicción o algo que te impactó especialmente?"},{"q":"<b>Entender el texto</b><br>Lean los versículos 15-17. Babilonia es como un hombre que emborracha a sus vecinos para avergonzarlos. ¿Qué dice Dios que le pasará a Babilonia a cambio? Seguimiento: La copa en la diestra del Señor es una imagen del juicio de Dios. ¿Por qué la ira/el juicio de Dios es parte de su bondad? (Ver: Salmo 75:8; Jeremías 25:15-17)"},{"q":"<b>Entender el texto</b><br>Lean los versículos 18-19. ¿Qué hace insensato confiar en los ídolos aquí descritos? Seguimiento: El versículo 18 dice que el artesano “confía en su obra.” ¿Por qué la gente podría preferir un dios que pueda controlar? (Ver: Salmo 115:4-8; Isaías 44:14-20)"},{"q":"<b>Entender el texto</b><br>Lean el versículo 20. En el versículo 19, un hombre le dice a su ídolo que despierte. ¿Qué es distinto en el Señor? Seguimiento: Habacuc empezó este libro preguntándole a Dios: “¿Hasta cuándo?” y “¿Por qué?” ¿Cómo lo ayuda el versículo 20 a confiar en Dios aun sin respuestas a todas sus preguntas? (Ver: Salmo 11:3-4; Job 40:3-5)"},{"q":"<b>Aplicar el sermón</b><br>Babilonia buscó gloria humillando a otros. Nosotros también podemos tratar de vernos mejor derribando a alguien más. ¿Dónde somos tentados a hacer esto en la vida diaria? Seguimiento: ¿Por qué Dios toma esto tan en serio? (Ver: Marcos 10:42-45; Santiago 4:6)"},{"q":"<b>Aplicar el sermón</b><br>Incluso las cosas buenas pueden volverse ídolos. ¿Cómo podemos reconocer cuándo algo bueno se ha vuelto más importante para nosotros que obedecer a Dios? Seguimiento: El versículo 18 llama al ídolo “maestro de mentiras.” ¿Qué prometen nuestros ídolos que no pueden cumplir? (Ver: Jeremías 2:13; 1 Timoteo 6:17)"},{"q":"<b>Aplicar el sermón</b><br>Jesús no nos llama a encajarlo en la vida que hemos planeado. Nos llama a rendirle esa vida. ¿Recuerdas algún momento en que seguir a Jesús significó soltar algo que querías? ¿Qué aprendiste con eso? (Ver: Marcos 10:17-22; Lucas 9:23-25)"},{"q":"<b>Conocer la doctrina</b><br>La Biblia nos dice que temamos al Señor. Esto significa tomar en serio su santidad, su autoridad y sus advertencias. Si somos perdonados en Cristo, ¿en qué se diferencia temer a Dios de tener miedo de su condenación? (Ver: Salmo 130:3-4; Hebreos 12:28-29; 1 Juan 4:18)"},{"q":"<b>Compartir la verdad</b><br>El pastor Mike llamó al cuadro del versículo 15 “deliberadamente perturbador.” Imagina que un amigo pregunta: “¿Por qué hay tanta violencia y fealdad en la Biblia?” ¿Cómo te ayudaría este pasaje a responder? Seguimiento: ¿Qué perderíamos si la Biblia omitiera la fealdad del pecado humano? (Ver: Génesis 6:5-6; 2 Timoteo 3:16-17)"},{"q":"<b>Compartir la verdad</b><br>Babilonia bebería la copa del juicio de Dios por sus propios pecados. Jesús la bebió por los nuestros. Así que la copa que tomamos en la comunión es una copa de perdón, no de ira. Si un amigo o un niño te preguntara qué significa esa copa, ¿qué le dirías? (Ver: Mateo 26:27-28, 39-42)"}]}}];

/*ESX-START*/var ESX={"contentment":{"tab":"Contentamiento","title":"Hallando contentamiento","meta":"Andrew Kelley · 1 dic 2024 · Hope Chapel","ref":"Filipenses 4:10–13","verse":"“En gran manera me alegré en el Señor de que ya al fin han vuelto a revivir su interés por mí… He aprendido a estar contento cualquiera que sea mi situación. Sé vivir humildemente y sé también vivir en prosperidad… Todo lo puedo en Cristo que me fortalece.” (Filipenses 4:10–13, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"El contentamiento no se halla en las posesiones ni en la autosuficiencia, sino en Cristo mismo, y produce una confianza más profunda en la soberanía de Dios, una generosidad atrevida y una vida que se parece a Jesús.","take":["La acción de gracias es gratitud por lo que tenemos; el contentamiento de Pablo es una disposición firme ante nuestras circunstancias, sean cuales sean.","Ni siquiera las cosas buenas se disfrutan cuando sabemos que no durarán (la cuenta regresiva en Disneylandia). Estamos descontentos aun cuando estamos contentos.","Dos enemigos: mirar hacia <b>afuera<\/b> (el amor a las posesiones y a las personas) y mirar hacia <b>adentro<\/b> (la autosuficiencia). Pablo señala hacia <b>arriba<\/b>.","Las posesiones no son malas; el problema es cuando ellas te poseen a ti.","Filipenses 4:13 no trata de superpoderes cristianos. Trata de sobrellevar los altibajos con Cristo como tu fortaleza.","Cristo no es el medio para obtener el regalo: él <i>es<\/i> el regalo. No nos lo pueden quitar.","Fruto del contentamiento: satisfacción en la soberanía de Dios, generosidad atrevida y una identificación más fuerte con Jesús."],"scr":[["Filipenses 1:3–5, 7","El amor y la comunión de Pablo con los filipenses, aun “en mis prisiones”."],["Filipenses 4:10–13","“He aprendido a estar contento cualquiera que sea mi situación… Todo lo puedo en Cristo que me fortalece.”"],["Éxodo 20:3, 17","El primero y el último mandamiento: no tendrás otros dioses delante de mí; no codiciarás."],["Hebreos 13:8","Jesucristo es el mismo ayer, hoy y por los siglos."],["2 Corintios 4:16–18","Nuestro hombre exterior se desgasta, el interior se renueva; fijemos la vista en lo invisible, que es eterno."],["2 Corintios 12:9–10","“Te basta mi gracia… cuando soy débil, entonces soy fuerte.”"],["Romanos 8:28","Todas las cosas cooperan para bien de los que aman a Dios."],["Filipenses 2:5–8","Cristo Jesús, existiendo en forma de Dios, se despojó a sí mismo."],["Filipenses 3:7–9","“Todo lo considero pérdida por la superioridad del conocimiento de Cristo Jesús, mi Señor.”"]],"secs":[{"t":"Introducción: Acción de Gracias vs. Viernes Negro","h":"<p>El sermón comienza con la extraña pareja de dos celebraciones: una cena construida alrededor de la gratitud y, enseguida, filas a las 3 de la mañana en Target para comprar televisores baratos. Andrew admite que no ve multitudes derribando puertas para comprar pavos, y que no está “muy convencido” de que el Día de Acción de Gracias esté más cerca de nuestro corazón que tener más cosas.<\/p><p>La gratitud es una afirmación positiva de las cosas por las que estamos agradecidos. El <b>contentamiento<\/b> de Pablo es distinto: una disposición personal ante nuestras propias circunstancias.<\/p><div class='key'>“Sé vivir humildemente y sé también vivir en prosperidad… He aprendido el secreto, tanto de estar saciado como de tener hambre, de tener abundancia como de padecer necesidad.”<\/div><p><b>Ni siquiera las cosas buenas satisfacen.<\/b> De niño en Disneylandia, a las 11 de la mañana empezaba la cuenta regresiva (“faltan unas 13 horas”) y perdía la alegría porque todo iba a terminar. Podemos tener algo bueno y no disfrutarlo porque no va a durar.<\/p>"},{"t":"El contexto y la credibilidad de Pablo","h":"<ul><li>Pablo comenzó como enemigo de Cristo, estuvo presente en el primer martirio (Esteban) y luego se encontró con Jesús en el camino a Damasco.<\/li><li>Plantó la iglesia de Filipos y la amaba: “Doy gracias a mi Dios cada vez que me acuerdo de ustedes”.<\/li><li>Su vida misionera tuvo altibajos: azotado, apedreado, expulsado de ciudades (y una vez regresó a una), naufragado más de una vez.<\/li><li>Escribe esta carta bajo arresto domiciliario en Roma, probablemente cerca del final de su vida. La mayoría de los eruditos cree que fue martirizado poco después de donde termina Hechos.<\/li><li>En aquel tiempo la cárcel no garantizaba comida: dependía de regalos, y el de los filipenses había tardado en llegar.<\/li><\/ul><p><b>El regalo.<\/b> En el mundo antiguo los regalos eran socialmente complejos: se daban para ganar favor o esperando algo a cambio. (La historia de Andrew de las “30 pares de calcetines” en su primera Navidad muestra que todavía sentimos esa tensión.) Pablo rechaza esas reglas y <b>reorienta el regalo en torno a Jesucristo.<\/b><\/p>"},{"t":"I. El enemigo: el amor a las posesiones","h":"<p>Queremos comida, dinero, una vocación, que un negocio prospere, un mejor círculo social, un cónyuge, y nos sentimos insatisfechos cuando la vida no salió como esperábamos. Los anuncios lo intensifican: dices que quieres un suéter y una hora después Instagram te lo muestra. Cada anuncio dice: <i>no eres feliz porque te falta esto.<\/i><\/p><div class='q'>“El dueño de cinco sofás busca diez. El dueño de diez mesas compra otras tantas… y no se satisface, sino que se afana por más, pierde el sueño y nunca se sacia con ninguna cantidad.”<cite>— Plutarco<\/cite><\/div><p><b>La regla del diez por ciento.<\/b> Cuatro minutos más cerca de la playa, una casa un diez por ciento más grande: la pequeña brecha de “bueno, pero no del todo suficiente” causa el mayor dolor.<\/p><div class='key'>Las posesiones no son malas. El dinero no es malo. Una casa grande no es mala. Los cristianos ricos de los primeros tiempos usaron sus casas y recursos para el evangelio. El problema es cuando las posesiones <i>te poseen a ti<\/i>: cuando controlan el flujo y reflujo de tu vida.<\/div><p><b>La historia de la casa en Lomita.<\/b> Cuando llegó el COVID, Andrew se dio cuenta de que haría casi cualquier cosa por conservar la casa: “vendería teléfonos celulares en la esquina”. Él no poseía la casa; <i>la casa lo poseía a él.<\/i><\/p><p>Los ídolos sin los cuales estamos descontentos terminarán por matarnos: los deseamos intensamente y, cuando los conseguimos, no satisfacen. <b>No hallarás contentamiento en el mundo que está fuera de ti.<\/b><\/p>"},{"t":"I. El enemigo: la autosuficiencia","h":"<p>La palabra que Pablo usa para “contento” es <i>autarkeia<\/i> (autosuficiencia), una palabra usada por los estoicos antiguos, quienes vieron que el mundo exterior no podía satisfacer. Suena tan cercana a la verdad que muchos cristianos (y nuestra cultura) la creen.<\/p><div class='q'>“Tus circunstancias externas no deben controlar cómo te sientes”: no te dejes subir y bajar por las cosas buenas y malas.<cite>— Séneca (parafraseado)<\/cite><\/div><p>Andrew lee <i>Invictus<\/i> de Henley (“Soy el amo de mi destino, soy el capitán de mi alma”) junto a “Shake It Off” de Taylor Swift como dos rostros modernos de la misma idea.<\/p><ul><li><b>Versión 1: “Yo soy suficiente”.<\/b> No importa lo que piense nadie; lo que importa es lo que yo pienso de mí. Toda persona tiene dignidad infinita como portadora de la imagen de Dios, pero no todo en nosotros es maravilloso. Esto no dura.<\/li><li><b>Versión 2: la exigencia.<\/b> La cultura de la superación personal: “cada día son tres días para mí”. Tampoco ayuda.<\/li><\/ul><p><b>Pablo no hace ninguna de las dos.<\/b> No dice “este regalo me satisfizo por completo” ni lo devuelve diciendo “no lo necesito”. No lo controla el mundo ni se retira de él: llora por los que viven como enemigos de la cruz (Filipenses 3:18–19) y dice “Regocíjense en el Señor siempre” (4:4). Esas dos direcciones, hacia afuera y hacia adentro, quedan subordinadas a la dirección <b>hacia arriba<\/b>.<\/p><div class='q'>“Si descubro en mí un deseo que ninguna experiencia de este mundo puede satisfacer, la explicación más probable es que fui hecho para otro mundo.”<cite>— C. S. Lewis<\/cite><\/div><p>Esto nos libera de dos cosas: la apatía muda de replegarnos hacia adentro y la locura emocional de atar el corazón a todo lo que nos rodea.<\/p>"},{"t":"II. La fuente: suficiencia en Cristo","h":"<p>“Todo lo puedo en Cristo que me fortalece”: <b>el versículo más citado fuera de contexto del Nuevo Testamento.<\/b> No se trata de superpoderes cristianos. (Si el piloto anuncia que no tiene licencia pero “todo lo puede en Cristo”, te bajas del avión.) Se entiende en el contexto de lo que Dios ha hecho en la vida de Pablo y en el evangelio.<\/p><p><b>El evangelio, como lo expresa Andrew:<\/b><\/p><ul><li>Nacemos como enemigos de Dios; nos rebelamos y pecamos contra él, como Adán y Eva introdujeron el pecado, la muerte y la condenación. Basta reflexionar con honestidad sobre los pensamientos de tu propio corazón que nadie más conoce.<\/li><li>La justicia de Dios desemboca naturalmente en ira contra la maldad.<\/li><li>Dios se hizo hombre, vivió en justicia y en la cruz su ira se derramó sobre Jesús como nuestro <b>sustituto<\/b>. A todos los que lo invocan se les paga su pecado y se les concede su justicia. En el juicio presentamos la justicia de Cristo y somos rescatados.<\/li><\/ul><p>Pablo cree que ha sido rescatado, que tiene un futuro nuevo, una familia nueva (la iglesia), cielos nuevos y tierra nueva. No se contenta con ser autosuficiente, sino <b>suficiente en Cristo.<\/b><\/p><div class='key'>“Por medio de” puede dar a entender algo equivocado: que por medio de Jesús consigo lo que quiero. Es <i>en<\/i> Jesús. Él no es un medio para un fin; él es el fin. No es solo el que da el regalo: es el regalo. No es solo el proveedor: es la provisión.<\/div><p>Como Jesús es el mismo ayer, hoy y siempre, no se le puede quitar y no puede ser menos de lo que es; por eso el contentamiento es posible. El testimonio de Pablo: 2 Corintios 4:16–18 y 12:9–10. El cristianismo es la única religión donde el contentamiento se halla solo en Cristo.<\/p><p><b>Conexión con los Diez Mandamientos:<\/b> “No tendrás otros dioses delante de mí” al principio; “no codiciarás” al final. Miramos lo que tiene nuestro prójimo y pensamos que lo merecemos más. Si Dios es el objeto de nuestra adoración, confiamos en que él sabe exactamente lo que tenemos (cuánto hay en la cuenta, cuántos días quedan) y no cometió un error.<\/p>"},{"t":"III. Los resultados del contentamiento","h":"<p><b>1. Una satisfacción más profunda en la soberanía de Dios.<\/b> Dios tiene el control de todo; nada está fuera de su poder, conocimiento o presencia. Cristo ya actuó de manera decisiva: la muerte fue vencida, los pecados perdonados, los impíos hechos justos. Cuando la gente pregunta por qué sufre, Andrew muchas veces tiene que decir “no lo sé”, pero Dios es bueno y nos dice que confiemos en él. Esa satisfacción madura y puede resistir bajones y subidas mayores.<\/p><p><b>2. Una generosidad más atrevida.<\/b> Casi todos nos sentimos generosos después de comprar un hot dog de 99 centavos mientras gastamos 8 dólares en nosotros mismos. El contentamiento y la confianza nos permiten ser generosos de maneras radicales, sacrificiales, “algo peligrosas”.<\/p><div class='key'>No tememos enriquecernos rápido; tememos empobrecernos rápido. El dinero no nos mantendrá a salvo.<\/div><p><b>3. Una identificación más fuerte con Jesús.<\/b> El Nuevo Testamento ofrece sobre todo un <i>modelo<\/i>, no métodos: mira a Cristo. En Filipenses 2, Jesús, existiendo en forma de Dios, se despojó a sí mismo. ¿Permito que su vida desafíe cómo vivo? ¿Hay en mi casa un altar a la estabilidad financiera? En Filipenses 3, Pablo considera toda ganancia como pérdida por la superioridad de conocer a Cristo.<\/p><p><i>Cierre: “Hope Chapel, solo se puede vivir una vida así si uno está contento en Cristo.”<\/i> Después el servicio pasa a la comunión.<\/p>"}],"qs":["¿Qué descontento del “diez por ciento” te cuesta más: algo bueno que aun así sientes que no es del todo suficiente?","¿Dónde ves que las posesiones te poseen a ti en lugar de que tú las uses para el evangelio?","¿Te tienta más perseguir cosas hacia afuera o la autosuficiencia hacia adentro? ¿Cómo se ve cada una en tu vida?","¿Cómo cambia tu manera de oír Filipenses 4:13 leerlo como “en Cristo” y no “por medio de Cristo”?","¿Dónde está siendo puesta a prueba ahora tu confianza en la soberanía de Dios?","¿Cómo se vería este mes una generosidad atrevida, incluso incómoda?","¿Hay algo respecto de lo cual dirías “haría cualquier cosa por conservarlo”? ¿Qué revela eso?"],"app":["Nombra una cosa cuya pérdida te desestabilizaría de verdad; llévala con honestidad a Dios.","Lee Filipenses 2:1–11 y medita en el despojamiento de Cristo.","Practica un acto de generosidad que te resulte un poco incómodo.","Cuando surja el descontento, pregúntate: ¿estoy mirando hacia afuera, hacia adentro o hacia arriba?","Memoriza Filipenses 4:11–12."]},"fear":{"tab":"No temas","title":"No temas","meta":"Andrew Kelley · 3 may 2026 · Hope Chapel","ref":"Lucas 21:10–19","verse":"“Se levantará nación contra nación y reino contra reino… Pero antes de todo esto les echarán mano y los perseguirán… Esto les será ocasión para dar testimonio. Propónganse, pues, en sus corazones no preparar de antemano su defensa… Pero ni un cabello de su cabeza perecerá. Con su perseverancia ganarán sus almas.” (Lucas 21:10–19, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"“No se aterroricen” es un mandato, y Jesús da tres razones para obedecerlo: él gobierna sobre todas las cosas, provee en el sufrimiento y preservará a su pueblo.","take":["Sufrimos ahora anticipando lo que podría pasar después: temores del futuro que aún no han llegado.","El pasaje trata principalmente de los discípulos del primer siglo; las mismas categorías de amenaza y las mismas seguridades alcanzan hoy al pueblo de Dios.","Guerras, desastres, enfermedades, sistemas impersonales, poderes ocultos: ninguno opera fuera de la autoridad de Cristo.","La persecución se replantea como oportunidad. No esperes un momento dramático; ya estás en misión ahora, en tu vida ordinaria.","Prepárate para proclamar a Cristo, no para protegerte a ti mismo.","Sé fiel, no fructífero: tal vez no veas la cosecha.","Puedes perder la vida, pero no tu alma, y todo lo que el mundo te quite, Cristo te lo devuelve."],"scr":[["Efesios 1:20–22","Cristo sentado a la diestra de Dios, muy por encima de todo principado y autoridad; todo bajo sus pies."],["1 Pedro 3:22","Ángeles, autoridades y potestades le están sujetos."],["Colosenses 1:16–17","Todas las cosas fueron creadas por medio de él y para él; en él todas las cosas subsisten."],["Hebreos 1:3","Él sostiene todas las cosas con la palabra de su poder."],["Efesios 2:10","Somos hechura suya, creados para buenas obras que Dios preparó de antemano."],["Hechos 6:10","Los opositores de Esteban no podían resistir la sabiduría y el Espíritu con que hablaba."],["1 Corintios 1:18","La palabra de la cruz es necedad para los que se pierden, pero poder de Dios para los que somos salvos."],["Juan 10:28–29","“Nadie las arrebatará de mi mano.”"],["Filipenses 1:6","El que comenzó la buena obra en ustedes la perfeccionará."],["1 Tesalonicenses 5:23–24","Fiel es el que los llama, el cual también lo hará."]],"secs":[{"t":"Introducción: La anatomía del miedo","h":"<p>Niños en Knott’s Berry Farm, paralizados por miedos que se superponían, sin querer subirse a nada. Los niños temen cosas que no existen o que en realidad no son peligrosas; los adultos no somos distintos, solo que nuestros miedos se proyectan hacia adelante: las finanzas, la familia, la salud, la fe de nuestros hijos.<\/p><div class='key'>La confesión del predicador: “Soy un tipo muy asustadizo… La gente memoriza la Escritura; yo anoto todas las cosas malas que podrían pasar y medito en eso.”<\/div><p><b>El contexto en Lucas.<\/b> La última semana de la vida de Jesús. Ha estado confrontando a los hipócritas en Jerusalén y ahora da su discurso más largo, casi todo sobre el futuro. Los discípulos admiran el templo; Jesús dice que será derribado. Ellos preguntan <i>cuándo<\/i>, un intento de tener el control.<\/p><p><b>Afirmación interpretativa.<\/b> Los versículos 10–19 tratan principalmente de los discípulos del primer siglo y de lo que realmente vivirían, no de una predicción de nuestro fin de los tiempos. Las mismas categorías de amenaza siguen vigentes, y los mandatos y las seguridades se extienden a nosotros.<\/p><p><i>Nota pastoral:<\/i> quienes se apasionan por el fin de los tiempos muestran dos cosas buenas: amor por la palabra de Dios y ansias por el regreso de Cristo. “Cuando se trata del regreso de Cristo, no estamos en el comité de planificación. Estamos en la fiesta de bienvenida.”<\/p><div class='key'>“No se aterroricen”: no es una sugerencia, es un mandato. El resto del pasaje da las razones.<\/div>"},{"t":"I. Cristo gobierna sobre todas las cosas (vv. 10–11)","h":"<p>Jesús nombra las fuerzas que aterrarían a cualquiera en cualquier época, no para minimizarlas, sino para mostrar que ninguna opera fuera de su autoridad.<\/p><ul><li><b>Guerras y naciones<\/b>: el sitio de Roma a Jerusalén, tres emperadores asesinados en un año. Hoy: conflictos globales, fracturas políticas, relaciones perdidas por la división.<\/li><li><b>Terremotos<\/b>: con los desastres naturales no se puede negociar. “No puedes convencer a un huracán de que se detenga. ¿Sabes quién puede? Jesús.”<\/li><li><b>Pestes<\/b>: la enfermedad y la muerte. Una mujer que moría en el hospital la noche anterior: “Sé que Cristo me tiene.” La medicina llega a su límite; Cristo no.<\/li><li><b>Hambre / fallas de sistemas<\/b>: daño burocrático y sin rostro. “Tenemos un Señor personal frente a peligros impersonales.”<\/li><li><b>Señales y poderes ocultos<\/b>: cosas a puerta cerrada que no podemos ver ni verificar. “Cristo lo sabe todo.”<\/li><\/ul><div class='key'>A diferencia de cualquier otra cosmovisión, los cristianos adoramos al que sostiene el universo. No solo un buen maestro: el Rey del universo.<\/div><p>Vuelve a los textos ancla en momentos de miedo: Efesios 1:20–22, 1 Pedro 3:22, Colosenses 1:16–17, Hebreos 1:3 (ver Escrituras clave).<\/p>"},{"t":"II-A. Ya estás en misión","h":"<p>Jesús replantea la persecución, el arresto y la traición de la familia como una <i>oportunidad de dar testimonio.<\/i> La pregunta pastoral: <b>¿Estás en misión en el lugar donde vives?<\/b> No en algún escenario dramático del futuro: ahora mismo.<\/p><ul><li>A los discípulos se les darían plataformas ante sinagogas, cárceles, reyes y gobernadores.<\/li><li>Pablo, juzgado ante el rey Agripa, convirtió su defensa en una invitación evangelística. El tribunal se volvió púlpito.<\/li><\/ul><div class='q'>“Tenemos estas extrañas fantasías de persecución… ‘Si hicieran ilegal el cristianismo y me sacaran de mi casa, seguro moriría por Cristo.’ Pero la mayoría ni siquiera le hablamos de Jesús al tipo del autobús.”<\/div><p>Los momentos ordinarios son la misión: la relación que necesita humildad, el matrimonio que necesita sacrificio, el vecino, la mesa del almuerzo. Efesios 2:10: despierta buscando lo que Dios ya preparó para que hagas hoy.<\/p>"},{"t":"II-B. Sabiduría, no autosuficiencia","h":"<p>“Propónganse en sus corazones no preparar de antemano su defensa” (v. 14) no prohíbe prepararse. Confronta la <b>autosuficiencia<\/b>: entrar en conversaciones evangelísticas pensando sobre todo en cómo nos veremos.<\/p><ul><li>A Esteban, el primer mártir, se le dio una sabiduría que sus opositores no podían resistir (Hechos 6:10).<\/li><li>Ensayamos argumentos ingeniosos en la ducha; Dios nos llama a proclamar a Cristo y confiar en él para las palabras.<\/li><li>Si no sabes la respuesta, no pasa nada: el creador del universo está de pie detrás de ti.<\/li><\/ul><div class='q'>“Prepárate para proclamar a Cristo, no para protegerte a ti mismo.”<\/div><p>1 Corintios 1:18: la palabra de la cruz es necedad para los que se pierden, pero poder de Dios para nosotros.<\/p>"},{"t":"II-C. Resultados que quizá no esperas","h":"<p>Jesús no promete éxito como lo mide el mundo: a algunos los entregarán, los odiarán, incluso los matarán. El llamado es a ser <b>fieles, no fructíferos.<\/b><\/p><ul><li>Unos riegan, otros plantan, otros cosechan: quizá no veas la cosecha.<\/li><li>Un padre que discipula con fidelidad a un hijo que se aleja: el hijo puede volver por el trabajo de otra persona, pero tu trabajo aun así importó.<\/li><li>La fidelidad en el matrimonio, la amistad y el vecindario es el fruto de la misión, aunque sea invisible.<\/li><\/ul><div class='key'>Cualquier valentía que tengamos ahora será más difícil cuando haya más en juego. El valor para ser fieles en la vida ordinaria es el valor que necesitaremos en los momentos extraordinarios, y se entrena en lo ordinario.<\/div>"},{"t":"El evangelio: por qué esto es posible","h":"<p>Antes del último punto, una presentación completa del evangelio: el fundamento de cada seguridad que Jesús da.<\/p><ul><li><b>Malas noticias:<\/b> los seres humanos somos enemigos de Dios y ratificamos el pecado de Adán en nuestra propia vida; Dios es justo y su ira justa cae sobre quienes se le oponen.<\/li><li><b>Buenas noticias:<\/b> Dios se hizo hombre en Jesús, vivió una vida perfectamente sin pecado y fue a la cruz como nuestro sustituto. La ira de Dios se derramó sobre él para que todos los que se arrepienten y confían reciban su justicia y queden libres de condenación.<\/li><li><b>El veredicto:<\/b> Estarás delante del juez. No presentarás tu propio historial; presentas la justicia de Cristo. Eres declarado justo. Eres rescatado.<\/li><\/ul><p><i>“Hoy es el día de salvación.”<\/i><\/p>"},{"t":"III. Cristo preservará a su pueblo (vv. 17–19)","h":"<p>Una aparente contradicción: “a algunos de ustedes los matarán” y “ni un cabello de su cabeza perecerá”. La clave está en la palabra del final del v. 19: <i>psychē<\/i>, que se traduce con más exactitud como <b>alma.<\/b><\/p><div class='q'>“Puedes perder la vida. No perderás el alma. Y entonces tu vida te será devuelta.”<\/div><ul><li>Este mundo quita: el cáncer quita la salud, la demencia quita la memoria y la personalidad, la edad quita el cuerpo.<\/li><li>La esperanza cristiana: todo lo que el mundo te quite, Cristo te lo devolverá. Ni un cabello perecerá: todo es restaurado.<\/li><li>La esperanza no es que no morirás; es que resucitarás.<\/li><\/ul><p><b>La perseverancia también la provee Cristo<\/b>, no es una persistencia a puño cerrado. El poder que te salva te hace más santo: Juan 10:28–29, Filipenses 1:6, 1 Tesalonicenses 5:23–24.<\/p><div class='key'>“Somos salvos y Dios dice: ‘Estás adentro’, y luego se va y nosotros pensamos que tenemos que mantenernos adentro. Dios no te va a dejar caer. ¿Qué clase de Dios digno de adoración podría perderte?”<\/div><p>Persigue la santidad con todo el corazón, pero el poder viene de Cristo. Él te guía a ella, te lleva a través de ella y te acompaña hasta el final.<\/p>"}],"qs":["Andrew dijo que muchos de sus miedos son por cosas que podrían pasar en el futuro. ¿Cuáles de tus miedos actuales son por algo que todavía no ha sucedido? ¿Cómo le habla a ese miedo en particular la seguridad de que “Cristo gobierna sobre todas las cosas”?","Lee Colosenses 1:16–17 y Hebreos 1:3. ¿Qué cambia cuando recuerdas que el Cristo a quien adoras está sosteniendo el universo en este mismo momento?","Andrew preguntó: “¿Estás en misión en el lugar donde vives?” ¿Dónde, en tu vida diaria, ha preparado Dios oportunidades que quizá has pasado por alto?","Andrew advirtió contra las “fantasías de persecución”. ¿Cuál es una conversación, relación o acto de sacrificio pequeño y real esta semana que podría poner el evangelio a la vista?","“Prepárate para proclamar a Cristo, no para protegerte a ti mismo.” ¿Dónde estorban la autosuficiencia, la imagen o el querer parecer inteligente a la hora de hablar de Jesús?","“Tu llamado es a ser fiel, no fructífero.” ¿Dónde te sientes tentado a rendirte porque no ves fruto? ¿Cómo se vería la fidelidad ahí este mes?","¿Dónde necesitas más oír la tercera seguridad, que Cristo preservará a su pueblo hasta el final, y qué cambiaría en tu manera de vivir esta semana si de verdad lo creyeras?"],"app":["Nombra tu miedo con precisión; anótalo; ponlo junto a Efesios 1, 1 Pedro 3, Colosenses 1 y Hebreos 1 y pregunta: ¿está esto fuera de la autoridad de Cristo?","Identifica tu campo misionero ordinario: las personas de tu semana normal.","Empieza una mañana preguntando qué buenas obras ya preparó Dios (Efesios 2:10).","Prepárate para proclamar, no para proteger: una frase sencilla y sincera sobre lo que Cristo ha hecho por ti.","Quédate con Filipenses 1:6: tu perseverancia es provista, no ganada."]},"p1":{"tab":"Culpables Pt. 1","title":"Los culpables acusando al inocente","meta":"Jared Blue · 9 ago 2026 · Hope Chapel","ref":"Lucas 23:1–7","verse":"“Entonces toda la asamblea se levantó y llevaron a Jesús ante Pilato. Y comenzaron a acusarlo: ‘Hemos hallado que este pervierte a nuestra nación, prohíbe pagar impuestos a César y dice que él mismo es Cristo, un rey.’… Pilato dijo… ‘No encuentro delito alguno en este hombre.’” (Lucas 23:1–4, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Aunque hombres culpables presentaron cargos falsos contra el inocente Jesús, el propio veredicto de Pilato lo declaró sin culpa, y cada paso de este proceso corrupto se desarrolló exactamente como Jesús lo planeó.","take":["El Sanedrín cambió su cargo real (blasfemia) por cargos políticos inventados, porque a Pilato no le importaba la ley religiosa judía.","Los tres cargos (sedición, resistencia al impuesto, pretender ser rey) eran falsos, y los acusadores eran más culpables de cada uno que Jesús.","Pilato vio a través de la envidia de los líderes, pero eligió el camino fácil en vez del correcto: un fallo al que todos somos propensos.","Jesús estuvo de pie, ensangrentado pero sin temor y en calma; no montó ninguna defensa porque no era una víctima, sino que lo permitía con soberanía.","Todavía hoy se tergiversa a Jesús (predicadores de la prosperidad, nacionalistas cristianos, autoayuda con versículos): el discernimiento importa.","Toda persona tendrá que emitir un veredicto sobre Jesús."],"scr":[["Juan 18:31","“A nosotros no nos está permitido dar muerte a nadie.”"],["Lucas 20:24–25","“Den, pues, a César lo que es de César, y a Dios lo que es de Dios.”"],["Juan 4:25–26","“Yo soy, el que habla contigo.”"],["Marcos 14:61–62","“¿Eres tú el Cristo, el Hijo del Bendito?” “Yo soy.”"],["Isaías 52:14","Su apariencia estaba tan desfigurada que ya no parecía un ser humano."],["Mateo 27:18","Pilato sabía que lo habían entregado por envidia."],["Mateo 20:17–19","La propia predicción de Jesús: entregado a los principales sacerdotes, condenado, entregado a los gentiles, azotado, crucificado y resucitado al tercer día."],["Salmos 110:4; Zacarías 6:12–13","El Mesías como sacerdote y rey."]],"secs":[{"t":"Apertura: ¿Cómo llegamos hasta aquí?","h":"<p>Este es el penúltimo capítulo de Lucas, después de casi tres años en el libro: una bendición estar en una iglesia que recorre la Palabra de Dios versículo por versículo, capítulo por capítulo y libro por libro.<\/p><p><b>Antecedentes.<\/b> Jesús fue traicionado y arrestado, llevado ante Anás (el sumo sacerdote anterior) y luego ante Caifás (el actual); ambos juicios fueron ilegales según la ley judía, a manos de quienes debían defenderla. Lo declararon culpable de blasfemia, una sentencia de muerte que no podían ejecutar (Juan 18:31).<\/p><p>Así que todo el Sanedrín, 71 miembros (sumos sacerdotes, ancianos, jefes de familia, escribas, fariseos y saduceos), se reúne el viernes por la mañana y lleva a Jesús ante Pilato. Fariseos y saduceos discrepaban en casi todo, pero aquí están unidos: <i>“el enemigo de mi enemigo es mi amigo”.<\/i><\/p>"},{"t":"Pilato y las acusaciones (23:1–2)","h":"<p>Pilato fue gobernador romano de Judea del 26 al 36 d. C., con sede habitual en Cesarea; en Jerusalén durante la Pascua, cuando el orgullo nacional y las rebeliones eran más probables. El erudito judío Filón lo describió como corrupto, insolente y cruel, dado a “asesinatos continuos de personas sin juicio ni condena”.<\/p><p>Fíjate en lo que falta: la <b>blasfemia.<\/b> Ese cargo lo confirmaron en su propio tribunal, pero lo cambian por tres acusaciones políticas para alarmar a un gobernador romano:<\/p><ul><li><b>1. “Pervierte a nuestra nación”<\/b> (sedición): falso. Jesús rechazó el poder mundano y habló de un reino espiritual, por eso muchos líderes no lo aceptaron como Mesías. Si alguien quería una revuelta, eran ellos.<\/li><li><b>2. “Prohíbe pagar impuestos a César”<\/b>: falso. Días antes los fariseos y los herodianos intentaron tenderle una trampa en público. Jesús: “Muéstrenme un denario. ¿De quién es la imagen?… Den a César…” Ahora reciclan una trampa fallida como prueba.<\/li><li><b>3. “Cristo, un rey”<\/b>: <i>Christos<\/i> es el griego para el hebreo <i>Mesías<\/i>, “el ungido”. Jesús sí afirmó esto (Juan 4; Marcos 14), y el Antiguo Testamento describe al Mesías como sacerdote y rey. Tuercen una identidad verdadera para hacerla ver como amenaza al César.<\/li><\/ul><div class='key'>La gente todavía hace esto: algunos promueven egoístamente a Jesús bajo una luz falsa para lucrar: predicadores de la prosperidad, nacionalistas cristianos radicales, movimientos de autoayuda con versículos metidos. Presta mucha atención a lo que ves y escuchas.<\/div>"},{"t":"El veredicto (23:3–4)","h":"<p>Pilato lleva a Jesús aparte a su cuartel privado (Juan 18) y se centra en el único cargo digno de investigar. El griego enfatiza el pronombre: <i>¿Eres <b>tú<\/b> el rey de los judíos?<\/i>, con sarcasmo incluido.<\/p><p>Jesús, golpeado hasta quedar irreconocible (con los ojos vendados, golpeado repetidamente en el rostro con puños: se cumple Isaías 52:14), responde con autoridad serena: <b>“Tú lo dices.”<\/b> Los hombres llegaban ante Pilato arrastrándose y rogando por su vida; Jesús era distinto: “sin temor… con una nobleza serena y confiada”.<\/p><p><b>¿Y si se hubiera defendido?<\/b> Podría haber llamado a la pareja de Caná, al centurión cuyo siervo sanó (un hombre que Pilato conocería), a los 5,000, a Lázaro. En cambio: “Tú lo dices.” Esto refleja su respuesta al Sanedrín (“Ustedes dicen que lo soy”). Reconoció una pregunta hecha de mala fe.<\/p><p>El veredicto de Pilato: <b>“No encuentro delito alguno en este hombre.”<\/b> Aun después de una respuesta afirmativa, un rey sin ejército, entregado por su propio pueblo, no es amenaza para el César. Pilato también vio la <i>envidia<\/i> (Mateo 27:18): una jugada de poder político, una facción tratando de usar a Roma contra un rival.<\/p><div class='q'>“No seas como los líderes religiosos que permanecen hostiles a Jesús. No seas como Pilato que lo trata con desdén.”<\/div><p>Jared expone aquí el evangelio: la desobediencia de Adán y Eva trajo pecado y muerte como un cáncer; todos nacemos con una naturaleza pecaminosa y la hemos ratificado; todos merecemos castigo eterno. Dios el Padre, por amor, envió a Dios el Hijo (plenamente Dios y plenamente hombre) para vivir perfectamente y morir en nuestro lugar, de modo que todos los que son atraídos al arrepentimiento y la fe reciban vida eterna. Cada oyente enfrentará la misma pregunta de veredicto que Pilato.<\/p>"},{"t":"El traslado (23:5–7)","h":"<p>El veredicto de inocencia estalla como una bomba. Los líderes insisten: “Alborota al pueblo, enseñando por toda Judea, desde Galilea hasta aquí.” La mención de Galilea es calculada: todas las grandes revueltas judías contra Roma comenzaron allí.<\/p><div class='q'>Los galileos: “campesinos fuera de la red que envolvían todo en la bandera y estaban en contra del gobierno… fuertes nacionalistas judíos y antirromanos.”<\/div><p><b>El dilema de Pilato.<\/b> Sabe que Jesús es inocente, pero liberarlo podría provocar un motín → tropas romanas → derramamiento de sangre → un informe al César escrito por los enemigos de Jesús, que pintaría a Pilato como el hombre que liberó a un agitador antirromano. Ya estaba en problemas con el César por levantamientos anteriores.<\/p><p>La mención de Galilea, pensada para sellar el destino de Jesús, le da a Pilato una salida: Galilea es jurisdicción de Herodes Antipas, y Herodes está en la ciudad por la Pascua. Pilato envía a Jesús allá: se protege mientras traslada a Jesús a otro tribunal.<\/p><p><b>Aplicación.<\/b> No mires el fracaso de Pilato desde lejos: “Todos hemos estado en la encrucijada entre lo que es correcto y lo que es fácil.” Ejemplos: copiar en un examen, callar cuando el error de cobro de un mesero te favorece, una mentirita para evitar incomodidad, descuidar responsabilidades por los videojuegos o las redes sociales. Pídele al Señor que escudriñe tu corazón.<\/p>"},{"t":"Cierre: Jesús no es una víctima","h":"<p>Es tentador imaginar a Jesús como un hombre al que no le sale nada bien: traición, arresto, juicios ilegales, golpes, burlas, desdén romano, traslado. Esa imagen es equivocada. <b>No fue víctima de estos sucesos; los orquestaba con soberanía.<\/b><\/p><p>Predijo cada paso (Mateo 20:17–19): entregado a los principales sacerdotes y escribas, condenado, entregado a los gentiles para ser burlado, azotado y crucificado, y resucitado al tercer día.<\/p><div class='key'>“Todo está encajando exactamente como Jesús el Mesías quiere.”<\/div>"}],"qs":["Las tres acusaciones eran falsas pero verosímiles. ¿Qué dice eso sobre conocer lo que Jesús realmente enseñó y no solo lo que otros dicen?","Si alguien en la sala era culpable de sedición, eran los acusadores. ¿Dónde proyectas en otros las faltas de las que tú eres más culpable?","Jesús pudo haber montado una defensa poderosa y eligió el silencio. ¿Qué dice eso de su confianza en el Padre, y qué puede modelarte cuando te acusan falsamente?","Pilato sabía que Jesús era inocente. ¿En qué punto saber lo correcto se convierte en ser responsable de hacerlo?","“Nos parecemos mucho más a Pilato de lo que quisiéramos pensar.” ¿Dónde estás eligiendo la comodidad en lugar de la conciencia?","¿Cómo cambia tu lectura de la Pasión saber que Jesús controlaba cada paso?","¿Qué prácticas te ayudan a distinguir las representaciones fieles de Jesús de las interesadas?"]},"p2":{"tab":"Culpables Pt. 2","title":"Los culpables acusando al inocente, Parte 2","meta":"Zac Nazarian · 16 ago 2026 · Hope Chapel","ref":"Lucas 23:8–25","verse":"“Por tercera vez les dijo: ‘¿Pues qué mal ha hecho este? No he hallado en él ningún delito digno de muerte…’ Pero ellos insistían a gritos pidiendo que fuera crucificado. Y sus voces prevalecieron… entregó a Jesús a la voluntad de ellos.” (Lucas 23:22–25, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Cada veredicto de culpabilidad que Jesús debió recibir fue reemplazado por una declaración de inocencia (de Pilato, de Herodes y de la profecía), y aun así la cobardía y la presión de la turba enviaron a un inocente a la cruz, tal como Dios lo había planeado.","take":["Jesús fue odiado porque nunca transigió: exponía la hipocresía y la cobardía de los líderes. ¿Cuáles son tus no negociables?","Herodes y Pilato son dos testigos independientes (uno indiferente, otro hostil) que hallaron inocente a Jesús, cumpliendo Deuteronomio 19:15 y Salmos 2:2.","El silencio de Jesús no fue debilidad; cumplió Isaías 53 y modela una confianza que no necesita defenderse.","Pilato sabía lo correcto e hizo lo fácil: tres veces declaró a Jesús inocente y luego lo entregó.","Pidieron la crucifixión para marcar a Jesús como maldito de Dios; el evangelio dice que él tomó esa maldición en nuestro lugar.","Sus decisiones no determinaron el destino de Jesús: determinaron el suyo."],"scr":[["Juan 18:31","“A nosotros no nos está permitido dar muerte a nadie.”"],["Mateo 27:12–14","No respondió, “ni siquiera a un solo cargo”."],["Juan 18:36–37","“Mi reino no es de este mundo… Todo el que es de la verdad escucha mi voz.”"],["Lucas 9:7–9","Herodes: “A Juan yo lo hice decapitar, ¿pero quién es este?”"],["Deuteronomio 19:15","Un cargo se establece por el testimonio de dos o tres testigos."],["Salmos 2:2","Los reyes y los gobernantes se confabulan contra el Señor y su Ungido."],["Isaías 53:7","Como cordero llevado al matadero… no abrió su boca."],["1 Pedro 2:21–23","Se encomendaba al que juzga con justicia."],["Marcos 15:6–10","Barrabás, la costumbre de la Pascua y la percepción de Pilato sobre la envidia."],["Mateo 27:19","La esposa de Pilato: “No tengas nada que ver con ese justo.”"],["Deuteronomio 21:23","El colgado es maldito de Dios."],["Mateo 27:24–25","Pilato se lava las manos; “¡Su sangre sea sobre nosotros y sobre nuestros hijos!”"],["Hechos 4:27–28","Herodes y Pilato hicieron lo que la mano y el plan de Dios habían predestinado."]],"secs":[{"t":"Apertura: Cobardía, hipocresía y no negociables","h":"<p>Zac toma prestado el título de Jared pero le da un giro: donde Jared preguntó “¿Alguna vez te han acusado falsamente?”, Zac quiere hablar de la <b>cobardía y la hipocresía<\/b>, luchas reales de los cristianos de hoy. ¿Cuáles son tus principios básicos, lo que no vas a comprometer ni vender de ninguna manera?<\/p><div class='q'>“¿Era Jesús un hipócrita? ¿Era un transigente? No: fue absolutamente odiado por los líderes religiosos judíos. ¿Por qué? Porque constantemente señalaba su hipocresía, constantemente señalaba su cobardía.”<\/div>"},{"t":"¿Por qué Pilato? De blasfemia a traición","h":"<p>El cargo original era blasfemia, pena de muerte según la ley judía, pero los judíos no podían ejecutar (Juan 18:31). A un gobernador romano la blasfemia no le importaba, así que el Sanedrín cambió a <b>traición<\/b>: incitar a la rebelión, negarse a pagar impuestos, pretender ser rey.<\/p><p><b>Un Mesías malentendido.<\/b> Bajo una intensa expectativa mesiánica querían un libertador político y militar; Jesús vino como libertador espiritual.<\/p><div class='q'>“Todos estos problemas comienzan primero en lo espiritual: problemas de relaciones, el fundamento espiritual, o la falta de él… Busquen primero mi reino y mi justicia, y yo me encargo de todo lo demás.”<\/div><p>Como Jesús no cumplió sus expectativas políticas, la nación que lo había recibido días antes “ya había terminado con él”.<\/p>"},{"t":"Ante Pilato: “¿Eres tú el rey?”","h":"<p>Todo el Sanedrín, la Corte Suprema judía, esperaba que la unidad lo resolviera, pero no presentó pruebas, ni testigos, ni una falta concreta. Jesús no dijo nada (Mateo 27:12–14). Pilato quedó asombrado.<\/p><p>Pilato pregunta por la realeza; Jesús primero hace una pregunta aclaratoria y luego responde: “Mi reino no es de este mundo… Para esto he nacido… para dar testimonio de la verdad. Todo el que es de la verdad escucha mi voz.”<\/p><div class='key'>“¿Cómo sabes que estás del lado de la verdad? Escuchas a Jesús.”<\/div><p>Pilato lo descarta con un “¿Qué es la verdad?”, el relativista de su época. Su fallo: no culpable de ningún delito contra Roma.<\/p><p><b>Jesús provoca una respuesta.<\/b> Di a desconocidos “creo en Dios” y la mayoría responde con calidez. Añade que Jesús es el único Hijo de Dios y el único camino, y el ambiente cambia. Los creyentes pueden ser reacios a hablar positivamente de Jesús con amigos y compañeros de trabajo. Cuando se tensa, pregunta: <i>¿Por qué lo sientes con tanta fuerza? ¿Has leído realmente su libro?<\/i><\/p><div class='q'>“Si Jesús está equivocado, se le puede descartar. No importa. Pero si tiene razón, merece ser adorado y obedecido. De cualquier manera, provoca una respuesta.”<\/div>"},{"t":"Un nuevo cargo → ante Herodes","h":"<p>Los líderes escalan (Lucas 23:5): “Alborota al pueblo, desde Galilea hasta aquí.” Saben que Pilato debe mantener la paz. Pero Galilea le da a Pilato una salida: es jurisdicción de Herodes, y Herodes está en la ciudad.<\/p><p>Herodes está encantado; hacía tiempo que quería ver un milagro. Pero Zac recuerda la historia de Herodes: Juan el Bautista le predicó arrepentimiento y fue decapitado (Lucas 9:7–9). Herodes interroga a Jesús largamente, y Jesús <b>no responde absolutamente nada<\/b>, la única persona en los Evangelios a quien no le dice nada.<\/p><div class='key'>“Herodes tenía un corazón duro y Jesús lo sabía. No escuchaste a Juan. No me vas a escuchar a mí.”<\/div><p><b>Discernimiento:<\/b> no toda pregunta merece respuesta. “¿Realmente te interesan las respuestas, o solo te interesan excusas para no creer? Si es lo segundo, a veces la mejor respuesta que puedes dar es simplemente callar.”<\/p><p>Herodes y sus soldados se burlan de Jesús, lo visten con una túnica elegante y lo envían de vuelta.<\/p>"},{"t":"Dos testigos y profecía cumplida","h":"<p>Tres razones por las que importa la audiencia ante Herodes:<\/p><ul><li>Confirma el veredicto de inocencia de Pilato.<\/li><li>Herodes y Pilato son <b>dos testigos independientes<\/b> (Pilato indiferente, Herodes queriéndolo muerto), con lo que se cumple Deuteronomio 19:15.<\/li><li>Cumple el <b>Salmo 2:2<\/b>: gobernantes confabulándose contra el Ungido del Señor.<\/li><\/ul><p><b>El siervo sufriente.<\/b> El silencio de Jesús ante el Sanedrín, Pilato y Herodes cumple Isaías 53:7 y modela 1 Pedro 2:21–23: encomendarse al que juzga con justicia.<\/p><div class='q'>“Lo siento. Me equivoqué. Perdóname. Te quiero. Diez palabras mágicas que todo esposo debería tener en su arsenal.” <cite>— Zac, sobre no necesitar defenderse<\/cite><\/div>"},{"t":"La cobardía de Pilato","h":"<p>Pilato confirma su fallo (nada digno de muerte) y propone un compromiso: azotar a Jesús y soltarlo. Este es el momento de prueba de Pilato: sabe lo que es correcto, pero la multitud ruge.<\/p><div class='q'>“Si Pilato hubiera sido un hombre de verdadero valor, un hombre íntegro, habría liberado a Jesús sin importar las consecuencias. Pero la multitud rugió y Pilato cedió.”<\/div><p>Hacer lo correcto suele costar: rechazo, relaciones perdidas, hasta un empleo. <b>“Cuando haya presión sobre ti para tomar la decisión correcta, acuérdate de Pilato. No seas como él.”<\/b><\/p>"},{"t":"Barrabás y “¡Crucifícalo!”","h":"<p>Los manuscritos de Lucas omiten el v. 17, así que Zac pasa a Marcos 15:6–10: era costumbre soltar a un preso en la fiesta. Entre los rebeldes estaba Barrabás, que había cometido homicidio en una insurrección. Pilato intenta usar la costumbre como salida, apostando a la popularidad de Jesús y percibiendo que los sacerdotes actuaban por envidia.<\/p><p>Entonces la <b>esposa de Pilato<\/b> manda a decirle (Mateo 27:19): “No tengas nada que ver con ese justo, porque hoy he sufrido mucho en sueños por causa de él.” Pero los líderes inclinan a la multitud hacia Barrabás, probablemente un héroe popular por oponerse a Roma. La ironía: el mismo cargo de insurrección que le achacaron a Jesús lo pasan por alto en el hombre que quieren libre.<\/p><div class='q'>“¿No es una lógica descabellada? Llegarán a los extremos que sea con tal de eliminar a Jesús. No me confundan con los hechos.”<\/div><p><b>¿Por qué la crucifixión?<\/b> Tres veces apela Pilato; tres veces crece la exigencia. Bajo la ley de Moisés, la blasfemia se castigaba con apedreamiento. Pero la crucifixión tenía un significado deliberado: Deuteronomio 21:23, “el colgado es maldito de Dios”. Querían que Jesús quedara marcado como maldito, descalificado como Mesías. El evangelio le da la vuelta:<\/p><div class='key'>La crucifixión muestra a Jesús tomando sobre sí la maldición de Dios por el pecado para que su pueblo sea libre. Sea lo que sea que la gente no puede romper o de lo que no puede escapar, Jesús es el único que puede liberarla.<\/div><p><b>Pilato se lava las manos<\/b> (Mateo 27:24–25): temiendo un motín, se desmarca con una costumbre judía: “Soy inocente de la sangre de este hombre; allá ustedes.” La multitud: “¡Su sangre sea sobre nosotros y sobre nuestros hijos!” Más tarde el Sanedrín negaría su responsabilidad (Hechos 5:28).<\/p>"},{"t":"Cierre: Ironía, soberanía, invitación","h":"<p>La gran ironía: el perfectamente justo, sin pecado e inocente fue condenado como blasfemo y criminal, mientras que los hombres que lo condenaron serán juzgados por él algún día. Nada de esto estuvo fuera del control de Dios (Hechos 4:27–28).<\/p><div class='key'>“Sus decisiones no determinaron el destino de Jesús. Sus decisiones determinaron su propio destino.”<\/div><p>Zac llama al rechazo de los líderes la oportunidad desperdiciada más trágica de la historia: el Dios del universo de pie frente a ellos. Y la invitación:<\/p><div class='q'>“Si todavía no conoces a Jesús, no pierdas tiempo. No seas como esos judíos. No desperdicies este momento. Él es para ti… Solo di: ‘Jesús me salvó’.”<\/div>"}],"qa":[{"q":"¿Qué fue lo que más se te quedó del sermón del domingo esta semana: una pregunta, una convicción o algo que sigues rumiando?"},{"q":"El pastor Zac comenzó preguntando por los no negociables: las creencias centrales que no vas a comprometer. ¿Cuál es una creencia que ya has establecido como no negociable, cueste lo que cueste?"},{"q":"Los líderes religiosos odiaron a Jesús por señalar su hipocresía y endurecieron su corazón en lugar de arrepentirse. Cuando alguien señala una brecha entre lo que dices y cómo vives, ¿cuál es tu primera reacción?"},{"q":"Los líderes judíos querían un libertador político y militar, y por eso rechazaron a Jesús cuando no encajó. ¿Dónde has esperado que Jesús obrara de cierta manera y te ha costado cuando no lo hizo?"},{"q":"El pastor Zac dijo que debajo de nuestros problemas hay asuntos espirituales y que ponemos curitas en lugar de tratar la raíz. ¿Cómo se ve tratar la raíz y no el síntoma?"},{"q":"Mientras los principales sacerdotes lo acusaban, Jesús no dio respuesta. Pedro dice que “se encomendaba al que juzga con justicia”. Cuando te acusan injustamente, ¿qué hace difícil callar y dejar el resultado en manos de Dios?"},{"q":"Decir “creo en Dios” recibe una respuesta amable, pero añadir que Jesús es el único Hijo de Dios y el único camino pierde rápido el favor. ¿Cuándo nombrar a Jesús en particular ha cambiado la temperatura de una conversación?"},{"q":"Herodes colmó a Jesús de preguntas y no obtuvo respuesta. Zac las llamó preguntas cortina de humo. ¿Cómo puedes saber si las preguntas de alguien sobre la fe son sinceras?"},{"q":"Pilato dijo tres veces que no hallaba fundamento para un cargo y luego entregó a Jesús. Somos como Pilato cuando sabemos lo correcto pero hacemos lo contrario. ¿Qué presión es la que más te impide hacer lo correcto que ya sabes?"},{"q":"Zac dijo que nuestras decisiones son pruebas de lealtad, fe e integridad, y que la decisión de los líderes determinó su propio destino, no el de Jesús. ¿Cuál es una decisión que tienes por delante en la que este grupo puede ayudarte a mantenerte con integridad y fe?"}]},"obey":{"tab":"Conocer y obedecer","title":"Conocer y obedecer, Parte 1","meta":"Zac Nazarian · 28 dic 2025 · Hope Chapel","ref":"Mateo 25:1–30","verse":"“Entonces el reino de los cielos será semejante a diez vírgenes que tomaron sus lámparas y salieron a recibir al novio… ‘Señor, señor, ábrenos.’ Pero él respondió: ‘En verdad les digo que no los conozco.’” … “Bien, siervo bueno y fiel. Sobre poco has sido fiel; sobre mucho te pondré.” (Mateo 25:1–30, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Dios no te salvó solo para llevarte al cielo: te salvó para que lo conozcas y lo obedezcas. En el día del juicio la prueba es “¿Me conoces?” y “¿Hiciste mi voluntad?”, y la obediencia solo puede brotar de la relación, nunca al revés.","take":["Las dos parábolas de Mateo 25 plantean dos preguntas que Cristo hará: ¿me conoces? y ¿hiciste mi voluntad?","El “aceite” de las Diez Vírgenes es el Espíritu Santo; solo los que han nacido de nuevo pueden conocer de verdad al novio.","Al siervo infiel no lo castigaron por robar, sino por enterrar lo que se le había confiado.","“Soy salvo por gracia, así que no se requiere nada más” malinterpreta la gracia. La gracia produce personas obedientes que conocen al Maestro.","La salvación es instantánea y también un proceso: “soy salvo, estoy siendo salvado, seré salvado”.","La obediencia es el fruto de conocerlo, no un sustituto de ello.","El cielo no es la meta; la meta es la relación con Cristo, y el cielo es un subproducto."],"scr":[["Mateo 25:1–13","Parábola de las Diez Vírgenes: estar listos para recibir al novio."],["Mateo 25:14–30","Parábola de los Talentos: administrar con fidelidad lo que el amo confió."],["Juan 3:7","“Tienen que nacer de nuevo.”"],["Tito 3:5","Salvos “por el lavamiento de la regeneración y la renovación del Espíritu Santo”."],["Romanos 8:11","El Espíritu que resucitó a Jesús habita en ustedes y da vida a sus cuerpos mortales."],["Juan 10:14","“Yo soy el buen pastor, y conozco mis ovejas y mis ovejas me conocen.”"],["Juan 14:21, 23–24","“El que tiene mis mandamientos y los guarda, ese es el que me ama.”"],["1 Juan 2:3–4","El que dice “yo lo conozco” pero no guarda sus mandamientos es un mentiroso."],["2 Corintios 5:10","Todos debemos comparecer ante el tribunal de Cristo."],["Gálatas 6:7","De Dios nadie se burla; lo que el hombre siembre, eso también segará."],["Mateo 7:21–23","“Nunca los conocí; apártense de mí.”"],["Juan 17:3","“Esta es la vida eterna: que te conozcan a ti, el único Dios verdadero.”"],["Tito 2:11–14","La gracia nos enseña a renunciar a la impiedad y a ser celosos de buenas obras."]],"secs":[{"t":"Preparando el escenario: dos parábolas","h":"<p>Jesús acaba de responder en el capítulo 24 la pregunta de sus discípulos sobre cuándo regresará. Ahora da dos parábolas sobre cómo se ve estar listos: las <b>Diez Vírgenes<\/b> (cinco insensatas, cinco prudentes; las insensatas no llevaron aceite) y los <b>Talentos<\/b> (cinco, dos y un talento confiados “a cada uno conforme a su capacidad”; dos siervos duplican los suyos, el tercero entierra el suyo y lo llaman “malo y perezoso”).<\/p><p>Después de la celebración de Nochebuena, Zac dice que viene “a hablar claro” y pide a todos pensar, sin responder en voz alta: <b>“¿Por qué te salvó Dios?”<\/b> El título es la respuesta: para conocerlo y obedecerlo.<\/p><div class='key'>“¿Me conoces? ¿Hiciste mi voluntad? Creo que todo se reduce a eso.” Las Vírgenes examinan la primera pregunta; los Talentos, la segunda.<\/div>"},{"t":"Pregunta 1: “¿Me conoces?” (Diez Vírgenes)","h":"<p>El aceite habla de <b>estar listos<\/b>; Zac lo toma como imagen del Espíritu Santo: solo por el Espíritu puede alguien conocer de verdad al novio (Juan 3:7; Tito 3:5; Romanos 8:11; Juan 10:14).<\/p><p><b>Su testimonio:<\/b> creció en un hogar religioso y sabía acerca de Dios, de Jesús y de la resurrección, pero había una brecha.<\/p><div class='q'>“Yo sabía acerca de Jesús. Sabía de la resurrección. Simplemente nunca conocí a Jesús. Hay una enorme diferencia.”<\/div><p>Apocalipsis 19: Cristo regresa para casarse con su novia, vestida de lino blanco de obras justas. Los que no tienen el aceite del Espíritu no tienen luz y no pueden entrar al banquete.<\/p>"},{"t":"Pregunta 2: “¿Hiciste mi voluntad?” (Talentos)","h":"<p>Cada siervo recibió “conforme a su capacidad”: todo creyente tiene dones, habilidades y oportunidades. El trabajo de un siervo es saber lo que el amo requiere. La mayoría de los cristianos conocen los trazos generales (no robar, no mentir, no matar), pero ¿y los detalles? <i>“¿Qué quieres de mí hoy?”<\/i> El tercer siervo ni se molestó en averiguarlo.<\/p><p><b>La defensa común:<\/b> “Soy salvo por gracia. Ese es mi boleto al cielo. No se requiere nada más.” Zac responde con las propias palabras de Jesús (Juan 14:21, 23–24) y las tres condiciones del discipulado: negarse a sí mismo, tomar su cruz, seguirlo. ¿Bromeaba Jesús?<\/p><div class='q'>“No puedo decir que lo conozco. No puedo decir que soy creyente. No puedo decir que he nacido de nuevo e ignorar lo que él me ha llamado a ser y a vivir.” <cite>— de 1 Juan 2:3–4<\/cite><\/div>"},{"t":"Las preguntas están ligadas; habrá rendición de cuentas","h":"<p>No se puede separar conocerlo de hacer su voluntad: la obediencia es la prueba de la relación, y la relación es la fuente de la obediencia. La Biblia es un libro sobre relaciones: la vertical (con Dios), luego contigo mismo, luego con los demás, luego con el entorno que Dios te confió. Si se rompe la primera, las demás se derrumban.<\/p><p>La gente se casa no solo porque está enamorada sino porque la vida se siente incompleta a solas: “Esto es lo que Dios quiere. Quiere que lo tengamos en nuestra vida para vivir la vida juntos.”<\/p><p><b>El juicio es real y personal<\/b> (2 Corintios 5:10; Gálatas 6:7). Resiste la autojustificación, ese reflejo de “pero, pero, usted no entiende”. Mejor: <i>“Gracias por señalármelo. Lo necesitaba.”<\/i> La gente de tu entorno te está observando; admítelo, arrepiéntete y sigue adelante.<\/p>"},{"t":"La salvación es un proceso","h":"<p>Cuidado con deslizarse hacia las obras: confesamos, nos arrepentimos y recibimos a Jesús como Salvador y Señor; ese es el punto de entrada, no la meta. Luego comienza la santificación de toda la vida, siendo conformados a la imagen de Cristo por el Espíritu.<\/p><div class='key'>“La salvación de hecho es instantánea. También es un proceso. Soy salvo. Estoy siendo salvado. Seré salvado.”<\/div>"},{"t":"Oración: deja de hablar, empieza a escuchar","h":"<p>Zac admite su larga lista de oración y el “no mi voluntad, sino la tuya” para cubrir todas las bases. Pero casi todo su tiempo de oración lo dedica a <b>escuchar<\/b>.<\/p><div class='q'>“Casi todo mi tiempo de oración lo paso escuchando, aprendiendo a oír su voz.”<\/div><p>Ora con su Biblia abierta: la carne quiere hablar, el diablo también citará la Escritura y el Espíritu Santo hablará; y él quiere discernir cuál voz es cuál.<\/p>"},{"t":"El cielo no es la meta","h":"<div class='key'>“El cielo no es la meta. Anótenlo.” El cielo es un subproducto; la meta es la relación con Cristo.<\/div><p>De ese conocerlo fluye la obediencia: lo consultamos, escuchamos su voluntad en situaciones particulares y la llevamos a cabo en cosas ordinarias y extraordinarias.<\/p><div class='q'>“La obediencia es un fruto. La obediencia es una vara de medir de la calidad de la relación que tengo con él. No funciona al revés.”<\/div><p>No puedes invertir el orden con obras religiosas muertas, y ni siquiera conocerás su voluntad para una situación dada si la relación no existe ya.<\/p>"},{"t":"El pasaje más aterrador (Mateo 7:21–23)","h":"<p>“Señor, Señor, ¿no profetizamos en tu nombre, y en tu nombre echamos fuera demonios… e hicimos muchos milagros?” — “Nunca los conocí; apártense de mí, hacedores de iniquidad.” Las obras parecían impresionantes; Jesús las llama malas, no porque los actos fueran malos sino porque no había una relación detrás.<\/p><ul><li><b>Cuidado con las fórmulas.<\/b> “A más B más C… El reino de Dios es más que una fórmula.”<\/li><li><b>Cuidado con la confianza tranquila.<\/b> “‘Tengo el cielo en el bolsillo.’ No hagas eso.”<\/li><\/ul><p>Juan 17:3: la vida eterna es conocer a Dios. Hoy es el día de salvación: no lo pospongas.<\/p>"},{"t":"Por qué nos salvó Dios e invitación","h":"<p>Tito 2:11–14: la gracia nos enseña a renunciar a la impiedad y a ser celosos de buenas obras.<\/p><div class='q'>“¿Por qué nos salvó? Porque nos quería. El Padre quiere hijos. Jesús quiere hermanos y hermanas ansiosos de ser como él y de hacer lo que él quiere.”<\/div><p>Primero la relación; luego sabemos lo que él quiere. Desde el servicio obediente nos volvemos sal y luz donde los no creyentes nos observan.<\/p><p><b>Invitación:<\/b> si no conoces al Señor, puedes conocerlo ahora mismo: confiesa, arrepiéntete, pídele a Jesús que te perdone, te llene de su Espíritu y te haga nuevo. <i>“No se me ocurre una mejor persona en toda la existencia para conocer que Jesús.”<\/i><\/p>"}],"qs":["Zac preguntó: “¿Por qué te salvó Dios?” Si tuvieras que responder en una frase ahora mismo, ¿qué dirías, y coincide con cómo vives en realidad?","Él distinguió conocer acerca de Jesús de conocer a Jesús. ¿Dónde está tu relación en esa línea y qué profundizaría ese conocerlo esta semana?","Al siervo infiel lo castigaron no por robar sino por enterrar lo confiado, por miedo. ¿Hay algún don, oportunidad o responsabilidad que hayas enterrado?","“No puedo decir que lo conozco… e ignorar lo que él me ha llamado a ser y a vivir.” ¿Cuál es un área específica en la que Cristo te pide obedecer y has estado posponiendo?","“El cielo no es la meta.” ¿Qué cambiaría en tu vida diaria esta semana si la relación con Cristo fuera tu meta operativa?","Zac dedica casi todo su tiempo de oración a escuchar, con la Biblia abierta. ¿Cómo se vería escuchar tanto como hablas en oración esta semana?","En Mateo 7:21–23 la gente enumeró obras impresionantes y Jesús dijo: “Nunca los conocí”. ¿En qué podrías estar confiando como prueba de relación que en realidad es un sustituto?","¿Quiénes son las personas de tus esferas de influencia que observan cómo vives? ¿Qué quieres que vean en ti en 2026?"]},"obey2":{"tab":"Conocer y obedecer 2","title":"Conocer y obedecer, Parte 2","meta":"Zac Nazarian · 4 ene 2026 · Hope Chapel","ref":"2 Corintios 10:5","verse":"“Destruimos argumentos y toda altivez que se levanta contra el conocimiento de Dios, y llevamos cautivo todo pensamiento a la obediencia de Cristo.” (2 Corintios 10:5, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"La obediencia comienza en la mente. Aprendemos a conocer y reconocer la voz de Dios llevando todo pensamiento cautivo a Cristo: contrastándolo con su palabra, orando antes de actuar o hablar y confiando en él con todo el corazón, porque la obediencia brota de una relación real con él.","take":["Las dos preguntas de la semana pasada siguen en pie: ¿Me conoces? ¿Hiciste mi voluntad? No te rindas: Dios sigue obrando y obedecerás cada vez más.","La obediencia es relacional. Solo ocurre dentro de una relación íntima en la que conocemos a Dios y él nos conoce.","Las ovejas de Jesús conocen su voz, y podemos desarrollar un oído afinado para oírlo.","La mayoría de nuestros problemas empiezan con pensamientos que nunca examinamos. El pecado comenzó en el Edén cuando la mente de Eva aceptó una sugerencia sin llevarla a Dios.","Llevar los pensamientos cautivos significa preguntarle a Dios de dónde vino un pensamiento y qué hacer con él. Puede ser nuestro, del enemigo o de Dios.","Dios transforma y renueva nuestra mente. Nuestra tarea es permanecer cerca de él mediante su palabra, la oración en quietud y respondiendo con reflexión en lugar de reaccionar.","La obediencia es la vara de medir de nuestra relación con Cristo, y no es una manera de ganarla. Sin ella, nuestra afirmación de conocerlo es vacía."],"scr":[["2 Corintios 10:5","Llevar cautivo todo pensamiento a la obediencia de Cristo."],["Juan 10:3–5","Las ovejas siguen al pastor porque conocen su voz; no seguirán a un extraño."],["Génesis 3:1–6","La caída comenzó con una sugerencia: “¿Conque Dios les ha dicho?”"],["Proverbios 3:5–6","Confía en el Señor con todo tu corazón; reconócelo en todos tus caminos y él enderezará tus sendas."],["Romanos 12:2","Sean transformados mediante la renovación de su mente."],["Mateo 6:6","Entra en tu cuarto, cierra la puerta y ora a tu Padre en secreto."],["Gálatas 5:16","Anden por el Espíritu y no satisfarán los deseos de la carne."],["Hebreos 5:8–9","Jesús aprendió obediencia por lo que padeció y vino a ser fuente de salvación para todos los que le obedecen."],["Juan 16:33","En el mundo tendrán aflicción, pero confíen: yo he vencido al mundo."],["Juan 14:6","“Yo soy el camino, la verdad y la vida.”"],["Juan 14:21–24","El que me ama guardará mi palabra."],["1 Juan 2:3–5","Sabemos que lo hemos llegado a conocer si guardamos sus mandamientos."],["Mateo 7:21–23","“Nunca los conocí; apártense de mí.”"],["Josué 24:14–25","“Yo y mi casa serviremos al Señor.”"]],"secs":[{"t":"Repaso: dos preguntas","h":"<p>Zac abre con 2 Corintios 10:5 y nos recuerda la Parte 1: en el día del juicio Jesús podría preguntar <b>“¿Me conoces?”<\/b> (las Diez Vírgenes) y <b>“¿Hiciste mi voluntad?”<\/b> (los Talentos).<\/p><div class='key'>Dios quiere un pueblo que, desde una relación de amor con él, esté listo y dispuesto a agradarle en todo. Si te quedas corto, no te rindas: él sigue obrando y nunca se da por vencido.<\/div>"},{"t":"La obediencia es relacional","h":"<p>Hacer su voluntad es otra manera de decir obediencia. Zac recuerda el lema que dio antes: <b>“Sí, Señor. No mi voluntad, sino la tuya.”<\/b><\/p><p>Como un niño que le dice “te quiero” a un padre, el amor se muestra obedeciendo. La obediencia solo ocurre dentro de una relación íntima donde queremos conocer a Dios y ser conocidos por él, no solo creer en él desde lejos.<\/p>"},{"t":"Oír su voz","h":"<p>Si no tenemos relación, ¿cómo vamos a reconocer a Dios cuando habla? La relación es comunicación. Él habla por su palabra y también a nuestra mente y corazón.<\/p><p>En Juan 10, las ovejas siguen al pastor porque conocen su voz y huyen de un extraño. <b>¿Podemos desarrollar un oído afinado?<\/b> Sí, y 2 Corintios 10:5 muestra cómo.<\/p>"},{"t":"Lleva cautivo todo pensamiento","h":"<p>Dedicarnos al Señor incluye nuestra mente. La mayoría de nuestros problemas empiezan con pensamientos que nunca examinamos para ver de dónde vinieron o adónde llevan (Proverbios 23:7).<\/p><p>Que un pensamiento esté en mi mente no significa que haya empezado en mí.<\/p>"},{"t":"La caída: una batalla por la mente","h":"<p>Génesis 3 ocurrió por sugerencia, no por fuerza: “¿Conque Dios les ha dicho?” y “No morirán”. Adán y Eva no llevaron esos pensamientos a Dios.<\/p><div class='q'>“Todo lo que Eva tenía que hacer era decirle a la serpiente: ‘Espera. Tengo que ir a hablar con mi esposo y tengo que hablar con Dios.’”<\/div><p>Satanás atacaba el carácter de Dios. <b>El pecado comienza cuando cuestionamos la palabra de Dios y la bondad de Dios.<\/b> Eva confió en su propio juicio.<\/p>"},{"t":"Confianza y renovación","h":"<p>Proverbios 3:5: confía en el Señor con <b>todo<\/b> tu corazón y no te apoyes en tu propio entendimiento. Si sigues quedándote corto, permanece en el proceso; Dios sigue siendo soberano.<\/p><p>En Romanos 12:2, ser “transformados” y “renovados” son pasivos. <b>Dios hace la transformación y la renovación. Mi parte es quedarme cerca de él<\/b> llevándole cada pensamiento para comprobar su origen.<\/p>"},{"t":"Conoce la Palabra; responde, no reacciones","h":"<p>Para examinar nuestros pensamientos tenemos que conocer la verdad: leer, conocer, meditar y memorizar la Escritura, y aprovechar las clases de capacitación de la iglesia (Zac destaca una, Hope 101).<\/p><p>Muchos cristianos dicen “no sé qué quiere Dios”. Lo sabrías si estuvieras dedicado a su palabra y a llevar los pensamientos cautivos. En emergencias, no entres en pánico.<\/p><div class='key'>“Reaccionar es un proceso sin pensar. Responder es un proceso pensado.”<\/div>"},{"t":"El cuarto de oración y orar antes de hablar","h":"<p>A Dios le encanta hablarnos, pero necesitamos silenciar el ruido. Mateo 6:6: entra en tu cuarto, cierra la puerta y deja el teléfono afuera.<\/p><p><b>La batalla es por nuestra mente,<\/b> y es seria, no un juego.<\/p><p>Prueba orar antes de hablar. Hablarás menos (Santiago 1:19; Proverbios 10:19) y será menos probable que satisfagas la carne. Al andar en el Espíritu (Gálatas 5:16), obedecer produce en ti la vida y el poder de Cristo.<\/p>"},{"t":"El sufrimiento enseña obediencia","h":"<p>Hebreos 5:8: Jesús aprendió obediencia por lo que padeció, y Pedro dice que nos dejó ejemplo para seguir. El sufrimiento es un maestro eficaz: “No lo vuelvo a hacer.”<\/p><p>Jesús prometió aflicción pero dijo que tuviéramos ánimo, porque él ha vencido al mundo, y en Cristo lo vencemos mediante la obediencia. Oró para que el Padre nos protegiera del maligno, no para que nos sacara del mundo.<\/p>"},{"t":"El cielo no es la meta; la paz es posible ahora","h":"<p>Una mujer le dijo a Zac que no había olvidado el mensaje de la semana pasada: <b>la relación con Dios es la meta y el cielo es el subproducto.<\/b> No importa tanto adónde vamos sino con quién vivimos para siempre. Menciona los próximos servicios conmemorativos de tres personas de la iglesia que ahora ven a Jesús.<\/p><p>Hebreos 5:9 y un anhelo de descanso: la paz de Dios que sobrepasa todo entendimiento se puede conocer en buena medida ahora. Zac se niega a vivir ansioso y lee su Biblia cuando se ve tentado a una noche sin dormir.<\/p>"},{"t":"Reconócelo en todos tus caminos","h":"<p>Proverbios 3:6: no <i>algunos<\/i> de tus caminos, sino <b>todos<\/b>. Cuando lo reconocemos, él endereza nuestras sendas. Ese camino recto y ese descanso vienen solo por confiar en él mediante Jesús (Juan 14:6).<\/p><p>En el Padrenuestro lo amamos, dependemos de él y pedimos hacer su voluntad <b>ahora mismo<\/b>, lo cual sucede cuando le damos el primer lugar en la batalla por nuestra mente.<\/p>"},{"t":"La obediencia prueba la relación","h":"<p>La obediencia es una <b>vara de medir<\/b> de la calidad de nuestra relación, pero la relación va primero (Juan 14:21–24; 1 Juan 2:3–5). Los de Mateo 7 que hicieron milagros oyeron “Nunca los conocí”.<\/p><p>Zac nos llama a dejar de racionalizar, poner excusas, echar culpas (Adán), quejarnos, la pereza y la complacencia. Esto es tan serio como puede ser, y <b>la decisión es nuestra.<\/b> No podremos culpar a otros en el día del juicio. Y “todo saldrá bien” no basta. La gracia no cancela la siembra y la cosecha.<\/p>"},{"t":"Cómo aprendemos a obedecer","h":"<p>Aprendemos a obedecer:<\/p><ul><li><b>Escuchando<\/b> primero.<\/li><li><b>Consultando al Señor<\/b> antes de decidir: “¿Has orado por esto?”<\/li><li><b>Consultándolo<\/b> antes de hablar, actuar, intervenir o sacar conclusiones.<\/li><\/ul><p>Su reino no
