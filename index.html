of tribulation through history, ultimately Christ’s final return. “It accounts for the data the best.”</li><li><b>Generational type:</b> “this generation” is a type of people (wicked, righteous, believing), not a time period.</li></ul><div class=\"key\">“Regardless of your view, the application for our lives is the same — no matter what happens to us, we’re to joyfully anticipate the return of Christ.”</div>"},{"t":"The World Shakes (vv. 25–26)","s":510,"h":"<p>This is a passage about judgment — uncomfortable. The target is “the world”: the system of people who persistently refuse Christ, with its habits, comforts, promises and hopes.</p><div class=\"q\">“A warning is always an act of mercy.”</div><p>(Like tornado-warning signs on Missouri hotel doors: mercy, not anger.)</p><p><b>The world is confused.</b> Our culture has “signed divorce papers with truth” — it lies about bodies, money, time, happiness — and will still claim to know the truth when judgment arrives (1 Cor. 1:19–21; James 3:13–15).</p><p><b>The world is weak with fear.</b> Building societies is good (Gen. 1 dominion), but we drift to thinking we did it alone — like rereading an email you thought was razor-sharp. Then God’s judgment meets what we thought was great (Isa. 13; Jer. 17; Ps. 33). Europe’s castles once housed people who thought they were extremely important; now they’re rocks on a tourist itinerary.</p><div class=\"key\">If you stand on your own power and achievements, judgment comes on those no matter how strong they seem, if you’ve not turned to Christ.</div><p><b>The delay is mercy</b> (2 Pet. 3:8–10): “The delay of judgment is not approval of your life. It is not indifference… It is not laziness on the part of God. It is mercy.”</p>"},{"t":"The Son Returns (v. 27)","s":1479,"h":"<p><b>On clouds.</b> Clouds mark God’s presence (Exod. 34; Ps. 104). Daniel 7:13–14 is the source of Jesus’s “Son of Man” — and the high priest understood it: when Jesus said “I am,” he tore his robes (Mark 14:61–64). We worship the Lord of the universe, embodied in Jesus, who will return in that body.</p><p><b>With power.</b> He made the world, saves it, will judge and restore it (1 Cor. 15:24–25). Andrew wryly asks who believes politicians will deliver:</p><div class=\"q\">“When Christ returns, he can do it all. He doesn’t need your vote. He doesn’t need your money. He can actually right all wrongs.”</div><p><b>With glory</b> (<i>doxa</i> — reputation, the weight of who you are). First coming: infant in a manger, no army, no home, rejected, betrayed, beaten, crucified. “The second time will not look like this.” (Rev. 19:11–16)</p><div class=\"key\">When he shows up, everyone will be on their knees either in worship or under the weight of judgment.</div>"},{"t":"The Church Anticipates (v. 28)","s":2059,"h":"<p>Followers and non-followers see the same events and respond completely differently: those who repented and trusted Christ have had their judgment spent — Christ bore it — so he has none left to give them.</p><p>To anyone who thinks “do good, go to heaven; do bad, go to hell”: the Bible teaches you were completely unable to gain God’s favor and needed someone to do it for you. Christ lived perfectly, died under wrath in our place, and all who turn and trust are declared righteous. Today is the day of salvation.</p><p><b>Bent but unbroken.</b> Paul writing from prison (2 Tim. 1:8–12). For those walking through illness, relational pain, financial strain, or the creeping losses of age — things taken that don’t come back — Christ’s return is not an interruption but a rescue (Rev. 21:1–6).</p>"},{"t":"Closing: Shackleton on Elephant Island","s":2498,"h":"<p>From the book <i>Endurance</i>: Shackleton’s trans-Antarctic attempt fails; the ship freezes in the ice. His men reach Elephant Island, and he leaves twenty-two behind while he takes five to find help. The twenty-two build a whole society — overturned lifeboats for shelter, hunting parties, watches — and survive four months. Everything they made was essential to survival.</p><div class=\"key\">“They see Shackleton and immediately all of it’s worthless. They can abandon camp. They can get on the boat.”</div><div class=\"q\">“I’m tempted to stay here, to build a permanent life. And the things here — they do matter. But I believe, like these men, when I see Christ, everything else becomes worthless.”</div><p><b>“Stand up straight. Stand up straight. Look to Christ. He’s coming back.”</b></p>"}],"qs":["Andrew says our culture thinks of history like kids playing Monopoly without rules — no end, no telos. How has that assumption shaped how you actually live day to day?","Which of the three interpretive views resonates most with you, and does it change the application Andrew draws?","“The delay of judgment is not approval of your life — it is mercy.” How does that reframe God’s patience right now?","Where are you most tempted to trust the world’s counsel over Scripture’s?","Andrew contrasts a humble first coming with a glorious second. What does that tell you about how Christ works, and how you wait for him now?","For those in Christ, his return is redemption, not judgment. Where do you still experience it as a threat? What would it look like to welcome it?","The men on Elephant Island abandoned their survival infrastructure the moment their rescuer arrived. What in your life is hardest to hold loosely?"]},{"id":"eoh2","yt":"I7pNaudW_cM","tab":"End of History 2","color":"#8a6d3b","title":"The End of History, Part 2","meta":"Zac Nazarian · Hope Chapel","ref":"Luke 21:29–36","verse":"“Look at the fig tree, and all the trees. As soon as they come out in leaf, you see for yourselves and know that the summer is already near. So also, when you see these things taking place, you know that the kingdom of God is near… Heaven and earth will pass away, but my words will not pass away.”","big":"Because Jesus is returning — the fulfillment of every biblical promise — believers fix their eyes on him through the signs, stand firm on his unshakeable Word, and live in eager, watchful expectation.","take":["The second coming is “the most important of all biblical truths,” because every other truth finds its fulfillment there.","The signs aren’t meant to alarm but to focus our eyes on Jesus.","“This generation” most likely means those alive when the final signs occur — they will know the end is near.","Zac leans pre-tribulation, premillennial, and invites charitable disagreement.","The rapture and the second coming are two distinct events.","Heaven and earth will pass away, but Jesus’s Word stands forever."],"scr":[["John 14:15","“If you love me, you will obey me.”"],["Rom. 8:18–23","Creation groans, waiting in eager expectation for the revealing of the sons of God."],["Ps. 141:8; Heb. 12:2","Fix our eyes on the Lord / on Jesus."],["2 Tim. 3:1–4","Terrible times in the last days: lovers of self, money, pleasure."],["Dan. 11:31; 2 Thess. 2:3–4","The abomination of desolation; the man of lawlessness in God’s temple."],["Rev. 5:9–10","The new song of redemption in heaven."],["John 14:1–3","Jesus will come back and take his people to be with him."],["1 Cor. 15:51–52","Changed “in the twinkling of an eye.”"],["1 Thess. 4:16–18; 5:9","Caught up in the clouds; God did not appoint us to wrath."],["Zech. 14:4","At the second coming the Mount of Olives splits."],["2 Pet. 3:10–13","The heavens will disappear; we look for a new heaven and new earth."],["Rev. 21:1; Isa. 65:17","New heavens and new earth."]],"secs":[{"t":"Opening: Do You Love Jesus?","s":83,"h":"<p>Zac opens with pointed questions: Do you love Jesus? How do you know? How does <i>he</i> know? Jesus gave the test himself.</p><div class=\"q\">“There’s only one test. What does he say? If you love me, you will — obey.”</div><p>Love for Jesus isn’t a warm feeling but faithfulness expressed in obedience. Are you concerned about his glory? Eagerly awaiting his return? He anchors this in Romans 8:18–23: the whole creation groans for what’s coming.</p>"},{"t":"The Most Important Biblical Truth","s":314,"h":"<div class=\"key\">“I submit to you it’s the second coming of Jesus Christ… all other biblical truths find their fulfillment in his second coming. If he doesn’t come back, we got nothing.”</div><p>The return is the consummation of redemptive history and God’s eternal plan. Jesus’s fullest teaching on it is the Olivet Discourse (Matt. 24, Mark 13, Luke 21), given the Wednesday of his final week from the Mount of Olives.</p>"},{"t":"The Fig Tree: What Signs Do","s":380,"h":"<ul><li><b>Signs can be seen.</b> Leaves announce summer. “If we’re not looking and thinking… we will miss the truth.” Jesus uses <i>know</i> (v. 31) deliberately — he doesn’t want his people to doubt or fall away.</li><li><b>Signs occur within one generation.</b> The 70 AD generation was warned, fled, and saw it happen exactly as said.</li><li><b>Signs are sure.</b> His words will not pass away.</li></ul><p><b>Signs focus our gaze</b> (Ps. 141:8; Heb. 12:2) — not to frighten but to direct us to Jesus.</p><p>Signs reviewed: false teachers and messiahs, wars, intensifying disasters, persecution, armies around Jerusalem, astronomical events — all growing in severity. 2 Tim. 3:1–4 shows the moral landscape. <i>“Things are getting worse. It’s a sign.”</i></p>"},{"t":"The Abomination of Desolation","s":985,"h":"<p>Two specific signs mark the tribulation. First: midway through, the Antichrist — previously Israel’s protector — desecrates a rebuilt temple (Dan. 11:31; 2 Thess. 2:3–4). No such temple exists yet; Zac watches for any movement toward one.</p><p>The second half is the most severe outpouring of God’s wrath the world has seen; the Antichrist demands worship of his image on pain of death — yet those who comply face God’s wrath.</p>"},{"t":"“This Generation” — Who Is It?","s":1342,"h":"<p>Zac isn’t categorical, but reads it as most likely the generation alive when the final signs begin — not only 70 AD. As the first-century generation was warned to flee Jerusalem, the final generation will see the signs and know the Son of Man’s return is imminent. He believes that generation will be largely those saved after the church’s rapture.</p>"},{"t":"Where Zac Leans: Pre-Tribulation Rapture","s":1471,"h":"<p>He has studied about 25 commentaries and books and leans premillennial, pre-tribulation.</p><div class=\"q\">“I’m not setting it in cement. If you have a different view, God bless you. We’re not really going to know till it’s all over anyway.”</div><ul><li><b>1. Flow of Revelation.</b> The church is in chapters 1–3; in 4–5 the scene is heaven, with the 24 elders singing redemption (5:9–10); the church is absent from chapters 6–18 (tribulation); it returns with Christ in chapter 19.</li><li><b>2. No tribulation instructions for the church.</b></li><li><b>3. Key rapture passages:</b> John 14:1–3; 1 Cor. 15:51–52; 1 Thess. 4:16–18; 1 Thess. 5:9.</li><li><b>4. OT prefigurements:</b> Enoch (taken), Noah (delivered through the flood), Lot (rescued before Sodom’s judgment), Elijah (taken in a whirlwind). <i>“I just offer that to you for your consideration.”</i></li><li><b>5. Two distinct events:</b> at the rapture the church meets Jesus in the air; at the second coming it returns with him. Olives untouched vs. split (Zech. 14:4). Rapture is signless and imminent; the second coming has preceding signs. Rapture involves only the saved; the second coming, saved and lost.</li></ul>"},{"t":"Heaven and Earth Will Pass Away — His Word Won’t","s":2669,"h":"<p>Verse 33 isn’t hyperbole: the present heavens and earth will be destroyed; his Word stands forever.</p><div class=\"q\">“I stand on his word. Not that voice over there. Not that philosophy. Not that person. I stand on his word. That’s all I need.”</div><p>2 Pet. 3: the same word that made the heavens and flooded the world now reserves the present heavens and earth for fire. After the millennium — Jesus’s thousand-year reign — God makes a new creation (Rev. 21:1; Isa. 65:17).</p>"},{"t":"Closing","s":3040,"h":"<p>Zac returns to Romans 8’s golden chain: those God predestined he called; those he called he justified; those he justified he glorified. Already accomplished.</p><div class=\"key\">“He does it all. Our part is to trust him. Our part is to walk with him. Our part is to follow him. He’s faithful, and he will do it.”</div><p>He then leads the church to the Lord’s Table.</p>"}],"qs":["Zac says obedience is the one true test of love for Jesus. Where is God calling you to trust and obey even when it’s uncomfortable?","He calls the second coming “the most important of all biblical truths.” Does that surprise you? How much does Christ’s return shape your daily life?","The signs are meant to fix our gaze on Jesus, not frighten us. When you hear disturbing news, does it draw you to Christ or to anxiety?","Zac walks through Enoch, Noah, Lot and Elijah as possible prefigurements of the rapture. What do they have in common, and what does that suggest about those God rescues?","Which of the three — dissipation, drunkenness, cares of this life — is your most present temptation?","“Heaven and earth will pass away, but my words will never pass away.” What would building your life more firmly on that look like?","Zac ends: “Our part is to trust him… walk with him… follow him.” What is one concrete step you could take this week?"]},{"id":"eoh3","yt":"gOuzSm9er44","tab":"End of History 3","color":"#d14a1f","title":"The End of History, Part 3","meta":"Zac Nazarian · Hope Chapel","ref":"Luke 21:34–36","verse":"“But watch yourselves lest your hearts be weighed down with dissipation and drunkenness and cares of this life, and that day come upon you suddenly like a trap… But stay awake at all times, praying that you may have strength to escape all these things that are going to take place, and to stand before the Son of Man.”","big":"Because Jesus’s return is imminent and his judgment certain, believers live in constant readiness — watchful, prayerful, and urgently sharing the gospel with those not yet ready.","take":["Jesus didn’t say when he’s coming, only that he is — and we must be dressed and ready.","The rapture is the next event on Jesus’s calendar: imminent, could happen without warning.","Three things weigh down hearts and rob readiness: dissipation, drunkenness, and anxiety.","Worry isn’t just understandable — Jesus commands us not to, and to trust God’s perfect plan.","Anticipating his return should produce holy living and urgent evangelism, not passive waiting.","Everyday evangelism: daily prayer, a prayer list of lost friends, and real time with non-believers."],"scr":[["Rev. 18:21–23","The fall of Babylon: no music, light, or voice of bridegroom and bride ever again."],["Rom. 1:7; 1 Thess. 1:10; 2 Thess. 2:1","Waiting for the Son from heaven; gathered to him."],["Rev. 22:20","“Yes, I am coming soon. Amen. Come, Lord Jesus.”"],["Luke 12:39–40","The thief comes at an hour you don’t expect."],["Gal. 5:19–21","Acts of the sinful nature — those who live this way won’t inherit the kingdom."],["Eph. 5:18","“Do not get drunk on wine… Instead, be filled with the Spirit.”"],["Matt. 6:25, 31–34","“Do not worry about your life… seek first his kingdom.”"],["Phil. 4:4–7","Do not be anxious about anything; the peace of God will guard your hearts."],["Matt. 9","The crowds, harassed and helpless like sheep without a shepherd."],["Col. 1:21–23","Presented holy “if you continue in your faith.”"],["Heb. 3:6, 14","We share in Christ if we hold firmly to the end."]],"secs":[{"t":"Opening: Christmas and the Return of Christ","s":87,"h":"<p>What is Christmas really about? The birth of Jesus — buried under shopping, Santa, and office parties. The world will embrace an infant in a manger but has no tolerance for the same Jesus returning in power, glory and judgment.</p><div class=\"q\">“The world is eager to embrace an infant in a manger… But the world has no tolerance whatsoever for a sovereign Lord coming back in power, glory, and judgment.”</div><p>Revelation 18:21–23 paints what his return means for the world’s systems and celebrations — no more partying. Jesus came the first time in humility to save sinners; he returns in the full display of his deity to judge, and finally to populate heaven and hell.</p>"},{"t":"Jesus’s Return Is Imminent","s":404,"h":"<p>After weeks in the Olivet Discourse: Jesus described signs but withheld the <i>when</i>. Instead of a date, he gave a command: <b>be ready.</b></p><p>Zac leans pre-tribulation: no signs precede the rapture, just Christ’s sudden appearance. It’s the very next event on Jesus’s calendar — it could happen right now. <i>“It’s my great dream to be raptured while I’m preaching, not while I’m doing stupid stuff.”</i></p><p>Support: believers eagerly waiting (Rom. 1:7; 1 Thess. 1:10; 2 Thess. 2:1) and Jesus’s three “I am coming soon” in Revelation 22. John’s response is the church’s: <b>“Come, Lord Jesus.”</b></p>"},{"t":"Be Dressed and Ready: Live with Expectation","s":771,"h":"<p>Zac grew up watching Disneyland on TV each Wednesday as his dad promised “We’re going to Disneyland” — constant buzzing anticipation. That is the posture toward Christ’s return.</p><div class=\"q\">“I can hardly wait. I can hardly wait. But I know I must wait — and I’m going to wait with a sense of expectation.”</div><p>Test yourself: am I careful, on my guard? A thief gives no warning (Luke 12:39–40). Like Noah’s and Lot’s days, people were eating, drinking, buying, selling, planting, building — until judgment fell.</p>"},{"t":"Don’t Let Your Heart Be Weighed Down","s":1417,"h":"<p><b>Dissipation</b> — immorality, corruption, self-indulgence, sensuality, debauchery. Galatians 5:19–21 lists the marks of those who won’t inherit the kingdom; claiming Jesus while living this way doesn’t make you a Christian.</p><p><b>Drunkenness</b> — Zac refuses to soften it: “We call it the disease of alcoholism. I’m just telling you what the Bible says — it’s sin.” The alternative isn’t moderation but a different fullness (Eph. 5:18).</p><div class=\"q\">“I want to get high on God… Can he fill you with joy and peace and just everything your heart desires?”</div><p><b>Anxiety</b> — worry isn’t just understandable; Jesus commands us not to (Matt. 6). If God has a good, pleasing, perfect plan, why worry? Paul’s remedy (Phil. 4:4–7): God’s peace guards heart and mind. <i>“You find yourself finally exhaling.”</i></p>"},{"t":"Compelled to Warn Others","s":2447,"h":"<p>Readiness has an outward edge. If you understand what’s coming, how can you stay silent toward people you care about? If their house were on fire, you’d bang on the door.</p><p>Matthew 9: the crowds are harassed and helpless; believers are the ones sent. The Great Commission isn’t the Great Suggestion. God takes no pleasure in the death of the wicked, and effective evangelism can hasten Christ’s coming.</p><div class=\"q\">“I would sooner bring one sinner to Jesus Christ than to unravel all the mysteries of the divine word.” <cite>— Charles Spurgeon</cite></div><p><b>Zac’s testimony:</b> he filled his life with education, money, cars — and knew something was missing. Friends shared their testimony at his lowest point and he said, “I need Jesus in my life. Jesus never fails.”</p>"},{"t":"Three Habits for Everyday Evangelism","s":2896,"h":"<p>Zac’s challenge: thirty days of intentional evangelism.</p><ul><li><b>1. Pray daily</b> — for open doors, boldness (“make me bold — you know how timid I am”), divine appointments. God convicts and converts; our job is to sow seeds. <i>“You will amaze yourself.”</i></li><li><b>2. Keep a prayer list</b> — three to five names of people who don’t know Jesus. About 75% of Christians came to faith through a friend or relative. <i>“Awkward conversations change lives.”</i></li><li><b>3. Spend time with non-believing friends</b> — the longer people are Christians, the fewer non-believing friends they have. Jesus ate with tax collectors and sinners. Hospitality: budget for it; “people are disarmed around food.”</li></ul><p>His dream: every member of Hope Chapel leads one person to Christ and begins discipling them.</p>"},{"t":"Closing: Persevere to the End","s":3992,"h":"<p>Luke 21:36 commands watching and praying. Two promises to those who persevere: they will escape the coming judgments (Zac applies this to the raptured church) and they will stand before the Son of Man — approved, not ashamed.</p><div class=\"key\">Col. 1:21–23 and Heb. 3:6, 14: held “if you continue in your faith.” — “I know who I am and I know whose I am.”</div><p>The goal: to hear “Well done, good and faithful servant.” <i>He’s coming back. Be faithful. He is faithful. Stand firm.</i></p>"}],"qs":["The world welcomes the baby in the manger but resists the returning King. Where do you feel pressure to soften the second coming?","Do you live with the Disneyland-on-Wednesday kind of expectation for Christ’s return? What would raise it?","Of dissipation, drunkenness and anxiety, which weighs your heart down most right now? What is the “filled with the Spirit” alternative?","Jesus commands us not to worry. What do you do with worry that you’ve been calling “being responsible”?","Who are three to five people you could put on a prayer list this week?","Where could you spend regular time with a non-believing friend — and what meal could you host?"]},{"id":"king","yt":"511_SbHaoiA","tab":"King Betrayed","color":"#d1204a","title":"The King Is Betrayed","meta":"Mike Nazarian · Jun 7, 2026 · Hope Chapel","ref":"Luke 21:37–22:6","verse":"“Then Satan entered into Judas called Iscariot, who was of the number of the twelve. He went away and conferred with the chief priests and officers how he might betray him to them. And they were glad, and agreed to give him money. So he consented and sought an opportunity to betray him to them in the absence of a crowd.”","big":"Betrayal never begins in the garden — it begins with a heart that slowly shifts loyalty through small, unconfessed compromises; but the King who was betrayed is the King who forgives everyone who falls toward him.","take":["Even with the cross looming, Jesus refused to hide: “A good king doesn’t hide.”","The crowds’ hunger for Jesus was the door his enemies couldn’t open.","Satan didn’t pick the lock on Judas — Judas handed him the key through years of quiet compromise with money.","Satan doesn’t need your worst sin, just your small, regular one. Small compromises never announce their destination.","Remorse and repentance are not the same. The difference between Peter and Judas was the direction of the fall.","When the weight of your sin hits, fall toward Jesus."],"scr":[["Luke 4:13","The devil departed “until an opportune time.”"],["James 4:7","Submit to God. Resist the devil, and he will flee."],["Eph. 4:27","“Give no opportunity to the devil.” (The word means “place.”)"],["John 12:6","Judas “used to help himself” to the moneybag."],["Matt. 27:3–5","Judas’s remorse and death."],["Luke 23:34","“Father, forgive them, for they know not what they do.”"]],"secs":[{"t":"Opening: Betrayal Begins Long Before","s":0,"h":"<p>Every betrayal begins long before the betrayal itself. The kiss didn’t begin in the garden. It begins with a heart that has slowly shifted loyalty — a compromise here, a door left open — until the unthinkable becomes possible.</p><div class=\"q\">“Betrayal always begins with a heart that has very slowly shifted its loyalty. It doesn’t happen all at once.”</div><p>Luke wants us to see how a heart can shift until it can betray a very good king. (Note the unfortunate chapter break — read 21:37–22:6 together.) Luke’s kingship theme builds to Passion Week: Jesus is the true king, fulfilling every promise to David — and before he reigns he must suffer and die, to open his kingdom to sinners.</p>"},{"t":"The King Won’t Hide; The People Won’t Leave","s":211,"h":"<p><b>The king won’t hide (v. 37).</b> Last week, cross looming, vultures circling — every instinct says lower your profile. Luke’s grammar stresses a settled daily pattern: Jesus walked back into the temple, the most public place in the most crowded city, to be present for the people.</p><div class=\"key\">“A good king doesn’t hide.”</div><p><b>The people won’t leave (v. 38).</b> At the crack of dawn all the people came to him. <i>“The people have set their alarms for Jesus.”</i> When was the last time you were hungry to wake up early and meet with Jesus? If you wake up early, he’s already waiting.</p>"},{"t":"The Leaders Can’t Get to Him","s":687,"h":"<p>Luke names Passover — redemption through blood, a substitute dying so others live. History moves on two planes: human action below, God’s sovereignty above. The leaders plot; God is setting the table.</p><p><b>The decision is made.</b> They sought <i>how</i> to kill him, not whether. <i>“If you reject God’s truth long enough, you’re not going to just grow neutral to it. You’re going to grow hostile to it.”</i> The clearer Jesus becomes, the harder it is to stay undecided. Where are you at with Jesus today?</p><p><b>The door won’t move.</b> The most powerful men in Jerusalem feared the people. They had the will but not the way.</p><div class=\"key\">“The door that is protecting Jesus is not made of iron. It is made of hunger.”</div>"},{"t":"Satan Finds the Key","s":1253,"h":"<p>“Then Satan entered into Judas.” Not a Hollywood possession — Luke stacks verbs: Judas <i>goes, confers, consents, bargains, seeks.</i> “Those are not the actions of a man who has lost his mind. Those are the actions of a man who has made up his mind.” Judas yielded; he didn’t resist (James 4:7).</p><p>Rewind to Luke 4:13 — after the wilderness Satan left “until an opportune time.” Eighteen chapters later, it has come.</p><div class=\"q\">“Satan is real and he is never in a hurry. He is patient and calculating and he never wastes his moves.”</div><p>Judas was “of the number of the twelve,” handpicked, trusted with the purse, present for every miracle.</p><div class=\"key\">“Satan did not pick the lock — Judas handed him the key.”</div><p>John tells us Judas was a quiet thief — a shekel here, a shekel there. <i>“He does not need a wide-open door in your life… He does not need your worst sin. He just needs your small, regular one.”</i> The Bible says give him no <i>place</i> (Eph. 4:27).</p><p><b>“Small compromises never announce their final destination.”</b> What place have you given him — a secret lust, love of money, bitterness, unforgiveness, deception, an addiction you’ve stopped fighting? Don’t hide it; confess it to someone (elders are available to pray). “Sin thrives in the darkness… the light is the best chemotherapy, spiritually speaking.” The Savior who forgives your sin also breaks its power.</p>"},{"t":"Judas Betrays Jesus","s":2067,"h":"<p>Judas goes, confers with the chief priests and officers, and they were <i>glad</i> — a gospel word (angels rejoice over one sinner who repents) hijacked for treachery. A price is agreed; the king is sold. Judas seeks an opportunity “in the absence of a crowd” — he alone knows where Jesus sleeps and where to find him when the people aren’t there as his shield.</p><div class=\"q\">“The people are hungry for Jesus. The leaders are hungry for blood. Judas is hungry for money, and Satan is hungry for glory. And when all those hungers collide, the king is betrayed.”</div>"},{"t":"Closing: Which Direction Do You Fall?","s":2526,"h":"<p>It’s tempting to look at Judas with contempt. But every one of us has chosen something over Jesus — a relationship, reputation, secret, habit. Maybe not thirty pieces of silver, but something.</p><p>When the weight hit Judas he felt it (Matt. 27:3–5). <b>Remorse and repentance are not the same.</b> His greater tragedy was believing there was no way back — a small view of Jesus. The cross covers every sin that nailed him there (Luke 23:34); many who cried “Crucify him” were saved at Pentecost.</p><p>Peter did essentially the same — denied Jesus three times with curses and wept bitterly. He couldn’t immediately run back, but he didn’t run away; when he heard the tomb was empty, he ran toward it, and Jesus restored him.</p><div class=\"key\">“The difference between Peter and Judas is not the greatness of the sin, but the direction of the fall. Peter fell towards Jesus, and Judas fell away from him.”</div><p>Do you run to yourself, the world, beating yourself up — or fall into the arms of Jesus? <b>“The king who was betrayed is the king who forgives. He did it for Peter. He will do it for you.”</b></p>"}],"qs":["Mike says betrayal begins with a heart that slowly shifts loyalty. Where have you noticed small compromises or “doors left slightly open”?","The crowds “set their alarms for Jesus.” When were you last that hungry to meet with him? What would rekindle it?","The leaders saw Jesus’s teaching, compassion and miracles — and grew hostile, not neutral. Why does knowing more about Jesus force a decision? Where are you at with him?","What’s the difference between Satan “picking the lock” and Judas “handing him the key”? How does it change how you think about temptation and responsibility?","What “place” might you be giving the enemy — a small, regular sin you think you can manage? What would bringing it into the light this week look like?","Why are remorse and repentance not the same? How do Judas and Peter illustrate the difference?","“The difference between Peter and Judas is the direction of the fall.” When your sin’s weight hits, which direction do you tend to fall?","How does “the king who was betrayed is the king who forgives” change how you approach Jesus after failure?"]},{"id":"arrest","yt":"gHTA6dyHiwg","tab":"The Arrest","color":"#4f8a10","title":"The Arrest","meta":"Andrew Kelley · Jul 19, 2026 · Hope Chapel","ref":"Luke 22:47–53","verse":"“While he was still speaking, there came a crowd, and the man called Judas, one of the twelve, was leading them. He drew near to Jesus to kiss him, but Jesus said to him, ‘Judas, would you betray the Son of Man with a kiss?’… But Jesus said, ‘No more of this!’ And he touched his ear and healed him… ‘But this is your hour, and the power of darkness.’”","big":"Three people, three choices — a kiss, a sword, and a cup. Judas rejected God’s plan, Peter misunderstood it, Jesus accomplished it. No one can stay indifferent to Jesus; not to choose is to choose.","take":["We love having options but resist making a choice — yet Scripture won’t let us stay undecided about Jesus.","Judas had theological knowledge, religious reputation, proximity to holiness and outward obedience — none of it was trust.","“The problem with Judas was not lack of trying. It was lack of trusting.”","Peter’s faith faltered but did not fail; Judas’s failed. Peter was restored.","Jesus was in complete control and genuinely innocent — he drank the cup willingly.","“The innocent goes to the cross because the guilty cannot.”"],"scr":[["John 6:64","Jesus knew from the beginning who would betray him."],["James 2:18–19","Even the demons believe — and shudder."],["Luke 6:16; Eph. 2:19–20; Rev. 21:14","Judas’s title among the twelve — and the foundation of the church."],["John 12:4–6","Judas “was a thief, and having charge of the moneybag he used to help himself.”"],["Luke 9:22","Jesus had already told them what would happen."],["Ps. 27:14; James 5:7–8; Isa. 30:15","Wait for the Lord; in quietness and trust is your strength."],["Matt. 26:53","“More than twelve legions of angels.”"],["Luke 22:52–53","“You came at night… this is your hour.”"]],"secs":[{"t":"Intro: Too Many Options, Only One Choice","s":109,"h":"<p>The sermon opens at 7-Eleven: a son frozen trying to pick one treat from too many options — choice paralysis, tears, no snack. We love options; we resist choosing. We’re near the end of Luke; Jesus’s ministry is over and this is his last free moment before the cross. Last week: his humanity in the garden (“not my will but yours be done”).</p><p><b>Pressure cooker:</b> first-century Jerusalem — competing Jewish factions, a population swollen tenfold for Passover, a brutal Roman occupation, and a carpenter’s son making divine claims and working miracles. Everyone who meets Jesus must respond.</p><div class=\"key\">“We cannot be indifferent to the person of Jesus… to not make a choice is also to actually make a choice.” A kiss, a sword, a cup. Judas rejected God’s plan; Peter misunderstood it; Jesus accomplished it.</div>"},{"t":"I. The Kiss — Judas’s Hypocrisy (vv. 47–48)","s":348,"h":"<p>A kiss was a sign of honor; Judas weaponizes it. He was handpicked and present for every miracle — in body but never in spirit. Four things were true of him, each able to masquerade as saving faith:</p><ul><li><b>Theological knowledge.</b> Taught by Jesus himself — but it went to his head, not his heart (James 2:18–19). Knowledge is the beginning of faith, not the end.</li><li><b>Religious reputation.</b> One of the Twelve, a foundation of the church — but an unexercised title is empty. Luke 6:16 already flags him: “who became a traitor.”</li><li><b>Proximity to holiness.</b> He watched Jesus heal, calm storms, raise the dead. Nearness is not union. <i>“You will not survive on the faith of your parents… your spouse or friends… There is only one advocate, and you must know him.”</i></li><li><b>Outward obedience.</b> He objected to the anointing: “Why was this ointment not sold… and given to the poor?” — but he was a thief (John 12:6). A pious persona hid a private god: money.</li></ul><div class=\"key\">“The problem with Judas was not lack of trying. It was lack of trusting.” See yourself in Judas; the only thing separating us is the mercy of God.</div><p>When Judas arrives Jesus doesn’t rage — he asks a question: “Judas, would you betray the Son of Man with a kiss?”</p>"},{"t":"II. The Sword — Peter’s Self-Sufficiency (vv. 49–51)","s":1457,"h":"<p>All four Gospels tell it; only John (writing after Peter’s death) names him.</p><ul><li><b>Initiative over dependence.</b> Peter swings before Jesus answers, though Jesus had plainly said what would happen (Luke 9:22).</li><li><b>Impatient action over patient waiting.</b> Action isn’t the problem; running ahead of God’s plan is (Ps. 27:14; James 5:7–8; Isa. 30:15).</li><li><b>Force over faith.</b> <i>“It’s much easier to be a crusader than it is to be a martyr… No one has ever had a genuine conversion at the end of a gun or the edge of a sword. If we use violence to promote Christianity, we don’t make converts, we make victims.”</i></li></ul><p>With unsaved loved ones: speak truth, but trust God — not manipulation or force — to save them.</p><div class=\"key\">“Judas chose a kiss. Peter chose a sword. Whereas Judas’s faith failed, Peter’s faltered, but it did not fail. At the end of his self-sufficiency, he’s met by Christ who restores him.”</div>"},{"t":"III. The Cup — Jesus’s Self-Sacrifice (vv. 52–53)","s":2282,"h":"<ul><li><b>Complete control.</b> Not a victim; he could stop it at any moment (Matt. 26:53 — twelve legions of angels). He heals the ear his disciple just severed — mercy toward those arresting him.</li><li><b>Genuinely innocent.</b> They come with swords and clubs, at night, as against a robber (an insurrectionist — the term used of Barabbas and the men crucified beside him) when he taught publicly day after day. Rome crucified perceived threats to power, not religious teachers. The cover of night exposes the pretense. <i>None of us are innocent. He actually is.</i></li></ul>"},{"t":"The Gospel — Why the Cup Was Necessary","s":2667,"h":"<ul><li><b>Bad news:</b> by nature we are enemies of God (“all have sinned”; “no one does good, not even one”). Because God is just, he must deal with sin — the byproduct of his justice is wrath.</li><li><b>Good news:</b> God became man, lived sinlessly, carried no sin of his own. At the cross God’s wrath is poured out on the Son — fully man to pay, fully God to endure and exhaust it.</li><li><b>The verdict:</b> all who call on him in faith and repentance are granted his righteousness. “It cost him his life. It cost you nothing.”</li></ul><div class=\"key\">“The innocent goes to the cross because the guilty cannot. There was no one that was able. No friend, no family member… Just the one.”</div><p>You can’t look at Jesus in the garden, think “great story, I want to be more like Jesus,” and move on. <b>You have to decide.</b> “The anxiety you feel in response to God’s word is a mercy… Today is the day of salvation.”</p>"}],"qs":["What stuck with you most from this sermon? Was there anything you heard for the first time, or that challenged you?","Judas was handpicked and saw everything the other apostles saw, yet Jesus knew from the beginning he would betray him. What makes Judas such a sobering warning for people who have spent years around Jesus and his church? (Look at: John 6:64)","Belief is the beginning of faith, not the end; even demons believe and shudder. What does it look like when theology has actually penetrated someone’s heart and not just their head? (Look at: James 2:18–19)","Judas had the best teacher and best title, yet Scripture remembers him as the one “who became a traitor.” Why is it dangerous to rest on titles and reputation? How ought we live out the title of Christian? (Look at: Luke 6:16; Ephesians 2:19–21)","Judas’s problem was not lack of trying but lack of trusting. What do people trust for security instead of God, and when have you seen one let someone — yourself — down? (Look at: John 12:4–6)","Peter swings before waiting for an answer, though Jesus had told them God’s plan again and again. Why do we so often default to our own initiative rather than depending on God?","When have you acted before you had really prayed something through, and what happened? (Look at: Psalm 27:14; James 5:7–8; Isaiah 30:15)","It is easier to be a crusader than a martyr. How does trusting that God alone converts hearts change how we talk about Jesus with people in our lives?","Jesus is in control and innocent, yet courageously calls out the cowardice of men who came at night and willingly goes with them. How does he redefine courage? (Look at: Matthew 26:53; Luke 22:52–53)","Nearness to Christ is not union with Christ. How do we know our faith is our own? When did it become true faith for you? What are the hallmarks of saving faith?"],"official":true},{"id":"faith","yt":"Lm9MKFJ60J0","tab":"Faith or Pride","color":"#c9358d","title":"Faith or Pride?","meta":"Andrew Kelley · Nov 1, 2026 · Hope Chapel","ref":"Habakkuk 2:2–5","verse":"“Write the vision; make it plain on tablets, so he may run who reads it… If it seems slow, wait for it; it will surely come; it will not delay. Behold, his soul is puffed up; it is not upright within him, but the righteous shall live by his faith.”","big":"Because God’s word is public, clear, certain, and always on time, the righteous live by faith — a faith that receives Christ’s finished work, rests in it, and perseveres to the end — while pride trusts itself, swells into insatiable greed, and ends in death.","take":["Habakkuk 2 sets faith and pride side by side — like Cain and Abel, Moses and Pharaoh, Saul and David, the two thieves.","Faith needs a good object, and God’s word is that object: public, clear, certain, always on time.","“The righteous shall live by faith” is quoted in three NT places, and each shows what faith does: it receives (Romans), rests (Galatians), perseveres (Hebrews).","Test: when you stand before the judge, what will you be tempted to show him? The only plea is Christ crucified.","Pride is dangerous because it makes us feel safer; it breeds greed that’s never satisfied and looks like death.","Christ will return — vindication for those in him, judgment for those outside. Living by faith will be worth it."],"scr":[["Hab. 2:1","“I will take my stand at my watchpost.”"],["Luke 23:39–43","The two thieves — one mocks, one asks to be remembered."],["Deut. 29:29","The secret things belong to the Lord; the revealed things belong to us."],["Rom. 1:16–17","“The righteous shall live by faith.”"],["Rom. 3:21–26","Righteousness through faith in Jesus; propitiation by his blood."],["Gal. 3:10–14","No one is justified by the law; Christ became a curse for us."],["Heb. 10:32–39","Do not throw away your confidence; we are not of those who shrink back."]],"secs":[{"t":"Two Attitudes, Two Contexts","s":90,"h":"<div class=\"q\">“It’s true in my life that faith has never failed me and pride has never preserved me.”</div><p>(When that doesn’t feel true, he usually just needs to wait — time proves it.)</p><p><b>Context one: Habakkuk, 6th century BCE.</b> Unlike most prophets, Habakkuk converses with God. He cries that his people are unjust and corrupt; God answers he’ll fix them by raising the brutal pagan Chaldeans (Babylon). Habakkuk objects honestly — Babylon sweeps up nations like fishermen — then takes his stand at the watchpost to wait (2:1).</p><p><b>Context two: the NT era.</b> The NT authors cite Habakkuk repeatedly. Habakkuk asks what God will do about evil coming on his people; the NT asks the same about all human evil across history. Both answers: go to the watchpost and wait. In the waiting two dispositions contrast: pride and faith.</p>"},{"t":"The Two Thieves (Luke 23:39–43)","s":324,"h":"<p>Both guilty, both nailed to a cross, both in their final hours, both facing the same Jesus — and opposite responses. One mockingly demands a display of power; the other simply asks Jesus to remember him. Pride and faith.</p><p>What is the primary disposition of my heart day in and day out — humble trust with a lower opinion of myself and higher vision of Christ, or pride, which condemns me?</p><div class=\"key\">“No one has ever come to Christ and brought their pride with them. It requires faith.”</div>"},{"t":"I. The Nature of the Word: Faith Needs a Good Object","s":435,"h":"<p>In vv. 2–3 God describes his word four ways:</p><ul><li><b>Public</b> — written on tablets like billboards, not secret notes. Don’t wait on spiritual people to relay what God told them about you, or an elusive voice about which job or whom to date. <i>“God doesn’t have a plan for your life that he’s hiding from you.”</i> (Deut. 29:29)</li><li><b>Clear</b> — “make it plain… so he may run who reads it”: a street sign, not a map’s fine print. Some passages are clearer than others; Christians sometimes disagree (hopefully kindly, humbly, patiently); the most important things are the clearest. <i>“Do not delegate your Bible study to somebody else. It’s on you.”</i></li><li><b>Certain</b> — “it will not lie.” We trust the pilot, the bus driver, online reviews, even a restaurant with a C in the window (“You shouldn’t, guys”), gravity and the sunrise. <i>“The things that you trust most are less reliable than God.”</i></li><li><b>Always on time</b> — “it will not delay.” Andrew’s little girls make him pick Google Maps just to watch the minutes count down — 15, 14, 13, back to 14, green to red. He’s made the drive hundreds of times and never failed to get them there.</li></ul><div class=\"key\">“If you just stop focusing on the minute counter, you would have a better journey. Trust me, I’m going to get you there.” — I don’t know when or how, or what obstacles. But God will do what he says.</div>"},{"t":"II-A. Faith Receives (Romans)","s":1188,"h":"<p>Romans 1:16–17: “The righteous shall live by faith.” Paul, writing to churches he hasn’t started, hoping for support to go to Spain, then spends two and a half chapters telling them how evil they are — Greeks first (the Jews cheering, like a kid whose mom is yelling at his sister) and then the Jews, who had the law and dishonored God. All without excuse.</p><p>Then Romans 3:21–26: righteousness through faith in Jesus, a gift, with no list of things to do. Every other worldview has a desired state (heaven, nirvana) and things you must do; Christianity says God did it for you — which cuts against our Western instincts.</p><div class=\"q\">“Jesus did not just die a death at the hand of the Romans. He died a death at the hand of God who poured his wrath out on him.” <cite>— on <i>propitiation</i></cite></div><p>Back to the thieves: the one who asks to be remembered has no opportunity to do any good — yet “Today you will be with me in paradise.” Faith receives.</p>"},{"t":"II-B. Faith Rests (Galatians)","s":1591,"h":"<p>Paul preached to mostly pagans in Galatia, who trusted a Jewish Messiah. After he left, others told them faith in Jesus isn’t enough — you must obey Jewish law. Fearful, they added to the gospel (the men circumcised themselves). Paul’s response, probably his “meanest letter”: adding to the gospel is straying from it. Faith in Christ can rest in Christ.</p><p>Few are tempted to give up shellfish, but as adamant as Protestants are about faith alone, it’s easiest to fail to rest in Christ’s finished work. Andrew knows many who trusted Christ and are still afraid — himself included.</p><div class=\"key\">“When you stand before the judge, what will you be tempted to show him for him to have mercy on you?”</div><p>His own temptation: a devoted husband and faithful father. Others: a worn Bible, terrible sins never done, church volunteering — a sweating, panicked list of credentials.</p><div class=\"q\">“I only have one plea when I’m there. Just the one. Christ crucified.”</div><p><b>Faith rests:</b> it kills your pride and calms your fears.</p>"},{"t":"II-C. Faith Perseveres (Hebrews)","s":1956,"h":"<p>Hebrews 10:32–39: faith strengthens endurance and produces obedience.</p><div class=\"q\">“Obedience is not the basis of your salvation. Christ’s obedience is not yours. But your obedience is the evidence of your salvation.”</div><p>A new heart leads to a new life; a new tree bears new fruit. Suffering isn’t proof you sinned, but it’s the earthquake that shakes the building and shows what you’re held together by. <i>“Suffering is a teacher that teaches us about ourselves.”</i></p><p>Not easy believism (“sign a card… now party till you die”). The Bible teaches an imperfect, gradual endurance: five steps forward, four back; a defeated sin creeping back; confessing the same things twice. (“I’m a young man” is less true these days — his wife recently gave him hair-growth shampoo.) But as life brings less favorable seasons, Christ fills more of his field of vision.</p><p>To those in the dark: come up for air a moment, and when you walk back into the valley, look to Christ.</p><div class=\"key\">“When you’re in the valley, look to Christ. I promise you he will carry you through.”</div>"},{"t":"III. The Rejection of the Word: Pride (v. 5)","s":2426,"h":"<p>Sidebar: many Bibles read “wine,” some “wealth.” After a week of research Andrew doesn’t know which — but both convey an insatiable appetite that kills you.</p><ul><li><b>Pride trusts itself.</b> “His soul is puffed up.” Babylon is the fisherman with hook, net, drag net — then building an altar to his fishing gear (like a salesman making an altar to his iPhone; “make an appointment with Pastor Mike”). <i>Pride lulls you into a sense of safety</i> — one of the few sins that doesn’t make us feel in danger.</li><li><b>Pride breeds greed never satisfied.</b> <b>Wealth:</b> every dollar you’re about to get will finally make you happy; vocation becomes a means to money; people become customers; you cut corners. Retirement accounts make you feel safe but can’t save you — and you can be a slave to wealth even with none. <b>Approval:</b> a smile, a nod — insatiable for others’ approval you empty yourself of conviction and end lonelier than ever, a shadow of a person.</li><li><b>Greed looks like death.</b> “As wide as Sheol; like death he has never enough.”</li></ul><div class=\"key\">If you are not in Christ, you are not safe. You are in danger of the just judgment Christ will bring when he returns. Do not delay.</div><p>For those in Christ, his return is vindication, joy, renewal, reunion, glorification — a new heaven, new earth, new body. For those outside, judgment.</p>"},{"t":"Closing: Living by Faith Will Be Worth It","s":2973,"h":"<div class=\"q\">“Living by faith will be worth it. It will be worth it. God will keep his promises.”</div><p>Andrew believes this some days more than others. The church then approaches the table for communion.</p>"}],"qa":[{"q":"What’s one thing from Sunday’s sermon that stuck with you this week: a question, a conviction, or something especially impactful?"},{"q":"<b>The Nature of the Word (vv. 2–3)</b><br>Pastor Andrew said faith has never failed him and pride has never preserved him, and when it doesn’t feel that way, he waits. Can you recall a time when faith seemed to be failing you but later proved true? What changed? (Look at: Lamentations 3:25–26)"},{"q":"The vision was written on tablets for anyone to read (v. 2). Yet we often wait for a private whisper about an important decision instead of the wisdom God has already revealed. Think of a big decision you faced. How did you look for God’s direction? (Look at: Deuteronomy 29:29)"},{"q":"God’s word is plain enough to read on the run, like a road sign (v. 2). Not all of it is equally clear, but you were made to understand it. What passage once confused you but now makes sense? What made the difference? (Look at: Psalm 119:130)"},{"q":"Wise counsel is good, but no one should let a pastor or anyone else do their Bible reading for them. Can you recall a season when you leaned on sermons etc. more than your own reading? What was different once you opened it yourself? (Look at: Acts 17:11)"},{"q":"<b>The Reception of the Word (v. 4)</b><br>People add to the gospel, Pastor Andrew said, “because we’re afraid that maybe Jesus is not enough.” Before the judge, though, “you have one plea. Christ crucified.” When have you felt you had to earn God’s acceptance? What helped you rest in Christ instead? (Look at: Galatians 3:10–14)"},{"q":"“Easy believism” says pray a prayer, then live however you want. Scripture says otherwise: obedience is not the basis of salvation, but it is the evidence of it. If obedience does not save us, why is a faith without it dead? (Look at: James 2:14–17; Hebrews 10:36–39)"},{"q":"<b>The Rejection of the Word (v. 5)</b><br>Babylon worshiped its own net (Habakkuk 1:16). Pride works the same way: an ability, possession, or position puffs us up and makes us feel safe while leaving us in greater danger. When has something you leaned on for security given way? What did it teach you? (Look at: Jeremiah 17:5–8)"},{"q":"Verse 5 says greed, like death, never has enough. For many of us the greed is not for money but for approval: “one more smile, one more friend.” Can you recall finally getting something you had chased? How long did it satisfy? (Look at: Ecclesiastes 5:10)"},{"q":"Verse 4 sets pride beside faith, and the sermon asked which one rules your heart. Think of a season when your pursuits and desires lined up with your faith, and one when they did not. What was different between the two? (Look at: Luke 23:39–43)"}]},{"id":"money1","yt":"u5SQmleRJoI","tab":"God & Money 1","color":"#248a3d","title":"God and Money, Part 1","meta":"Andrew Kelley · Aug 17, 2025 · Hope Chapel","ref":"Luke 16:1–13","verse":"“There was a rich man who had a manager, and charges were brought to him that this man was wasting his possessions… And I tell you, make friends for yourselves by means of unrighteous wealth, so that when it fails, they may receive you into the eternal dwellings.”","big":"Everything belongs to God and we are only his managers, so we use our money with the shrewdness of the dishonest manager — not to secure this life, but to invest in eternity.","take":["Jesus talks about money more than a hundred times, and about a third of his parables involve money. Following him includes how we use it.","This is called the hardest parable to interpret. The key is that we live in two worlds: the cutthroat world before Christ and the new kingdom we now belong to.","Know your place: there is a difference between an owner and a manager. Everything belongs to God, including the abilities that let us earn.","Believing that it is all God’s kills pride, kills fear, and produces responsibility, because we will give an account.","Jesus is not telling us to be dishonest. He is telling us to be shrewd: to act wisely and urgently with the future in view.","Invest in eternity. Earthly wealth will fail us, and the only way to keep it is to put it into the cause of Christ.","Repeating God’s promises about the future helps us obey him now. “He is no fool who gives what he cannot keep to gain what he cannot lose.”"],"scr":[["Luke 16:1–13","The parable of the dishonest manager and the call to serve God rather than money."],["Col. 1:13–14","God delivered us from the domain of darkness and transferred us to the kingdom of his Son."],["Ps. 24:1","“The earth is the Lord’s and the fullness thereof.”"],["Deut. 10:14","Heaven and the earth with all that is in it belong to the Lord."],["Hag. 2:8","“The silver is mine and the gold is mine, declares the Lord of hosts.”"],["John 14:1–3","In my Father’s house are many rooms; I go to prepare a place for you."],["1 Pet. 1:3–9","A living hope and an inheritance that is imperishable, undefiled and unfading."],["Matt. 6:19–21","Lay up treasures in heaven, for where your treasure is, there your heart will be also."]],"secs":[{"t":"Opening: Reading Luke 16:1–13","s":0,"h":"<p>Andrew reads the whole parable and announces he will split it into two weeks. Today covers the first half; Part 2 finishes the passage.</p>"},{"t":"Why Talk About Money?","s":166,"h":"<p>We like hearing about other people’s money, but we do not like talking about our own. Some of that comes from churches and preachers who have exploited people.</p><div class=\"key\">Jesus talks about money over a hundred times, and about a third of his parables involve financial transactions.</div><p>Money is part of every day, so obeying Jesus includes how we use it.</p>"},{"t":"A Hard Parable and Two Worlds","s":342,"h":"<p>Commentators call this the hardest parable in the New Testament to interpret. A manager is fired, cheats to secure a new future, and the owner still praises him.</p><p>The answer is that we live in two worlds: the brutal, materialistic world before Christ, and the new kingdom we have been transferred into (Col. 1:13–14). Jesus takes lessons from the cutthroat world and applies them to our new one.</p><p>The gospel: we begin as enemies of God, Christ lives perfectly and takes God’s wrath on the cross, and all who repent and believe are given his righteousness.</p>"},{"t":"I. Know Your Place (vv. 1–2)","s":582,"h":"<p>The owner lives far away and hires a manager (an <i>oikonomos</i>) to run his property. The manager owns nothing. Everything he handles belongs to the owner.</p><div class=\"q\">“Everything belongs to God. All of it. Every dollar I have in any account, any investment — it actually does in fact belong to God.”</div><p>Andrew supports this from Ps. 24:1, Deut. 10:14 and Hag. 2:8. He also covers the abilities we use to work hard: muscles, intelligence and certifications were all given by God.</p>"},{"t":"The Chicken Illustration","s":872,"h":"<p>Imagine setting up a chicken coop, leaving for a few days, and coming back to an “egg economy” with egg casinos and egg department stores. The chickens say the eggs are theirs, but they are not. The owner made and arranged everything.</p><p>God made everything, sustains everything (Col. 1:17), and directs where every dollar goes.</p>"},{"t":"What This Truth Does for Us","s":1086,"h":"<p>If everything is God’s and we are managers, three things follow:</p><ul><li><b>It kills pride.</b> We tie money to status and want to look like winners. If it was given to us to manage, there is nothing to boast about.</li><li><b>It kills fear.</b> We are afraid of lacking money. God can give more as easily as making a sandwich, and he has already provided what we need. We can obey whatever the cost.</li><li><b>It produces responsibility.</b> Like the manager facing Friday’s meeting, we will be held accountable, and our management will be taken away. We will not manage earthly money in the new heavens and new earth.</li></ul>"},{"t":"II. Invest in Eternity (vv. 3–9)","s":1348,"h":"<p>Andrew rereads verses 3–9 and explains what is happening. The manager knows his time is up. He is too weak to dig and too proud to beg. So he cuts what the debtors owe to make friends before he is let go. The amounts are huge, like years of wages.</p><div class=\"key\">He acts shrewdly, urgently and decisively to secure his future.</div><p>The surprise is not like the prodigal son. The owner says “great job,” as if he would have done the same thing.</p>"},{"t":"Shrewd, Not Dishonest","s":1635,"h":"<p>We are to use the manager’s mindset and methods, but not his morals. Jesus is telling us to be wise, clever and aware of how urgent life is.</p><div class=\"q\">“Take the material things you have now at your disposal and invest it into eternity. He’s saying your money will in fact fail you.”</div><p>Daily pressures press us back into the present world, so the future we are investing in is hard to see.</p>"},{"t":"Believing the Promises","s":1738,"h":"<p>Andrew reads John 14:1–3 and 1 Pet. 1:3–9, and says we need to repeat God’s promises about our future so that we can obey now.</p><p>It is hard to act on a future that feels far away. He shares how he ignored advice to save for retirement in his teens, twenties and thirties. The villain is not me now, but me twenty years ago.</p><p>Believing we will be raised, and that everything will be restored, lets us invest in heaven and not just in earth.</p>"},{"t":"Where Does Wealth Go? Egyptians and Matt. 6","s":2100,"h":"<p>The Egyptians buried their gold with their kings, but the tombs were robbed and the mummies were ground up. Holding on to wealth until the end fails.</p><p>Jesus says to lay up treasure in heaven (Matt. 6:19–21).</p><div class=\"key\">“The only way to see your material investment on the other side of eternity is to place it inside the cause of Christ.”</div><p>That means gospel work, teaching, missions, discipleship and the local church. Some people will be there because you gave and sacrificed. You cannot buy your way into heaven, but you can give yourself over to heavenly purposes.</p>"},{"t":"Closing: Jim Elliot","s":2324,"h":"<p>Jim Elliot was killed by the people he went to reach. His wife and children later returned and baptized some of them.</p><div class=\"q\">“He is no fool who gives what he cannot keep to gain what he cannot lose.”</div><p>Andrew closes by asking whether we believe God’s promises of resurrection and a new heavens and new earth, then prays that we would use our money, time and talents for God’s purposes.</p>"}],"qs":["Do you think of your money as yours or as God’s? What changes in a day if it is his?","Which does knowing it all belongs to God speak to most right now: pride, fear, or responsibility? Why?","The manager acted shrewdly with the future in mind. What would it look like to be that shrewd with your money for eternity?","Why is it so hard to act on a future that feels far away? What helps you keep God’s promises in view?","Where could you invest in the cause of Christ with what he has given you: gospel work, missions, discipleship, your church?"]},{"id":"money","yt":"T5bKCaIEx9U","tab":"God & Money 2","color":"#248a3d","title":"God and Money, Part 2","meta":"Andrew Kelley · Aug 24, 2025 · Hope Chapel","ref":"Luke 16:1–13","verse":"“One who is faithful in a very little is also faithful in much, and one who is dishonest in a very little is also dishonest in much… No servant can serve two masters… You cannot serve God and money.”","big":"Your direction determines your destination. We are passing through one world to get to another, so we use money now — faithfully, wisely, generously — with eternity in view, and we worship God rather than money.","take":["Direction determines destination — we are passing through one world to get to another.","Jesus commends the manager’s foresight, not his dishonesty: leverage what you have now for the future.","Money is a test of stewardship and character (Luke 16:10).","Three wrong approaches: prosperity, poverty, passive. The right one is principled stewardship.","Generosity reveals the heart now — start small and build strength.","The greatest reward is not money but the gospel: God’s profound generosity to us in Christ.","Money competes with God for worship; in Christ you already have comfort, status, security and approval."],"scr":[["Luke 16:1–13","The parable of the dishonest manager and the call to faithfulness."],["Luke 16:10","“One who is faithful in a very little is also faithful in much.”"],["Luke 6:38","“Give, and it will be given to you.”"],["Prov. 3:9–10","Honor the Lord with your wealth; your barns will be filled."],["Mal. 3:10","“Open the windows of heaven.”"],["1 Tim. 6:17–19","Storing up treasure as a good foundation for the future."],["Luke 16:13","“You cannot serve God and money.”"],["Matt. 11:28–30","Come to me, and I will give you rest."],["Phil. 2:9–11","Christ exalted above every name."],["Rom. 8:38–39","Nothing can separate us from the love of God in Christ."]],"secs":[{"t":"Intro: Direction Determines Destination","s":146,"h":"<p>Andrew’s illustration: following the wrong church steeple in Germany ended in the wrong place.</p><div class=\"key\">“Your direction determines your destination. We are passing through one world to get to another.”</div><p>Jesus’s parable reorients us to live now with eternity in view.</p>"},{"t":"I. The Dishonest Manager (vv. 1–8)","s":310,"h":"<p>The manager wasted resources, faced dismissal, and acted shrewdly to prepare for his future. Jesus commended his <i>foresight</i>, not his dishonesty.</p><div class=\"q\">“He’s leveraging everything he has in the present for the future.”</div><p><b>Application:</b> Christians must leverage resources now with eternity in mind.</p>"},{"t":"II. Faithfulness and Money as a Test (vv. 10–12)","s":454,"h":"<p>Luke 16:10: faithful in little, faithful in much. Money is a test of stewardship and character. Three wrong approaches:</p><ul><li><b>Prosperity</b> — equates wealth with God’s love. <i>“How much money you have does not tell you how much God loves you.”</i></li><li><b>Poverty</b> — sees money itself as evil. <i>“Money is not evil, but it is dangerous — like a power tool.”</i></li><li><b>Passive</b> — avoiding responsibility. <i>“Young men, do not waste your 20s. You are called to work, to provide, to be generous.”</i></li></ul><p>The right approach: <b>principled stewardship</b> — wise, honest, generous, Christ-centered.</p>"},{"t":"III. Generosity Reveals the Heart","s":1279,"h":"<div class=\"key\">“What we do with our money reveals us right now.”</div><p>Weightlifting: start small, build strength. <i>“Saying I’ll be generous when I have more is like saying I’ll lift heavy weights when I have bigger muscles.”</i> Faithfulness with little prepares you for greater generosity later.</p>"},{"t":"IV. The Rewards of Faithful Generosity","s":1391,"h":"<p>Rewards in this life and the next: Luke 6:38; Prov. 3:9–10; Mal. 3:10; 1 Tim. 6:17–19. <i>“When we’re generous now, it is in some way credited to us in the resurrection.”</i></p><div class=\"key\">“The greatest reward is not money. The greatest reward is the gospel — that God has been profoundly generous with us in Christ.”</div>"},{"t":"V. Who Do You Worship? (v. 13)","s":1815,"h":"<p>“You cannot serve God and money.” Money competes with God for worship.</p><div class=\"q\">“We throw money at the altar of comfort, status, security, approval. But in Christ you already have comfort, status, security, and approval.”</div>"},{"t":"Conclusion: Living with Eternal Perspective","s":2371,"h":"<p>Reminders from Scripture: Christ gives rest (Matt. 11:28–30); Christ is exalted (Phil. 2:9–11); nothing separates us from God’s love (Rom. 8:38–39).</p><div class=\"key\">“We don’t have to worship other gods. We can use our money to worship the one true God.”</div>"}],"qs":["Which direction is your use of money pointing you — toward the destination you want?","Which wrong approach to money do you lean toward: prosperity, poverty, or passive? What would principled stewardship look like?","What does your giving and spending reveal about your heart right now?","What is one small, faithful step of generosity you could take now rather than waiting until you have more?","What “altar” do you throw money at — comfort, status, security, approval? What does Christ already give you in its place?"]},{"id":"judgment","yt":"gB2YOSj45dQ","tab":"Judgment","color":"#636a78","title":"When Judgment Comes","meta":"Mike Nazarian · May 10, 2026 · Hope Chapel","ref":"Luke 21:20–24","verse":"“But when you see Jerusalem surrounded by armies, then know that its desolation has come near. Then let those who are in Judea flee to the mountains… Alas for women who are pregnant and for those who are nursing infants in those days!… Jerusalem will be trampled underfoot by the Gentiles, until the times of the Gentiles are fulfilled.”","big":"Because Jesus sees clearly, warns faithfully, and grieves sincerely, we can trust even his hardest words — and must flee to him as our only true refuge when judgment comes.","take":["Jesus made a precise, historically falsifiable prediction about Jerusalem’s fall — and history confirmed it forty years later.","AD 70 was God keeping every covenant warning he had issued through the prophets.","God’s judgment flows from his holiness — a perfectly good God cannot let rebellion go unanswered forever.","Christians who survived the siege trusted Jesus’s words over their own instincts and culture.","Jesus not only warned of judgment — he absorbed the greater judgment on the cross, becoming the one true refuge.","Whatever walls we trust for safety before the final judgment will not hold; only Christ will."],"scr":[["Luke 21:20–24","Jerusalem surrounded; flee; “alas”; trampled until the times of the Gentiles are fulfilled."],["Isa. 34:8","“The Lord has a day of vengeance, a year of recompense for the cause of Zion.”"],["Isa. 6:3","“Holy, holy, holy is the Lord of hosts.”"]],"secs":[{"t":"Opening: An Unexpected Mother’s Day Text","s":1,"h":"<p>On Mother’s Day the series lands on judgment — yet in the middle of it Jesus pauses to grieve for mothers. Many churches quietly turn the page on passages like this; faithfulness means opening ourselves to the sharper edges of his word.</p><div class=\"q\">“If we are going to be faithful to Jesus, then we can’t pretend to be his editors. We have to be his disciples.”</div><p><i>“The gospel is still good news. It’s good news in this text and it is good news today.”</i></p>"},{"t":"1. Jesus Saw Judgment Coming","s":267,"h":"<p>Verses 10–19 described broad upheaval; now Jesus narrows to a specific city, sign, and people — a <b>precise, falsifiable prediction.</b> The sign: Jerusalem surrounded by armies. Matthew and Mark use “abomination of desolation” for Jewish readers; Luke decodes it for Gentiles. “Desolation” means destruction where there was construction, death where there was life.</p><p>Greek: “surrounded” is a present participle — already unfolding. “Know” is an imperative.</p><div class=\"q\">“He says when you see, know. And the implication is move. When you see it, know it, move it.”</div><p><b>Three commands (v. 21):</b> those in Judea flee; those inside the city get out; those outside don’t enter. The third was counterintuitive — the very thing they think will save them will bury them.</p><p><b>History vindicates.</b> Josephus: false prophets told people to take refuge in the temple; thousands flooded in and Rome burned them. Eusebius: the Christians fled to Pella east of the Jordan — the route Jesus described.</p><div class=\"key\">“They survived because they trusted God’s Son and not their own instincts, their own intuitions, their own culture.”</div>"},{"t":"What It Meant: Days of Vengeance","s":1010,"h":"<p>Verse 22: “days of vengeance, to fulfill all that is written” — covenant judgment language (Isa. 34:8). For centuries God sent prophet after prophet; now Israel has rejected not another prophet but God’s Son. Jesus draws a line from Moses through the prophets: “it’s all landing right here, right now, on this city, in this generation.”</p><p>The passage is ultimately about the terrifying reliability of the God who means what he says — “All that is written. Not some. Not most. All.” If Jesus could speak with such precision about AD 70, he sees clearly, including into your future.</p>"},{"t":"2. Jesus Saw Straight Through It: “Alas”","s":1520,"h":"<p>Verse 23: <i>ouai</i> — a cry of grief. Jesus grieves not for the city or temple but for <b>mothers and nursing infants.</b> “This cry is not the cry of a cold, distant, indifferent judge. It is the cry of a savior.”</p><p><b>Isn’t this cruel?</b> Mike answers: not cruelty — holiness. If judgment feels harsh, the problem is that we’ve lost sight of God’s holiness (Isa. 6:3 — the threefold superlative).</p><div class=\"q\">“Why does a good God punish human sin? Because he’s good. He loves goodness. And he hates what is evil. Because he is good, he is just.”</div><p>Verse 24 names sword, captivity, exile; Josephus records over a million dead and nearly a hundred thousand taken captive.</p>"},{"t":"Hard Words for Every Generation","s":2120,"h":"<p>Some want a Jesus who speaks only of love and peace. He is all that — but also the Jesus of Luke 21, who still calls us away from what we think will save us. Hard words he still speaks: flee sexual immorality; forgive as I have forgiven you; unless you repent you will all likewise perish.</p><div class=\"key\">“He gives us hard words because he wants to rescue us. He wants to rescue us from ourselves. He wants to rescue us from the wrath that is to come.”</div>"},{"t":"Jesus Saw the Other Side","s":2405,"h":"<p>Verse 24 ends with a hinge: <b>until.</b> Two horizons run through Luke 21 — the near (AD 70, fulfilled) and the far (final consummation). The age of the Gentiles is when the gospel goes to every tongue, tribe and nation; it will close, and then comes the Son of Man in a cloud with power and great glory.</p><div class=\"q\">“He sees through the near horizon. He sees through the judgment to come. And what he sees at the end is himself.”</div>"},{"t":"Closing: He Walked Into It for Us","s":2776,"h":"<p>Within days of these words Jesus walked straight into judgment on a cross. The wrath that fell on Jerusalem was a whisper beside what fell on him at Calvary — absorbed as our substitute, “nothing left over to spill out onto us.” We’re called to trust not only his word but his work.</p><div class=\"key\">“The cross is not our warning. Jesus gave a warning, but then he went to the cross. The cross is our rescue.”</div><p>The invitation is the same Jesus gave Jerusalem: when judgment is coming, flee — now to him, the true and better refuge.</p><div class=\"q\">“The people who survived Jerusalem were not the people with the strongest walls. They were the people who trusted Jesus… Your walls will not hold and neither will mine. Only Jesus will hold.”</div>"}],"qs":["Mike says many churches turn the page on hard passages about judgment. Why is judgment so uncomfortable, and what might we lose by avoiding it?","The Christians who survived trusted Jesus’s words over their instincts and culture. Where is Jesus calling you toward something counterintuitive or countercultural?","How does understanding God’s holiness change how you think about his judgment?","What does centuries of patient covenant warning tell you about God’s character, and about how you hear his warnings today?","Jesus cried “Alas” in grief even as he pronounced judgment. What does grief and judgment together reveal about his heart?","What “walls” are you tempted to hide behind when you think about standing before God — your record, effort, decency?","Is there a hard word from Jesus you’ve been avoiding or softening? What would it look like to trust it?","Spend a moment on the cross as the place where the greater wrath fell so none would fall on us. What does it stir in you?"]},{"id":"hab1","yt":"zO3w1CG_NQA","tab":"Habakkuk 1","color":"#0a7f6e","title":"Faith When We Don’t Understand","meta":"Mike Nazarian · Oct 11, 2026 · Hope Chapel","ref":"Habakkuk 1:1–11","verse":"“O Lord, how long shall I cry for help, and you will not hear? Or cry to you ‘Violence!’ and you will not save? Why do you make me see iniquity, and why do you idly look at wrong?… Look among the nations, and see; wonder and be astounded. For I am doing a work in your days that you would not believe if told.”","big":"Faith means trusting the character of God when we don’t understand the ways of God: evil strikes close to home, God can seem painfully silent, yet he is always at work — often in ways we would never expect — and the cross proves he does not ignore evil.","take":["New series, <i>Faith When We Don’t Understand</i>, through the short three-chapter book of Habakkuk. Unlike most prophets, Habakkuk speaks to God for the people (and for himself).","Point 1 — Evil often strikes close to home. Habakkuk is grieved by violence, strife, a paralyzed law and perverted justice among God’s own covenant people.","Point 2 — God can seem painfully silent when evil strikes. Habakkuk’s “How long?” is a <b>lament</b>: faith that speaks honestly when it doesn’t totally understand. God welcomes it, and he was listening all along.","Point 3 — God is always at work, often in ways we would never expect. He answers every complaint, but with a surprise: he is raising up the Babylonians.","We live “a thousand miles per hour,” so one small frame becomes the whole story. Habakkuk tells us to look up: God is steering the nations — and our lives.","At the cross it looked like evil had won, when God was achieving his greatest victory. The cross shows God deals with evil “out there” — and with the evil in us, when Jesus bore our judgment."],"scr":[["Hab. 1:1–11","Habakkuk’s complaint (vv. 2–4) and the Lord’s answer (vv. 5–11)."],["Hab. 1:5–6","“Look among the nations and see… I am raising up the Chaldeans.”"],["Ps. 22:1","Jesus’ cry from the cross, “My God, my God, why have you forsaken me?”"],["2 Kings 23:36–37","The king who did evil in Judah after Josiah."],["Ps. 13:1–2","“How long, O Lord?” — honest lament."],["Isa. 55:8–9","God’s ways and thoughts are higher than ours."],["Gen. 50:20; Isa. 10:5–7; Acts 2:23","God’s sovereignty and human responsibility."],["Rom. 8:28; 2 Pet. 3:9","God works for good; patience toward sinners."],["Acts 13:38–41","Paul uses Habakkuk 1:5 to preach Christ."]],"secs":[{"t":"Welcome to Habakkuk","s":0,"h":"<p>A brief journey through one of the shortest Old Testament books (pronounced “Habakkuk”), a minor prophet — not less important, just short — between Nahum and Zephaniah.</p><p>Most prophets speak to the people <i>for God</i>. Habakkuk speaks <i>to God</i> for the people and himself. He looks at a culture that doesn’t make sense to him and asks what many of us ask: <i>God, where are you? Why is this happening? Why aren’t you doing anything about the evil I see?</i></p><div class=\"key\">Habakkuk shows what it looks like to trust the character of God when we don’t fully understand the ways of God.</div>"},{"t":"Getting Our Bearings: The Big Story","s":281,"h":"<p>The Bible is God’s story from creation to new creation: <b>creation, fall, redemption, new creation</b>. God promises redemption right after the fall; that plan runs through Israel to Jesus, who establishes the kingdom, gives way to the church age where we live now, and will return to make all things new.</p><p><b>Israel in a nutshell:</b> Abraham → Isaac → Jacob (Israel) and 12 tribes → Egypt → Moses and the wilderness → the promised land and judges → Saul (fails) → David (promise of an everlasting throne) → Solomon (wise, then foolish) → the kingdom splits into Israel (north) and Judah (south), both sliding into idolatry.</p><p><b>722 BC:</b> Assyria conquers and scatters the north. <b>136 years later:</b> Babylon sacks Jerusalem and exiles Judah. Habakkuk is sandwiched in between.</p><p><b>Just before he writes:</b> good King Josiah leads reform; the temple is repaired and the lost book of the law is rediscovered and read aloud; Josiah tears his garments and calls the nation to repent — a brief renewal. Then Josiah dies, a wicked son takes the throne, and Judah backslides. Meanwhile the world churns: Assyria is collapsing, Egypt presses from the south, Babylon is rising.</p><p>But Habakkuk’s greatest concern isn’t out there — it’s what is happening at home.</p>"},{"t":"I. Evil Often Strikes Close to Home (vv. 3–4)","s":755,"h":"<p>Habakkuk says <b>“before me”</b> — not distant evil, but evil up close, among people in covenant with the God who delivered and provided for them. Notice how it spreads outward and intensifies:</p><ul><li><b>Destruction and violence</b> — open abuse and murder in plain view.</li><li><b>Strife and contention</b> — people exploit and murder each other, so they divide, grow hostile and suspicious; families, friendships and neighborhoods fracture; trust erodes.</li><li><b>The law is paralyzed</b> — “Torah,” God’s own instruction. Rediscovered under Josiah, now buried again; no longer governing or shaping the culture.</li><li><b>Justice goes forth perverted</b> — it doesn’t vanish, it comes out crooked: the very thing meant to correct wrong produces a worse result.</li></ul><div class=\"key\">This is what happens when any culture pushes God to the margins — says to its Creator, “You are no longer welcome here.”</div><p>Evil far away we can acknowledge without feeling it. It’s different when someone you trust looks you in the eye and lies, a friend betrays you, a leader abuses power, or a brother or sister in Christ sins against you — or when you watch your city, state or nation descend into corruption and folly. That grieves us differently because it hits close to home. But for Habakkuk, that is only half the problem.</p>"},{"t":"II. God Can Seem Painfully Silent (vv. 1–2)","s":1273,"h":"<p>From where Habakkuk stands, God seems to be standing by. What do we do when God seems silent? Can we still trust him when we don’t understand?</p><ul><li><b>“How long?”</b> — not his first prayer; he’s been crying out a long time.</li><li><b>“You will not hear”</b> — in Hebrew poetry, for God to “hear” is to recognize <i>and act</i>. “Your refusal to act is speaking louder than any other voice.”</li><li><b>“Violence!” … “you will not save”</b> — like witnessing a violent crime on a walk and shouting, “Somebody do something!” He doesn’t want an explanation; he wants an <i>intervention</i>.</li><li><b>“Why do you make me see?”</b> — I see it, you see it, I can’t do anything, you can do everything, yet you idly look on.</li></ul><p><b>Even so, he is still talking to God.</b> God’s answer — twice the length of the complaint — shows he was listening. Frustrated, angry, hurting, confused, Habakkuk is still praying. This is <b>lament: faith that speaks honestly when it doesn’t totally understand.</b></p><div class=\"key\">God is not offended by your lament; he welcomes it. You can come to him precisely because you don’t understand — and he has given us words in Scripture when ours fail.</div><p><b>Jesus himself prayed lament</b> on the cross: “My God, my God, why have you forsaken me?” (from Psalm 22) — evil not only at the doorstep but breaking through the front door. And at the cross it looked like evil had won, when God had just defeated it.</p><div class=\"q\">“Sometimes God is doing his greatest work when it looks like he is doing no
