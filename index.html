r the Son from heaven; gathered to him."],["Rev. 22:20","“Yes, I am coming soon. Amen. Come, Lord Jesus.”"],["Luke 12:39–40","The thief comes at an hour you don’t expect."],["Gal. 5:19–21","Acts of the sinful nature — those who live this way won’t inherit the kingdom."],["Eph. 5:18","“Do not get drunk on wine… Instead, be filled with the Spirit.”"],["Matt. 6:25, 31–34","“Do not worry about your life… seek first his kingdom.”"],["Phil. 4:4–7","Do not be anxious about anything; the peace of God will guard your hearts."],["Matt. 9","The crowds, harassed and helpless like sheep without a shepherd."],["Col. 1:21–23","Presented holy “if you continue in your faith.”"],["Heb. 3:6, 14","We share in Christ if we hold firmly to the end."]],"secs":[{"t":"Opening: Christmas and the Return of Christ","h":"<p>What is Christmas really about? The birth of Jesus — buried under shopping, Santa, and office parties. The world will embrace an infant in a manger but has no tolerance for the same Jesus returning in power, glory and judgment.</p><div class=\"q\">“The world is eager to embrace an infant in a manger… But the world has no tolerance whatsoever for a sovereign Lord coming back in power, glory, and judgment.”</div><p>Revelation 18:21–23 paints what his return means for the world’s systems and celebrations — no more partying. Jesus came the first time in humility to save sinners; he returns in the full display of his deity to judge, and finally to populate heaven and hell.</p>"},{"t":"Jesus’s Return Is Imminent","h":"<p>After weeks in the Olivet Discourse: Jesus described signs but withheld the <i>when</i>. Instead of a date, he gave a command: <b>be ready.</b></p><p>Zac leans pre-tribulation: no signs precede the rapture, just Christ’s sudden appearance. It’s the very next event on Jesus’s calendar — it could happen right now. <i>“It’s my great dream to be raptured while I’m preaching, not while I’m doing stupid stuff.”</i></p><p>Support: believers eagerly waiting (Rom. 1:7; 1 Thess. 1:10; 2 Thess. 2:1) and Jesus’s three “I am coming soon” in Revelation 22. John’s response is the church’s: <b>“Come, Lord Jesus.”</b></p>"},{"t":"Be Dressed and Ready: Live with Expectation","h":"<p>Zac grew up watching Disneyland on TV each Wednesday as his dad promised “We’re going to Disneyland” — constant buzzing anticipation. That is the posture toward Christ’s return.</p><div class=\"q\">“I can hardly wait. I can hardly wait. But I know I must wait — and I’m going to wait with a sense of expectation.”</div><p>Test yourself: am I careful, on my guard? A thief gives no warning (Luke 12:39–40). Like Noah’s and Lot’s days, people were eating, drinking, buying, selling, planting, building — until judgment fell.</p>"},{"t":"Don’t Let Your Heart Be Weighed Down","h":"<p><b>Dissipation</b> — immorality, corruption, self-indulgence, sensuality, debauchery. Galatians 5:19–21 lists the marks of those who won’t inherit the kingdom; claiming Jesus while living this way doesn’t make you a Christian.</p><p><b>Drunkenness</b> — Zac refuses to soften it: “We call it the disease of alcoholism. I’m just telling you what the Bible says — it’s sin.” The alternative isn’t moderation but a different fullness (Eph. 5:18).</p><div class=\"q\">“I want to get high on God… Can he fill you with joy and peace and just everything your heart desires?”</div><p><b>Anxiety</b> — worry isn’t just understandable; Jesus commands us not to (Matt. 6). If God has a good, pleasing, perfect plan, why worry? Paul’s remedy (Phil. 4:4–7): God’s peace guards heart and mind. <i>“You find yourself finally exhaling.”</i></p>"},{"t":"Compelled to Warn Others","h":"<p>Readiness has an outward edge. If you understand what’s coming, how can you stay silent toward people you care about? If their house were on fire, you’d bang on the door.</p><p>Matthew 9: the crowds are harassed and helpless; believers are the ones sent. The Great Commission isn’t the Great Suggestion. God takes no pleasure in the death of the wicked, and effective evangelism can hasten Christ’s coming.</p><div class=\"q\">“I would sooner bring one sinner to Jesus Christ than to unravel all the mysteries of the divine word.” <cite>— Charles Spurgeon</cite></div><p><b>Zac’s testimony:</b> he filled his life with education, money, cars — and knew something was missing. Friends shared their testimony at his lowest point and he said, “I need Jesus in my life. Jesus never fails.”</p>"},{"t":"Three Habits for Everyday Evangelism","h":"<p>Zac’s challenge: thirty days of intentional evangelism.</p><ul><li><b>1. Pray daily</b> — for open doors, boldness (“make me bold — you know how timid I am”), divine appointments. God convicts and converts; our job is to sow seeds. <i>“You will amaze yourself.”</i></li><li><b>2. Keep a prayer list</b> — three to five names of people who don’t know Jesus. About 75% of Christians came to faith through a friend or relative. <i>“Awkward conversations change lives.”</i></li><li><b>3. Spend time with non-believing friends</b> — the longer people are Christians, the fewer non-believing friends they have. Jesus ate with tax collectors and sinners. Hospitality: budget for it; “people are disarmed around food.”</li></ul><p>His dream: every member of Hope Chapel leads one person to Christ and begins discipling them.</p>"},{"t":"Closing: Persevere to the End","h":"<p>Luke 21:36 commands watching and praying. Two promises to those who persevere: they will escape the coming judgments (Zac applies this to the raptured church) and they will stand before the Son of Man — approved, not ashamed.</p><div class=\"key\">Col. 1:21–23 and Heb. 3:6, 14: held “if you continue in your faith.” — “I know who I am and I know whose I am.”</div><p>The goal: to hear “Well done, good and faithful servant.” <i>He’s coming back. Be faithful. He is faithful. Stand firm.</i></p>"}],"qs":["The world welcomes the baby in the manger but resists the returning King. Where do you feel pressure to soften the second coming?","Do you live with the Disneyland-on-Wednesday kind of expectation for Christ’s return? What would raise it?","Of dissipation, drunkenness and anxiety, which weighs your heart down most right now? What is the “filled with the Spirit” alternative?","Jesus commands us not to worry. What do you do with worry that you’ve been calling “being responsible”?","Who are three to five people you could put on a prayer list this week?","Where could you spend regular time with a non-believing friend — and what meal could you host?"]},{"id":"king","tab":"King Betrayed","color":"#7a1f3d","title":"The King Is Betrayed","meta":"Mike Nazarian · Jun 7, 2026 · Hope Chapel","ref":"Luke 21:37–22:6","verse":"“Then Satan entered into Judas called Iscariot, who was of the number of the twelve. He went away and conferred with the chief priests and officers how he might betray him to them. And they were glad, and agreed to give him money. So he consented and sought an opportunity to betray him to them in the absence of a crowd.”","big":"Betrayal never begins in the garden — it begins with a heart that slowly shifts loyalty through small, unconfessed compromises; but the King who was betrayed is the King who forgives everyone who falls toward him.","take":["Even with the cross looming, Jesus refused to hide: “A good king doesn’t hide.”","The crowds’ hunger for Jesus was the door his enemies couldn’t open.","Satan didn’t pick the lock on Judas — Judas handed him the key through years of quiet compromise with money.","Satan doesn’t need your worst sin, just your small, regular one. Small compromises never announce their destination.","Remorse and repentance are not the same. The difference between Peter and Judas was the direction of the fall.","When the weight of your sin hits, fall toward Jesus."],"scr":[["Luke 4:13","The devil departed “until an opportune time.”"],["James 4:7","Submit to God. Resist the devil, and he will flee."],["Eph. 4:27","“Give no opportunity to the devil.” (The word means “place.”)"],["John 12:6","Judas “used to help himself” to the moneybag."],["Matt. 27:3–5","Judas’s remorse and death."],["Luke 23:34","“Father, forgive them, for they know not what they do.”"]],"secs":[{"t":"Opening: Betrayal Begins Long Before","h":"<p>Every betrayal begins long before the betrayal itself. The kiss didn’t begin in the garden. It begins with a heart that has slowly shifted loyalty — a compromise here, a door left open — until the unthinkable becomes possible.</p><div class=\"q\">“Betrayal always begins with a heart that has very slowly shifted its loyalty. It doesn’t happen all at once.”</div><p>Luke wants us to see how a heart can shift until it can betray a very good king. (Note the unfortunate chapter break — read 21:37–22:6 together.) Luke’s kingship theme builds to Passion Week: Jesus is the true king, fulfilling every promise to David — and before he reigns he must suffer and die, to open his kingdom to sinners.</p>"},{"t":"The King Won’t Hide; The People Won’t Leave","h":"<p><b>The king won’t hide (v. 37).</b> Last week, cross looming, vultures circling — every instinct says lower your profile. Luke’s grammar stresses a settled daily pattern: Jesus walked back into the temple, the most public place in the most crowded city, to be present for the people.</p><div class=\"key\">“A good king doesn’t hide.”</div><p><b>The people won’t leave (v. 38).</b> At the crack of dawn all the people came to him. <i>“The people have set their alarms for Jesus.”</i> When was the last time you were hungry to wake up early and meet with Jesus? If you wake up early, he’s already waiting.</p>"},{"t":"The Leaders Can’t Get to Him","h":"<p>Luke names Passover — redemption through blood, a substitute dying so others live. History moves on two planes: human action below, God’s sovereignty above. The leaders plot; God is setting the table.</p><p><b>The decision is made.</b> They sought <i>how</i> to kill him, not whether. <i>“If you reject God’s truth long enough, you’re not going to just grow neutral to it. You’re going to grow hostile to it.”</i> The clearer Jesus becomes, the harder it is to stay undecided. Where are you at with Jesus today?</p><p><b>The door won’t move.</b> The most powerful men in Jerusalem feared the people. They had the will but not the way.</p><div class=\"key\">“The door that is protecting Jesus is not made of iron. It is made of hunger.”</div>"},{"t":"Satan Finds the Key","h":"<p>“Then Satan entered into Judas.” Not a Hollywood possession — Luke stacks verbs: Judas <i>goes, confers, consents, bargains, seeks.</i> “Those are not the actions of a man who has lost his mind. Those are the actions of a man who has made up his mind.” Judas yielded; he didn’t resist (James 4:7).</p><p>Rewind to Luke 4:13 — after the wilderness Satan left “until an opportune time.” Eighteen chapters later, it has come.</p><div class=\"q\">“Satan is real and he is never in a hurry. He is patient and calculating and he never wastes his moves.”</div><p>Judas was “of the number of the twelve,” handpicked, trusted with the purse, present for every miracle.</p><div class=\"key\">“Satan did not pick the lock — Judas handed him the key.”</div><p>John tells us Judas was a quiet thief — a shekel here, a shekel there. <i>“He does not need a wide-open door in your life… He does not need your worst sin. He just needs your small, regular one.”</i> The Bible says give him no <i>place</i> (Eph. 4:27).</p><p><b>“Small compromises never announce their final destination.”</b> What place have you given him — a secret lust, love of money, bitterness, unforgiveness, deception, an addiction you’ve stopped fighting? Don’t hide it; confess it to someone (elders are available to pray). “Sin thrives in the darkness… the light is the best chemotherapy, spiritually speaking.” The Savior who forgives your sin also breaks its power.</p>"},{"t":"Judas Betrays Jesus","h":"<p>Judas goes, confers with the chief priests and officers, and they were <i>glad</i> — a gospel word (angels rejoice over one sinner who repents) hijacked for treachery. A price is agreed; the king is sold. Judas seeks an opportunity “in the absence of a crowd” — he alone knows where Jesus sleeps and where to find him when the people aren’t there as his shield.</p><div class=\"q\">“The people are hungry for Jesus. The leaders are hungry for blood. Judas is hungry for money, and Satan is hungry for glory. And when all those hungers collide, the king is betrayed.”</div>"},{"t":"Closing: Which Direction Do You Fall?","h":"<p>It’s tempting to look at Judas with contempt. But every one of us has chosen something over Jesus — a relationship, reputation, secret, habit. Maybe not thirty pieces of silver, but something.</p><p>When the weight hit Judas he felt it (Matt. 27:3–5). <b>Remorse and repentance are not the same.</b> His greater tragedy was believing there was no way back — a small view of Jesus. The cross covers every sin that nailed him there (Luke 23:34); many who cried “Crucify him” were saved at Pentecost.</p><p>Peter did essentially the same — denied Jesus three times with curses and wept bitterly. He couldn’t immediately run back, but he didn’t run away; when he heard the tomb was empty, he ran toward it, and Jesus restored him.</p><div class=\"key\">“The difference between Peter and Judas is not the greatness of the sin, but the direction of the fall. Peter fell towards Jesus, and Judas fell away from him.”</div><p>Do you run to yourself, the world, beating yourself up — or fall into the arms of Jesus? <b>“The king who was betrayed is the king who forgives. He did it for Peter. He will do it for you.”</b></p>"}],"qs":["Mike says betrayal begins with a heart that slowly shifts loyalty. Where have you noticed small compromises or “doors left slightly open”?","The crowds “set their alarms for Jesus.” When were you last that hungry to meet with him? What would rekindle it?","The leaders saw Jesus’s teaching, compassion and miracles — and grew hostile, not neutral. Why does knowing more about Jesus force a decision? Where are you at with him?","What’s the difference between Satan “picking the lock” and Judas “handing him the key”? How does it change how you think about temptation and responsibility?","What “place” might you be giving the enemy — a small, regular sin you think you can manage? What would bringing it into the light this week look like?","Why are remorse and repentance not the same? How do Judas and Peter illustrate the difference?","“The difference between Peter and Judas is the direction of the fall.” When your sin’s weight hits, which direction do you tend to fall?","How does “the king who was betrayed is the king who forgives” change how you approach Jesus after failure?"]},{"id":"arrest","tab":"The Arrest","color":"#4a5a1f","title":"The Arrest","meta":"Andrew Kelley · Jul 19, 2026 · Hope Chapel","ref":"Luke 22:47–53","verse":"“While he was still speaking, there came a crowd, and the man called Judas, one of the twelve, was leading them. He drew near to Jesus to kiss him, but Jesus said to him, ‘Judas, would you betray the Son of Man with a kiss?’… But Jesus said, ‘No more of this!’ And he touched his ear and healed him… ‘But this is your hour, and the power of darkness.’”","big":"Three people, three choices — a kiss, a sword, and a cup. Judas rejected God’s plan, Peter misunderstood it, Jesus accomplished it. No one can stay indifferent to Jesus; not to choose is to choose.","take":["We love having options but resist making a choice — yet Scripture won’t let us stay undecided about Jesus.","Judas had theological knowledge, religious reputation, proximity to holiness and outward obedience — none of it was trust.","“The problem with Judas was not lack of trying. It was lack of trusting.”","Peter’s faith faltered but did not fail; Judas’s failed. Peter was restored.","Jesus was in complete control and genuinely innocent — he drank the cup willingly.","“The innocent goes to the cross because the guilty cannot.”"],"scr":[["John 6:64","Jesus knew from the beginning who would betray him."],["James 2:18–19","Even the demons believe — and shudder."],["Luke 6:16; Eph. 2:19–20; Rev. 21:14","Judas’s title among the twelve — and the foundation of the church."],["John 12:4–6","Judas “was a thief, and having charge of the moneybag he used to help himself.”"],["Luke 9:22","Jesus had already told them what would happen."],["Ps. 27:14; James 5:7–8; Isa. 30:15","Wait for the Lord; in quietness and trust is your strength."],["Matt. 26:53","“More than twelve legions of angels.”"],["Luke 22:52–53","“You came at night… this is your hour.”"]],"secs":[{"t":"Intro: Too Many Options, Only One Choice","h":"<p>The sermon opens at 7-Eleven: a son frozen trying to pick one treat from too many options — choice paralysis, tears, no snack. We love options; we resist choosing. We’re near the end of Luke; Jesus’s ministry is over and this is his last free moment before the cross. Last week: his humanity in the garden (“not my will but yours be done”).</p><p><b>Pressure cooker:</b> first-century Jerusalem — competing Jewish factions, a population swollen tenfold for Passover, a brutal Roman occupation, and a carpenter’s son making divine claims and working miracles. Everyone who meets Jesus must respond.</p><div class=\"key\">“We cannot be indifferent to the person of Jesus… to not make a choice is also to actually make a choice.” A kiss, a sword, a cup. Judas rejected God’s plan; Peter misunderstood it; Jesus accomplished it.</div>"},{"t":"I. The Kiss — Judas’s Hypocrisy (vv. 47–48)","h":"<p>A kiss was a sign of honor; Judas weaponizes it. He was handpicked and present for every miracle — in body but never in spirit. Four things were true of him, each able to masquerade as saving faith:</p><ul><li><b>Theological knowledge.</b> Taught by Jesus himself — but it went to his head, not his heart (James 2:18–19). Knowledge is the beginning of faith, not the end.</li><li><b>Religious reputation.</b> One of the Twelve, a foundation of the church — but an unexercised title is empty. Luke 6:16 already flags him: “who became a traitor.”</li><li><b>Proximity to holiness.</b> He watched Jesus heal, calm storms, raise the dead. Nearness is not union. <i>“You will not survive on the faith of your parents… your spouse or friends… There is only one advocate, and you must know him.”</i></li><li><b>Outward obedience.</b> He objected to the anointing: “Why was this ointment not sold… and given to the poor?” — but he was a thief (John 12:6). A pious persona hid a private god: money.</li></ul><div class=\"key\">“The problem with Judas was not lack of trying. It was lack of trusting.” See yourself in Judas; the only thing separating us is the mercy of God.</div><p>When Judas arrives Jesus doesn’t rage — he asks a question: “Judas, would you betray the Son of Man with a kiss?”</p>"},{"t":"II. The Sword — Peter’s Self-Sufficiency (vv. 49–51)","h":"<p>All four Gospels tell it; only John (writing after Peter’s death) names him.</p><ul><li><b>Initiative over dependence.</b> Peter swings before Jesus answers, though Jesus had plainly said what would happen (Luke 9:22).</li><li><b>Impatient action over patient waiting.</b> Action isn’t the problem; running ahead of God’s plan is (Ps. 27:14; James 5:7–8; Isa. 30:15).</li><li><b>Force over faith.</b> <i>“It’s much easier to be a crusader than it is to be a martyr… No one has ever had a genuine conversion at the end of a gun or the edge of a sword. If we use violence to promote Christianity, we don’t make converts, we make victims.”</i></li></ul><p>With unsaved loved ones: speak truth, but trust God — not manipulation or force — to save them.</p><div class=\"key\">“Judas chose a kiss. Peter chose a sword. Whereas Judas’s faith failed, Peter’s faltered, but it did not fail. At the end of his self-sufficiency, he’s met by Christ who restores him.”</div>"},{"t":"III. The Cup — Jesus’s Self-Sacrifice (vv. 52–53)","h":"<ul><li><b>Complete control.</b> Not a victim; he could stop it at any moment (Matt. 26:53 — twelve legions of angels). He heals the ear his disciple just severed — mercy toward those arresting him.</li><li><b>Genuinely innocent.</b> They come with swords and clubs, at night, as against a robber (an insurrectionist — the term used of Barabbas and the men crucified beside him) when he taught publicly day after day. Rome crucified perceived threats to power, not religious teachers. The cover of night exposes the pretense. <i>None of us are innocent. He actually is.</i></li></ul>"},{"t":"The Gospel — Why the Cup Was Necessary","h":"<ul><li><b>Bad news:</b> by nature we are enemies of God (“all have sinned”; “no one does good, not even one”). Because God is just, he must deal with sin — the byproduct of his justice is wrath.</li><li><b>Good news:</b> God became man, lived sinlessly, carried no sin of his own. At the cross God’s wrath is poured out on the Son — fully man to pay, fully God to endure and exhaust it.</li><li><b>The verdict:</b> all who call on him in faith and repentance are granted his righteousness. “It cost him his life. It cost you nothing.”</li></ul><div class=\"key\">“The innocent goes to the cross because the guilty cannot. There was no one that was able. No friend, no family member… Just the one.”</div><p>You can’t look at Jesus in the garden, think “great story, I want to be more like Jesus,” and move on. <b>You have to decide.</b> “The anxiety you feel in response to God’s word is a mercy… Today is the day of salvation.”</p>"}],"qs":["What stuck with you most from this sermon? Was there anything you heard for the first time, or that challenged you?","Judas was handpicked and saw everything the other apostles saw, yet Jesus knew from the beginning he would betray him. What makes Judas such a sobering warning for people who have spent years around Jesus and his church? (Look at: John 6:64)","Belief is the beginning of faith, not the end; even demons believe and shudder. What does it look like when theology has actually penetrated someone’s heart and not just their head? (Look at: James 2:18–19)","Judas had the best teacher and best title, yet Scripture remembers him as the one “who became a traitor.” Why is it dangerous to rest on titles and reputation? How ought we live out the title of Christian? (Look at: Luke 6:16; Ephesians 2:19–21)","Judas’s problem was not lack of trying but lack of trusting. What do people trust for security instead of God, and when have you seen one let someone — yourself — down? (Look at: John 12:4–6)","Peter swings before waiting for an answer, though Jesus had told them God’s plan again and again. Why do we so often default to our own initiative rather than depending on God?","When have you acted before you had really prayed something through, and what happened? (Look at: Psalm 27:14; James 5:7–8; Isaiah 30:15)","It is easier to be a crusader than a martyr. How does trusting that God alone converts hearts change how we talk about Jesus with people in our lives?","Jesus is in control and innocent, yet courageously calls out the cowardice of men who came at night and willingly goes with them. How does he redefine courage? (Look at: Matthew 26:53; Luke 22:52–53)","Nearness to Christ is not union with Christ. How do we know our faith is our own? When did it become true faith for you? What are the hallmarks of saving faith?"],"official":true},{"id":"faith","tab":"Faith or Pride","color":"#7a2e5c","title":"Faith or Pride?","meta":"Andrew Kelley · Nov 1, 2026 · Hope Chapel","ref":"Habakkuk 2:2–5","verse":"“Write the vision; make it plain on tablets, so he may run who reads it… If it seems slow, wait for it; it will surely come; it will not delay. Behold, his soul is puffed up; it is not upright within him, but the righteous shall live by his faith.”","big":"Because God’s word is public, clear, certain, and always on time, the righteous live by faith — a faith that receives Christ’s finished work, rests in it, and perseveres to the end — while pride trusts itself, swells into insatiable greed, and ends in death.","take":["Habakkuk 2 sets faith and pride side by side — like Cain and Abel, Moses and Pharaoh, Saul and David, the two thieves.","Faith needs a good object, and God’s word is that object: public, clear, certain, always on time.","“The righteous shall live by faith” is quoted in three NT places, and each shows what faith does: it receives (Romans), rests (Galatians), perseveres (Hebrews).","Test: when you stand before the judge, what will you be tempted to show him? The only plea is Christ crucified.","Pride is dangerous because it makes us feel safer; it breeds greed that’s never satisfied and looks like death.","Christ will return — vindication for those in him, judgment for those outside. Living by faith will be worth it."],"scr":[["Hab. 2:1","“I will take my stand at my watchpost.”"],["Luke 23:39–43","The two thieves — one mocks, one asks to be remembered."],["Deut. 29:29","The secret things belong to the Lord; the revealed things belong to us."],["Rom. 1:16–17","“The righteous shall live by faith.”"],["Rom. 3:21–26","Righteousness through faith in Jesus; propitiation by his blood."],["Gal. 3:10–14","No one is justified by the law; Christ became a curse for us."],["Heb. 10:32–39","Do not throw away your confidence; we are not of those who shrink back."]],"secs":[{"t":"Two Attitudes, Two Contexts","h":"<div class=\"q\">“It’s true in my life that faith has never failed me and pride has never preserved me.”</div><p>(When that doesn’t feel true, he usually just needs to wait — time proves it.)</p><p><b>Context one: Habakkuk, 6th century BCE.</b> Unlike most prophets, Habakkuk converses with God. He cries that his people are unjust and corrupt; God answers he’ll fix them by raising the brutal pagan Chaldeans (Babylon). Habakkuk objects honestly — Babylon sweeps up nations like fishermen — then takes his stand at the watchpost to wait (2:1).</p><p><b>Context two: the NT era.</b> The NT authors cite Habakkuk repeatedly. Habakkuk asks what God will do about evil coming on his people; the NT asks the same about all human evil across history. Both answers: go to the watchpost and wait. In the waiting two dispositions contrast: pride and faith.</p>"},{"t":"The Two Thieves (Luke 23:39–43)","h":"<p>Both guilty, both nailed to a cross, both in their final hours, both facing the same Jesus — and opposite responses. One mockingly demands a display of power; the other simply asks Jesus to remember him. Pride and faith.</p><p>What is the primary disposition of my heart day in and day out — humble trust with a lower opinion of myself and higher vision of Christ, or pride, which condemns me?</p><div class=\"key\">“No one has ever come to Christ and brought their pride with them. It requires faith.”</div>"},{"t":"I. The Nature of the Word: Faith Needs a Good Object","h":"<p>In vv. 2–3 God describes his word four ways:</p><ul><li><b>Public</b> — written on tablets like billboards, not secret notes. Don’t wait on spiritual people to relay what God told them about you, or an elusive voice about which job or whom to date. <i>“God doesn’t have a plan for your life that he’s hiding from you.”</i> (Deut. 29:29)</li><li><b>Clear</b> — “make it plain… so he may run who reads it”: a street sign, not a map’s fine print. Some passages are clearer than others; Christians sometimes disagree (hopefully kindly, humbly, patiently); the most important things are the clearest. <i>“Do not delegate your Bible study to somebody else. It’s on you.”</i></li><li><b>Certain</b> — “it will not lie.” We trust the pilot, the bus driver, online reviews, even a restaurant with a C in the window (“You shouldn’t, guys”), gravity and the sunrise. <i>“The things that you trust most are less reliable than God.”</i></li><li><b>Always on time</b> — “it will not delay.” Andrew’s little girls make him pick Google Maps just to watch the minutes count down — 15, 14, 13, back to 14, green to red. He’s made the drive hundreds of times and never failed to get them there.</li></ul><div class=\"key\">“If you just stop focusing on the minute counter, you would have a better journey. Trust me, I’m going to get you there.” — I don’t know when or how, or what obstacles. But God will do what he says.</div>"},{"t":"II-A. Faith Receives (Romans)","h":"<p>Romans 1:16–17: “The righteous shall live by faith.” Paul, writing to churches he hasn’t started, hoping for support to go to Spain, then spends two and a half chapters telling them how evil they are — Greeks first (the Jews cheering, like a kid whose mom is yelling at his sister) and then the Jews, who had the law and dishonored God. All without excuse.</p><p>Then Romans 3:21–26: righteousness through faith in Jesus, a gift, with no list of things to do. Every other worldview has a desired state (heaven, nirvana) and things you must do; Christianity says God did it for you — which cuts against our Western instincts.</p><div class=\"q\">“Jesus did not just die a death at the hand of the Romans. He died a death at the hand of God who poured his wrath out on him.” <cite>— on <i>propitiation</i></cite></div><p>Back to the thieves: the one who asks to be remembered has no opportunity to do any good — yet “Today you will be with me in paradise.” Faith receives.</p>"},{"t":"II-B. Faith Rests (Galatians)","h":"<p>Paul preached to mostly pagans in Galatia, who trusted a Jewish Messiah. After he left, others told them faith in Jesus isn’t enough — you must obey Jewish law. Fearful, they added to the gospel (the men circumcised themselves). Paul’s response, probably his “meanest letter”: adding to the gospel is straying from it. Faith in Christ can rest in Christ.</p><p>Few are tempted to give up shellfish, but as adamant as Protestants are about faith alone, it’s easiest to fail to rest in Christ’s finished work. Andrew knows many who trusted Christ and are still afraid — himself included.</p><div class=\"key\">“When you stand before the judge, what will you be tempted to show him for him to have mercy on you?”</div><p>His own temptation: a devoted husband and faithful father. Others: a worn Bible, terrible sins never done, church volunteering — a sweating, panicked list of credentials.</p><div class=\"q\">“I only have one plea when I’m there. Just the one. Christ crucified.”</div><p><b>Faith rests:</b> it kills your pride and calms your fears.</p>"},{"t":"II-C. Faith Perseveres (Hebrews)","h":"<p>Hebrews 10:32–39: faith strengthens endurance and produces obedience.</p><div class=\"q\">“Obedience is not the basis of your salvation. Christ’s obedience is not yours. But your obedience is the evidence of your salvation.”</div><p>A new heart leads to a new life; a new tree bears new fruit. Suffering isn’t proof you sinned, but it’s the earthquake that shakes the building and shows what you’re held together by. <i>“Suffering is a teacher that teaches us about ourselves.”</i></p><p>Not easy believism (“sign a card… now party till you die”). The Bible teaches an imperfect, gradual endurance: five steps forward, four back; a defeated sin creeping back; confessing the same things twice. (“I’m a young man” is less true these days — his wife recently gave him hair-growth shampoo.) But as life brings less favorable seasons, Christ fills more of his field of vision.</p><p>To those in the dark: come up for air a moment, and when you walk back into the valley, look to Christ.</p><div class=\"key\">“When you’re in the valley, look to Christ. I promise you he will carry you through.”</div>"},{"t":"III. The Rejection of the Word: Pride (v. 5)","h":"<p>Sidebar: many Bibles read “wine,” some “wealth.” After a week of research Andrew doesn’t know which — but both convey an insatiable appetite that kills you.</p><ul><li><b>Pride trusts itself.</b> “His soul is puffed up.” Babylon is the fisherman with hook, net, drag net — then building an altar to his fishing gear (like a salesman making an altar to his iPhone; “make an appointment with Pastor Mike”). <i>Pride lulls you into a sense of safety</i> — one of the few sins that doesn’t make us feel in danger.</li><li><b>Pride breeds greed never satisfied.</b> <b>Wealth:</b> every dollar you’re about to get will finally make you happy; vocation becomes a means to money; people become customers; you cut corners. Retirement accounts make you feel safe but can’t save you — and you can be a slave to wealth even with none. <b>Approval:</b> a smile, a nod — insatiable for others’ approval you empty yourself of conviction and end lonelier than ever, a shadow of a person.</li><li><b>Greed looks like death.</b> “As wide as Sheol; like death he has never enough.”</li></ul><div class=\"key\">If you are not in Christ, you are not safe. You are in danger of the just judgment Christ will bring when he returns. Do not delay.</div><p>For those in Christ, his return is vindication, joy, renewal, reunion, glorification — a new heaven, new earth, new body. For those outside, judgment.</p>"},{"t":"Closing: Living by Faith Will Be Worth It","h":"<div class=\"q\">“Living by faith will be worth it. It will be worth it. God will keep his promises.”</div><p>Andrew believes this some days more than others. He closes in prayer, thanking God for providing for and protecting Hope Chapel, and, as the church approaches the table for communion, asking God to prepare hearts and to unify and sanctify the congregation.</p>"}],"qa":[{"q":"What’s one thing from Sunday’s sermon that stuck with you this week: a question, a conviction, or something especially impactful?"},{"q":"<b>The Nature of the Word (vv. 2–3)</b><br>Pastor Andrew said faith has never failed him and pride has never preserved him, and when it doesn’t feel that way, he waits. Can you recall a time when faith seemed to be failing you but later proved true? What changed? (Look at: Lamentations 3:25–26)"},{"q":"The vision was written on tablets for anyone to read (v. 2). Yet we often wait for a private whisper about an important decision instead of the wisdom God has already revealed. Think of a big decision you faced. How did you look for God’s direction? (Look at: Deuteronomy 29:29)"},{"q":"God’s word is plain enough to read on the run, like a road sign (v. 2). Not all of it is equally clear, but you were made to understand it. What passage once confused you but now makes sense? What made the difference? (Look at: Psalm 119:130)"},{"q":"Wise counsel is good, but no one should let a pastor or anyone else do their Bible reading for them. Can you recall a season when you leaned on sermons etc. more than your own reading? What was different once you opened it yourself? (Look at: Acts 17:11)"},{"q":"<b>The Reception of the Word (v. 4)</b><br>People add to the gospel, Pastor Andrew said, “because we’re afraid that maybe Jesus is not enough.” Before the judge, though, “you have one plea. Christ crucified.” When have you felt you had to earn God’s acceptance? What helped you rest in Christ instead? (Look at: Galatians 3:10–14)"},{"q":"“Easy believism” says pray a prayer, then live however you want. Scripture says otherwise: obedience is not the basis of salvation, but it is the evidence of it. If obedience does not save us, why is a faith without it dead? (Look at: James 2:14–17; Hebrews 10:36–39)"},{"q":"<b>The Rejection of the Word (v. 5)</b><br>Babylon worshiped its own net (Habakkuk 1:16). Pride works the same way: an ability, possession, or position puffs us up and makes us feel safe while leaving us in greater danger. When has something you leaned on for security given way? What did it teach you? (Look at: Jeremiah 17:5–8)"},{"q":"Verse 5 says greed, like death, never has enough. For many of us the greed is not for money but for approval: “one more smile, one more friend.” Can you recall finally getting something you had chased? How long did it satisfy? (Look at: Ecclesiastes 5:10)"},{"q":"Verse 4 sets pride beside faith, and the sermon asked which one rules your heart. Think of a season when your pursuits and desires lined up with your faith, and one when they did not. What was different between the two? (Look at: Luke 23:39–43)"}]},{"id":"money","tab":"God & Money","color":"#2c5d3a","title":"God and Money, Part 2","meta":"Andrew Kelley · Aug 24, 2025 · Hope Chapel","ref":"Luke 16:1–13","verse":"“One who is faithful in a very little is also faithful in much, and one who is dishonest in a very little is also dishonest in much… No servant can serve two masters… You cannot serve God and money.”","big":"Your direction determines your destination. We are passing through one world to get to another, so we use money now — faithfully, wisely, generously — with eternity in view, and we worship God rather than money.","take":["Direction determines destination — we are passing through one world to get to another.","Jesus commends the manager’s foresight, not his dishonesty: leverage what you have now for the future.","Money is a test of stewardship and character (Luke 16:10).","Three wrong approaches: prosperity, poverty, passive. The right one is principled stewardship.","Generosity reveals the heart now — start small and build strength.","The greatest reward is not money but the gospel: God’s profound generosity to us in Christ.","Money competes with God for worship; in Christ you already have comfort, status, security and approval."],"scr":[["Luke 16:1–13","The parable of the dishonest manager and the call to faithfulness."],["Luke 16:10","“One who is faithful in a very little is also faithful in much.”"],["Luke 6:38","“Give, and it will be given to you.”"],["Prov. 3:9–10","Honor the Lord with your wealth; your barns will be filled."],["Mal. 3:10","“Open the windows of heaven.”"],["1 Tim. 6:17–19","Storing up treasure as a good foundation for the future."],["Luke 16:13","“You cannot serve God and money.”"],["Matt. 11:28–30","Come to me, and I will give you rest."],["Phil. 2:9–11","Christ exalted above every name."],["Rom. 8:38–39","Nothing can separate us from the love of God in Christ."]],"secs":[{"t":"Intro: Direction Determines Destination","h":"<p>Andrew’s illustration: following the wrong church steeple in Germany ended in the wrong place.</p><div class=\"key\">“Your direction determines your destination. We are passing through one world to get to another.”</div><p>Jesus’s parable reorients us to live now with eternity in view.</p>"},{"t":"I. The Dishonest Manager (vv. 1–8)","h":"<p>The manager wasted resources, faced dismissal, and acted shrewdly to prepare for his future. Jesus commended his <i>foresight</i>, not his dishonesty.</p><div class=\"q\">“He’s leveraging everything he has in the present for the future.”</div><p><b>Application:</b> Christians must leverage resources now with eternity in mind.</p>"},{"t":"II. Faithfulness and Money as a Test (vv. 10–12)","h":"<p>Luke 16:10: faithful in little, faithful in much. Money is a test of stewardship and character. Three wrong approaches:</p><ul><li><b>Prosperity</b> — equates wealth with God’s love. <i>“How much money you have does not tell you how much God loves you.”</i></li><li><b>Poverty</b> — sees money itself as evil. <i>“Money is not evil, but it is dangerous — like a power tool.”</i></li><li><b>Passive</b> — avoiding responsibility. <i>“Young men, do not waste your 20s. You are called to work, to provide, to be generous.”</i></li></ul><p>The right approach: <b>principled stewardship</b> — wise, honest, generous, Christ-centered.</p>"},{"t":"III. Generosity Reveals the Heart","h":"<div class=\"key\">“What we do with our money reveals us right now.”</div><p>Weightlifting: start small, build strength. <i>“Saying I’ll be generous when I have more is like saying I’ll lift heavy weights when I have bigger muscles.”</i> Faithfulness with little prepares you for greater generosity later.</p>"},{"t":"IV. The Rewards of Faithful Generosity","h":"<p>Rewards in this life and the next: Luke 6:38; Prov. 3:9–10; Mal. 3:10; 1 Tim. 6:17–19. <i>“When we’re generous now, it is in some way credited to us in the resurrection.”</i></p><div class=\"key\">“The greatest reward is not money. The greatest reward is the gospel — that God has been profoundly generous with us in Christ.”</div>"},{"t":"V. Who Do You Worship? (v. 13)","h":"<p>“You cannot serve God and money.” Money competes with God for worship.</p><div class=\"q\">“We throw money at the altar of comfort, status, security, approval. But in Christ you already have comfort, status, security, and approval.”</div>"},{"t":"Conclusion: Living with Eternal Perspective","h":"<p>Reminders from Scripture: Christ gives rest (Matt. 11:28–30); Christ is exalted (Phil. 2:9–11); nothing separates us from God’s love (Rom. 8:38–39).</p><div class=\"key\">“We don’t have to worship other gods. We can use our money to worship the one true God.”</div>"}],"qs":["Which direction is your use of money pointing you — toward the destination you want?","Which wrong approach to money do you lean toward: prosperity, poverty, or passive? What would principled stewardship look like?","What does your giving and spending reveal about your heart right now?","What is one small, faithful step of generosity you could take now rather than waiting until you have more?","What “altar” do you throw money at — comfort, status, security, approval? What does Christ already give you in its place?"]},{"id":"judgment","tab":"Judgment","color":"#46505c","title":"When Judgment Comes","meta":"Mike Nazarian · May 10, 2026 · Hope Chapel","ref":"Luke 21:20–24","verse":"“But when you see Jerusalem surrounded by armies, then know that its desolation has come near. Then let those who are in Judea flee to the mountains… Alas for women who are pregnant and for those who are nursing infants in those days!… Jerusalem will be trampled underfoot by the Gentiles, until the times of the Gentiles are fulfilled.”","big":"Because Jesus sees clearly, warns faithfully, and grieves sincerely, we can trust even his hardest words — and must flee to him as our only true refuge when judgment comes.","take":["Jesus made a precise, historically falsifiable prediction about Jerusalem’s fall — and history confirmed it forty years later.","AD 70 was God keeping every covenant warning he had issued through the prophets.","God’s judgment flows from his holiness — a perfectly good God cannot let rebellion go unanswered forever.","Christians who survived the siege trusted Jesus’s words over their own instincts and culture.","Jesus not only warned of judgment — he absorbed the greater judgment on the cross, becoming the one true refuge.","Whatever walls we trust for safety before the final judgment will not hold; only Christ will."],"scr":[["Luke 21:20–24","Jerusalem surrounded; flee; “alas”; trampled until the times of the Gentiles are fulfilled."],["Isa. 34:8","“The Lord has a day of vengeance, a year of recompense for the cause of Zion.”"],["Isa. 6:3","“Holy, holy, holy is the Lord of hosts.”"]],"secs":[{"t":"Opening: An Unexpected Mother’s Day Text","h":"<p>On Mother’s Day the series lands on judgment — yet in the middle of it Jesus pauses to grieve for mothers. Many churches quietly turn the page on passages like this; faithfulness means opening ourselves to the sharper edges of his word.</p><div class=\"q\">“If we are going to be faithful to Jesus, then we can’t pretend to be his editors. We have to be his disciples.”</div><p><i>“The gospel is still good news. It’s good news in this text and it is good news today.”</i></p>"},{"t":"1. Jesus Saw Judgment Coming","h":"<p>Verses 10–19 described broad upheaval; now Jesus narrows to a specific city, sign, and people — a <b>precise, falsifiable prediction.</b> The sign: Jerusalem surrounded by armies. Matthew and Mark use “abomination of desolation” for Jewish readers; Luke decodes it for Gentiles. “Desolation” means destruction where there was construction, death where there was life.</p><p>Greek: “surrounded” is a present participle — already unfolding. “Know” is an imperative.</p><div class=\"q\">“He says when you see, know. And the implication is move. When you see it, know it, move it.”</div><p><b>Three commands (v. 21):</b> those in Judea flee; those inside the city get out; those outside don’t enter. The third was counterintuitive — the very thing they think will save them will bury them.</p><p><b>History vindicates.</b> Josephus: false prophets told people to take refuge in the temple; thousands flooded in and Rome burned them. Eusebius: the Christians fled to Pella east of the Jordan — the route Jesus described.</p><div class=\"key\">“They survived because they trusted God’s Son and not their own instincts, their own intuitions, their own culture.”</div>"},{"t":"What It Meant: Days of Vengeance","h":"<p>Verse 22: “days of vengeance, to fulfill all that is written” — covenant judgment language (Isa. 34:8). For centuries God sent prophet after prophet; now Israel has rejected not another prophet but God’s Son. Jesus draws a line from Moses through the prophets: “it’s all landing right here, right now, on this city, in this generation.”</p><p>The passage is ultimately about the terrifying reliability of the God who means what he says — “All that is written. Not some. Not most. All.” If Jesus could speak with such precision about AD 70, he sees clearly, including into your future.</p>"},{"t":"2. Jesus Saw Straight Through It: “Alas”","h":"<p>Verse 23: <i>ouai</i> — a cry of grief. Jesus grieves not for the city or temple but for <b>mothers and nursing infants.</b> “This cry is not the cry of a cold, distant, indifferent judge. It is the cry of a savior.”</p><p><b>Isn’t this cruel?</b> Mike answers: not cruelty — holiness. If judgment feels harsh, the problem is that we’ve lost sight of God’s holiness (Isa. 6:3 — the threefold superlative).</p><div class=\"q\">“Why does a good God punish human sin? Because he’s good. He loves goodness. And he hates what is evil. Because he is good, he is just.”</div><p>Verse 24 names sword, captivity, exile; Josephus records over a million dead and nearly a hundred thousand taken captive.</p>"},{"t":"Hard Words for Every Generation","h":"<p>Some want a Jesus who speaks only of love and peace. He is all that — but also the Jesus of Luke 21, who still calls us away from what we think will save us. Hard words he still speaks: flee sexual immorality; forgive as I have forgiven you; unless you repent you will all likewise perish.</p><div class=\"key\">“He gives us hard words because he wants to rescue us. He wants to rescue us from ourselves. He wants to rescue us from the wrath that is to come.”</div>"},{"t":"Jesus Saw the Other Side","h":"<p>Verse 24 ends with a hinge: <b>until.</b> Two horizons run through Luke 21 — the near (AD 70, fulfilled) and the far (final consummation). The age of the Gentiles is when the gospel goes to every tongue, tribe and nation; it will close, and then comes the Son of Man in a cloud with power and great glory.</p><div class=\"q\">“He sees through the near horizon. He sees through the judgment to come. And what he sees at the end is himself.”</div>"},{"t":"Closing: He Walked Into It for Us","h":"<p>Within days of these words Jesus walked straight into judgment on a cross. The wrath that fell on Jerusalem was a whisper beside what fell on him at Calvary — absorbed as our substitute, “nothing left over to spill out onto us.” We’re called to trust not only his word but his work.</p><div class=\"key\">“The cross is not our warning. Jesus gave a warning, but then he went to the cross. The cross is our rescue.”</div><p>The invitation is the same Jesus gave Jerusalem: when judgment is coming, flee — now to him, the true and better refuge.</p><div class=\"q\">“The people who survived Jerusalem were not the people with the strongest walls. They were the people who trusted Jesus… Your walls will not hold and neither will mine. Only Jesus will hold.”</div>"}],"qs":["Mike says many churches turn the page on hard passages about judgment. Why is judgment so uncomfortable, and what might we lose by avoiding it?","The Christians who survived trusted Jesus’s words over their instincts and culture. Where is Jesus calling you toward something counterintuitive or countercultural?","How does understanding God’s holiness change how you think about his judgment?","What does centuries of patient covenant warning tell you about God’s character, and about how you hear his warnings today?","Jesus cried “Alas” in grief even as he pronounced judgment. What does grief and judgment together reveal about his heart?","What “walls” are you tempted to hide behind when you think about standing before God — your record, effort, decency?","Is there a hard word from Jesus you’ve been avoiding or softening? What would it look like to trust it?","Spend a moment on the cross as the place where the greater wrath fell so none would fall on us. What does it stir in you?"]},{"id":"hab1","tab":"Habakkuk 1","color":"#2f6b5a","title":"Faith When We Don’t Understand","meta":"Mike Nazarian · Oct 11, 2026 · Hope Chapel","ref":"Habakkuk 1:1–11","verse":"“O Lord, how long shall I cry for help, and you will not hear? Or cry to you ‘Violence!’ and you will not save? Why do you make me see iniquity, and why do you idly look at wrong?… Look among the nations, and see; wonder and be astounded. For I am doing a work in your days that you would not believe if told.”","big":"Faith means trusting the character of God when we don’t understand the ways of God: evil strikes close to home, God can seem painfully silent, yet he is always at work — often in ways we would never expect — and the cross proves he does not ignore evil.","take":["New series, <i>Faith When We Don’t Understand</i>, through the short three-chapter book of Habakkuk. Unlike most prophets, Habakkuk speaks to God for the people (and for himself).","Point 1 — Evil often strikes close to home. Habakkuk is grieved by violence, strife, a paralyzed law and perverted justice among God’s own covenant people.","Point 2 — God can seem painfully silent when evil strikes. Habakkuk’s “How long?” is a <b>lament</b>: faith that speaks honestly when it doesn’t totally understand. God welcomes it, and he was listening all along.","Point 3 — God is always at work, often in ways we would never expect. He answers every complaint, but with a surprise: he is raising up the Babylonians.","We live “a thousand miles per hour,” so one small frame becomes the whole story. Habakkuk tells us to look up: God is steering the nations — and our lives.","At the cross it looked like evil had won, when God was achieving his greatest victory. The cross shows God deals with evil “out there” — and with the evil in us, when Jesus bore our judgment."],"scr":[["Hab. 1:1–11","Habakkuk’s complaint (vv. 2–4) and the Lord’s answer (vv. 5–11)."],["Hab. 1:5–6","“Look among the nations and see… I am raising up the Chaldeans.”"],["Ps. 22:1","Jesus’ cry from the cross, “My God, my God, why have you forsaken me?”"],["2 Kings 23:36–37","The king who did evil in Judah after Josiah."],["Ps. 13:1–2","“How long, O Lord?” — honest lament."],["Isa. 55:8–9","God’s ways and thoughts are higher than ours."],["Gen. 50:20; Isa. 10:5–7; Acts 2:23","God’s sovereignty and human responsibility."],["Rom. 8:28; 2 Pet. 3:9","God works for good; patience toward sinners."],["Acts 13:38–41","Paul uses Habakkuk 1:5 to preach Christ."]],"secs":[{"t":"Welcome to Habakkuk","h":"<p>A brief journey through one of the shortest Old Testament books (pronounced “Habakkuk”), a minor prophet — not less important, just short — between Nahum and Zephaniah.</p><p>Most prophets speak to the people <i>for God</i>. Habakkuk speaks <i>to God</i> for the people and himself. He looks at a culture that doesn’t make sense to him and asks what many of us ask: <i>God, where are you? Why is this happening? Why aren’t you doing anything about the evil I see?</i></p><div class=\"key\">Habakkuk shows what it looks like to trust the character of God when we don’t fully understand the ways of God.</div>"},{"t":"Getting Our Bearings: The Big Story","h":"<p>The Bible is God’s story from creation to new creation: <b>creation, fall, redemption, new creation</b>. God promises redemption right after the fall; that plan runs through Israel to Jesus, who establishes the kingdom, gives way to the church age where we live now, and will return to make all things new.</p><p><b>Israel in a nutshell:</b> Abraham → Isaac → Jacob (Israel) and 12 tribes → Egypt → Moses and the wilderness → the promised land and judges → Saul (fails) → David (promise of an everlasting throne) → Solomon (wise, then foolish) → the kingdom splits into Israel (north) and Judah (south), both sliding into idolatry.</p><p><b>722 BC:</b> Assyria conquers and scatters the north. <b>136 years later:</b> Babylon sacks Jerusalem and exiles Judah. Habakkuk is sandwiched in between.</p><p><b>Just before he writes:</b> good King Josiah leads reform; the temple is repaired and the lost book of the law is rediscovered and read aloud; Josiah tears his garments and calls the nation to repent — a brief renewal. Then Josiah dies, a wicked son takes the throne, and Judah backslides. Meanwhile the world churns: Assyria is collapsing, Egypt presses from the south, Babylon is rising.</p><p>But Habakkuk’s greatest concern isn’t out there — it’s what is happening at home.</p>"},{"t":"I. Evil Often Strikes Close to Home (vv. 3–4)","h":"<p>Habakkuk says <b>“before me”</b> — not distant evil, but evil up close, among people in covenant with the God who delivered and provided for them. Notice how it spreads outward and intensifies:</p><ul><li><b>Destruction and violence</b> — open abuse and murder in plain view.</li><li><b>Strife and contention</b> — people exploit and murder each other, so they divide, grow hostile and suspicious; families, friendships and neighborhoods fracture; trust erodes.</li><li><b>The law is paralyzed</b> — “Torah,” God’s own instruction. Rediscovered under Josiah, now buried again; no longer governing or shaping the culture.</li><li><b>Justice goes forth perverted</b> — it doesn’t vanish, it comes out crooked: the very thing meant to correct wrong produces a worse result.</li></ul><div class=\"key\">This is what happens when any culture pushes God to the margins — says to its Creator, “You are no longer welcome here.”</div><p>Evil far away we can acknowledge without feeling it. It’s different when someone you trust looks you in the eye and lies, a friend betrays you, a leader abuses power, or a brother or sister in Christ sins against you — or when you watch your city, state or nation descend into corruption and folly. That grieves us differently because it hits close to home. But for Habakkuk, that is only half the problem.</p>"},{"t":"II. God Can Seem Painfully Silent (vv. 1–2)","h":"<p>From where Habakkuk stands, God seems to be standing by. What do we do when God seems silent? Can we still trust him when we don’t understand?</p><ul><li><b>“How long?”</b> — not his first prayer; he’s been crying out a long time.</li><li><b>“You will not hear”</b> — in Hebrew poetry, for God to “hear” is to recognize <i>and act</i>. “Your refusal to act is speaking louder than any other voice.”</li><li><b>“Violence!” … “you will not save”</b> — like witnessing a violent crime on a walk and shouting, “Somebody do something!” He doesn’t want an explanation; he wants an <i>intervention</i>.</li><li><b>“Why do you make me see?”</b> — I see it, you see it, I can’t do anything, you can do everything, yet you idly look on.</li></ul><p><b>Even so, he is still talking to God.</b> God’s answer — twice the length of the complaint — shows he was listening. Frustrated, angry, hurting, confused, Habakkuk is still praying. This is <b>lament: faith that speaks honestly when it doesn’t totally understand.</b></p><div class=\"key\">God is not offended by your lament; he welcomes it. You can come to him precisely because you don’t understand — and he has given us words in Scripture when ours fail.</div><p><b>Jesus himself prayed lament</b> on the cross: “My God, my God, why have you forsaken me?” (from Psalm 22) — evil not only at the doorstep but breaking through the front door. And at the cross it looked like evil had won, when God had just defeated it.</p><div class=\"q\">“Sometimes God is doing his greatest work when it looks like he is doing nothing at all.”</div>"},{"t":"III. God Is Always at Work (vv. 5–6)","h":"<p>The Lord answers: <i>“Look among the nations and see. Wonder and be astounded. For I am doing a work in your days that you would not believe if told. For behold, I am raising up the Chaldeans…”</i> (Chaldeans = Babylonians).</p><p><b>1. God widens Habakkuk’s field of view.</b> Habakkuk has been staring at Judah; God says, “Zoom way out… look wider.” God is directing the movement of human history.</p><p><b>2. God answers every complaint, category for category:</b></p><ul><li>“How long?” → “In your days I will act.”</li><li>“You’re doing nothing.” → “I am doing a work.”</li><li>“Why do you make me see?” → “Look among the nations and see.”</li><li>“Violence!” → “I am bringing a greater violence to judge the violence you see.”</li></ul><p><b>3. But not the answer Habakkuk expected.</b> God will deal with Judah’s wickedness by raising up Babylon — brutal, merciless, bloodthirsty, conquest-driven; they “gather captives like sand,” and their “might is their god.” That creates a new problem: <i>can God be good if he uses a greater evil to judge a lesser one?</i> Pastor Mike left that deep conundrum for Pastor Andrew, who is preaching next.</p>"},{"t":"Application: Look Up","h":"<p>Pastor Mike admitted that on a Tuesday night he lay awake thinking, <i>“What in the world have I gotten us into? Preaching Habakkuk,”</i> but by Friday found the book “super relatable” and profoundly encouraging for Christians today.</p><p>We live a thousand miles an hour, so our field of vision shrinks — marriage strain, a wandering kid, trouble at work becomes the whole story. Habakkuk reminds us to <b>look up</b>: God is steering the nations and, if he steered Habakkuk’s world, he is steering our lives. The same is true of our cities, state and nation, even with midterm elections coming and the frustration politics stirs: <i>“How long, Lord?”</i></p><div class=\"key\">“My little frame is not the whole story.” God is sovereign; he will deal with every wicked ruler and injustice. I may not understand — I may not even like — what God is doing, but faith won’t judge God’s character by the small piece of the story in my frame.</div>"},{"t":"The Cross & the Invitation","h":"<p>When evil kicks down your door and you’re tempted to ask <i>Do you see? Do you care? Are you good? Do you even exist?</i> — <b>remember the cross.</b> There we see most clearly that God does not ignore evil; he dealt with it, judged it and defeated it. Every evil will face a reckoning.</p><p>The cross also shows that the problem is not only the evil <i>out there</i> but the evil <i>in here</i>. “We may not be as sinful as we could be, but we’re sinful enough” to incur God’s judgment. How can God judge the evil out there without judging us? Jesus took all our sin and bore the full judgment, paying it in full. <b>Either Jesus pays for my sin or I do.</b></p><p><b>Invitation:</b> if you’ve never turned to Jesus, turn to him in faith, turn from sin, trust his perfect work as your substitute, and cry out to him — right in your seat. The service then moved into communion.</p><p><b>Closing prayer:</b> that the book, “not written to us, but written for us,” would challenge and encourage us to look up to God and find renewed hope; and that God would turn hearts and save some.</p>"}],"qa":[{"q":"What’s one thing from Sunday’s sermon that stuck with you this week: a question, a conviction, or something especially impactful?"},{"q":"<b>Understanding the Text</b><br>Habakkuk lived in Judah’s last years, just before Babylon invaded. Good King Josiah had died, and the people had returned to their old sins. Read verses 2–4: who is committing the violence and injustice that Habakkuk condemns? (Look at: 2 Kings 23:36–37)"},{"q":"<b>Understanding the Text</b><br>Habakkuk speaks boldly to God, accusing Him of not hearing or intervening (vv. 2–3). Yet he brings his complaints to God rather than turning away. What does this teach us about the difference between honest lament and unbelief? (Look at: Psalm 13:1–2)"},{"q":"<b>Understanding the Text</b><br>God answers Habakkuk, but not as he expected: He is raising up the Chaldeans (Babylonians), an even more wicked nation, to judge Judah (vv. 5–11). What does God’s answer reveal about the assumptions we sometimes make concerning how God ought to act?"},{"q":"<b>Applying the Sermon</b><br>Pastor Mike’s first point: evil often strikes close to home. Habakkuk is grieved by the wickedness among God’s own people (v. 4). Why might injustice and unfaithfulness among God’s people be particularly grievous? How should we respond when we encounter it in the church?"},{"q":"<b>Applying the Sermon</b><br>Pastor Mike’s second point: God can seem painfully silent when evil strikes. Habakkuk continues crying out to God even when heaven seems silent. Have you experienced a season when God seemed unresponsive to your prayers? How did that affect your relationship with Him, and what can we learn from Habakkuk’s response?"},{"q":"<b>Applying the Sermon</b><br>Pastor Mike’s third point: God is always at work, often in ways we would never expect. Habakkuk knew God was righteous and just, yet his circumstances seemed to contradict what he knew of God. What should govern our understanding of God when our circumstances appear to contradict what He has revealed about Himself? (Look at: Isaiah 55:8–9)"},{"q":"<b>Knowing the Doctrine</b><br>God raises up the Chaldeans to accomplish His purposes, yet He still holds them guilty for their wickedness (vv. 6, 11). How does Scripture uphold both God’s absolute sovereignty and man’s responsibility for evil? Why is it important that we never surrender either truth? (Look at: Genesis 50:20; Isaiah 10:5–7; Acts 2:23)"},{"q":"<b>Sharing the Truth</b><br>A friend says, “If God is good and powerful, why doesn’t He stop evil?” How might Habakkuk 1 help you respond? What can we confidently affirm about God even when we cannot explain His particular purposes? (Look at: Romans 8:28; 2 Peter 3:9)"},{"q":"<b>Sharing the Truth</b><br>Years later, Paul used Habakkuk 1:5 in preaching Christ (Acts 13:38–41). At the cross, evil appeared to triumph, yet God was accomplishing our salvation. Who in your life is struggling to trust God, and how might you encourage them with the hope of the gospel this week?"}]},{"id":"hab2","tab":"Why, God?","color":"#8a5a1f","title":"Why, God?","meta":"Andrew Kelley · Oct 18, 2026 · Hope Chapel","ref":"Habakkuk 1:12–2:1","verse":"“Are you not from everlasting, O Lord my God, my Holy One? We shall not die… Is he then to keep on emptying his net and mercilessly killing nations forever? I will take my stand at my watchpost and station myself on the tower, and look out to see what he will say to me.”","big":"“Why, God?” is a dangerous but invited question — and Habakkuk shows how to ask it well: trust God’s goodness first, wrestle honestly with his providence, then hope in his deliverance from the watchtower.","take":["God does not forbid “Why, God?” — he invites us to bring our complaints to him, in humility.","The Bible acknowledges real evil and affirms that God is good, holding both in tension. It rejects the intellectual exit (“God doesn’t exist”) and the emotional exit (“He can stay in his corner”).","Trust God’s goodness first (v. 12): everlasting, the covenant Lord (Yahweh), holy, keeper of promises (“We shall not die”), with plans that are right and on purpose. Habakkuk starts from God’s character, then tries to understand his situation.","Wrestle with God’s providence (vv. 13–17): suffer without abandoning God, and succeed without replacing God. God’s sovereignty over sin is not approval of sin; success isn’t proof of favor, failure isn’t proof of judgment; God uses evil for good (Joseph, the cross); success can breed idolatry — exalting the gift, not the giver.","The greatness of a sin or trial doesn’t mean it’s permanent. In Christ, “your best days are ahead of you” — it ends in glory.","Hope in God’s deliverance (2:1) with patience, longing (not indifference), and listening — God has spoken in his word."],"scr":[["Hab. 1:12–2:1","Habakkuk’s second complaint and his watchtower."],["Hab. 1:5–6","God’s first answer: raising up the Chaldeans."],["Exod. 3:13–15","“I am who I am… the Lord… this is my name forever.”"],["Lev. 26:44; Deut. 4:31","God will not utterly destroy or forget his covenant."],["Rom. 8:28","All things work together for good for those who love God."],["Gen. 50:20","“You meant evil against me, but God meant it for good.”"],["2 Cor. 4:16–18","Light momentary affliction preparing an eternal weight of glory."],["Gen. 1:26–28","Mankind made to rule — the order of creation."],["James 1:17; Gal. 6:9","Every good gift from above; do not grow weary in doing good."],["Rom. 5:1; Rom. 8:1","Peace with God; no condemnation in Christ."],["Ps. 13; 2 Cor. 5:21","Lament and trust; Christ made sin for us."]],"secs":[{"t":"Opening: A Dangerous Question","h":"<p>Pastor Andrew opened with his first reciprocating saw: a useful tool and a dangerous one (he met a man who cut off his own fingers). So is the question <b>“Why, God?”</b> It takes us to the edge of faith, stretches our emotional limits and brings us face to face with doubt — a high narrow path with despair on one side and resentment on the other.</p><p>Everyone has asked it: over small things (a parking space, no Wi-Fi) and over things no one would challenge — a failing marriage, a wayward child, a lost job, a loss, a diagnosis. In one room there is enough combined suffering to crush one person. It is a divine mercy we don’t know our future hardships.</p><div class=\"key\">What’s remarkable about Christianity is that God does not forbid the question — he invites it. We can bring our complaints about God to God (humbly, not arrogantly).</div>"},{"t":"Context & the Problem of Evil","h":"<p>Josiah was a good king; the law was found; the people were renewed. Then his sons were bad kings and things went downhill, with the Babylonians about to take the Jews into exile. Habakkuk cried out about evil among his own people (violence, strife, a paralyzed law, perverted justice). God answered (1:5–6): he’s raising up the Chaldeans — <i>a more destructive, more violent, more sinful nation</i>. Not a quick renewal, but ruin and judgment. Habakkuk now faces the problem of evil.</p><p><b>The problem, stated:</b> God is all good, all powerful and evil exists — and those can’t all be true.</p><ul><li><b>The intellectual exit:</b> “God obviously doesn’t exist” (at least not as the Bible describes him).</li><li><b>The emotional exit</b> (more common): “My life is a shipwreck… Maybe God exists, but I don’t trust him anymore. He can stay in his corner and I’ll stay in mine.”</li><li>Others redefine or cope with evil.</li></ul><p><b>The Bible does two things at once:</b> it acknowledges gross, egregious evil — no sugarcoating — and it affirms that God is good, holding both in tension. Habakkuk shows what asking “Why, God?” well looks like. (Pastor Andrew noted he wouldn’t immediately solve the problem; the text’s answer is helpful but not the one our Western minds expect. A session on it is at next weekend’s Apologetics Conference.)</p>"},{"t":"I. Trust in God’s Goodness (v. 12)","h":"<p><i>“Are you not from everlasting, O Lord my God, my Holy One? We shall not die. O Lord, you have ordained them as a judgment, and you, O Rock, have established them for reproof.”</i> Habakkuk leans <b>in</b> to God’s goodness, not away: the substance of faith isn’t understanding all God’s plans, it’s <b>knowing God’s character.</b> He rehearses:</p><ul><li><b>Everlasting</b> — God has always existed, is all powerful and all knowing; nothing outside his control. Suffering can exhaust us; it won’t exhaust or overpower God, and when suffering ends God is still there. This loosens suffering’s grip.</li><li><b>Lord (Yahweh)</b> — the covenant name God gave Moses (Exod. 3: “I am who I am… this is my name forever”). Not a philosophical construct but the God who called Abraham, sent Moses, raised up David: invested in his people, close by, bound to them and working for them.</li><li><b>Holy One</b> — set apart, in a category by himself; his ways higher than ours; nothing wrong with him; everything he does is right.</li><li><b>His promises are certain — “We shall not die.”</b> Not “we shall not suffer, be harmed, oppressed, exiled or scattered,” but the judgment won’t be final and the destruction won’t be total. (Lev. 26:44; Deut. 4:31.) In suffering we remember that God keeps his promises.</li><li><b>His plans are right</b> — “ordained… for reproof” (correction). A hard word: the difficult plans are on purpose. Your life is not an accident or improvised; he will not waste what he’s given you. Looking back, most see how he used suffering to shape them for good (Rom. 8:28).</li></ul><div class=\"key\">When I suffer my heart says, “Prove to me you’re good again… show me your resume.” Habakkuk does the opposite: he affirms that God is good, <i>then</i> tries to understand his situation.</div>"},{"t":"II. Wrestle with God’s Providence (vv. 13–17)","h":"<p>Habakkuk offers a real complaint: God is too pure to look at evil, so why does he idly watch traitors and stay silent when the wicked swallow the more righteous? Pastor Andrew wants both edges of the sword: <b>learn to suffer without abandoning God, and to succeed without replacing God.</b> First, the imagery:</p><ul><li><b>Fish with no ruler (v. 14)</b> — a callback to creation: humans made to rule as God’s vice-regents in an ordered creation. Babylon’s devastation feels like creation disordered; God’s people treated as meaningless as fish, without a ruler, vulnerable (Gen. 1:26–28).</li><li><b>Hook, net, dragnet (v. 15)</b> — one hook catches one fish; a net a few more; a dragnet sweeps up everything. Progressive devastation, and no escape from the coming judgment.</li></ul><p><b>Lessons from the section:</b></p><ol><li><b>God’s sovereignty over sin is not approval of sin.</b> Evil people sometimes win — cruel nations, bad political ideas, the dishonest coworker promoted over you. Don’t assume trouble means God hates you or ease means he loves you; success ≠ approval, failure ≠ hatred. This kills pride and jealousy together, because God looks on the inside. Ask: is my success leading me to believe I have favor when I’m not obedient?</li><li><b>God uses evil for good.</b> Joseph: “You meant evil against me, but God meant it for good” (Gen. 50:20) — he doesn’t call the evil “no big deal.” Bigger still: <b>the gospel.</b> Humans are rebels guilty in a cosmic court; God became man, lived perfectly, and we killed him — betrayal, unjust trials, beating, crown of thorns, cross. What great evil! Yet at the cross, in the death of Christ, we see the death of death. Jesus carried no sin of his own, so he could carry ours; he “became sin for us”; we take his righteousness.<div class=\"key\">Before the judge, the only advocate you could ever have is Christ — not your mom, spouse, children or pastor. If you’ve repented and turned to him, you present his perfect bill of health and escape wrath. If you haven’t, you are not safe. Today is the day of salvation (elders were available for prayer).</div></li><li><b>Success can produce idolatry (v. 16).</b> Babylon sacrifices to his net, worshiping the tools that gave him luxury — “exalting the gift and not the giver.” Like his daughter thanking the dollhouse instead of her grandparents. We worship money (checking the bank account), family (joy rises and falls with their health), vocation, credit cards, achievements, medals — confusing creation with Creator. Pastor Andrew wants to succeed without replacing God.</li><li><b>The greatness of a sin doesn’t mean it’s permanent (v. 17).</b> The man endlessly empties his net onto the beach — “forever?” When we suffer, it always feels long-term, hopeless, like it will never stop raining. We have a limited view of life and history. Everyone who has persevered through suffering looks back and says that’s what they needed to hear: God is good, keeps his promises, and suffering doesn’t ultimately last.<div class=\"key\">No matter how dark life gets, if you are in Christ it ends in glory (2 Cor. 4:16–18): “your best days are ahead of you.”</div></li></ol>"},{"t":"III. Hope in God’s Deliverance (2:1)","h":"<p><i>“I will take my stand at my watchpost and station myself on the tower, and look out to see what he will say to me, and what I will answer concerning my complaint.”</i> The movement: affirm God’s goodness → lay out the complaint → return to the watchtower to hope. Three postures of hope:</p><ul><li><b>Patience.</b> A watchman doesn’t control when what he’s watching for arrives. God brought great good from Babylon’s destruction, though Habakkuk never saw it: exile → <b>synagogues</b> in every major city (where Paul later went first, finding receptive God-fearers); Alexander and Greece → one common language (the New Testament was written in Greek); Rome → roads. Brutal empires, yet God used them. We must trust him even if we don’t see the fruit in our lifetime — in discipling our kids, evangelizing our cities, staying obedient to the one true God.</li><li><b>Longing, not indifference.</b> Don’t detach or refuse to hope so you won’t look foolish. “You don’t have to hedge your emotional bets” — you can wholeheartedly and riskily hope in Christ’s return. He won’t let you down.</li><li><b>Listening.</b> Habakkuk is ready to hear God speak. We need God to speak — and he has, in his word.</li></ul><p><b>Closing prayer:</b> for each eternal soul in the room, especially those who don’t yet know Christ; that hearts be moved and given new hearts and new lives; and for hearts prepared to remember the Lord well at communion.</p>"}],"qa":[{"q":"What’s one thing from Sunday’s sermon that stuck with you this week: a question, a conviction, or something especially impactful?"},{"q":"<b>Understanding the Text</b><br>Read verse 12. Habakkuk is about to pour out a complaint, but he begins by naming who God is. What truths about God do we find in this verse?"},{"q":"<b>Understanding the Text</b><br>In verse 12 Habakkuk says, “We shall not die.” He does not say: we shall not suffer, be scattered, or be exiled. What is the difference between God sparing us from suffering vs God preserving us through them? (Look at: Leviticus 26:44; Deuteronomy 4:31)"},{"q":"<b>Understanding the Text</b><br>Read verses 14-15. Habakkuk pictures people as fish with no ruler, caught first with a hook, then a net, then a dragnet that sweeps the whole sea. What do these pictures show about how evil and injustice feel to the people living under them? (Look at: Genesis 1:26-28)"},{"q":"<b>Applying the Sermon</b><br>Pastor Andrew admitted that when something goes wrong, his heart says, “God, you need to explain yourself to me.” Habakkuk did the opposite: he started from God’s goodness, then aired his complaint. When life does not make sense, what helps you take confidence in God’s unchanging character instead of demanding answers?"},{"q":"<b>Applying the Sermon</b><br>Babylon worships the tools that made him rich (v. 16). Pastor Andrew said we do the same when we “rest in the gift and not the giver,” like his daughter thanking the dollhouse instead of her grandparents. How can you tell when a good gift has started to take God’s place in your life? (Look at: James 1:17)"},{"q":"<b>Applying the Sermon</b><br>Habakkuk never saw it, but God used Babylon’s evil to spread the gospel: exile created the synagogues, Greece spread one shared language, and Rome built the roads. God may bring good from your obedience that you will never see. Where is God calling you to stay faithful even without visible results? (Look at: Galatians 6:9)"},{"q":"<b>Knowing the Doctrine</b><br>Pastor Andrew said we should not read success as God’s favor or failure as his judgment. Yet everyone wants to know where they stand with God. If our circumstances cannot tell us, what can? (Look at: Romans 5:1; Romans 8:1)"},{"q":"<b>Sharing the Truth</b><br>Many people can slowly drift away and stop trusting God after life disappoints them: “He can stay in his corner. I’ll stay in mine.” How would you respond to a friend who feels this way? (Look at: Psalm 13)"},{"q":"<b>Sharing the Truth</b><br>Pastor Andrew said the Bible does not teach that good people go to heaven and bad people go to hell. It teaches that at the cross “a trade is made”: Jesus takes our sin, and we receive his righteousness. How would you explain this trade in your own words to a friend who thinks being good is enough? (Look at: 2 Corinthians 5:21)"}]},{"id":"story","tab":"Story of Reality","color":"#5b3a8c","title":"The Story of Reality","meta":"Greg Koukl (guest) · Oct 25, 2026 · Hope Chapel","ref":"The big story: Genesis to Revelation","vref":"Gen. 1:1; John 1:1–14","verse":"“In the beginning, God created the heavens and the earth.” … “In the beginning was the Word… And the Word became flesh and dwelt among us.”","big":"Christianity is not a private spiritual fantasy but a picture of reality — one true story that can be told in five words: God, man, Jesus, cross, resurrection. It starts with God, explains why the world is broken, and shows why Jesus alone is the rescue.","take":["Christianity is more than a religion, a lifestyle or an inner relationship: it is <b>a picture of reality</b> — a world view, a description of how things actually are. Not “true for me,” true to the way the world is; history, not fiction.","Many Christians hold a <b>pile of puzzle pieces</b> (Jesus, Moses, the new covenant, the second coming…). Look at the <b>puzzle’s cover</b> — the big story — so you never get lost in the pieces.","The five words: <b>God, man, Jesus, cross, resurrection</b>. It has every part of a good story: beginning, conflict, resolution, restoration. In this story man cannot rescue himself; God has to.","<b>God</b> — the story is about him, not us (“our lives for God’s wonderful plan,” not God’s wonderful plan for our lives); everything belongs to him (we are tenants, he is the landlord); it’s a kingdom; reality is material <i>and</i> immaterial; and the problem of evil is a problem for atheism, not for Christians.","<b>Man</b> — body and soul, made in God’s image, so every person is “magnificent.” Man used his moral freedom to rebel (“you do you”) and broke everything: guilty, spiritually dead, enslaved to Satan and the flesh. God is angry <i>because</i> he is good.","<b>Jesus, cross, resurrection</b> — the God-man came to rescue us, even from the Father’s just wrath. At the cross he lived the life we should have lived and made a trade: <i>“Take me instead.”</i> “Tetelestai — it is finished.” Jesus takes our guilt; we take his goodness. At the final resurrection it will be either perfect justice or perfect mercy: either Jesus pays or you pay."],"scr":[["Gen. 1:1","“In the beginning, God created the heavens and the earth.”"],["John 1:1–3, 14","The Word who was with God and was God became flesh."],["Phil. 2:6–8","He emptied himself, taking the form of a servant, to death on a cross."],["Matt. 10:28","Fear the one who can destroy body and soul in hell — the Father."],["Col. 2:13–14","The certificate of debt, with its decrees against us, nailed to the cross."],["Luke 5:32; Matt. 20:28; Luke 19:10; John 3:17","Why Jesus came: to call sinners, give his life as a ransom, seek and save the lost, save
