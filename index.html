thing at all.”</div>"},{"t":"III. God Is Always at Work (vv. 5–6)","s":1868,"h":"<p>The Lord answers: <i>“Look among the nations and see. Wonder and be astounded. For I am doing a work in your days that you would not believe if told. For behold, I am raising up the Chaldeans…”</i> (Chaldeans = Babylonians).</p><p><b>1. God widens Habakkuk’s field of view.</b> Habakkuk has been staring at Judah; God says, “Zoom way out… look wider.” God is directing the movement of human history.</p><p><b>2. God answers every complaint, category for category:</b></p><ul><li>“How long?” → “In your days I will act.”</li><li>“You’re doing nothing.” → “I am doing a work.”</li><li>“Why do you make me see?” → “Look among the nations and see.”</li><li>“Violence!” → “I am bringing a greater violence to judge the violence you see.”</li></ul><p><b>3. But not the answer Habakkuk expected.</b> God will deal with Judah’s wickedness by raising up Babylon — brutal, merciless, bloodthirsty, conquest-driven; they “gather captives like sand,” and their “might is their god.” That creates a new problem: <i>can God be good if he uses a greater evil to judge a lesser one?</i> Pastor Mike left that deep conundrum for Pastor Andrew, who is preaching next.</p>"},{"t":"Application: Look Up","s":2239,"h":"<p>Pastor Mike admitted that on a Tuesday night he lay awake thinking, <i>“What in the world have I gotten us into? Preaching Habakkuk,”</i> but by Friday found the book “super relatable” and profoundly encouraging for Christians today.</p><p>We live a thousand miles an hour, so our field of vision shrinks — marriage strain, a wandering kid, trouble at work becomes the whole story. Habakkuk reminds us to <b>look up</b>: God is steering the nations and, if he steered Habakkuk’s world, he is steering our lives. The same is true of our cities, state and nation, even with midterm elections coming and the frustration politics stirs: <i>“How long, Lord?”</i></p><div class=\"key\">“My little frame is not the whole story.” God is sovereign; he will deal with every wicked ruler and injustice. I may not understand — I may not even like — what God is doing, but faith won’t judge God’s character by the small piece of the story in my frame.</div>"},{"t":"The Cross & the Invitation","s":2472,"h":"<p>When evil kicks down your door and you’re tempted to ask <i>Do you see? Do you care? Are you good? Do you even exist?</i> — <b>remember the cross.</b> There we see most clearly that God does not ignore evil; he dealt with it, judged it and defeated it. Every evil will face a reckoning.</p><p>The cross also shows that the problem is not only the evil <i>out there</i> but the evil <i>in here</i>. “We may not be as sinful as we could be, but we’re sinful enough” to incur God’s judgment. How can God judge the evil out there without judging us? Jesus took all our sin and bore the full judgment, paying it in full. <b>Either Jesus pays for my sin or I do.</b></p><p><b>Invitation:</b> if you’ve never turned to Jesus, turn to him in faith, turn from sin, trust his perfect work as your substitute, and cry out to him — right in your seat. The service then moved into communion.</p>"}],"qa":[{"q":"What’s one thing from Sunday’s sermon that stuck with you this week: a question, a conviction, or something especially impactful?"},{"q":"<b>Understanding the Text</b><br>Habakkuk lived in Judah’s last years, just before Babylon invaded. Good King Josiah had died, and the people had returned to their old sins. Read verses 2–4: who is committing the violence and injustice that Habakkuk condemns? (Look at: 2 Kings 23:36–37)"},{"q":"<b>Understanding the Text</b><br>Habakkuk speaks boldly to God, accusing Him of not hearing or intervening (vv. 2–3). Yet he brings his complaints to God rather than turning away. What does this teach us about the difference between honest lament and unbelief? (Look at: Psalm 13:1–2)"},{"q":"<b>Understanding the Text</b><br>God answers Habakkuk, but not as he expected: He is raising up the Chaldeans (Babylonians), an even more wicked nation, to judge Judah (vv. 5–11). What does God’s answer reveal about the assumptions we sometimes make concerning how God ought to act?"},{"q":"<b>Applying the Sermon</b><br>Pastor Mike’s first point: evil often strikes close to home. Habakkuk is grieved by the wickedness among God’s own people (v. 4). Why might injustice and unfaithfulness among God’s people be particularly grievous? How should we respond when we encounter it in the church?"},{"q":"<b>Applying the Sermon</b><br>Pastor Mike’s second point: God can seem painfully silent when evil strikes. Habakkuk continues crying out to God even when heaven seems silent. Have you experienced a season when God seemed unresponsive to your prayers? How did that affect your relationship with Him, and what can we learn from Habakkuk’s response?"},{"q":"<b>Applying the Sermon</b><br>Pastor Mike’s third point: God is always at work, often in ways we would never expect. Habakkuk knew God was righteous and just, yet his circumstances seemed to contradict what he knew of God. What should govern our understanding of God when our circumstances appear to contradict what He has revealed about Himself? (Look at: Isaiah 55:8–9)"},{"q":"<b>Knowing the Doctrine</b><br>God raises up the Chaldeans to accomplish His purposes, yet He still holds them guilty for their wickedness (vv. 6, 11). How does Scripture uphold both God’s absolute sovereignty and man’s responsibility for evil? Why is it important that we never surrender either truth? (Look at: Genesis 50:20; Isaiah 10:5–7; Acts 2:23)"},{"q":"<b>Sharing the Truth</b><br>A friend says, “If God is good and powerful, why doesn’t He stop evil?” How might Habakkuk 1 help you respond? What can we confidently affirm about God even when we cannot explain His particular purposes? (Look at: Romans 8:28; 2 Peter 3:9)"},{"q":"<b>Sharing the Truth</b><br>Years later, Paul used Habakkuk 1:5 in preaching Christ (Acts 13:38–41). At the cross, evil appeared to triumph, yet God was accomplishing our salvation. Who in your life is struggling to trust God, and how might you encourage them with the hope of the gospel this week?"}]},{"id":"hab2","yt":"FmhE9t7QCAM","tab":"Why, God?","color":"#c25e00","title":"Why, God?","meta":"Andrew Kelley · Oct 18, 2026 · Hope Chapel","ref":"Habakkuk 1:12–2:1","verse":"“Are you not from everlasting, O Lord my God, my Holy One? We shall not die… Is he then to keep on emptying his net and mercilessly killing nations forever? I will take my stand at my watchpost and station myself on the tower, and look out to see what he will say to me.”","big":"“Why, God?” is a dangerous but invited question — and Habakkuk shows how to ask it well: trust God’s goodness first, wrestle honestly with his providence, then hope in his deliverance from the watchtower.","take":["God does not forbid “Why, God?” — he invites us to bring our complaints to him, in humility.","The Bible acknowledges real evil and affirms that God is good, holding both in tension. It rejects the intellectual exit (“God doesn’t exist”) and the emotional exit (“He can stay in his corner”).","Trust God’s goodness first (v. 12): everlasting, the covenant Lord (Yahweh), holy, keeper of promises (“We shall not die”), with plans that are right and on purpose. Habakkuk starts from God’s character, then tries to understand his situation.","Wrestle with God’s providence (vv. 13–17): suffer without abandoning God, and succeed without replacing God. God’s sovereignty over sin is not approval of sin; success isn’t proof of favor, failure isn’t proof of judgment; God uses evil for good (Joseph, the cross); success can breed idolatry — exalting the gift, not the giver.","The greatness of a sin or trial doesn’t mean it’s permanent. In Christ, “your best days are ahead of you” — it ends in glory.","Hope in God’s deliverance (2:1) with patience, longing (not indifference), and listening — God has spoken in his word."],"scr":[["Hab. 1:12–2:1","Habakkuk’s second complaint and his watchtower."],["Hab. 1:5–6","God’s first answer: raising up the Chaldeans."],["Exod. 3:13–15","“I am who I am… the Lord… this is my name forever.”"],["Lev. 26:44; Deut. 4:31","God will not utterly destroy or forget his covenant."],["Rom. 8:28","All things work together for good for those who love God."],["Gen. 50:20","“You meant evil against me, but God meant it for good.”"],["2 Cor. 4:16–18","Light momentary affliction preparing an eternal weight of glory."],["Gen. 1:26–28","Mankind made to rule — the order of creation."],["James 1:17; Gal. 6:9","Every good gift from above; do not grow weary in doing good."],["Rom. 5:1; Rom. 8:1","Peace with God; no condemnation in Christ."],["Ps. 13; 2 Cor. 5:21","Lament and trust; Christ made sin for us."]],"secs":[{"t":"Opening: A Dangerous Question","s":143,"h":"<p>Pastor Andrew opened with his first reciprocating saw: a useful tool and a dangerous one (he met a man who cut off his own fingers). So is the question <b>“Why, God?”</b> It takes us to the edge of faith, stretches our emotional limits and brings us face to face with doubt — a high narrow path with despair on one side and resentment on the other.</p><p>Everyone has asked it: over small things (a parking space, no Wi-Fi) and over things no one would challenge — a failing marriage, a wayward child, a lost job, a loss, a diagnosis. In one room there is enough combined suffering to crush one person. It is a divine mercy we don’t know our future hardships.</p><div class=\"key\">What’s remarkable about Christianity is that God does not forbid the question — he invites it. We can bring our complaints about God to God (humbly, not arrogantly).</div>"},{"t":"Context & the Problem of Evil","s":366,"h":"<p>Josiah was a good king; the law was found; the people were renewed. Then his sons were bad kings and things went downhill, with the Babylonians about to take the Jews into exile. Habakkuk cried out about evil among his own people (violence, strife, a paralyzed law, perverted justice). God answered (1:5–6): he’s raising up the Chaldeans — <i>a more destructive, more violent, more sinful nation</i>. Not a quick renewal, but ruin and judgment. Habakkuk now faces the problem of evil.</p><p><b>The problem, stated:</b> God is all good, all powerful and evil exists — and those can’t all be true.</p><ul><li><b>The intellectual exit:</b> “God obviously doesn’t exist” (at least not as the Bible describes him).</li><li><b>The emotional exit</b> (more common): “My life is a shipwreck… Maybe God exists, but I don’t trust him anymore. He can stay in his corner and I’ll stay in mine.”</li><li>Others redefine or cope with evil.</li></ul><p><b>The Bible does two things at once:</b> it acknowledges gross, egregious evil — no sugarcoating — and it affirms that God is good, holding both in tension. Habakkuk shows what asking “Why, God?” well looks like. (Pastor Andrew noted he wouldn’t immediately solve the problem; the text’s answer is helpful but not the one our Western minds expect. A session on it is at next weekend’s Apologetics Conference.)</p>"},{"t":"I. Trust in God’s Goodness (v. 12)","s":715,"h":"<p><i>“Are you not from everlasting, O Lord my God, my Holy One? We shall not die. O Lord, you have ordained them as a judgment, and you, O Rock, have established them for reproof.”</i> Habakkuk leans <b>in</b> to God’s goodness, not away: the substance of faith isn’t understanding all God’s plans, it’s <b>knowing God’s character.</b> He rehearses:</p><ul><li><b>Everlasting</b> — God has always existed, is all powerful and all knowing; nothing outside his control. Suffering can exhaust us; it won’t exhaust or overpower God, and when suffering ends God is still there. This loosens suffering’s grip.</li><li><b>Lord (Yahweh)</b> — the covenant name God gave Moses (Exod. 3: “I am who I am… this is my name forever”). Not a philosophical construct but the God who called Abraham, sent Moses, raised up David: invested in his people, close by, bound to them and working for them.</li><li><b>Holy One</b> — set apart, in a category by himself; his ways higher than ours; nothing wrong with him; everything he does is right.</li><li><b>His promises are certain — “We shall not die.”</b> Not “we shall not suffer, be harmed, oppressed, exiled or scattered,” but the judgment won’t be final and the destruction won’t be total. (Lev. 26:44; Deut. 4:31.) In suffering we remember that God keeps his promises.</li><li><b>His plans are right</b> — “ordained… for reproof” (correction). A hard word: the difficult plans are on purpose. Your life is not an accident or improvised; he will not waste what he’s given you. Looking back, most see how he used suffering to shape them for good (Rom. 8:28).</li></ul><div class=\"key\">When I suffer my heart says, “Prove to me you’re good again… show me your resume.” Habakkuk does the opposite: he affirms that God is good, <i>then</i> tries to understand his situation.</div>"},{"t":"II. Wrestle with God’s Providence (vv. 13–17)","s":1213,"h":"<p>Habakkuk offers a real complaint: God is too pure to look at evil, so why does he idly watch traitors and stay silent when the wicked swallow the more righteous? Pastor Andrew wants both edges of the sword: <b>learn to suffer without abandoning God, and to succeed without replacing God.</b> First, the imagery:</p><ul><li><b>Fish with no ruler (v. 14)</b> — a callback to creation: humans made to rule as God’s vice-regents in an ordered creation. Babylon’s devastation feels like creation disordered; God’s people treated as meaningless as fish, without a ruler, vulnerable (Gen. 1:26–28).</li><li><b>Hook, net, dragnet (v. 15)</b> — one hook catches one fish; a net a few more; a dragnet sweeps up everything. Progressive devastation, and no escape from the coming judgment.</li></ul><p><b>Lessons from the section:</b></p><ol><li><b>God’s sovereignty over sin is not approval of sin.</b> Evil people sometimes win — cruel nations, bad political ideas, the dishonest coworker promoted over you. Don’t assume trouble means God hates you or ease means he loves you; success ≠ approval, failure ≠ hatred. This kills pride and jealousy together, because God looks on the inside. Ask: is my success leading me to believe I have favor when I’m not obedient?</li><li><b>God uses evil for good.</b> Joseph: “You meant evil against me, but God meant it for good” (Gen. 50:20) — he doesn’t call the evil “no big deal.” Bigger still: <b>the gospel.</b> Humans are rebels guilty in a cosmic court; God became man, lived perfectly, and we killed him — betrayal, unjust trials, beating, crown of thorns, cross. What great evil! Yet at the cross, in the death of Christ, we see the death of death. Jesus carried no sin of his own, so he could carry ours; he “became sin for us”; we take his righteousness.<div class=\"key\">Before the judge, the only advocate you could ever have is Christ — not your mom, spouse, children or pastor. If you’ve repented and turned to him, you present his perfect bill of health and escape wrath. If you haven’t, you are not safe. Today is the day of salvation (elders were available for prayer).</div></li><li><b>Success can produce idolatry (v. 16).</b> Babylon sacrifices to his net, worshiping the tools that gave him luxury — “exalting the gift and not the giver.” Like his daughter thanking the dollhouse instead of her grandparents. We worship money (checking the bank account), family (joy rises and falls with their health), vocation, credit cards, achievements, medals — confusing creation with Creator. Pastor Andrew wants to succeed without replacing God.</li><li><b>The greatness of a sin doesn’t mean it’s permanent (v. 17).</b> The man endlessly empties his net onto the beach — “forever?” When we suffer, it always feels long-term, hopeless, like it will never stop raining. We have a limited view of life and history. Everyone who has persevered through suffering looks back and says that’s what they needed to hear: God is good, keeps his promises, and suffering doesn’t ultimately last.<div class=\"key\">No matter how dark life gets, if you are in Christ it ends in glory (2 Cor. 4:16–18): “your best days are ahead of you.”</div></li></ol>"},{"t":"III. Hope in God’s Deliverance (2:1)","s":2540,"h":"<p><i>“I will take my stand at my watchpost and station myself on the tower, and look out to see what he will say to me, and what I will answer concerning my complaint.”</i> The movement: affirm God’s goodness → lay out the complaint → return to the watchtower to hope. Three postures of hope:</p><ul><li><b>Patience.</b> A watchman doesn’t control when what he’s watching for arrives. God brought great good from Babylon’s destruction, though Habakkuk never saw it: exile → <b>synagogues</b> in every major city (where Paul later went first, finding receptive God-fearers); Alexander and Greece → one common language (the New Testament was written in Greek); Rome → roads. Brutal empires, yet God used them. We must trust him even if we don’t see the fruit in our lifetime — in discipling our kids, evangelizing our cities, staying obedient to the one true God.</li><li><b>Longing, not indifference.</b> Don’t detach or refuse to hope so you won’t look foolish. “You don’t have to hedge your emotional bets” — you can wholeheartedly and riskily hope in Christ’s return. He won’t let you down.</li><li><b>Listening.</b> Habakkuk is ready to hear God speak. We need God to speak — and he has, in his word.</li></ul>"}],"qa":[{"q":"What’s one thing from Sunday’s sermon that stuck with you this week: a question, a conviction, or something especially impactful?"},{"q":"<b>Understanding the Text</b><br>Read verse 12. Habakkuk is about to pour out a complaint, but he begins by naming who God is. What truths about God do we find in this verse?"},{"q":"<b>Understanding the Text</b><br>In verse 12 Habakkuk says, “We shall not die.” He does not say: we shall not suffer, be scattered, or be exiled. What is the difference between God sparing us from suffering vs God preserving us through them? (Look at: Leviticus 26:44; Deuteronomy 4:31)"},{"q":"<b>Understanding the Text</b><br>Read verses 14-15. Habakkuk pictures people as fish with no ruler, caught first with a hook, then a net, then a dragnet that sweeps the whole sea. What do these pictures show about how evil and injustice feel to the people living under them? (Look at: Genesis 1:26-28)"},{"q":"<b>Applying the Sermon</b><br>Pastor Andrew admitted that when something goes wrong, his heart says, “God, you need to explain yourself to me.” Habakkuk did the opposite: he started from God’s goodness, then aired his complaint. When life does not make sense, what helps you take confidence in God’s unchanging character instead of demanding answers?"},{"q":"<b>Applying the Sermon</b><br>Babylon worships the tools that made him rich (v. 16). Pastor Andrew said we do the same when we “rest in the gift and not the giver,” like his daughter thanking the dollhouse instead of her grandparents. How can you tell when a good gift has started to take God’s place in your life? (Look at: James 1:17)"},{"q":"<b>Applying the Sermon</b><br>Habakkuk never saw it, but God used Babylon’s evil to spread the gospel: exile created the synagogues, Greece spread one shared language, and Rome built the roads. God may bring good from your obedience that you will never see. Where is God calling you to stay faithful even without visible results? (Look at: Galatians 6:9)"},{"q":"<b>Knowing the Doctrine</b><br>Pastor Andrew said we should not read success as God’s favor or failure as his judgment. Yet everyone wants to know where they stand with God. If our circumstances cannot tell us, what can? (Look at: Romans 5:1; Romans 8:1)"},{"q":"<b>Sharing the Truth</b><br>Many people can slowly drift away and stop trusting God after life disappoints them: “He can stay in his corner. I’ll stay in mine.” How would you respond to a friend who feels this way? (Look at: Psalm 13)"},{"q":"<b>Sharing the Truth</b><br>Pastor Andrew said the Bible does not teach that good people go to heaven and bad people go to hell. It teaches that at the cross “a trade is made”: Jesus takes our sin, and we receive his righteousness. How would you explain this trade in your own words to a friend who thinks being good is enough? (Look at: 2 Corinthians 5:21)"}]},{"id":"story","yt":"LGPnzMgfOi4","tab":"Story of Reality","color":"#5e5ce6","title":"The Story of Reality","meta":"Greg Koukl (guest) · Oct 25, 2026 · Hope Chapel","ref":"The big story: Genesis to Revelation","vref":"Gen. 1:1; John 1:1–14","verse":"“In the beginning, God created the heavens and the earth.” … “In the beginning was the Word… And the Word became flesh and dwelt among us.”","big":"Christianity is not a private spiritual fantasy but a picture of reality — one true story that can be told in five words: God, man, Jesus, cross, resurrection. It starts with God, explains why the world is broken, and shows why Jesus alone is the rescue.","take":["Christianity is more than a religion, a lifestyle or an inner relationship: it is <b>a picture of reality</b> — a world view, a description of how things actually are. Not “true for me,” true to the way the world is; history, not fiction.","Many Christians hold a <b>pile of puzzle pieces</b> (Jesus, Moses, the new covenant, the second coming…). Look at the <b>puzzle’s cover</b> — the big story — so you never get lost in the pieces.","The five words: <b>God, man, Jesus, cross, resurrection</b>. It has every part of a good story: beginning, conflict, resolution, restoration. In this story man cannot rescue himself; God has to.","<b>God</b> — the story is about him, not us (“our lives for God’s wonderful plan,” not God’s wonderful plan for our lives); everything belongs to him (we are tenants, he is the landlord); it’s a kingdom; reality is material <i>and</i> immaterial; and the problem of evil is a problem for atheism, not for Christians.","<b>Man</b> — body and soul, made in God’s image, so every person is “magnificent.” Man used his moral freedom to rebel (“you do you”) and broke everything: guilty, spiritually dead, enslaved to Satan and the flesh. God is angry <i>because</i> he is good.","<b>Jesus, cross, resurrection</b> — the God-man came to rescue us, even from the Father’s just wrath. At the cross he lived the life we should have lived and made a trade: <i>“Take me instead.”</i> “Tetelestai — it is finished.” Jesus takes our guilt; we take his goodness. At the final resurrection it will be either perfect justice or perfect mercy: either Jesus pays or you pay."],"scr":[["Gen. 1:1","“In the beginning, God created the heavens and the earth.”"],["John 1:1–3, 14","The Word who was with God and was God became flesh."],["Phil. 2:6–8","He emptied himself, taking the form of a servant, to death on a cross."],["Matt. 10:28","Fear the one who can destroy body and soul in hell — the Father."],["Col. 2:13–14","The certificate of debt, with its decrees against us, nailed to the cross."],["Luke 5:32; Matt. 20:28; Luke 19:10; John 3:17","Why Jesus came: to call sinners, give his life as a ransom, seek and save the lost, save the world."],["Ps. 24:1; 1 Cor. 6:19–20","The earth is the Lord’s; you are not your own."],["Gen. 1:26–27; James 3:9","Made in God’s image."],["Gen. 3:4–5; John 8:34","The serpent’s lie; everyone who sins is a slave to sin."]],"secs":[{"t":"Welcome & the Problem of “Religion”","s":0,"h":"<p>Greg Koukl (founder of Stand to Reason), who first spoke at Hope Chapel in 1976 and has been away about 30 years, said he wanted to tell a familiar story that few understand even if they call it their own: how the world began, how it ends, and everything important in between — <b>the story of reality.</b></p><p>The problem: on an airplane, a stockbroker who asks what he does will politely assume religion is a “spiritual fantasy” — everyone has their own, whatever works for them. Greg doesn’t want his convictions heard that way, and many Christians, influenced by the culture, haven’t fully grasped the alternative.</p>"},{"t":"What Is Christianity? A Picture of Reality","s":257,"h":"<p>A rhetorical question: <b>What is Christianity?</b> Common answers — a religion; a satisfying way to live; a moral structure; a relationship — are good but not deep, and they’re all about the <i>inside</i>.</p><div class=\"key\">The correct answer: Christianity is a picture of reality — an account of the way things actually are. That’s why it’s called a world view.</div><p><b>The puzzle:</b> for many Christians it’s a <i>pile of pieces</i> — Jesus, Moses, the new covenant, Joshua, the Red Sea, the second coming, the disciples. If you’ve never put it together coherently you don’t know if you have all the pieces, or if pieces from other worldviews (like reincarnation — a carburetor on a computer) have crept in. The trick to a puzzle is to <b>look at the picture on the box</b>; today Greg shows the cover.</p><p><b>It’s also a story</b> — peace shattered by rebellion, love and betrayal, conflict, self-sacrifice, redemption — with a beginning (characters and world), conflict, resolution, restoration (“denouement”). And it doesn’t begin “once upon a time”: not a myth or Narnia-style make-believe, but history. “It’s not my fantasy. It’s reality.”</p>"},{"t":"Why the Story Matters: Two Big Challenges","s":716,"h":"<ul><li><b>The problem of evil</b> — why is the world such a mess if God is good and powerful? Seen in the story, it’s not a problem for Christians the way people think. It’s a problem for atheists (see below).</li><li><b>“Why is Jesus the only way?”</b> — politically incorrect, but singular problems often have singular solutions (cancer: surgery, chemo, radiation).</li></ul><p><b>The backbone — five words:</b> <b>God, man, Jesus, cross, resurrection</b> (the final resurrection to reward or judgment). God starts everything and makes it from nothing; creates man for friendship; man gets in trouble; God initiates a rescue — unique to this story, because man cannot rescue himself. God comes down in Jesus, and how Jesus lives and dies determines what happens to everyone in the final resurrection. (Greg’s 6-year-old daughter could tick the words off on her fingers.)</p>"},{"t":"1. God — “In the beginning, God…”","s":1015,"h":"<ul><li><b>The story starts with God because it’s about God</b> — not me. “It’s not so much about God’s wonderful plan for our lives as our lives for God’s wonderful plan.” When we ask “How could God let this happen <i>to me</i>?” we’re assuming the story is about us. “The tail should not be wagging the dog.”</li><li><b>Everything belongs to God</b> because he made it. Against “my body, my choice”: maybe you’re the tenant and he’s the landlord (C. S. Lewis).</li><li><b>It’s a kingdom</b> — a king and his domain; a civil war is coming, but he is still king. John, Jesus and the disciples proclaim the kingdom to draw people back under the rightful ruler: God is in charge.</li><li><b>Reality is material and immaterial</b> — visible and invisible. Water into wine, resurrection, virgin birth “don’t happen” only if your picture of reality is the atheist story (“the cosmos is all there is”). In this story it’s an enchanted world.</li><li><b>Evil is a defeater for atheism, not for Christianity.</b> Everyone knows the world is broken, “not the way it’s supposed to be” — so there’s a way it’s supposed to be, which means a “supposer.” No God → no transcendent moral rules → no broken rules → no real evil. But there is real evil, so there is a lawgiver.</li><li><b>Everything God made was good</b> — exactly as his mind intended.</li></ul>"},{"t":"2. Man — Made in God’s Image, Then Rebellion","s":1440,"h":"<p><b>What we are:</b> physical (contingent, mortal — never “little gods”) <i>and</i> non-physical: a soul, the invisible self united with the body. Animals have souls too (“Fido has a very little soul”), but only humans are made in the <b>image of God</b> — so every person, any size, age, ability or attractiveness, is <b>magnificent</b>. (C. S. Lewis: if you saw a human’s true essence you’d be tempted to worship; cf. 2 Cor. 4 “eternal weight of glory.”) The image of God grounds our moral obligations to each other (we are animals, but not <i>mere</i> animals) and makes friendship with God possible. God also gave a wonderful place and, most of all, himself.</p><p><b>The rebellion:</b> man could live in harmony under God’s rule — or betray him. That’s moral freedom, and man used it to betray. “You do you” is not new — it’s from the beginning: what I want dictates my “authentic self” rather than God’s law and created order. An enemy tells Adam and Eve the king can’t be trusted, he’s holding out on you, “be like God.” One act of disobedience changes everything.</p><p><b>The result:</b> rebellion doesn’t bring freedom but brokenness, disgrace, guilt, slavery and struggle. Still beautiful in God’s image, humans are now twisted, in rebellion, spiritually dead, and enslaved twice — to Satan (a real, dangerous being, not a man in red tights; “the whole world lies in the power of the evil one”) and to their own corrupted nature (“the flesh”). Mankind is guilty of sedition, and the king is angry.</p><div class=\"key\">“Why is God angry if he’s love?” Because he is good. The same goodness and holiness that produce his love also ground his justice — it wouldn’t be good if he let the guilty go free.</div><p>Like a parent’s boundaries, God knows how the world works and made us for flourishing. Breaking his rule broke our relationship with God, with each other and with creation (which groans for redemption). A broken world produces broken people and circumstances. Two things about the problem of evil: <b>it’s part of the story</b> (it starts in Genesis 3 and doesn’t end for 66 books), and <b>the story is not over yet</b> — Lord of the Rings looks bleak in the cave, but keep reading.</p>"},{"t":"3. Jesus — Who He Was & What He Came to Do","s":2148,"h":"<p>With man lost and helpless, God steps in. Two essentials: <b>who Jesus was</b> and <b>what he came to do</b> (the person and work of Christ).</p><p><b>Who he was:</b> fully human — body, soul, mind, feelings, limits (hungry, tired, grieving, joyful, suffering) — <i>and more</i>. John 1 begins as Genesis does: “In the beginning was the Word… the Word was God… all things came into being through him” — the uncreated Creator. Then: “the Word became flesh and dwelt among us.” Greg’s favorite — <b>sublime</b>: God got low and small, like a parent kneeling to comfort a child. He never ceased being God; he laid aside privileges, emptied himself, took a servant’s form, and died a criminal’s death (Phil. 2) — the definition of humility. This is not the Jesus of Islam, Jehovah’s Witnesses, LDS, or Oprah/New Age; they’d admit it.</p><p><b>What he came to do — not</b> to spread peace and love or restore social justice. (Greg’s articles: “The Legend of Jesus the Social Justice Warrior” and “Why the Blood?” at str.org; John’s whole gospel never frames his mission that way. It isn’t that Jesus didn’t care.) In his own words: <i>“I did not come to call the righteous but sinners to repentance… to give my life a ransom for many… to seek and save the lost… that the world might be saved.”</i> “Save” means rescue from imminent danger. From what? From <b>whom</b>: the Father. It’s the king we’ve rebelled against (Matt. 10:28 — fear the one who can throw body and soul into hell; that’s the Father, not the devil). That’s the bad news — now the good.</p>"},{"t":"4. The Cross — The Trade","s":2695,"h":"<p>Jesus did two things: <b>lived the life we should have lived</b>, then <b>made a trade</b> by the way he died.</p><div class=\"q\">The airplane conversation: a Muslim woman, dissatisfied with Islam given current events. Greg: imagine terrorists coming down the aisle to drag you out; I put my arms in front of you and say, “Don’t take her. Take me instead.” She said, “I cannot imagine anybody doing that for me.” That’s what God did in Jesus — not Allah but Yahweh, not Muhammad but Jesus: God came down and said to the Father, “Take me instead.”<cite>— Golgotha, “the place of the skull”; Calvary</cite></div><ul><li>Crucifixion normally kills by suffocation (they broke the thieves’ legs to hasten death) — but there was a deeper, unseen agony: God the Father unleashing his fury on his sinless Son as if he were guilty of all sin.</li><li><b>The titulus</b> — “King of the Jews” — the stated crime (sedition under Rome). In the ancient world a paid debt was marked <i>tetelestai</i> (“paid, canceled, finished”). But the real certificate nailed to the cross is the one in <b>Colossians 2</b>: our “certificate of debt consisting of decrees against us” — every sin each of us committed, our rap sheet. Between the sixth and ninth hours, the trade took place.</li><li><b>“Either Jesus pays, or you pay.”</b> Jesus’ cry <i>Tetelestai</i> — “It is finished” — is a <b>victory cry</b>, not “I’m glad that’s over”: the debt of everyone who trusts him is paid in full. <b>Jesus takes our guilt; we take his goodness.</b></li></ul><div class=\"key\">This is why Jesus is the only way: he alone solved the problem. Nobody else did it; nobody else could. It is a gift — it can’t be earned or bought, only received by trusting him. That is what the story means by <b>faith</b>.</div>"},{"t":"5. Resurrection — Justice or Mercy","s":3075,"h":"<p>Your decision about this rescue determines what happens to everyone in the final resurrection. History’s final event brings one of two things:</p><ul><li><b>Perfect justice</b> — punishment for every crime you committed; Jesus misses nothing (“you will give an account of every idle word”). Those who reject God’s mercy in Christ are judged by their works and banished from God’s presence forever.</li><li><b>Perfect mercy</b> — forgiveness for everything you’ve done wrong; Jesus misses nothing. Those who cease their rebellion and receive God’s pardon become members of his family and live with him in a new world — the perfect life he intended — forever.</li></ul>"},{"t":"The Story in One Sentence & Close","s":3193,"h":"<div class=\"key\">God, the creator of the universe, in order to rescue man from punishment for his rebellion, took humanity on in Jesus, the savior, to die on a cross and rise from the dead, so that in the final resurrection we could enjoy a wonderful friendship with our sovereign Lord in the kind of perfect world our hearts have always yearned for.</div><p>The story of how the world began and ends: goodness → rebellion and brokenness → rescue → the trade → mercy and final justice → the end of evil → full restoration, and for those who trust the rescuer, unending friendship with a Father who satisfies the deepest longings of the heart. “As Lewis put it, the door we’ve been knocking on all our lives will finally open.” If you’re a Christian this is your story; if not, <b>this is still your story</b> — it’s the way things really are. “Not just a story… the true story.”</p><p>The service then moved to communion.</p>"}],"qa":[{"q":"What was the most impactful part of Sunday’s talk: a question it raised, a conviction, or something you have kept thinking about?"},{"q":"<b>Understanding the Story</b><br>Greg opened his talk with a question: What is Christianity? How would you normally answer that if asked?"},{"q":"<b>Understanding the Story</b><br>Greg’s answer was that Christianity is “a picture of reality,” a description of the way the world actually is. Most people, he said, treat religious beliefs as personal, not as facts about the world. How does his answer differ from the answers we just gave?"},{"q":"<b>Understanding the Story</b><br>Greg said the whole story can be told in five words, in order: God, man, Jesus, cross, resurrection. He also said every good story has four parts: a beginning, a conflict, a resolution, and a restoration. Which of the five words belong to each part?"},{"q":"<b>Applying the Talk</b><br>The story starts with God, not us. Greg said everything belongs to God because he made it: we are tenants; he is the landlord. Where in your life is it hardest to live as a tenant, not the owner? (Look at: Psalm 24:1; 1 Corinthians 6:19-20)"},{"q":"<b>Applying the Talk</b><br>Then God made man. Greg said one thing is true of every person: each is made in the image of God, which makes every human being “magnificent.” How does/should seeing people this way change how you treat those who are hardest for you to love? (Look at: Genesis 1:26-27; James 3:9)"},{"q":"<b>Applying the Talk</b><br>Then man rebelled. Greg traced “you do you” back to the garden: make your own rules, “freedom awaits you.” But the revolt brought “brokenness and disgrace and guilt and slavery” instead. Where have you seen “you do you” promise freedom and deliver the opposite? (Look at: Genesis 3:4-5; John 8:34)"},{"q":"<b>Knowing the Doctrine</b><br>Then God stepped in. Greg said the two things we must know about Jesus are who he was and what he came to do. What is the answer to each of these in your own words? (Who he was: John 1:1-3, 14; Philippians 2:6-8. What he came to do: Luke 5:32; Matthew 20:28; Luke 19:10; John 3:17) Why does what Jesus came to do depend on who he is?"},{"q":"<b>Sharing the Truth</b><br>A friend asks “Why is Jesus the only way?” – How would you answer?"},{"q":"<b>Sharing the Truth</b><br>The story ends at the final resurrection: “either perfect justice or perfect mercy.” Greg said that if you are not a Christian, “this is still your story.” Take the rest of your time here. Using the five words, tell the story together: what is the gospel?"}]},{"id":"wins","yt":"ALGlPJkfTvI","tab":"God Wins","color":"#0a84a8","title":"God Wins","meta":"Mike Nazarian · Nov 8, 2026 · Hope Chapel","ref":"Habakkuk 2:6–14","verse":"“For the earth will be filled with the knowledge of the glory of the Lord as the waters cover the sea.”","big":"You can win a battle and still lose the war. Temporary success is not ultimate victory: the glory of man will fail on this earth, but in the end the glory of the Lord will fill the earth — and that glory is revealed in Jesus. In the end, God wins.","take":["There is a big difference between winning a battle and winning the war. Sometimes God’s enemies seem to prosper, but <b>temporary success is not the same thing as ultimate victory.</b>","Habakkuk may not understand what God is doing, but he can know and trust the God who is doing it — “the righteous shall live by faith” (2:4).","Three of Babylon’s five woes: <b>what man plunders will perish</b> (greed); <b>what man secures will fade</b> (no nest is high enough); <b>what man builds will fall</b> (empires labor “for fire”).","These woes are put on the lips of the nations Babylon trampled — a great reversal. Wicked gain can never provide lasting security; there is always a reckoning.","God’s promise (v. 14): the earth will be filled with the <b>knowledge</b> of his <b>glory</b> “as the waters cover the sea” — fulfilled through the reign of Jesus (Num. 14:21; Isa. 11; 2 Cor. 4:6).","Babylon wanted to acquire, secure and exalt itself by crushing others. Jesus humbled himself to save others. Every knee will bow — and Jesus took the judgment we deserve."],"scr":[["Hab. 2:6–14","Five woes on Babylon (three covered), and the promise of v. 14."],["Hab. 2:4","“The righteous shall live by faith” — quoted in Romans, Galatians and Hebrews."],["2 Kings 25:6–7","Nebuchadnezzar’s brutality: Zedekiah’s sons executed before his eyes."],["Num. 14:21","“All the earth shall be filled with the glory of the Lord.”"],["Isa. 11:1–5, 9","The coming king from the stump of Jesse; the earth full of the knowledge of the Lord."],["2 Cor. 4:6","The knowledge of the glory of God in the face of Jesus Christ."],["Phil. 2:5–11","Jesus humbled himself; every knee will bow."]],"secs":[{"t":"Opening: Winning the Battle vs the War","s":64,"h":"<p>Pastor Mike opened with a short prayer confessing, “you are God and we are not,” then a reflection from preparing this message: in life you can win a battle and still lose the war — experience temporary success and still suffer ultimate defeat.</p><p>Sometimes it looks like God’s enemies are winning: those who oppose God prosper, darkness holds power, and we wonder, <i>Lord, where are you? Why are you allowing this?</i></p><div class=\"key\">Temporary success is not the same thing as ultimate victory — and that is what God shows us in Habakkuk 2:6–14.</div><p><b>Two truths:</b> (1) the glory of man will fail on this earth; (2) the glory of the Lord will fill the earth.</p>"},{"t":"Getting Oriented","s":300,"h":"<p>Honest confession: we gravitate to John, Proverbs or Ephesians, not Habakkuk or Zephaniah — read three lines, then have to read them again. Pastor Mike reinforced Andrew’s message from last week on <b>the clarity of Scripture</b>: it really can be read and understood with a little effort.</p><ul><li><b>Habakkuk</b> grieves the spiritual, moral and social decline of Judah — rebellion against God and hostility between people.</li><li>He lives between the fall of Assyria (which God used to judge the northern kingdom) and the rise of Babylon (which God would use to judge Judah), right after Josiah’s reforms and renewal — then Josiah was killed and the kings plunged the nation back into idolatry.</li><li>God’s answer: he’s raising up the Babylonians. That creates a bigger problem — they’re <i>more</i> wicked. So Habakkuk takes his stand on the watchtower (2:1).</li><li><b>2:4 — “The righteous shall live by faith.”</b> Quoted in Romans, Galatians and Hebrews, at the heart of the gospel. Habakkuk may not understand what God is doing, but he can know and trust the God who is doing it. So can we.</li></ul><p>Then God turns to Babylon, an arrogant man whose appetite for conquest is never satisfied, and announces <b>five woes</b>. “Woe” signals coming judgment — a solemn declaration that God will act decisively (the NLT: “What sorrow awaits you!”). Strikingly, God puts these woes on the lips of the nations Babylon trampled: one day they will taunt Babylon because God has brought her low. Together the woes expose the futility of man’s attempt to establish his own glory and permanence in opposition to God.</p>"},{"t":"I. The Glory of Man Will Fail — Woe 1: What Man Plunders Will Perish (vv. 6–8)","s":642,"h":"<p><i>“Woe to him who heaps up what is not his own — for how long! — and loads himself with pledges.”</i></p><p>Babylon was notorious for brutality. When it conquered Judah, Nebuchadnezzar had King Zedekiah’s sons executed in front of him, then put out his eyes so the last thing he ever saw was the execution of his sons. Babylon enriched itself by conquering nations, brutalizing people and plundering wealth.</p><p><b>How it relates to us:</b> most of us aren’t pillaging our cul-de-sacs, but the temptation under Babylon’s lust for conquest isn’t foreign: <b>greed — the relentless desire for more.</b></p><ul><li>John D. Rockefeller, asked how much money is enough, reportedly said, “just a little bit more.”</li><li>Greed is never satisfied. It tempts us to justify what we know is wrong — cut corners, compromise integrity, take advantage of others.</li><li><b>Greed dehumanizes:</b> we value what we can get from people more than the people themselves. Babylon saw nations not as peoples to care for but peoples to plunder.</li></ul><p><b>The reversal (vv. 7–8):</b> your debtors will suddenly arise; “because you have plundered many nations, all the remnant of the peoples shall plunder you.” The plunderer becomes the plundered.</p><div class=\"key\">Wicked gain can never provide lasting security. There’s always an accounting. God sees, God knows, God will judge and make things right — so what man plunders will perish.</div><p>This should scare those tempted that way — and encourage those who are discouraged by how much of it they see.</p>"},{"t":"Woe 2: What Man Secures Will Fade (vv. 9–11)","s":1112,"h":"<p>The woes stack: the first exposes Babylon’s lust to <i>acquire</i>; the second its desire to <i>secure</i> what it has stored.</p><p><i>“Woe to him who gets evil gain for his house, to set his nest on high to be safe from the reach of harm!”</i> Like an eagle building its nest high on a cliff, out of reach of predators — Babylon plundered and protected itself to be untouchable. (Verses 10–11: shame, a forfeited life, and the stones crying out from the wall.)</p><p><b>Bringing it home:</b> “Work hard, invest, stack, save, plan.” Nothing wrong with that — the Bible commends wise and shrewd living. But we can believe that if I accumulate enough money and security, I’ll finally be safe. Then where have I put my ultimate faith?</p><ul><li>How much is enough? “Just a little bit more.”</li><li>How much money would guarantee nothing could go wrong — that your health never failed or your children never suffered? There’s no amount.</li><li>We keep building our nest a little higher on the cliff, looking to storehouses, savings accounts and portfolios for a security only God can give.</li></ul><div class=\"key\">There’s nothing wrong with building some material security. The question is what my <i>ultimate</i> security is — where my heart is vested. It’s wrong to make security my god, especially if I trample or use others to get it. No amount of wealth or earthly power protects us from God’s judgment; no nest is built high enough to put you beyond the reach of his justice.</div>"},{"t":"Woe 3: What Man Builds Will Fall (vv. 12–13)","s":1353,"h":"<p>Babylon wanted to acquire, to secure, and a third step: to <b>exalt itself</b>. <i>“Woe to him who builds a town with blood and founds a city on iniquity!”</i> “Babylon the Great” — a magnificent city built with the blood of other civilizations, a monument to its own greatness.</p><p><b>Verse 13:</b> “Behold, is it not from the Lord of hosts that peoples labor merely for fire and nations weary themselves for nothing?” In other words, God himself has determined that all of Babylon’s labor, ambition, conquest, storing up and nest-building is destined for the fire. The NLT: <i>“The wealth of nations will turn to ashes. They work so hard but all in vain.”</i> Empires try to be empires, but God sits in the heavens and laughs.</p><p><b>Fulfilled:</b> about 70 years after Habakkuk, God raised up Cyrus the Great of Persia to crush the Babylonians, who were relegated to the annals of history. “God did exactly what he said he would do.”</p><p><b>A timely word:</b> Pastor Mike (not choosing a side or advocating a candidate) acknowledged many are troubled by the direction of our nation and world — headlines and social media show things contrary to God’s word — and we cry out like Habakkuk, <i>How long, O Lord?</i></p><div class=\"key\">God’s answer to Habakkuk was not that wickedness would never gain power — Babylon gained power — but that wickedness would <b>never have the last word</b>, because he would. God has not lost his sovereignty; Christ is still on his throne, directing history to its prescribed ends. When discouraged, look up and remember: the righteous shall live by faith, trusting the God who is working even when you can’t see how.</div><p><b>The warnings are for us too.</b> They dismantle our natural illusions: that <i>more will satisfy</i>, that <i>security will protect</i>, that <i>achievement will give significance</i>. Babylon pursued all three by wicked means and none lasted — God always has the final word. So the glory of man will ultimately fail.</p>"},{"t":"II. The Glory of the Lord Will Fill the Earth (v. 14)","s":1735,"h":"<p><i>“For the earth will be filled with the knowledge of the glory of the Lord as the waters cover the sea.”</i> Four observations:</p><ol><li><b>It’s a promise.</b> Empires rise and fall — Egyptians, Assyrians, Babylonians, Persians, Greeks, Romans, Ottomans — but here God promises something that will never pass away into history: “the earth will be filled.”</li><li><b>It’s the <i>knowledge</i> of his glory.</b> Not everyone knows God today; “to know” also means to acknowledge. Some ignore him, reject him or worship gods of their own making. A day is coming when the whole earth will observe, recognize and acknowledge his glory — completely, “as the waters cover the sea.”</li><li><b>What is God’s glory?</b> His supreme greatness; the magnificent display of all he is — holiness, righteousness, goodness, wisdom, power (the Old Testament shekinah glory). The Hebrew <i>kabod</i> carries the idea of weight and worth: there is no one greater or more worthy than God.</li><li><b>It will be fulfilled through the reign of Jesus.</b> Numbers 14:21: “All the earth shall be filled with the glory of the Lord.” Isaiah 11:9: “The earth shall be full of the knowledge of the Lord as the waters cover the sea.” Habakkuk pulls the two together. Isaiah 11 describes a coming king from the stump of Jesse, with the Spirit of the Lord upon him, who judges the poor with righteousness and decides with equity for the meek — <i>that is Jesus.</i> And 2 Corinthians 4:6: “the knowledge of the glory of God in the face of Jesus Christ.” When we look at Jesus, we see God; the earth will be filled with the recognition that Jesus is Lord.</li></ol>"},{"t":"Babylon vs Jesus","s":2211,"h":"<p><b>Babylon:</b> acquire, secure, exalt itself — “Take what I want. Protect what I’ve gained. Make a name for myself. Empire.” It was willing to crush and murder whole peoples to pursue its own glory. That’s why Babylon becomes a type of human rebellion against God throughout the Bible, especially in Revelation.</p><p><b>Jesus</b> (Phil. 2): though in the form of God, he did not count equality with God something to exploit; he emptied himself, took the form of a servant, and became obedient to death on a cross.</p><ul><li>Babylon exalts itself by crushing others; <b>Jesus humbles himself to save others.</b></li><li>Babylon shed the blood of entire peoples to establish its kingdom; <b>Jesus shed his own blood</b> to rescue people from every tongue, tribe and nation.</li><li>Babylon wanted a name for itself; Jesus has been given <b>the name above every name</b> — every knee will bow and every tongue confess that Jesus Christ is Lord, to the glory of God the Father.</li><li>Babylon wanted glory that lasts forever; the glory of Jesus will never fade — it will fill the earth like the waters cover the sea.</li></ul><div class=\"key\">No matter how bad it looks out there, no matter how uncertain the future feels: in the end, God wins. All that matters is that you’re on that side when it happens.</div>"},{"t":"The Gospel & Invitation","s":2399,"h":"<p>Pastor Mike was thankful: just as God pronounced woes over Babylon, he would be right to pronounce woes over <i>me</i> because of my sin and rebellion — but I don’t have to fear that, because <b>Jesus has taken my judgment for me.</b> That’s the hope of the gospel.</p><p><b>If you don’t know Jesus,</b> you’re not here by accident: the Lord of heaven’s armies brought you to confront you with his Son. God is good, so he won’t excuse anyone’s sin or show partiality. “Somebody will pay for your sin. Either you will or Jesus has.” If you haven’t turned from your own way to Jesus in repentance and faith, call on his name now and receive the free gift of salvation only he can give.</p>"}],"qa":[{"q":"What’s one thing from Sunday’s sermon that stuck with you this week: a question, a conviction, or something especially impactful?"},{"q":"<b>Understanding the Text</b><br>Read verses 6-8. A “woe” is an announcement of coming judgment. Here the nations Babylon robbed are the ones announcing it. What do they say will happen to Babylon? Follow-up: They also ask, “For how long?” Babylon got away with it for years. Why do you think God sometimes waits before he brings justice? (Look at: Galatians 6:7; 2 Peter 3:9)"},{"q":"<b>Understanding the Text</b><br>Read verses 9-11. Babylon is like an eagle that builds its nest high on a cliff to be safe from harm. What does God say Babylon got instead of safety? Follow-up: Saving and planning are wise. But how can we tell when we are trusting our savings and plans more than we trust God? (Look at: Obadiah 1:3-4; Proverbs 18:10-11)"},{"q":"<b>Understanding the Text</b><br>Read verses 12-14. Babylon’s great city will not last. But God promises that one day the whole earth will know his glory, as completely as water covers the sea. What do you think the world will be like on that day? Follow-up: Where do you see that starting to happen already? (Look at: Numbers 14:21; Isaiah 11:1-9)"},{"q":"<b>Applying the Sermon</b><br>Greed starts small. Before long, we care more about what we can get from people than about the people themselves. When have you seen a “desire for more” change the way someone treated others? Follow-up: Why is greed so hard to see in ourselves? (Look at: Luke 12:15; 1 Timothy 6:9-10)"},{"q":"<b>Applying the Sermon</b><br>Verse 13 says the nations work themselves weary, and it all ends in fire. Think back to what you were working hardest for ten years ago. How much of it still matters today? Follow-up: What kind of work does last? (Look at: Psalm 127:1; 1 Corinthians 3:11-15)"},{"q":"<b>Applying the Sermon</b><br>Pastor Mike said that evil can win a battle and still lose the war. Recall a time when the news or the culture left you discouraged… What helped you find hope again? (Look at: Psalm 73:16-17; 1 Corinthians 15:58)"},{"q":"<b>Knowing the Doctrine</b><br>The Bible says we see God’s glory most clearly in Jesus. Babylon reached for glory by crushing others. Jesus humbled himself and died on a cross to save others. What does that tell us about the kind of God we worship? (Look at: 2 Corinthians 4:6; Philippians 2:5-11)"},{"q":"<b>Sharing the Truth</b><br>Imagine a friend says, “I could never believe in a God who judges people.” Think about the nations Babylon crushed. Why would God’s judgment be good news to them? Follow-up: How could that help you answer your friend? (Look at: Psalm 96:10-13; Romans 12:19)"},{"q":"<b>Sharing the Truth</b><br>One day every knee will bow to Jesus. Pastor Mike said he is thankful he does not have to fear God’s judgment, because Jesus took it in his place. How would you explain that good news to a friend in your own words? (Look at: Isaiah 53:5-6; Romans 8:1)"}]},{"id":"glory","yt":"En4H-K2Piy0","tab":"Gods & Glory","color":"#3d6fb5","title":"Gods and Glory","meta":"Mike Nazarian · Nov 15, 2026 · Hope Chapel","ref":"Habakkuk 2:15–20","verse":"“But the Lord is in his holy temple; let all the earth keep silence before him.”","big":"Every empire that chased its own glory eventually crumbled, yet the human appetite for glory and control never changes. Habakkuk’s last two woes show us three realities: <b>the glory we seek, the gods we make, and the God who reigns.</b> Stop chasing your own glory, stop making little gods to serve your purposes, and surrender to the God who reigns — the God whose cup of judgment Jesus drank in our place.","take":["Pharaoh, Caesar and every would-be god died, their empires collapsed and their monuments crumbled — <b>yet the human appetite for glory and control remains unchanged.</b>","<b>The glory we seek (vv. 15–17):</b> Babylon exposed and humiliated others and delighted in it. God reverses it: they will drink “the cup in the Lord’s right hand” and be filled with shame instead of glory.","God is not mean — he is <b>morally serious</b>. Because he is good he is just, and he will not let wickedness go unpunished. To fear the Lord is to approach him with reverence and humility, and it is the beginning of wisdom.","<b>The gods we make (vv. 18–19):</b> an idol is a “teacher of lies” made by the one who then trusts it. Idolatry is placing your hope in anything other than the living God — our idols are just more sophisticated now.","<b>A good thing has become an idol when it jeopardizes your following Jesus.</b> We prefer gods we can control; the living God doesn’t exist to serve our purposes — we exist to serve his.","<b>The God who reigns (v. 20):</b> he is enthroned (never surprised), sovereign (over all the earth) and to be revered. Babylon drank the cup of judgment for its own wickedness; <b>Jesus drank it for ours.</b>"],"scr":[["Hab. 2:15–20","The last two of five woes on Babylon: the cup of judgment, and the idols that cannot speak."],["Hab. 1:11","Babylon’s “own might is their god” — the root problem underneath all the other woes."],["Ps. 75:8","The cup in the Lord’s hand with foaming wine; the wicked of the earth drain it to the dregs."],["Prov. 9:10","The fear of the Lord is the beginning of wisdom."],["Matt. 26:39, 42","Gethsemane: “Let this cup pass from me… if this cannot pass unless I drink it, your will be done.”"]],"secs":[{"t":"Opening: The Arrogance of Humanity’s Pursuit of Power","s":0,"h":"<p>Pastor Mike opened with a thought from preparing this text: there is something almost comical about the arrogance of humanity’s pursuit of power. Throughout history men have built enormous empires, conquered nations, accumulated unimaginable wealth and demanded the allegiance of millions. Some, like Pharaoh or Caesar, even claimed to be gods.</p><p>Yet every one of them died, their empires collapsed, their monuments crumbled and their names faded — they weren’t gods after all. And despite that unbroken pattern, <b>the human appetite for glory, and our desire to control the world around us, remains unchanged.</b></p><div class=\"key\">What does God have to say about our obsession with glory and our determination to control the world around us?</div><p>After the reading of Habakkuk 2:15–20, he said the text brings us face to face with three realities: <b>the glory we seek, the gods we make, and the God who reigns.</b></p>"},{"t":"Getting Oriented: Where We Are in Habakkuk","s":257,"h":"<p>Habakkuk is a little book most of us haven’t studied closely, so Pastor Mike re-situated us.</p><ul><li>Habakkuk prophesies as Assyria (which God used to judge the northern kingdom of Israel) declines and Babylon rises (which God will use to judge Judah for covenant disobedience).</li><li>After a brief spiritual reform under King Josiah, the nation plunged back into disobedience, rebellion and idolatry. Habakkuk asks, <i>“How long, O Lord?”</i></li><li>God answers that he will raise up the Babylonians — a bigger problem, since Babylon is even more wicked. God’s reply: <b>“the righteous will live by faith.”</b> Even when we don’t fully understand what God is doing, we can trust the God who is doing it.</li><li>Because God is good and sensitive to Habakkuk’s struggle, he turns to Babylon and pronounces <b>five woes</b> — a solemn announcement that judgment is coming. Just as Judah won’t escape judgment, neither will Babylon.</li></ul><p>Last week covered the first three woes. Today: the final two.</p>"},{"t":"I. The Glory We Seek — Woe 4: Shame Instead of Glory (vv. 15–17)","s":417,"h":"<p><i>“Woe to him who makes his neighbors drink… to gaze at their nakedness. You will have your fill of shame instead of glory.”</i></p><p>Pastor Mike warned this verse is “a little bit spicy,” and said its imagery is <b>deliberately disturbing.</b> Chapter 2 has described Babylon as an arrogant man with an unquenchable appetite for conquest. Now the metaphor extends: Babylon is a man who gets others drunk so he can expose and humiliate them.</p><ul><li>“To gaze at their nakedness” conveys a deeply disturbing element of <b>sexual humiliation</b> — more than embarrassment, it is asserting power in an abusive, dominating way and exploiting vulnerability.</li><li>It pictures Babylon violating other peoples’ dignity and <b>taking pleasure in their humiliation</b> — a culture so morally corrupt it treats the suffering of others as recreation.</li><li>That is the kind of human wickedness God is confronting: brutal, conquering nations that bring ruin and unspeakable pain to other peoples.</li></ul><div class=\"key\">God’s answer is reversal: Babylon forced others to drink, but now Babylon will drink — shame instead of the glory it sought.</div>"},{"t":"The Cup in the Lord’s Right Hand","s":633,"h":"<p>Notice whose cup it is: “the cup in the <b>Lord’s</b> right hand.” All through the Old and New Testaments, God’s judgment is pictured as a cup of wrath that peoples, nations and individuals will be made to drink — stored up, then poured out (Psalm 75:8: the wicked of the earth “shall drain it down to the dregs”). Now that cup is handed to Babylon.</p><p>Pastor Mike paused to say that <b>the Bible gives us an honest, unsanitized picture of the world we live in.</b> It doesn’t whitewash history’s atrocities or ignore terrible evil, because God hates evil — he is holy, perfectly morally pure — and he will not let human wickedness go unpunished.</p><div class=\"key\">God is not mean. He is morally serious. A judge who sentences a guilty, hardened criminal isn’t mean — that judge is good.</div>"},{"t":"The Fear of the Lord","s":829,"h":"<p>This brings us to a biblical reality our culture has largely forgotten, and even many Christians are uncomfortable with: <b>we are to fear the Lord.</b></p><ul><li><b>What it isn’t:</b> God is not capricious or bad-tempered, ready to smite you if you poke him the wrong way.</li><li><b>What it is:</b> recognizing his awesome holiness and majesty and his supreme authority over all things, including you. It is approaching him with <b>reverence and humility</b>, hearing his warnings and actually taking them seriously, and understanding that he is not someone to be trifled with or approached casually.</li><li>We love to say God is merciful, gracious, slow to anger and abounding in steadfast love — and that’s all true, a function of his goodness. But <b>because God is good, he is also just</b>, and will not let the guilty go unpunished. The God rich in mercy is also rich in justice.</li><li>That’s why “the fear of the Lord is the beginning of wisdom” — wisdom is skillful living, living with the grain of reality as God designed it.</li></ul>"},{"t":"A Warning for Us: What Kind of Glory Am I Pursuing?","s":971,"h":"<p>Most of us aren’t pursuing Babylon’s wicked extremes (“I’m just trying to go to Starbucks”), but Pastor Mike said there is still a warning: <b>whenever we seek our own glory at the expense of others, we put ourselves in opposition to God.</b></p><ul><li>When we tear someone down to lift ourselves up.</li><li>When we exploit someone’s vulnerability to advance our own agenda.</li><li>When we use our influence to manipulate someone for our own benefit.</li></ul><p><i>Do you really want to find yourself opposing God? Who is going to win that contest?</i></p><div class=\"key\">Babylon pursued its own glory. What kind of glory am I pursuing in my life — and what am I willing to do to obtain it?</div>"},{"t":"II. The Gods We Make — Woe 5 (vv. 18–19)","s":1093,"h":"<p>The final woe exposes the thing underneath all the others: <b>Babylon’s idolatry.</b> Its main problem wasn’t how it treated others — though that was wicked — but how it regarded God. <b>How we treat others is always a function of how we regard God.</b></p><ul><li>Chapter 1 said Babylon’s “own might” was its god (Marduk, Ishtar and others), and it believed it could call on or manipulate those gods to benefit it.</li><li>Babylonians carved idols from wood, chiseled them from stone or cast them in metal, overlaid them with gold and silver, and believed that through elaborate rituals the gods would inhabit these images and receive offerings.</li><li>God essentially mocks it: the maker shapes the idol — and then <b>trusts what he made.</b> The idol is “a teacher of lies” because it promises what it cannot deliver. Scholars have documented the very practice of saying “awake, arise” to these objects. But there is “no breath in it at all.”</li></ul>"},{"t":"Idolatry Today: Are We Really That Different?","s":1322,"h":"<p>It sounds primitive and ridiculous — and it is, that’s God’s point. But Pastor Mike asked us not to dismiss them with a condescending, post-scientific gaze. They were people like us, living in an unpredictable, dangerous world of disease, famine, war and death. They wanted <b>security, protection and some measure of control over their outcomes.</b></p><p><i>Are we really that different?</i> Most of us don’t have statues, but we want to manage our lives and control our outcomes, and we’ve become good at keeping up the illusion. <b>We haven’t stopped making idols; they’ve just become more sophisticated.</b></p><ul><li><b>Idolatry is placing your hope and trust in something other than the one true living God</b> — what your heart is set on, what you live for and organize your life around. “If I just had that… then my life would be what it needs to be.” If that isn’t God himself, it’s an idol.</li><li>Fallen hearts prefer <b>gods we can control</b> — gods who serve our purposes. Pastor Mike named shallow preaching where God helps you “level up and live your best life” as a modern incarnation: turning the living God into a little god with a lowercase g. The living God doesn’t exist to serve our purposes; <b>we exist to serve his.</b></li><li>In an affluent place like the South Bay, it’s easy to carve out a well-manicured life — healthy bodies, beautiful spaces, financial security, impressive careers. These can be good gifts from the Lord, but <b>they make terrible gods.</b> “Its maker trusts in his own creation”: we trust our wealth to make us secure, our education to make us significant, our achievements to make us what we think we need to be, and our carefully designed lives to satisfy us.</li></ul>"},{"t":"How You Know a Good Thing Has Become an Idol","s":1655,"h":"<div class=\"key\">A good thing has become an idol when it jeopardizes your following Jesus — when you’re tempted to choose it over him.</div><p>Pastor Mike’s questions to test it: When does obedience to Christ cost me personally or professionally? When does faithfulness to his church interfere with my priorities? (He joked about weekend sports.) That’s when our idols begin to reveal themselves.</p><p>The bottom line: Jesus calls us, “Follow me.” He doesn’t call us to fit him into the well-manicured designs we’ve worked so hard on. <b>He calls us to surrender those lives</b> — not merely to fit him in.</p>"},{"t":"III. The God Who Reigns (v. 20)","s":1778,"h":"<p>The idol worshiper of verse 19 begs his little-g god to “awake, arise.” The living God needs no waking: <i>“But the Lord is in his holy temple. Let all the earth keep silence before him.”</i> Pastor Mike made three observations, as he did last week:</p><ul><li><b>God is enthroned.</b> In his holy temple, his heavenly dwelling. Habakkuk began the book wrestling with God’s apparent inactivity — as if God had checked out. Verse 20 declares he never abandoned his throne or his post. So the wickedness of Judah, of Babylon, of our country, of China or Iran — <b>no human wickedness takes him by surprise.</b></li><li><b>God is sovereign.</b> “Let <i>all the earth</i> keep silence” — not just Judah or Babylon. He is the creator of everyone and everything (what he taught his kids to say), and every nation, ruler and human being will answer to him one day.</li><li><b>God is to be revered.</b> This isn’t an invitation to meditation; it is a <b>summons to fear the Lord</b> — reverent silence before the holy God who will judge everyone and presently reigns over all creation.</li></ul>"},{"t":"Our Need: Recover a Vision of God","s":1971,"h":"<p>There’s a kind of answer to Habakkuk here. He opened the book demanding to know what God was doing; God was gracious and responded in various ways. But by the end of chapter 2, God simply calls all the earth to be silent before him — and he has the right to. <b>Ultimately we don’t need to understand everything God is doing; we need to remember who God is.</b></p><p>As believers today we desperately need to recover a vision of a God who is <b>holy</b>, who is <b>sovereign</b>, who <b>doesn’t exist to accommodate our purposes</b>, and who commands our awe — a God we rightly fear in humility, before whom we will one day bow.</p><p>The five woes have exposed how the human heart wants to live on its own terms (“you’re not the boss of me”), or at most wants a God who blesses the life we’ve carefully designed. But he doesn’t take instructions from us — he summons us to serve his purposes: <b>to trust him, fear him, obey him and worship him.</b></p>"},{"t":"Sin Ruins; Only Jesus Restores","s":2162,"h":"<p>Babylon shows what flows downstream when a culture rejects God’s good reign: catastrophic consequences for its fellow man. The pattern runs through history — in cultures, empires, peoples, individuals and our own lives: <b>sin ruins. Only Jesus restores.</b></p><p>That brings us back to the cup of judgment in verse 16. About 600 years after Habakkuk, Jesus knelt in Gethsemane and prayed, “My Father, if it be possible, let this cup pass from me… if this cannot pass unless I drink it, your will be done.” He knew what awaited him: far more than the physical agony of crucifixion — <b>the cup of God’s judgment, which he would drink to pay for the sins of humanity.</b> His physical death matched the ugliness of human sin, but what he endured spiritually was far worse.</p><div class=\"key\">Babylon would drink the cup of God’s judgment on account of its own wickedness — but Jesus drank the cup of God’s judgment on account of ours.</div>"},{"t":"The Gospel & Invitation","s":2407,"h":"<p>Here is a holy God who will not excuse sin, who is righteous and to be feared, who because he is good is just and will punish human rebellion and put down wickedness. Yet this same God <b>made a way for sinners to be saved</b> — not by spiritual shortcuts, not by compromising his holiness, not by sweeping sin under the rug “like an unscrupulous janitor,” but by giving his own Son to bear the judgment we deserve.</p><p>Through Jesus’ death and resurrection, every one of us who turns from sin and puts our trust, hope and security in him can receive forgiveness and eternal life.</p><div class=\"key\">The invitation: stop chasing your own glory, stop making little gods to serve your own purposes, and surrender your life to the God who reigns. Turn to him through the work of his Son Jesus — repent and believe in him today.</div><p>Pastor Mike closed in prayer, thanking God for this “obscure little book” and for sending his Son, praying especially for anyone hearing for the first time that Jesus drank the bitter cup of judgment as their substitute, then leading into communion.</p>"}],"qa":[{"q":"What’s one thing from Sunday’s sermon that stuck with you this week: a question, a conviction, or something especially impactful?"},{"q":"<b>Understanding the Text</b><br>Read verses 15-17. Babylon is like a man who gets his neighbors drunk so he can shame them. What does God say will happen to Babylon in return? Follow-up: The cup in the Lord’s right hand is a picture of God’s judgment. Why is God’s judgement/wrath part of his goodness? (Look at: Psalm 75:8; Jeremiah 25:15-17)"},{"q":"<b>Understanding the Text</b><br>Read verses 18-19. What makes it foolish to trust the idols described here? Follow-up: Verse 18 says the maker “trusts in his own creation.” Why might people prefer a god they can control? (Look at: Psalm 115:4-8; Isaiah 44:14-20)"},{"q":"<b>Understanding the Text</b><br>Read verse 20. In verse 19, a man tells his idol to wake up. What is different about the Lord? Follow-up: Habakkuk began this book by asking God, “How long?” and “Why?” How does verse 20 help him trust God even without answers to all his questions? (Look at: Psalm 11:3-4; Job 40:3-5)"},{"q":"<b>Applying the Sermon</b><br>Babylon sought glory by humiliating others. We also, can try to make ourselves look better by tearing someone else down. Where are we tempted to do this in everyday life? Follow-up: Why does God take this so seriously? (Look at: Mark 10:42-45; James 4:6)"},{"q":"<b>Applying the Sermon</b><br>Even good things can become idols. How can we recognize when something good has become more important to us than obeying God? Follow-up: Verse 18 calls an idol “a teacher of lies.” What do our idols promise that they cannot deliver? (Look at: Jeremiah 2:13; 1 Timothy 6:17)"},{"q":"<b>Applying the Sermon</b><br>Jesus does not call us to fit him into the life we have planned. He calls us to surrender that life to him. Can you recall a time when following Jesus meant letting go of something you wanted? What did you learn through that? (Look at: Mark 10:17-22; Luke 9:23-25)"},{"q":"<b>Knowing the Doctrine</b><br>The Bible tells us to fear the Lord. This means taking his holiness, authority, and warnings seriously. If we are forgiven in Christ, how is fearing God different from being afraid of his condemnation? (Look at: Psalm 130:3-4; Hebrews 12:28-29; 1 John 4:18)"},{"q":"<b>Sharing the Truth</b><br>Pastor Mike called the picture in verse 15 “deliberately disturbing.” Imagine a friend asks, “Why is there so much violence and ugliness in the Bible?” How would this passage help you answer? Follow-up: What would we lose if the Bible left out the ugliness of human sin? (Look at: Genesis 6:5-6; 2 Timothy 3:16-17)"},{"q":"<b>Sharing the Truth</b><br>Babylon would drink the cup of God’s judgment for its own sins. Jesus drank it for ours. So the cup we drink at communion is a cup of forgiveness, not wrath. If a friend or a child asked what that cup means, what would you say? (Look at: Matthew 26:27-28, 39-42)"}],"es":{"tab":"Dioses y Gloria","title":"Dioses y gloria","meta":"Mike Nazarian · 15 nov 2026 · Hope Chapel","ref":"Habacuc 2:15–20","verse":"El Señor está en su santo templo; que toda la tierra guarde silencio delante de él. (Habacuc 2:20, parafraseado; toca el enlace para leerlo en la LBLA.)","big":"Todo imperio que persiguió su propia gloria terminó derrumbándose, y aun así el apetito humano de gloria y de control no cambia. Los dos últimos “ayes” de Habacuc nos muestran tres realidades: <b>la gloria que buscamos, los dioses que fabricamos y el Dios que reina.</b> Deja de perseguir tu propia gloria, deja de hacer pequeños dioses que sirvan a tus propósitos y ríndete al Dios que reina: el Dios cuya copa de juicio Jesús bebió en nuestro lugar.","take":["Faraón, César y todo aquel que quiso ser dios murió, sus imperios se derrumbaron y sus monumentos se deshicieron, <b>y aun así el apetito humano de gloria y de control sigue igual.</b>","<b>La gloria que buscamos (vv. 15–17):</b> Babilonia exponía y humillaba a otros, y lo disfrutaba. Dios lo revierte: beberán “la copa de la diestra del Señor” y se saciarán de vergüenza en lugar de gloria.","Dios no es cruel: es <b>moralmente serio</b>. Porque es bueno, es justo y no dejará impune la maldad. Temer al Señor es acercarse a él con reverencia y humildad, y es el principio de la sabiduría.","<b>Los dioses que fabricamos (vv. 18–19):</b> un ídolo es un “maestro de mentiras” hecho por quien luego confía en él. Idolatría es poner tu esperanza en cualquier cosa que no sea el Dios vivo; nuestros ídolos solo se han vuelto más sofisticados.","<b>Algo bueno se ha vuelto un ídolo cuando pone en peligro tu seguir a Jesús.</b> Preferimos dioses que podamos controlar; el Dios vivo no existe para servir a nuestros propósitos: nosotros existimos para servir a los suyos.","<b>El Dios que reina (v. 20):</b> está entronizado (nada lo sorprende), es soberano (sobre toda la tierra) y debe ser reverenciado. Babilonia bebió la copa del juicio por su propia maldad; <b>Jesús la bebió por la nuestra.</b>"],"scr":[["Habacuc 2:15–20","Los dos últimos de cinco ayes contra Babilonia: la copa del juicio y los ídolos que no pueden hablar."],["Habacuc 1:11","La propia fuerza de Babilonia es su dios: la raíz del problema debajo de todos los demás ayes."],["Salmo 75:8","La copa en la mano del Señor con vino espumoso; todos los impíos de la tierra la beben hasta el fondo."],["Proverbios 9:10","El temor del Señor es el principio de la sabiduría."],["Mateo 26:39, 42","Getsemaní: “Que pase de mí esta copa… si no puede pasar sin que yo la beba, hágase tu voluntad.”"]],"secs":[{"t":"Apertura: La arrogancia de la búsqueda humana de poder","h":"<p>El pastor Mike abrió con un pensamiento surgido al preparar este texto: hay algo casi cómico en la arrogancia con que la humanidad busca el poder. A lo largo de la historia, hombres han construido enormes imperios, conquistado naciones, acumulado riquezas inimaginables y exigido la lealtad de millones. Algunos, como Faraón o César, hasta afirmaron ser dioses.</p><p>Sin embargo, todos murieron, sus imperios se derrumbaron, sus monumentos se deshicieron y sus nombres se desvanecieron: al fin y al cabo, no eran dioses. Y a pesar de esa cadena ininterrumpida, <b>el apetito humano de gloria, y nuestro deseo de controlar el mundo que nos rodea, sigue igual.</b></p><div class=\"key\">¿Qué dice Dios sobre nuestra obsesión con la gloria y nuestra determinación de controlar el mundo que nos rodea?</div><p>Después de leer Habacuc 2:15–20, dijo que el texto nos pone cara a cara con tres realidades: <b>la gloria que buscamos, los dioses que fabricamos y el Dios que reina.</b></p>"},{"t":"Para ubicarnos: dónde estamos en Habacuc","h":"<p>Habacuc es un librito que muchos no hemos estudiado con cuidado, así que el pastor Mike nos volvió a situar.</p><ul><li>Habacuc profetiza mientras Asiria (que Dios usó para juzgar al reino del norte, Israel) declina y Babilonia (que Dios usará para juzgar a Judá por desobedecer el pacto) se levanta.</li><li>Tras una breve reforma espiritual bajo el rey Josías, la nación volvió a caer en la desobediencia, la rebelión y la idolatría. Habacuc pregunta: <i>“¿Hasta cuándo, Señor?”</i></li><li>Dios responde que levantará a los babilonios, un problema aún mayor, porque Babilonia es todavía más malvada. La respuesta de Dios: <b>“el justo por su fe vivirá.”</b> Aun cuando no entendemos del todo lo que Dios hace, podemos confiar en el Dios que lo hace.</li><li>Como Dios es bueno y sensible a la lucha de Habacuc, se vuelve hacia Babilonia y pronuncia <b>cinco ayes</b>: un anuncio solemne de que viene el juicio. Así como Judá no escapará del juicio, tampoco Babilonia.</li></ul><p>La semana pasada vimos los primeros tres ayes. Hoy: los dos últimos.</p>"},{"t":"I. La gloria que buscamos — Ay 4: vergüenza en lugar de gloria (vv. 15–17)","h":"<p><i>“¡Ay del que da de beber a su prójimo… para mirar su desnudez! Te saciarás de deshonra en lugar de gloria.”</i></p><p>El pastor Mike advirtió que este versículo es “un poquito picante” y que su imagen es <b>deliberadamente perturbadora.</b> El capítulo 2 ha descrito a Babilonia como un hombre arrogante con un apetito insaciable de conquista. Ahora la metáfora se amplía: Babilonia es un hombre que emborracha a otros para exponerlos y humillarlos.</p><ul><li>“Mirar su desnudez” transmite un elemento profundamente perturbador de <b>humillación sexual</b>: es más que avergonzar, es afirmar poder de manera abusiva y dominante, explotando la vulnerabilidad.</li><li>Retrata a Babilonia violando la dignidad de otros pueblos y <b>disfrutando su humillación</b>: una cultura tan moralmente corrupta que convierte el sufrimiento ajeno en entretenimiento.</li><li>Ese es el tipo de maldad humana que Dios confronta: naciones brutales y conquistadoras que traen ruina y dolor indecible a otros pueblos.</li></ul><div class=\"key\">La respuesta de Dios es una reversión: Babilonia hizo beber a otros, pero ahora Babilonia beberá: vergüenza en lugar de la gloria que buscaba.</div>"},{"t":"La copa en la diestra del Señor","h":"<p>Fíjate de quién es la copa: “la copa de la diestra <b>del Señor</b>.” A lo largo del Antiguo y del Nuevo Testamento, el juicio de Dios se de
