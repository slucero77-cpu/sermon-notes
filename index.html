the world."],["Ps. 24:1; 1 Cor. 6:19–20","The earth is the Lord’s; you are not your own."],["Gen. 1:26–27; James 3:9","Made in God’s image."],["Gen. 3:4–5; John 8:34","The serpent’s lie; everyone who sins is a slave to sin."]],"secs":[{"t":"Welcome & the Problem of “Religion”","h":"<p>Greg Koukl (founder of Stand to Reason), who first spoke at Hope Chapel in 1976 and has been away about 30 years, said he wanted to tell a familiar story that few understand even if they call it their own: how the world began, how it ends, and everything important in between — <b>the story of reality.</b></p><p>The problem: on an airplane, a stockbroker who asks what he does will politely assume religion is a “spiritual fantasy” — everyone has their own, whatever works for them. Greg doesn’t want his convictions heard that way, and many Christians, influenced by the culture, haven’t fully grasped the alternative.</p>"},{"t":"What Is Christianity? A Picture of Reality","h":"<p>A rhetorical question: <b>What is Christianity?</b> Common answers — a religion; a satisfying way to live; a moral structure; a relationship — are good but not deep, and they’re all about the <i>inside</i>.</p><div class=\"key\">The correct answer: Christianity is a picture of reality — an account of the way things actually are. That’s why it’s called a world view.</div><p><b>The puzzle:</b> for many Christians it’s a <i>pile of pieces</i> — Jesus, Moses, the new covenant, Joshua, the Red Sea, the second coming, the disciples. If you’ve never put it together coherently you don’t know if you have all the pieces, or if pieces from other worldviews (like reincarnation — a carburetor on a computer) have crept in. The trick to a puzzle is to <b>look at the picture on the box</b>; today Greg shows the cover.</p><p><b>It’s also a story</b> — peace shattered by rebellion, love and betrayal, conflict, self-sacrifice, redemption — with a beginning (characters and world), conflict, resolution, restoration (“denouement”). And it doesn’t begin “once upon a time”: not a myth or Narnia-style make-believe, but history. “It’s not my fantasy. It’s reality.”</p>"},{"t":"Why the Story Matters: Two Big Challenges","h":"<ul><li><b>The problem of evil</b> — why is the world such a mess if God is good and powerful? Seen in the story, it’s not a problem for Christians the way people think. It’s a problem for atheists (see below).</li><li><b>“Why is Jesus the only way?”</b> — politically incorrect, but singular problems often have singular solutions (cancer: surgery, chemo, radiation).</li></ul><p><b>The backbone — five words:</b> <b>God, man, Jesus, cross, resurrection</b> (the final resurrection to reward or judgment). God starts everything and makes it from nothing; creates man for friendship; man gets in trouble; God initiates a rescue — unique to this story, because man cannot rescue himself. God comes down in Jesus, and how Jesus lives and dies determines what happens to everyone in the final resurrection. (Greg’s 6-year-old daughter could tick the words off on her fingers.)</p>"},{"t":"1. God — “In the beginning, God…”","h":"<ul><li><b>The story starts with God because it’s about God</b> — not me. “It’s not so much about God’s wonderful plan for our lives as our lives for God’s wonderful plan.” When we ask “How could God let this happen <i>to me</i>?” we’re assuming the story is about us. “The tail should not be wagging the dog.”</li><li><b>Everything belongs to God</b> because he made it. Against “my body, my choice”: maybe you’re the tenant and he’s the landlord (C. S. Lewis).</li><li><b>It’s a kingdom</b> — a king and his domain; a civil war is coming, but he is still king. John, Jesus and the disciples proclaim the kingdom to draw people back under the rightful ruler: God is in charge.</li><li><b>Reality is material and immaterial</b> — visible and invisible. Water into wine, resurrection, virgin birth “don’t happen” only if your picture of reality is the atheist story (“the cosmos is all there is”). In this story it’s an enchanted world.</li><li><b>Evil is a defeater for atheism, not for Christianity.</b> Everyone knows the world is broken, “not the way it’s supposed to be” — so there’s a way it’s supposed to be, which means a “supposer.” No God → no transcendent moral rules → no broken rules → no real evil. But there is real evil, so there is a lawgiver.</li><li><b>Everything God made was good</b> — exactly as his mind intended.</li></ul>"},{"t":"2. Man — Made in God’s Image, Then Rebellion","h":"<p><b>What we are:</b> physical (contingent, mortal — never “little gods”) <i>and</i> non-physical: a soul, the invisible self united with the body. Animals have souls too (“Fido has a very little soul”), but only humans are made in the <b>image of God</b> — so every person, any size, age, ability or attractiveness, is <b>magnificent</b>. (C. S. Lewis: if you saw a human’s true essence you’d be tempted to worship; cf. 2 Cor. 4 “eternal weight of glory.”) The image of God grounds our moral obligations to each other (we are animals, but not <i>mere</i> animals) and makes friendship with God possible. God also gave a wonderful place and, most of all, himself.</p><p><b>The rebellion:</b> man could live in harmony under God’s rule — or betray him. That’s moral freedom, and man used it to betray. “You do you” is not new — it’s from the beginning: what I want dictates my “authentic self” rather than God’s law and created order. An enemy tells Adam and Eve the king can’t be trusted, he’s holding out on you, “be like God.” One act of disobedience changes everything.</p><p><b>The result:</b> rebellion doesn’t bring freedom but brokenness, disgrace, guilt, slavery and struggle. Still beautiful in God’s image, humans are now twisted, in rebellion, spiritually dead, and enslaved twice — to Satan (a real, dangerous being, not a man in red tights; “the whole world lies in the power of the evil one”) and to their own corrupted nature (“the flesh”). Mankind is guilty of sedition, and the king is angry.</p><div class=\"key\">“Why is God angry if he’s love?” Because he is good. The same goodness and holiness that produce his love also ground his justice — it wouldn’t be good if he let the guilty go free.</div><p>Like a parent’s boundaries, God knows how the world works and made us for flourishing. Breaking his rule broke our relationship with God, with each other and with creation (which groans for redemption). A broken world produces broken people and circumstances. Two things about the problem of evil: <b>it’s part of the story</b> (it starts in Genesis 3 and doesn’t end for 66 books), and <b>the story is not over yet</b> — Lord of the Rings looks bleak in the cave, but keep reading.</p>"},{"t":"3. Jesus — Who He Was & What He Came to Do","h":"<p>With man lost and helpless, God steps in. Two essentials: <b>who Jesus was</b> and <b>what he came to do</b> (the person and work of Christ).</p><p><b>Who he was:</b> fully human — body, soul, mind, feelings, limits (hungry, tired, grieving, joyful, suffering) — <i>and more</i>. John 1 begins as Genesis does: “In the beginning was the Word… the Word was God… all things came into being through him” — the uncreated Creator. Then: “the Word became flesh and dwelt among us.” Greg’s favorite — <b>sublime</b>: God got low and small, like a parent kneeling to comfort a child. He never ceased being God; he laid aside privileges, emptied himself, took a servant’s form, and died a criminal’s death (Phil. 2) — the definition of humility. This is not the Jesus of Islam, Jehovah’s Witnesses, LDS, or Oprah/New Age; they’d admit it.</p><p><b>What he came to do — not</b> to spread peace and love or restore social justice. (Greg’s articles: “The Legend of Jesus the Social Justice Warrior” and “Why the Blood?” at str.org; John’s whole gospel never frames his mission that way. It isn’t that Jesus didn’t care.) In his own words: <i>“I did not come to call the righteous but sinners to repentance… to give my life a ransom for many… to seek and save the lost… that the world might be saved.”</i> “Save” means rescue from imminent danger. From what? From <b>whom</b>: the Father. It’s the king we’ve rebelled against (Matt. 10:28 — fear the one who can throw body and soul into hell; that’s the Father, not the devil). That’s the bad news — now the good.</p>"},{"t":"4. The Cross — The Trade","h":"<p>Jesus did two things: <b>lived the life we should have lived</b>, then <b>made a trade</b> by the way he died.</p><div class=\"q\">The airplane conversation: a Muslim woman, dissatisfied with Islam given current events. Greg: imagine terrorists coming down the aisle to drag you out; I put my arms in front of you and say, “Don’t take her. Take me instead.” She said, “I cannot imagine anybody doing that for me.” That’s what God did in Jesus — not Allah but Yahweh, not Muhammad but Jesus: God came down and said to the Father, “Take me instead.”<cite>— Golgotha, “the place of the skull”; Calvary</cite></div><ul><li>Crucifixion normally kills by suffocation (they broke the thieves’ legs to hasten death) — but there was a deeper, unseen agony: God the Father unleashing his fury on his sinless Son as if he were guilty of all sin.</li><li><b>The titulus</b> — “King of the Jews” — the stated crime (sedition under Rome). In the ancient world a paid debt was marked <i>tetelestai</i> (“paid, canceled, finished”). But the real certificate nailed to the cross is the one in <b>Colossians 2</b>: our “certificate of debt consisting of decrees against us” — every sin each of us committed, our rap sheet. Between the sixth and ninth hours, the trade took place.</li><li><b>“Either Jesus pays, or you pay.”</b> Jesus’ cry <i>Tetelestai</i> — “It is finished” — is a <b>victory cry</b>, not “I’m glad that’s over”: the debt of everyone who trusts him is paid in full. <b>Jesus takes our guilt; we take his goodness.</b></li></ul><div class=\"key\">This is why Jesus is the only way: he alone solved the problem. Nobody else did it; nobody else could. It is a gift — it can’t be earned or bought, only received by trusting him. That is what the story means by <b>faith</b>.</div>"},{"t":"5. Resurrection — Justice or Mercy","h":"<p>Your decision about this rescue determines what happens to everyone in the final resurrection. History’s final event brings one of two things:</p><ul><li><b>Perfect justice</b> — punishment for every crime you committed; Jesus misses nothing (“you will give an account of every idle word”). Those who reject God’s mercy in Christ are judged by their works and banished from God’s presence forever.</li><li><b>Perfect mercy</b> — forgiveness for everything you’ve done wrong; Jesus misses nothing. Those who cease their rebellion and receive God’s pardon become members of his family and live with him in a new world — the perfect life he intended — forever.</li></ul>"},{"t":"The Story in One Sentence & Close","h":"<div class=\"key\">God, the creator of the universe, in order to rescue man from punishment for his rebellion, took humanity on in Jesus, the savior, to die on a cross and rise from the dead, so that in the final resurrection we could enjoy a wonderful friendship with our sovereign Lord in the kind of perfect world our hearts have always yearned for.</div><p>The story of how the world began and ends: goodness → rebellion and brokenness → rescue → the trade → mercy and final justice → the end of evil → full restoration, and for those who trust the rescuer, unending friendship with a Father who satisfies the deepest longings of the heart. “As Lewis put it, the door we’ve been knocking on all our lives will finally open.” If you’re a Christian this is your story; if not, <b>this is still your story</b> — it’s the way things really are. “Not just a story… the true story.”</p><p><b>Prayer:</b> thanks to the author who entered the story — Emmanuel, God with us, serving us even in death on the cross — “once we were lost and now we’re found.” The service then moved to communion.</p>"}],"qa":[{"q":"What was the most impactful part of Sunday’s talk: a question it raised, a conviction, or something you have kept thinking about?"},{"q":"<b>Understanding the Story</b><br>Greg opened his talk with a question: What is Christianity? How would you normally answer that if asked?"},{"q":"<b>Understanding the Story</b><br>Greg’s answer was that Christianity is “a picture of reality,” a description of the way the world actually is. Most people, he said, treat religious beliefs as personal, not as facts about the world. How does his answer differ from the answers we just gave?"},{"q":"<b>Understanding the Story</b><br>Greg said the whole story can be told in five words, in order: God, man, Jesus, cross, resurrection. He also said every good story has four parts: a beginning, a conflict, a resolution, and a restoration. Which of the five words belong to each part?"},{"q":"<b>Applying the Talk</b><br>The story starts with God, not us. Greg said everything belongs to God because he made it: we are tenants; he is the landlord. Where in your life is it hardest to live as a tenant, not the owner? (Look at: Psalm 24:1; 1 Corinthians 6:19-20)"},{"q":"<b>Applying the Talk</b><br>Then God made man. Greg said one thing is true of every person: each is made in the image of God, which makes every human being “magnificent.” How does/should seeing people this way change how you treat those who are hardest for you to love? (Look at: Genesis 1:26-27; James 3:9)"},{"q":"<b>Applying the Talk</b><br>Then man rebelled. Greg traced “you do you” back to the garden: make your own rules, “freedom awaits you.” But the revolt brought “brokenness and disgrace and guilt and slavery” instead. Where have you seen “you do you” promise freedom and deliver the opposite? (Look at: Genesis 3:4-5; John 8:34)"},{"q":"<b>Knowing the Doctrine</b><br>Then God stepped in. Greg said the two things we must know about Jesus are who he was and what he came to do. What is the answer to each of these in your own words? (Who he was: John 1:1-3, 14; Philippians 2:6-8. What he came to do: Luke 5:32; Matthew 20:28; Luke 19:10; John 3:17) Why does what Jesus came to do depend on who he is?"},{"q":"<b>Sharing the Truth</b><br>A friend asks “Why is Jesus the only way?” – How would you answer?"},{"q":"<b>Sharing the Truth</b><br>The story ends at the final resurrection: “either perfect justice or perfect mercy.” Greg said that if you are not a Christian, “this is still your story.” Take the rest of your time here. Using the five words, tell the story together: what is the gospel?"}]},{"id":"wins","tab":"God Wins","color":"#1f6b78","title":"God Wins","meta":"Mike Nazarian · Nov 8, 2026 · Hope Chapel","ref":"Habakkuk 2:6–14","verse":"“For the earth will be filled with the knowledge of the glory of the Lord as the waters cover the sea.”","big":"You can win a battle and still lose the war. Temporary success is not ultimate victory: the glory of man will fail on this earth, but in the end the glory of the Lord will fill the earth — and that glory is revealed in Jesus. In the end, God wins.","take":["There is a big difference between winning a battle and winning the war. Sometimes God’s enemies seem to prosper, but <b>temporary success is not the same thing as ultimate victory.</b>","Habakkuk may not understand what God is doing, but he can know and trust the God who is doing it — “the righteous shall live by faith” (2:4).","Three of Babylon’s five woes: <b>what man plunders will perish</b> (greed); <b>what man secures will fade</b> (no nest is high enough); <b>what man builds will fall</b> (empires labor “for fire”).","These woes are put on the lips of the nations Babylon trampled — a great reversal. Wicked gain can never provide lasting security; there is always a reckoning.","God’s promise (v. 14): the earth will be filled with the <b>knowledge</b> of his <b>glory</b> “as the waters cover the sea” — fulfilled through the reign of Jesus (Num. 14:21; Isa. 11; 2 Cor. 4:6).","Babylon wanted to acquire, secure and exalt itself by crushing others. Jesus humbled himself to save others. Every knee will bow — and Jesus took the judgment we deserve."],"scr":[["Hab. 2:6–14","Five woes on Babylon (three covered), and the promise of v. 14."],["Hab. 2:4","“The righteous shall live by faith” — quoted in Romans, Galatians and Hebrews."],["2 Kings 25:6–7","Nebuchadnezzar’s brutality: Zedekiah’s sons executed before his eyes."],["Num. 14:21","“All the earth shall be filled with the glory of the Lord.”"],["Isa. 11:1–5, 9","The coming king from the stump of Jesse; the earth full of the knowledge of the Lord."],["2 Cor. 4:6","The knowledge of the glory of God in the face of Jesus Christ."],["Phil. 2:5–11","Jesus humbled himself; every knee will bow."]],"secs":[{"t":"Opening: Winning the Battle vs the War","h":"<p>Pastor Mike opened with a short prayer confessing, “you are God and we are not,” then a reflection from preparing this message: in life you can win a battle and still lose the war — experience temporary success and still suffer ultimate defeat.</p><p>Sometimes it looks like God’s enemies are winning: those who oppose God prosper, darkness holds power, and we wonder, <i>Lord, where are you? Why are you allowing this?</i></p><div class=\"key\">Temporary success is not the same thing as ultimate victory — and that is what God shows us in Habakkuk 2:6–14.</div><p><b>Two truths:</b> (1) the glory of man will fail on this earth; (2) the glory of the Lord will fill the earth.</p>"},{"t":"Getting Oriented","h":"<p>Honest confession: we gravitate to John, Proverbs or Ephesians, not Habakkuk or Zephaniah — read three lines, then have to read them again. Pastor Mike reinforced Andrew’s message from last week on <b>the clarity of Scripture</b>: it really can be read and understood with a little effort.</p><ul><li><b>Habakkuk</b> grieves the spiritual, moral and social decline of Judah — rebellion against God and hostility between people.</li><li>He lives between the fall of Assyria (which God used to judge the northern kingdom) and the rise of Babylon (which God would use to judge Judah), right after Josiah’s reforms and renewal — then Josiah was killed and the kings plunged the nation back into idolatry.</li><li>God’s answer: he’s raising up the Babylonians. That creates a bigger problem — they’re <i>more</i> wicked. So Habakkuk takes his stand on the watchtower (2:1).</li><li><b>2:4 — “The righteous shall live by faith.”</b> Quoted in Romans, Galatians and Hebrews, at the heart of the gospel. Habakkuk may not understand what God is doing, but he can know and trust the God who is doing it. So can we.</li></ul><p>Then God turns to Babylon, an arrogant man whose appetite for conquest is never satisfied, and announces <b>five woes</b>. “Woe” signals coming judgment — a solemn declaration that God will act decisively (the NLT: “What sorrow awaits you!”). Strikingly, God puts these woes on the lips of the nations Babylon trampled: one day they will taunt Babylon because God has brought her low. Together the woes expose the futility of man’s attempt to establish his own glory and permanence in opposition to God.</p>"},{"t":"I. The Glory of Man Will Fail — Woe 1: What Man Plunders Will Perish (vv. 6–8)","h":"<p><i>“Woe to him who heaps up what is not his own — for how long! — and loads himself with pledges.”</i></p><p>Babylon was notorious for brutality. When it conquered Judah, Nebuchadnezzar had King Zedekiah’s sons executed in front of him, then put out his eyes so the last thing he ever saw was the execution of his sons. Babylon enriched itself by conquering nations, brutalizing people and plundering wealth.</p><p><b>How it relates to us:</b> most of us aren’t pillaging our cul-de-sacs, but the temptation under Babylon’s lust for conquest isn’t foreign: <b>greed — the relentless desire for more.</b></p><ul><li>John D. Rockefeller, asked how much money is enough, reportedly said, “just a little bit more.”</li><li>Greed is never satisfied. It tempts us to justify what we know is wrong — cut corners, compromise integrity, take advantage of others.</li><li><b>Greed dehumanizes:</b> we value what we can get from people more than the people themselves. Babylon saw nations not as peoples to care for but peoples to plunder.</li></ul><p><b>The reversal (vv. 7–8):</b> your debtors will suddenly arise; “because you have plundered many nations, all the remnant of the peoples shall plunder you.” The plunderer becomes the plundered.</p><div class=\"key\">Wicked gain can never provide lasting security. There’s always an accounting. God sees, God knows, God will judge and make things right — so what man plunders will perish.</div><p>This should scare those tempted that way — and encourage those who are discouraged by how much of it they see.</p>"},{"t":"Woe 2: What Man Secures Will Fade (vv. 9–11)","h":"<p>The woes stack: the first exposes Babylon’s lust to <i>acquire</i>; the second its desire to <i>secure</i> what it has stored.</p><p><i>“Woe to him who gets evil gain for his house, to set his nest on high to be safe from the reach of harm!”</i> Like an eagle building its nest high on a cliff, out of reach of predators — Babylon plundered and protected itself to be untouchable. (Verses 10–11: shame, a forfeited life, and the stones crying out from the wall.)</p><p><b>Bringing it home:</b> “Work hard, invest, stack, save, plan.” Nothing wrong with that — the Bible commends wise and shrewd living. But we can believe that if I accumulate enough money and security, I’ll finally be safe. Then where have I put my ultimate faith?</p><ul><li>How much is enough? “Just a little bit more.”</li><li>How much money would guarantee nothing could go wrong — that your health never failed or your children never suffered? There’s no amount.</li><li>We keep building our nest a little higher on the cliff, looking to storehouses, savings accounts and portfolios for a security only God can give.</li></ul><div class=\"key\">There’s nothing wrong with building some material security. The question is what my <i>ultimate</i> security is — where my heart is vested. It’s wrong to make security my god, especially if I trample or use others to get it. No amount of wealth or earthly power protects us from God’s judgment; no nest is built high enough to put you beyond the reach of his justice.</div>"},{"t":"Woe 3: What Man Builds Will Fall (vv. 12–13)","h":"<p>Babylon wanted to acquire, to secure, and a third step: to <b>exalt itself</b>. <i>“Woe to him who builds a town with blood and founds a city on iniquity!”</i> “Babylon the Great” — a magnificent city built with the blood of other civilizations, a monument to its own greatness.</p><p><b>Verse 13:</b> “Behold, is it not from the Lord of hosts that peoples labor merely for fire and nations weary themselves for nothing?” In other words, God himself has determined that all of Babylon’s labor, ambition, conquest, storing up and nest-building is destined for the fire. The NLT: <i>“The wealth of nations will turn to ashes. They work so hard but all in vain.”</i> Empires try to be empires, but God sits in the heavens and laughs.</p><p><b>Fulfilled:</b> about 70 years after Habakkuk, God raised up Cyrus the Great of Persia to crush the Babylonians, who were relegated to the annals of history. “God did exactly what he said he would do.”</p><p><b>A timely word:</b> Pastor Mike (not choosing a side or advocating a candidate) acknowledged many are troubled by the direction of our nation and world — headlines and social media show things contrary to God’s word — and we cry out like Habakkuk, <i>How long, O Lord?</i></p><div class=\"key\">God’s answer to Habakkuk was not that wickedness would never gain power — Babylon gained power — but that wickedness would <b>never have the last word</b>, because he would. God has not lost his sovereignty; Christ is still on his throne, directing history to its prescribed ends. When discouraged, look up and remember: the righteous shall live by faith, trusting the God who is working even when you can’t see how.</div><p><b>The warnings are for us too.</b> They dismantle our natural illusions: that <i>more will satisfy</i>, that <i>security will protect</i>, that <i>achievement will give significance</i>. Babylon pursued all three by wicked means and none lasted — God always has the final word. So the glory of man will ultimately fail.</p>"},{"t":"II. The Glory of the Lord Will Fill the Earth (v. 14)","h":"<p><i>“For the earth will be filled with the knowledge of the glory of the Lord as the waters cover the sea.”</i> Four observations:</p><ol><li><b>It’s a promise.</b> Empires rise and fall — Egyptians, Assyrians, Babylonians, Persians, Greeks, Romans, Ottomans — but here God promises something that will never pass away into history: “the earth will be filled.”</li><li><b>It’s the <i>knowledge</i> of his glory.</b> Not everyone knows God today; “to know” also means to acknowledge. Some ignore him, reject him or worship gods of their own making. A day is coming when the whole earth will observe, recognize and acknowledge his glory — completely, “as the waters cover the sea.”</li><li><b>What is God’s glory?</b> His supreme greatness; the magnificent display of all he is — holiness, righteousness, goodness, wisdom, power (the Old Testament shekinah glory). The Hebrew <i>kabod</i> carries the idea of weight and worth: there is no one greater or more worthy than God.</li><li><b>It will be fulfilled through the reign of Jesus.</b> Numbers 14:21: “All the earth shall be filled with the glory of the Lord.” Isaiah 11:9: “The earth shall be full of the knowledge of the Lord as the waters cover the sea.” Habakkuk pulls the two together. Isaiah 11 describes a coming king from the stump of Jesse, with the Spirit of the Lord upon him, who judges the poor with righteousness and decides with equity for the meek — <i>that is Jesus.</i> And 2 Corinthians 4:6: “the knowledge of the glory of God in the face of Jesus Christ.” When we look at Jesus, we see God; the earth will be filled with the recognition that Jesus is Lord.</li></ol>"},{"t":"Babylon vs Jesus","h":"<p><b>Babylon:</b> acquire, secure, exalt itself — “Take what I want. Protect what I’ve gained. Make a name for myself. Empire.” It was willing to crush and murder whole peoples to pursue its own glory. That’s why Babylon becomes a type of human rebellion against God throughout the Bible, especially in Revelation.</p><p><b>Jesus</b> (Phil. 2): though in the form of God, he did not count equality with God something to exploit; he emptied himself, took the form of a servant, and became obedient to death on a cross.</p><ul><li>Babylon exalts itself by crushing others; <b>Jesus humbles himself to save others.</b></li><li>Babylon shed the blood of entire peoples to establish its kingdom; <b>Jesus shed his own blood</b> to rescue people from every tongue, tribe and nation.</li><li>Babylon wanted a name for itself; Jesus has been given <b>the name above every name</b> — every knee will bow and every tongue confess that Jesus Christ is Lord, to the glory of God the Father.</li><li>Babylon wanted glory that lasts forever; the glory of Jesus will never fade — it will fill the earth like the waters cover the sea.</li></ul><div class=\"key\">No matter how bad it looks out there, no matter how uncertain the future feels: in the end, God wins. All that matters is that you’re on that side when it happens.</div>"},{"t":"The Gospel & Invitation","h":"<p>Pastor Mike was thankful: just as God pronounced woes over Babylon, he would be right to pronounce woes over <i>me</i> because of my sin and rebellion — but I don’t have to fear that, because <b>Jesus has taken my judgment for me.</b> That’s the hope of the gospel.</p><p><b>If you don’t know Jesus,</b> you’re not here by accident: the Lord of heaven’s armies brought you to confront you with his Son. God is good, so he won’t excuse anyone’s sin or show partiality. “Somebody will pay for your sin. Either you will or Jesus has.” If you haven’t turned from your own way to Jesus in repentance and faith, call on his name now and receive the free gift of salvation only he can give.</p><p><b>Closing prayer:</b> thanks for “this obscure Old Testament prophet” with so much meaning for us today; that the Spirit would work in hearts — encouraging, challenging and convicting in love — as the church turned to communion.</p>"}],"qa":[{"q":"What’s one thing from Sunday’s sermon that stuck with you this week: a question, a conviction, or something especially impactful?"},{"q":"<b>Understanding the Text</b><br>Read verses 6-8. A “woe” is an announcement of coming judgment. Here the nations Babylon robbed are the ones announcing it. What do they say will happen to Babylon? Follow-up: They also ask, “For how long?” Babylon got away with it for years. Why do you think God sometimes waits before he brings justice? (Look at: Galatians 6:7; 2 Peter 3:9)"},{"q":"<b>Understanding the Text</b><br>Read verses 9-11. Babylon is like an eagle that builds its nest high on a cliff to be safe from harm. What does God say Babylon got instead of safety? Follow-up: Saving and planning are wise. But how can we tell when we are trusting our savings and plans more than we trust God? (Look at: Obadiah 1:3-4; Proverbs 18:10-11)"},{"q":"<b>Understanding the Text</b><br>Read verses 12-14. Babylon’s great city will not last. But God promises that one day the whole earth will know his glory, as completely as water covers the sea. What do you think the world will be like on that day? Follow-up: Where do you see that starting to happen already? (Look at: Numbers 14:21; Isaiah 11:1-9)"},{"q":"<b>Applying the Sermon</b><br>Greed starts small. Before long, we care more about what we can get from people than about the people themselves. When have you seen a “desire for more” change the way someone treated others? Follow-up: Why is greed so hard to see in ourselves? (Look at: Luke 12:15; 1 Timothy 6:9-10)"},{"q":"<b>Applying the Sermon</b><br>Verse 13 says the nations work themselves weary, and it all ends in fire. Think back to what you were working hardest for ten years ago. How much of it still matters today? Follow-up: What kind of work does last? (Look at: Psalm 127:1; 1 Corinthians 3:11-15)"},{"q":"<b>Applying the Sermon</b><br>Pastor Mike said that evil can win a battle and still lose the war. Recall a time when the news or the culture left you discouraged… What helped you find hope again? (Look at: Psalm 73:16-17; 1 Corinthians 15:58)"},{"q":"<b>Knowing the Doctrine</b><br>The Bible says we see God’s glory most clearly in Jesus. Babylon reached for glory by crushing others. Jesus humbled himself and died on a cross to save others. What does that tell us about the kind of God we worship? (Look at: 2 Corinthians 4:6; Philippians 2:5-11)"},{"q":"<b>Sharing the Truth</b><br>Imagine a friend says, “I could never believe in a God who judges people.” Think about the nations Babylon crushed. Why would God’s judgment be good news to them? Follow-up: How could that help you answer your friend? (Look at: Psalm 96:10-13; Romans 12:19)"},{"q":"<b>Sharing the Truth</b><br>One day every knee will bow to Jesus. Pastor Mike said he is thankful he does not have to fear God’s judgment, because Jesus took it in his place. How would you explain that good news to a friend in your own words? (Look at: Isaiah 53:5-6; Romans 8:1)"}]}];

  else if(last&&/^\d/.test(p)){book=last;rest=p}

 }).join('; ');
}

});
res.addEventListener('click',function(e){var r=e.target.closest('.r');if(r)show(+r.dataset.i,r.dataset.id?r.dataset.id:+r.dataset.k)});
/* text size */
var fs=17;try{var f=parseInt(localStorage.getItem('fs'),10);if(f>=14&&f<=24)fs=f}catch(e){}
function setFs(n){fs=Math.max(14,Math.min(24,n));document.documentElement.style.setProperty('--fs',fs+'px');try{localStorage.setItem('fs',fs)}catch(e){}}
var th=null;try{th=localStorage.getItem('th')}catch(e){}
if(!th)th=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
function setTh(v){th=v;document.documentElement.setAttribute('data-th',v);document.getElementById('th').textContent=v==='dark'?'☀':'☾';try{localStorage.setItem('th',v)}catch(e){}}
document.getElementById('th').onclick=function(){setTh(th==='dark'?'light':'dark')};
setTh(th);
setFs(fs);
document.getElementById('fm').onclick=function(){setFs(fs-1)};
document.getElementById('fp').onclick=function(){setFs(fs+1)};
/* verse popup */
var sh=document.createElement('div');sh.id='sheet';
sh.innerHTML='<div class="bd"></div><div class="pn" role="dialog" aria-modal="true"><div class="hd"><h3 id="shT"></h3><button class="x" aria-label="Close">×</button></div><div class="nt" id="shN"></div><div class="src" id="shS"></div><div class="lk" id="shL"></div></div>';
document.body.appendChild(sh);
function closeSh(){sh.classList.remove('on')}
function openSh(i,vi){
 var s=S[i],v=s.scr[vi];
 document.getElementById('shT').textContent=v[0];
 document.getElementById('shN').textContent=v[1];
 document.getElementById('shS').textContent='From “'+s.title+'”';
 document.getElementById('shL').innerHTML=linkRef(v[0]).replace(/<a ([^>]*)>([^<]*)<\/a>/g,function(m,a,t){return '<a '+a+'>Read '+t+' in the ESV ↗</a>'}).replace(/<\/a>; /g,'</a>');
 sh.classList.add('on');
}
main.addEventListener('click',function(e){var r=e.target.closest('.vr');if(r)openSh(+r.dataset.i,+r.dataset.v)});
main.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('vr')){e.preventDefault();openSh(+e.target.dataset.i,+e.target.dataset.v)}});
sh.querySelector('.bd').addEventListener('click',closeSh);
sh.querySelector('.x').addEventListener('click',closeSh);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSh()});


/* favorites + personal notes */
main.addEventListener('click',function(e){var b=e.target.closest('button[data-fav]');if(!b)return;
 var s=S[+b.dataset.fav];NT[s.id]=NT[s.id]||{};NT[s.id].fav=!NT[s.id].fav;saveNT();setFav(b.closest('.sermon'),s.id);buildSide&&buildSide();markSide&&markSide()});
main.addEventListener('input',function(e){var t=e.target;if(!t.matches||!t.matches('textarea.mynotes'))return;
 var s=S[+t.dataset.note];NT[s.id]=NT[s.id]||{};NT[s.id].n=t.value;saveNT()});
/* desktop sidebar + keyboard */
var side=document.getElementById('side');
function buildSide(){
 var s='';
 GRP.forEach(function(g){s+='<h3>'+g.n+'</h3>';g.ids.forEach(function(id){var k=idxOf(id);if(k<0)return;
  s+='<button data-i="'+k+'" style="--c:'+S[k].color+'">'+(isFav(S[k].id)?'★ ':'')+S[k].title+(hasNote(S[k].id)?' ✎':'')+'<small>'+shortMeta(S[k])+'</small></button>'})});
 side.innerHTML=s;
}
function markSide(){[].forEach.call(side.querySelectorAll('button'),function(b){b.classList.toggle('on',+b.dataset.i===view)})}
buildSide();
side.addEventListener('click',function(e){var b=e.target.closest('button');if(b){show(+b.dataset.i);markSide()}});
var _applyView=applyView;applyView=function(){_applyView();markSide()};
markSide();
document.addEventListener('keydown',function(e){
 var t=e.target,typing=t&&/^(INPUT|TEXTAREA)$/.test(t.tagName);
 if(e.key==='Escape'){if(sh&&sh.style.display==='block'){sh.style.display='none';return}if(typing||qin.value){qin.value='';qin.blur();applyView()}return}
 if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==='/'){e.preventDefault();qin.focus();qin.select()}
 else if(e.key==='ArrowRight'&&view!=='home')step(1);
 else if(e.key==='ArrowLeft'&&view!=='home')step(-1);
 else if((e.key==='g'||e.key==='q')&&view!=='home')setGm(true);
 else if(e.key==='n'&&view!=='home')setGm(false);
});
window.addEventListener('beforeprint',function(){[].forEach.call(document.querySelectorAll('.sermon.on details'),function(d){d.open=true})});
goHome();

try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&location.hostname.indexOf('claude')<0){navigator.serviceWorker.register('sw.js').catch(function(){})}}catch(e){}
</script>
</body>
</html>
