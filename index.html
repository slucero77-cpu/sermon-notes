<title>Sermon Notes — Hope Chapel</title>
<style>
:root{--a:#2f63c9;--bg:#f4f7fa;--card:#fff;--ink:#151c26;--mut:#4e6080;--rule:#d5deea;--tint:#eef3fb;--fs:17px;--at:var(--a);--btn:#fff;--sheet:#fff;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}
header{padding:calc(env(safe-area-inset-top) + 16px) 16px 12px;background:#6f9ef6;color:#fff}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
header small{font:700 11px/1 -apple-system,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:1;text-shadow:0 1px 2px rgba(15,42,92,.4)}
header h1{font-size:22px;margin-top:6px;line-height:1.2;text-shadow:0 1px 3px rgba(15,42,92,.35)}
html[data-th=dark] header{background:#4f7bd6}
.fs{display:flex;gap:6px}
.fs button,#th{font:600 15px -apple-system,system-ui,sans-serif;width:42px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.15);color:#fff}
.search{margin-top:12px}
.search input{width:100%;font:16px -apple-system,system-ui,sans-serif;padding:11px 14px;border-radius:10px;border:0;background:rgba(255,255,255,.95);color:#151c26;-webkit-appearance:none}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--rule);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font:600 14px -apple-system,system-ui,sans-serif;padding:9px 14px;border-radius:20px;border:1.5px solid var(--rule);background:var(--btn);color:var(--mut);min-height:40px}
nav button.on{color:#fff;border-color:transparent}
main{padding:14px 14px 40px;max-width:720px;margin:0 auto}
.meta{font-style:italic;color:var(--mut);font-size:.9em;margin:2px 0 12px}
.verse{background:var(--tint);border-left:4px solid var(--a);padding:12px 14px;border-radius:0 8px 8px 0;margin-bottom:14px;font-style:italic;font-size:.96em}
.verse b{display:block;font:600 11px -apple-system,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--at);font-style:normal;margin-bottom:4px}
.big{background:var(--a);color:#fff;border-radius:10px;padding:14px 16px;margin-bottom:14px;font-size:.97em}
.big b{display:block;font:600 11px -apple-system,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin-bottom:5px}
details{background:var(--card);border:1px solid var(--rule);border-radius:10px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;padding:14px 16px;font:600 16px/1.3 -apple-system,system-ui,sans-serif;display:flex;gap:10px;align-items:center;min-height:48px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;color:var(--at);font-size:22px;font-weight:400}
details[open]>summary::after{content:"–"}
details[open]>summary{border-bottom:1px solid var(--rule)}
.n{color:var(--at);font-family:Georgia,serif;min-width:26px}
.body{padding:12px 16px 4px}
.body p{margin-bottom:10px}
.body ul{padding-left:18px;margin-bottom:10px}
.body li{margin-bottom:7px}
.q{background:var(--tint);border-radius:8px;padding:10px 12px;margin:4px 0 12px;font-style:italic}
.q cite{display:block;font:12px -apple-system,system-ui,sans-serif;color:var(--mut);font-style:normal;margin-top:3px}
.key{background:#1a2a45;color:#e8eef8;border-radius:8px;padding:11px 13px;margin:4px 0 12px;font-style:italic}
.vr{padding:9px 0;border-bottom:1px dashed var(--rule)}
.vr:last-child{border-bottom:0}
.vr a{color:var(--at);text-decoration:underline;text-underline-offset:3px}
.vr b{display:block;font:700 12px -apple-system,system-ui,sans-serif;letter-spacing:.08em;color:var(--at);margin-bottom:2px}
.vr span{font-style:italic;font-size:.94em}
.sec{font:700 12px -apple-system,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:22px 4px 8px;display:flex;align-items:center;gap:8px}
.sec .tools{margin-left:auto;display:flex;gap:6px}
.sec .tools button{font:600 12px -apple-system,system-ui,sans-serif;letter-spacing:0;text-transform:none;padding:6px 10px;border-radius:14px;border:1px solid var(--rule);background:var(--btn);color:var(--mut);min-height:32px}
.qa{border-top:1px solid var(--rule);padding:12px 0 2px}
.qa:first-child{border-top:0}
.qa .qq{font-weight:bold;margin-bottom:6px}
.qa details{margin:6px 0 8px;background:var(--tint);border:0}
.qa summary{font-size:14px;min-height:40px;padding:8px 12px;color:var(--at)}
.qa .body{padding:8px 12px 2px;font-size:.95em}
ol.dq{padding-left:22px}
ol.dq li{margin-bottom:12px}
.sermon{display:none}.sermon.on{display:block}
#res{display:none;padding:14px}
#res .r{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-family:-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.4}
#res .r b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
#res .r em{font-style:normal;background:#ffe9a8}
#res p.none{color:var(--mut);font-family:-apple-system,system-ui,sans-serif;text-align:center;padding:20px}
footer{text-align:center;color:var(--mut);font-size:13px;font-style:italic;padding:10px 0 30px}

.vr{cursor:pointer;padding:11px 0}
.vr b::after{content:' ›';font-weight:400}
#sheet{display:none;position:fixed;inset:0;z-index:50}
#sheet.on{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);max-width:720px;margin:0 auto;box-shadow:0 -6px 24px rgba(0,0,0,.25);max-height:75vh;overflow:auto}
#sheet .hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
#sheet h3{font:700 18px/1.3 -apple-system,system-ui,sans-serif;color:var(--at);flex:1}
#sheet .x{font:22px/1 -apple-system,system-ui,sans-serif;border:0;background:var(--tint);border-radius:50%;width:36px;height:36px;color:var(--mut)}
#sheet .nt{font-style:italic;margin-bottom:14px}
#sheet .src{font:12px -apple-system,system-ui,sans-serif;color:var(--mut);margin:-6px 0 14px}
#sheet .lk a{display:block;text-align:center;text-decoration:none;font:600 16px -apple-system,system-ui,sans-serif;padding:13px 14px;border-radius:12px;background:var(--a);color:#fff;margin-bottom:8px}

#home{display:none;padding:14px;max-width:720px;margin:0 auto}
#home .hint{font:14px -apple-system,system-ui,sans-serif;color:var(--mut);margin:0 2px 4px}
#home .sec{margin:20px 2px 8px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--a);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-family:inherit;color:var(--ink);min-height:60px}
.card b{display:block;font:700 16px/1.3 -apple-system,system-ui,sans-serif}
.card span{display:block;font:13px -apple-system,system-ui,sans-serif;color:var(--mut);margin-top:3px}
.card em{display:block;font:12px -apple-system,system-ui,sans-serif;color:var(--mut);font-style:normal;margin-top:2px}
.card.wk{background:var(--a);color:#fff;border-color:transparent}
.card.wk b,.card.wk span{color:#fff}
.card.wk em{color:#fff!important;opacity:.85;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
html[data-th=dark] .card.wk{filter:brightness(.85)}
.card.cont{background:var(--tint)}
.card.cont em{font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--at);margin:0 0 3px}
nav{align-items:center}
#nHome{background:var(--btn);color:var(--at)!important;border-color:var(--rule)!important}

<script>
var S=[{"id":"contentment","tab":"Contentment","color":"#2f6b57","title":"Finding Contentment","meta":"Andrew Kelley · Dec 1, 2024 · Hope Chapel","ref":"Philippians 4:10–13","verse":"“I rejoiced in the Lord greatly that now at length you have revived your concern for me… I have learned in whatever situation I am to be content. I know how to be brought low, and I know how to abound… I can do all things through him who strengthens me.”","big":"Contentment is not found in possessions or in self-sufficiency, but in Christ himself — and it produces deeper trust in God’s sovereignty, daring generosity, and a life that looks like Jesus.","take":["Thanksgiving is gratitude for what we have; Paul’s contentment is a settled disposition toward our circumstances, whatever they are.","Even good things can’t be enjoyed when we know they won’t last (the Disneyland countdown). We’re discontent even when we’re content.","Two enemies: looking <b>outward</b> (the love of possessions and people) and looking <b>inward</b> (self-sufficiency). Paul points <b>upward</b>.","Possessions aren’t evil — the problem is when they possess you.","Phil. 4:13 is not about Christian superpowers. It’s about enduring the ups and downs with Christ as your strength.","Christ is not the means to the gift — he <i>is</i> the gift. He can’t be taken away from us.","Fruit of contentment: satisfaction in God’s sovereignty, daring generosity, stronger identification with Jesus."],"scr":[["Phil. 1:3–5, 7","Paul’s love and partnership with the Philippians, even “in my imprisonment.”"],["Phil. 4:10–13","“I have learned in whatever situation I am to be content… I can do all things through him who strengthens me.”"],["Exodus 20:3, 17","First and last commandments: no other gods before me; do not covet."],["Heb. 13:8","Jesus Christ is the same yesterday and today and forever."],["2 Cor. 4:16–18","Our outer self is wasting away, our inner self renewed; look to the unseen, which is eternal."],["2 Cor. 12:9–10","“My grace is sufficient for you… when I am weak, then I am strong.”"],["Rom. 8:28","All things work together for good for those who love God."],["Phil. 2:5–8","Christ Jesus, in the form of God, emptied himself."],["Phil. 3:7–9","“I count everything as loss because of the surpassing worth of knowing Christ Jesus my Lord.”"]],"secs":[{"t":"Intro: Thanksgiving vs. Black Friday","h":"<p>The sermon opens on the strange pairing of two holidays: a meal built around gratitude, then 3 a.m. lines at Target for cheap TVs. Andrew admits he doesn’t see crowds breaking down doors to buy turkeys — and he’s “not super convinced” Thanksgiving is closer to our hearts than having more stuff.</p><p>Gratitude is a positive affirmation of things we’re thankful for. Paul’s <b>contentment</b> is different: a personal disposition toward our own circumstances.</p><div class=\"key\">“I know how to be brought low, and I know how to abound… I have learned the secret of facing plenty and hunger, abundance and need.”</div><p><b>Even good things don’t satisfy.</b> As a kid at Disneyland he’d start counting down at 11 a.m. — “about 13 hours left” — and lose the joy because it would end. We can have a good thing and not enjoy it because it won’t last.</p>"},{"t":"Paul’s Context and Credibility","h":"<ul><li>Paul began as an enemy of Christ, stood by at the first martyrdom (Stephen), then met Jesus on the Damascus road.</li><li>He planted the church at Philippi and loved it: “I thank my God in all my remembrance of you.”</li><li>His missionary life had highs and lows — beaten, stoned, whipped, cast out of cities (and once went back in), shipwrecked more than once.</li><li>He writes this letter in house arrest in Rome, likely near the end of his life. Most scholars believe he was martyred shortly after Acts ends.</li><li>Prison then didn’t guarantee food — he depended on gifts, and the Philippians’ gift had been slow to arrive.</li></ul><p><b>The gift.</b> Gifts in the ancient world were socially complex: you gave to win favor or expecting something back. (Andrew’s “30 pairs of socks” first Christmas story shows we still feel the tension.) Paul refuses those rules and <b>reorients the gift around Jesus Christ.</b></p>"},{"t":"I. The Enemy: Love of Possessions","h":"<p>We want food, money, a vocation, a business to succeed, a better social group, a spouse — and we’re dissatisfied when life didn’t go as expected. Ads intensify this: say you want a sweater and an hour later Instagram shows it to you. Every ad says <i>you’re not happy because you lack this.</i></p><div class=\"q\">“The owner of five couches goes looking for ten. The owner of ten tables buys up as many again… and is not satisfied, but bent on more, losing sleep, and never sated with any amount.”<cite>— Plutarch</cite></div><p><b>The ten percent rule.</b> Four minutes closer to the beach, a place ten percent bigger — the small gap of “good, but not quite enough” causes the greatest pain.</p><div class=\"key\">Possessions are not evil. Money is not evil. A big house is not evil. Wealthy early Christians used their homes and resources for the gospel. The problem is when possessions <i>possess you</i> — when they control the ebb and flow of your life.</div><p><b>The Lomita house story.</b> When COVID hit, Andrew realized he’d do almost anything to keep the house — “I’ll sell cell phones on the corner.” He wasn’t possessing the house; <i>the house was possessing him.</i></p><p>Idols we are discontent without will ultimately kill us: we want them badly, and when we get them they don’t satisfy. <b>You will not find contentment in the world outside of you.</b></p>"},{"t":"I. The Enemy: Self-Sufficiency","h":"<p>The word Paul uses for “content” is <i>autarkeia</i> (self-sufficiency), a word used by the ancient Stoics who saw that the external world couldn’t satisfy. It feels so close to the truth that many Christians (and our culture) believe it.</p><div class=\"q\">“Your outside circumstances should not control how you feel” — don’t be drawn up and down by good and bad things.<cite>— Seneca (paraphrased)</cite></div><p>Andrew reads Henley’s <i>Invictus</i> (“I am the master of my fate, I am the captain of my soul”) beside Taylor Swift’s “Shake It Off” as two modern faces of the same idea.</p><ul><li><b>Version 1: “I’m enough.”</b> It doesn’t matter what anyone thinks; what matters is what I think of me. Every person has infinite dignity as an image-bearer of God — but not everything about us is marvelous. This doesn’t last.</li><li><b>Version 2: the grind.</b> Self-improvement culture — “every day is three days for me.” Not helpful either.</li></ul><p><b>Paul does neither.</b> He doesn’t say “this gift completely satisfied me,” and he doesn’t send it back saying “I don’t need it.” He’s neither controlled by the world nor withdrawn from it: he weeps over those who live as enemies of the cross (Phil. 3:18–19) and says “Rejoice in the Lord always” (4:4). Those two directions — outward and inward — are subordinated under the <b>upward</b>.</p><div class=\"q\">“If I find in myself a desire which no experience in this world can satisfy, the most probable explanation is that I was made for another world.”<cite>— C.S. Lewis</cite></div><p>This frees us from two things: the mute apathy of pulling inward, and the emotional insanity of attaching our hearts to everything around us.</p>"},{"t":"II. The Source: Christ-Sufficient","h":"<p>“I can do all things through him who strengthens me” — <b>the most misquoted verse in the New Testament.</b> It isn’t Christian superpowers. (If the pilot announces he’s not licensed but “can do all things through Christ,” you get off the plane.) It’s contextualized in what God has done in Paul’s life and in the gospel.</p><p><b>The gospel, as Andrew states it:</b></p><ul><li>We are born enemies of God; we rebel and sin against him, as Adam and Eve introduced sin, death and condemnation. Just reflect honestly on the thoughts of your own heart that no one can know.</li><li>God’s justice naturally issues in wrath against wickedness.</li><li>God became man, lived righteously, and at the cross his wrath was poured out on Jesus as our <b>substitute</b>. All who call on him have their sin paid for and his righteousness granted. At the judgment we present Christ’s righteousness and are rescued.</li></ul><p>Paul believes he’s been rescued, has a new future, a new family (the church), a new heavens and earth. He is not content to be self-sufficient, but <b>Christ-sufficient.</b></p><div class=\"key\">“Through” can imply the wrong thing — that through Jesus I get what I want. It’s <i>in</i> Jesus. He’s not a means to an end; he’s the end. Not just the giver of the gift — he’s the gift. Not just the provider — he’s the provision.</div><p>Because Jesus is the same yesterday, today, forever, he can’t be taken away and can’t be less than he is — so contentment is possible. Paul’s testimony: 2 Cor. 4:16–18 and 12:9–10. Christianity is the one religion where contentment is found in Christ alone.</p><p><b>Ten Commandments connection:</b> “No other gods before me” at the start; “you shall not covet” at the end. We look at what our neighbor has and think we deserve it more. If God is the object of worship, we trust he knows exactly what we have — how much is in the account, how many days are left — and didn’t make a mistake.</p>"},{"t":"III. The Results of Contentment","h":"<p><b>1. A deeper satisfaction in the sovereignty of God.</b> God is in control of everything; nothing is outside his power, knowledge, or presence. Christ has already acted decisively: death defeated, sins forgiven, the wicked made righteous. When people ask why they suffer, Andrew often has to say “I don’t know” — but God is good and tells us to trust him. That satisfaction matures and can withstand greater lows and highs.</p><p><b>2. A more daring generosity.</b> Most of us feel generous after buying a 99-cent hot dog while spending $8 on ourselves. Contentment and trust let us be generous in ways that are radical, sacrificial, “kind of dangerous.”</p><div class=\"key\">We’re not afraid of getting rich quick; we’re afraid of getting poor quick. Money will not keep us safe.</div><p><b>3. A stronger identification with Jesus.</b> The New Testament mostly gives a <i>model</i>, not methods: look at Christ. In Philippians 2 Jesus, in the form of God, emptied himself. Do I allow his life to challenge how I live? Is there an altar to financial stability in my house? In Phil. 3, Paul counts all gain as loss for the surpassing worth of knowing Christ.</p><p><i>Closing: “Hope Chapel, you could only ever live a life like that if you’re content in Christ.”</i> The sermon closes in prayer and leads into communion.</p>"}],"qs":["Which “ten percent” discontent is hardest for you — something good that still feels not quite enough?","Where do you see possessions possessing you rather than you using them for the gospel?","Are you more tempted toward chasing things outward or toward self-sufficiency inward? What does each look like for you?","How does reading Phil. 4:13 as “in Christ” rather than “through Christ” change how you hear the verse?","Where is your trust in God’s sovereignty being pressed right now?","What would daring, even uncomfortable, generosity look like this month?","Is there an area where you’d say “I’d do anything to keep this”? What does that reveal?"],"app":["Name one thing whose loss would genuinely destabilize you; bring it honestly to God.","Read Philippians 2:1–11 and meditate on Christ’s self-emptying.","Practice one act of generosity that feels slightly uncomfortable.","When discontentment surfaces, ask: am I looking outward, inward, or upward?","Memorize Philippians 4:11–12."]},{"id":"fear","tab":"Fear Not","color":"#2b4d8c","title":"Fear Not","meta":"Andrew Kelley · May 3, 2026 · Hope Chapel","ref":"Luke 21:10–19","verse":"“Nation will rise against nation, and kingdom against kingdom… But before all this, they will lay their hands on you and persecute you… This will be your opportunity to bear witness. Settle it therefore in your minds, not to meditate beforehand how to answer… But not a hair of your head will perish. By your endurance you will gain your lives.”","big":"“Do not be terrified” is a command, and Jesus gives three reasons to obey it: he rules over all things, he provides in suffering, and he will preserve his people.","take":["We suffer now by anticipating what might happen later — fears about the future that haven’t arrived.","The passage is primarily about the first-century disciples; the same categories of threat and the same assurances extend to God’s people today.","Wars, disasters, illness, impersonal systems, hidden powers — none operate outside Christ’s authority.","Persecution is reframed as opportunity. Don’t wait for a dramatic moment; you’re on mission now, in your ordinary life.","Prepare to proclaim Christ, not to protect yourself.","Be faithful, not fruitful — you may not see the harvest.","You may lose your life, but not your soul, and everything the world takes, Christ gives back."],"scr":[["Eph. 1:20–22","Christ seated at God’s right hand, far above all rule and authority; all things under his feet."],["1 Pet. 3:22","Angels, authorities and powers subjected to him."],["Col. 1:16–17","All things created through him and for him; in him all things hold together."],["Heb. 1:3","He upholds the universe by the word of his power."],["Eph. 2:10","We are his workmanship, created for good works prepared beforehand."],["Acts 6:10","Stephen’s opponents could not withstand the wisdom and Spirit with which he spoke."],["1 Cor. 1:18","The word of the cross is folly to the perishing, but power to us who are being saved."],["John 10:28–29","“No one will snatch them out of my hand.”"],["Phil. 1:6","He who began a good work in you will bring it to completion."],["1 Thess. 5:23–24","He who calls you is faithful; he will surely do it."]],"secs":[{"t":"Intro: The Anatomy of Fear","h":"<p>Kids at Knott’s Berry Farm — paralyzed by overlapping fears, none willing to ride anything. Children fear things that don’t exist or aren’t actually dangerous; adults are no different, except our fears are projected forward: finances, family, health, our children’s faith.</p><div class=\"key\">The preacher’s confession: “I’m a very scared guy… People memorize scripture; I write down all the bad things that might happen and meditate on that.”</div><p><b>Context in Luke.</b> Final week of Jesus’s life. He’s been confronting hypocrites in Jerusalem and now gives his longest discourse, mostly about the future. The disciples marvel at the temple; Jesus says it will be torn down. They ask <i>when</i> — an attempt to control.</p><p><b>Interpretive claim.</b> Verses 10–19 are primarily about the first-century disciples and what they would actually experience, not a prediction of our end times. Same categories of threat still apply, and the commands and assurances extend to us.</p><p><i>Pastoral note:</i> people passionate about end-times show two good things — love for God’s word and eagerness for Christ’s return. “When it comes to the return of Christ, we are not on the planning committee. We’re at the welcome party.”</p><div class=\"key\">“Do not be terrified” — not a suggestion, a command. The rest of the passage supplies the reasons.</div>"},{"t":"I. Christ Rules Over All Things (vv. 10–11)","h":"<p>Jesus names the forces that would terrify anyone in any age — not to minimize them, but to show none operate outside his authority.</p><ul><li><b>Wars &amp; nations</b> — Rome’s siege of Jerusalem, three emperors assassinated in a year. Today: global conflicts, political fracture, relationships lost over division.</li><li><b>Earthquakes</b> — natural disasters can’t be negotiated with. “You cannot talk down a hurricane. Do you know who can? Jesus.”</li><li><b>Pestilence</b> — illness and death. A woman dying in hospital the night before: “I know Christ has me.” Medicine reaches its limit; Christ does not.</li><li><b>Famine / systemic failure</b> — faceless, bureaucratic harm. “We have a personal Lord in the face of impersonal dangers.”</li><li><b>Signs &amp; hidden powers</b> — things behind closed doors we can’t see or verify. “Christ knows all things.”</li></ul><div class=\"key\">Unlike any other worldview, Christians worship the one who holds the universe together. Not merely a good teacher — the King of the universe.</div><p>Return to the anchor texts in moments of fear: Eph. 1:20–22, 1 Pet. 3:22, Col. 1:16–17, Heb. 1:3 (see Key Scriptures).</p>"},{"t":"II-A. You Are Already on Mission","h":"<p>Jesus reframes persecution, arrest and betrayal by family as an <i>opportunity to bear witness.</i> The pastoral question: <b>Are you on mission in your local geographical location?</b> Not in some dramatic future scenario — right now.</p><ul><li>Disciples were given platforms before synagogues, prisons, kings and governors.</li><li>Paul on trial before King Agrippa turned his defense into an evangelistic appeal. The courtroom became the pulpit.</li></ul><div class=\"q\">“We have these weird persecution fantasies… ‘If they made Christianity illegal and dragged me out of my house, I would surely die for Christ.’ But most of us won’t even tell the guy on the bus about Jesus.”</div><p>The ordinary moments are the mission: the relationship needing humility, the marriage needing self-sacrifice, the neighbor, the lunch table. Eph. 2:10 — wake up looking for what God has already prepared for you to do today.</p>"},{"t":"II-B. Wisdom, Not Self-Reliance","h":"<p>“Settle it in your minds not to meditate beforehand how to answer” (v. 14) doesn’t forbid preparation. It confronts <b>self-reliance</b> — going into evangelistic conversations thinking mostly about how we’ll look.</p><ul><li>Stephen, the first martyr, was given wisdom his opponents couldn’t withstand (Acts 6:10).</li><li>We rehearse clever arguments in the shower; God calls us to proclaim Christ and trust him for words.</li><li>If you don’t know the answer, that’s okay — the creator of the universe is standing behind you.</li></ul><div class=\"q\">“Prepare to proclaim Christ, not to protect yourself.”</div><p>1 Cor. 1:18: the word of the cross is folly to those perishing, but the power of God to us.</p>"},{"t":"II-C. Outcomes You Might Not Expect","h":"<p>Jesus doesn’t promise success as the world measures it: some will be handed over, hated, even killed. The call is to be <b>faithful, not fruitful.</b></p><ul><li>Some water, some plant, some reap — you may not see the harvest.</li><li>A parent faithfully discipling a child who drifts: the child may return through someone else’s work, but your work still mattered.</li><li>Faithfulness in marriage, friendship, neighborhood is the fruit of mission, even when invisible.</li></ul><div class=\"key\">Whatever bravery we have now will be harder when stakes are higher. The courage to be faithful in ordinary life is the courage we’ll need in extraordinary moments — and it’s trained in the ordinary.</div>"},{"t":"The Gospel — Why This Is Possible","h":"<p>Before the last point, a full gospel presentation: the foundation under every assurance Jesus gives.</p><ul><li><b>Bad news:</b> humans are enemies of God, ratifying Adam’s sin in our own lives; God is righteous and his just wrath falls on those who oppose him.</li><li><b>Good news:</b> God became man in Jesus, lived a perfectly sinless life, and went to the cross as our substitute. God’s wrath was poured out on him so all who repent and trust receive his righteousness and are free from condemnation.</li><li><b>The verdict:</b> You will stand before the judge. You won’t present your own record; you present Christ’s righteousness. You are declared righteous. You are rescued.</li></ul><p><i>“Today is the day of salvation.”</i></p>"},{"t":"III. Christ Will Preserve His People (vv. 17–19)","h":"<p>Apparent contradiction: “some of you will be put to death” and “not a hair of your head will perish.” The key is the word at the end of v. 19: <i>psychē</i> — more accurately <b>soul.</b></p><div class=\"q\">“You may lose your life. You will not lose your soul. And then your life will be given back to you.”</div><ul><li>This world takes: cancer takes health, dementia takes memory and personality, age takes the body.</li><li>Christian hope: everything the world takes from you, Christ will give back. Not a hair will perish — everything is restored.</li><li>The hope isn’t that you won’t die; it’s that you’ll be raised.</li></ul><p><b>Endurance is also supplied by Christ</b> — not white-knuckle persistence. The power that saves you makes you holier: John 10:28–29, Phil. 1:6, 1 Thess. 5:23–24.</p><div class=\"key\">“We get saved and God’s like, ‘You’re in’ — and then he walks out and we think we have to stay in. God’s not going to fumble you. What kind of God worthy of worship could lose you?”</div><p>Pursue holiness deeply — but the power comes from Christ. He leads you to it, brings you through it, and sees you to the end.</p><p><b>Closing prayer:</b> “…Help us to trust more and more on those promises, so that at the end of our lives when we must trust those promises, it’s easy.”</p>"}],"qs":["Andrew said many of his fears are about things that might happen in the future. Which of your current fears are about something that hasn’t actually happened yet? How does the assurance that “Christ rules over all things” speak to that specific fear?","Read Colossians 1:16–17 and Hebrews 1:3. What changes when you remember that the Christ you worship is holding the universe together right now?","Andrew asked, “Are you on mission in your local geographical location?” Where in your everyday life has God already prepared opportunities you may have been overlooking?","Andrew warned against “persecution fantasies.” What is one small, real conversation, relationship or act of self-sacrifice this week that could put the gospel on display?","“Prepare to proclaim Christ, not to protect yourself.” Where do self-reliance, image, or wanting to look smart get in the way of how you talk about Jesus?","“Your call is to be faithful, not fruitful.” Where are you tempted to give up because you can’t see fruit? What would faithfulness look like there this month?","Where do you most need to hear the third assurance — that Christ will preserve his people to the end — and what would it change about how you live this week if you truly believed it?"],"app":["Name your fear specifically; write it down; set it beside Eph. 1, 1 Pet. 3, Col. 1, Heb. 1 and ask: is this outside Christ’s authority?","Identify your ordinary mission field — the people in your regular week.","Start one morning asking what good works God has already prepared (Eph. 2:10).","Prepare to proclaim, not protect: one simple honest sentence about what Christ has done for you.","Sit with Phil. 1:6 — your perseverance is supplied, not earned."]},{"id":"p1","tab":"Guilty Pt. 1","color":"#7a3b3b","title":"The Guilty Accusing the Guiltless","meta":"Jared Blue · Aug 9, 2026 · Hope Chapel","ref":"Luke 23:1–7","verse":"“Then the whole company of them arose and brought him before Pilate. And they began to accuse him, saying, ‘We found this man misleading our nation and forbidding us to give tribute to Caesar, and saying that he himself is Christ, a king.’… Then Pilate said… ‘I find no guilt in this man.’”","big":"Though guilty men brought false charges against the innocent Jesus, Pilate’s own verdict declared him guiltless — and every step of this corrupt process unfolded exactly as Jesus planned.","take":["The Sanhedrin swapped their real charge (blasphemy) for fabricated political ones because Pilate had no reason to care about Jewish religious law.","All three charges — sedition, tax resistance, claiming kingship — were false, and the accusers were more guilty of each than Jesus was.","Pilate saw through the leaders’ envy yet chose the easy path over the right one — a failure we’re all prone to.","Jesus stood bloodied yet fearless and calm; he mounted no defense because he was not a victim but sovereignly allowing it.","People still misrepresent Jesus today (prosperity preachers, Christian nationalists, self-help with verses) — discernment matters.","Every person must ultimately render a verdict on Jesus."],"scr":[["John 18:31","“We have no right to execute anyone.”"],["Luke 20:24–25","“Render to Caesar the things that are Caesar’s, and to God the things that are God’s.”"],["John 4:25–26","“I who speak to you am he.”"],["Mark 14:61–62","“Are you the Christ, the Son of the Blessed?” “I am.”"],["Isa. 52:14","His appearance was so disfigured beyond that of any human being."],["Matt. 27:18","Pilate knew it was out of envy that they had delivered him up."],["Matt. 20:17–19","Jesus’s own prediction: delivered to the chief priests, condemned, handed to the Gentiles, flogged, crucified, raised on the third day."],["Ps. 110:4; Zech. 6:12–13","The Messiah as both priest and king."]],"secs":[{"t":"Opening: How Did We Get Here?","h":"<p>This is the penultimate chapter of Luke, after nearly three years in the book — a blessing to be in a church that goes through God’s Word one verse, chapter, and book at a time.</p><p><b>Backstory.</b> Jesus was betrayed and arrested, taken to Annas (former high priest) and then Caiaphas (current), both trials illegal under Jewish law by the very men meant to uphold it. He was found guilty of blasphemy — a death sentence, but they couldn’t carry it out (John 18:31).</p><p>So the entire Sanhedrin — 71 members: chief priests, elders, family heads, scribes, Pharisees and Sadducees — assembles Friday morning and takes Jesus to Pilate. The Pharisees and Sadducees disagreed on nearly everything, yet are united here: <i>“the enemy of my enemy is my friend.”</i></p>"},{"t":"Pilate and the Accusations (23:1–2)","h":"<p>Pilate was Rome’s governor of Judea AD 26–36, usually based in Caesarea; in Jerusalem at Passover when national pride and uprisings were most likely. The Jewish scholar Philo described him as corrupt, insolent, cruel, given to “continual murders of people untried and uncondemned.”</p><p>Notice what’s missing: <b>blasphemy.</b> They confirmed that charge in their own court, but swap it for three political accusations to alarm a Roman governor:</p><ul><li><b>1. “Misleading our nation”</b> (sedition) — false. Jesus rejected worldly power and spoke of a spiritual kingdom, which is why many leaders didn’t accept him as Messiah. If anyone wanted revolt, it was them.</li><li><b>2. “Forbidding tribute to Caesar”</b> — false. Days earlier the Pharisees and Herodians tried to trap him publicly. Jesus: “Show me a denarius. Whose likeness?… Render to Caesar…” They’re now recycling a failed trap as evidence.</li><li><b>3. “Christ, a king”</b> — <i>Christos</i> is Greek for Hebrew <i>Messiah</i>, “the anointed one.” Jesus did affirm this (John 4; Mark 14), and the OT describes the Messiah as priest and king. They twist a true identity into a threat to Caesar.</li></ul><div class=\"key\">People still do this: some selfishly promote Jesus in a false light to profit — prosperity preachers, radical Christian nationalists, self-help movements with verses tucked in. Pay close attention to what you’re watching and hearing.</div>"},{"t":"The Verdict (23:3–4)","h":"<p>Pilate takes Jesus aside into his private headquarters (John 18) and zeroes in on the one charge worth following up. The Greek stresses the pronoun: <i>Are <b>you</b> the king of the Jews?</i> — with sarcasm built in.</p><p>Jesus, battered beyond recognition (blindfolded, struck repeatedly in the face with fists — Isa. 52:14 fulfilled), answers with quiet authority: <b>“You have said so.”</b> Men came to Pilate groveling and begging for their lives; Jesus was different — “fearless… a calm and confident nobility.”</p><p><b>What if he’d defended himself?</b> He could have called the Cana couple, the centurion whose servant he healed (a man Pilate would know), the 5,000, Lazarus. Instead: “You have said so.” This mirrors his answer to the Sanhedrin (“You say that I am”). He recognized a question asked in bad faith.</p><p>Pilate’s verdict: <b>“I find no guilt in this man.”</b> Even after an affirmative answer, a king without an army, delivered by his own people, is no threat to Caesar. Pilate also saw the <i>envy</i> (Matt. 27:18) — a political power play, one faction trying to use Rome against a rival.</p><div class=\"q\">“Don’t be like the religious leaders and remain hostile towards Jesus. Don’t be like Pilate and be dismissive of Jesus.”</div><p>Jared lays out the gospel here: Adam and Eve’s disobedience brought sin and death like a cancer; all are born with a sinful nature and have ratified it; all deserve eternal punishment. God the Father in love sent God the Son — fully God, fully man — to live perfectly and die in our place, so all drawn to repentance and faith receive eternal life. Every listener will face the same verdict question Pilate did.</p>"},{"t":"The Transfer (23:5–7)","h":"<p>The not-guilty verdict detonates. The leaders double down: “He stirs up the people, teaching throughout all Judea, from Galilee even to this place.” The mention of Galilee is calculated — every major Jewish revolt against Rome began there.</p><div class=\"q\">Galileans: “off-the-grid hillbillies who wrapped everything in the American flag and were anti-government… strong Jewish nationalists and anti-Roman.”</div><p><b>Pilate’s dilemma.</b> He knows Jesus is innocent, but releasing him could mean a riot → Roman troops → bloodshed → a report to Caesar written by Jesus’s enemies, painting Pilate as the man who freed an anti-Roman agitator. He was already in trouble with Caesar over past uprisings.</p><p>The mention of Galilee, meant to seal Jesus’s fate, hands Pilate an exit: Galilee is Herod Antipas’s jurisdiction and Herod is in town for Passover. Pilate sends Jesus there — protecting himself while moving Jesus to another court.</p><p><b>Application.</b> Don’t watch Pilate’s failure from a distance: “We’ve all been at the crossroads of what is right and what is easy.” Examples: cheating on a test, staying quiet when a server’s billing mistake favors you, a white lie to avoid discomfort, neglecting responsibilities for gaming or social media. Ask the Lord to search your heart.</p>"},{"t":"Closing: Jesus Is Not a Victim","h":"<p>It’s tempting to picture Jesus as a man who can’t catch a break — betrayal, arrest, illegal trials, beatings, mockery, Roman dismissal, transfer. That picture is wrong. <b>He was not a victim of these events; he was sovereignly orchestrating them.</b></p><p>He predicted every step (Matt. 20:17–19): delivered to the chief priests and scribes, condemned, delivered to the Gentiles to be mocked, flogged and crucified, raised on the third day.</p><div class=\"key\">“Everything is falling into place just as Jesus the Messiah wants it to.”</div><p><b>Closing prayer:</b> for a love of Scripture deep enough that when something sounds off we recognize it; for those who haven’t decided about Jesus; and for courage to stop taking the easy way out and do what we know is right.</p>"}],"qs":["All three accusations were false yet plausible. What does that say about knowing what Jesus actually taught, not just what others say?","If anyone in the courtroom was guilty of sedition, it was the accusers. Where might you project onto others the faults you’re most guilty of?","Jesus could have mounted a powerful defense and chose silence. What does it say about his trust in the Father — and what might it model when you’re falsely accused?","Pilate knew Jesus was innocent. At what point does knowing the right thing become being responsible for doing it?","“We are much more like Pilate than we’d want to think.” Where are you choosing convenience over conscience?","How does it change your reading of the Passion to know Jesus was in control of every step?","What practices help you tell faithful from self-serving portrayals of Jesus?"]},{"id":"p2","tab":"Guilty Pt. 2","color":"#5b3f7a","title":"The Guilty Accusing the Guiltless, Part 2","meta":"Zac Nazarian · Aug 16, 2026 · Hope Chapel","ref":"Luke 23:8–25","verse":"“A third time he said to them, ‘Why? What evil has he done? I have found in him no guilt deserving death… ’ But they were urgent, demanding with loud cries that he should be crucified. And their voices prevailed… he delivered Jesus over to their will.”","big":"Every guilty verdict Jesus should have received was replaced with a declaration of innocence — from Pilate, from Herod, and from prophecy — yet cowardice and mob pressure sent an innocent man to the cross, exactly as God had planned.","take":["Jesus was hated because he never compromised — he exposed the leaders’ hypocrisy and cowardice. What are your non-negotiables?","Herod and Pilate are two independent witnesses (one indifferent, one hostile) who both found Jesus innocent — fulfilling Deut. 19:15 and Ps. 2:2.","Jesus’s silence wasn’t weakness; it fulfilled Isaiah 53 and models confidence that doesn’t need to defend itself.","Pilate knew what was right and did the easy thing — three times declaring Jesus not guilty, then handing him over.","Crucifixion was demanded to brand Jesus as cursed by God; the gospel says he took that curse in our place.","Their decisions didn’t determine Jesus’s fate — they determined their own."],"scr":[["John 18:31","“It is not lawful for us to put anyone to death.”"],["Matt. 27:12–14","He gave no answer, “not even to a single charge.”"],["John 18:36–37","“My kingdom is not of this world… Everyone who is of the truth listens to my voice.”"],["Luke 9:7–9","Herod: “John I beheaded, but who is this?”"],["Deut. 19:15","A charge is established on the evidence of two or three witnesses."],["Ps. 2:2","Kings and rulers take counsel together against the Lord and his Anointed."],["Isa. 53:7","Like a lamb led to slaughter… he opened not his mouth."],["1 Pet. 2:21–23","He entrusted himself to him who judges justly."],["Mark 15:6–10","Barabbas, the Passover custom, and Pilate’s perception of envy."],["Matt. 27:19","Pilate’s wife: “Have nothing to do with that righteous man.”"],["Deut. 21:23","A hanged man is cursed by God."],["Matt. 27:24–25","Pilate washes his hands; “His blood be on us and on our children!”"],["Acts 4:27–28","Herod and Pilate did what God’s hand and plan had predestined."]],"secs":[{"t":"Opening: Cowardice, Hypocrisy, Non-Negotiables","h":"<p>Zac borrows Jared’s title but turns it: where Jared asked “Have you ever been falsely accused?”, Zac wants to talk about <b>cowardice and hypocrisy</b> — real struggles for Christians today. What are your core principles — what will you absolutely not compromise or sell out?</p><div class=\"q\">“Was Jesus a hypocrite? Was he a compromiser? No — he was absolutely hated by the Jewish religious leaders. Why? Because he was constantly pointing out their hypocrisy, constantly pointing out their cowardice.”</div>"},{"t":"Why Pilate? Blasphemy → Treason","h":"<p>The original charge was blasphemy — a death penalty under Jewish law — but the Jews couldn’t execute (John 18:31). A Roman governor didn’t care about blasphemy, so the Sanhedrin switched to <b>treason</b>: inciting rebellion, refusing taxes, claiming to be a king.</p><p><b>A misunderstood Messiah.</b> Under intense messianic expectation they wanted a political, military deliverer; Jesus came as a spiritual one.</p><div class=\"q\">“All these problems start first spiritually — relational issues, spiritual foundation, lack thereof… Seek me first and my righteousness, and I’ll take care of all this other stuff.”</div><p>Because Jesus didn’t meet their political expectations, the nation that welcomed him days earlier was “done with him.”</p>"},{"t":"Before Pilate: “Are You the King?”","h":"<p>The whole Sanhedrin — the Jewish Supreme Court — expected unity to settle it, but offered no evidence, no witnesses, no specific wrongdoing. Jesus said nothing (Matt. 27:12–14). Pilate was amazed.</p><p>Pilate asks about kingship; Jesus first asks a clarifying question, then answers: “My kingdom is not of this world… For this purpose I was born… to bear witness to the truth. Everyone who is of the truth listens to my voice.”</p><div class=\"key\">“How do you know you’re on the side of truth? You listen to Jesus.”</div><p>Pilate waves it off — “What is truth?” — the relativist of his day. His ruling: not guilty of any crime against Rome.</p><p><b>Jesus provokes a response.</b> Say “I believe in God” to strangers and most respond warmly. Add that Jesus is God’s one and only Son and the only way, and the room changes. Believers can be reticent to speak positively of Jesus to friends and coworkers. When it gets tense, ask: <i>Why do you feel so strongly? Have you actually read his book?</i></p><div class=\"q\">“If Jesus is wrong, he can be dismissed. Doesn’t matter. But if he’s right, he deserves to be worshiped and obeyed. Either way, he provokes a response.”</div>"},{"t":"New Charge → Before Herod","h":"<p>The leaders escalate (Luke 23:5): “He stirs up the people, from Galilee even to this place.” They know Pilate must keep the peace. But Galilee gives Pilate an out — Herod’s jurisdiction, and Herod is in town.</p><p>Herod is thrilled; he’d long wanted to see a miracle. But Zac recalls Herod’s history: John the Baptist preached repentance to him and was beheaded (Luke 9:7–9). Herod questions Jesus at length — and Jesus gives <b>no answer at all</b>, the only person in the Gospels to whom he says nothing.</p><div class=\"key\">“Herod had a hard heart, and Jesus knew this. You didn’t listen to John. You’re not going to listen to me.”</div><p><b>Discernment:</b> not every question deserves an answer. “Are you really interested in the answers, or just interested in excuses not to believe? If it’s the latter, sometimes the best answer you can give is just quiet.”</p><p>Herod and his soldiers mock Jesus, dress him in an elegant robe, and send him back.</p>"},{"t":"Two Witnesses and Fulfilled Prophecy","h":"<p>Three reasons the Herod hearing matters:</p><ul><li>It confirms Pilate’s verdict of innocence.</li><li>Herod and Pilate are <b>two independent witnesses</b> — Pilate indifferent, Herod wanting him dead — meeting Deut. 19:15.</li><li>It fulfills <b>Psalm 2:2</b>: rulers taking counsel together against the Lord’s Anointed.</li></ul><p><b>The suffering servant.</b> Jesus’s silence before the Sanhedrin, Pilate and Herod fulfills Isaiah 53:7 and models 1 Pet. 2:21–23 — entrusting himself to the one who judges justly.</p><div class=\"q\">“I’m sorry. I was wrong. Forgive me. I love you. Ten magic words — every husband should have those in his arsenal.” <cite>— Zac, on not needing to defend yourself</cite></div>"},{"t":"Pilate’s Cowardice","h":"<p>Pilate confirms his ruling — nothing deserving death — and proposes a compromise: flog Jesus and release him. This is Pilate’s moment of testing: he knows what’s right, but the crowd roars.</p><div class=\"q\">“Had Pilate been a man really of courage, a man of integrity, he would have released Jesus regardless of the consequences. But the crowd roared, and Pilate buckled.”</div><p>Doing the right thing is often costly — rejection, lost relationships, even a job. <b>“When there’s pressure on you to make that right decision, remember Pilate. Don’t be like him.”</b></p>"},{"t":"Barabbas and “Crucify Him!”","h":"<p>Luke’s manuscripts omit v. 17, so Zac turns to Mark 15:6–10: it was custom to release a prisoner at the feast. Among the rebels was Barabbas, who’d committed murder in an insurrection. Pilate tries using the custom as an exit, banking on Jesus’s popularity, perceiving the priests acted from envy.</p><p>Then <b>Pilate’s wife</b> sends word (Matt. 27:19): “Have nothing to do with that righteous man, for I have suffered much because of him today in a dream.” But the leaders stir the crowd toward Barabbas — a likely folk hero for standing against Rome. The irony: the very charge of insurrection they pinned on Jesus, they overlook in the man they want freed.</p><div class=\"q\">“Is that crazy logic? They will go to any lengths whatsoever to have Jesus done away with. Don’t confuse me with the facts.”</div><p><b>Why crucifixion?</b> Three times Pilate appeals; three times the demand grows. Under Mosaic law, blasphemy meant stoning. But crucifixion carried deliberate meaning: Deut. 21:23, “a hanged man is cursed by God.” They wanted Jesus branded as cursed, disqualified as Messiah. The gospel flips it:</p><div class=\"key\">Crucifixion pictures Jesus taking God’s curse on sin on himself so his people can be set free. Whatever people can’t break or get away from — Jesus is the only one who can set them free.</div><p><b>Pilate washes his hands</b> (Matt. 27:24–25): fearing a riot, he distances himself with a Jewish custom — “I am innocent of this man’s blood; see to it yourselves.” The crowd: “His blood be on us and on our children!” The Sanhedrin would later deny responsibility (Acts 5:28).</p>"},{"t":"Closing: Irony, Sovereignty, Invitation","h":"<p>The great irony: the perfectly righteous, sinless, innocent one was condemned as blasphemer and criminal, while the men who condemned him will one day be judged by him. None of it was outside God’s control (Acts 4:27–28).</p><div class=\"key\">“Their decisions didn’t determine Jesus’ fate. Their decisions determined their fate.”</div><p>Zac calls the leaders’ rejection the most tragic wasted opportunity in history — the God of the universe standing in front of them. And the invitation:</p><div class=\"q\">“If you don’t know Jesus yet, don’t waste any time. Don’t be like those Jews. Don’t waste this moment. He is for you… Just say, ‘Jesus saved me.’”</div>"}],"qa":[{"q":"What’s one thing from Sunday’s sermon that stuck with you this week — a question, conviction, or something you’ve kept mulling?"},{"q":"Pastor Zac opened by asking about non-negotiables — core beliefs you will not compromise. What is one belief you’ve already settled as a non-negotiable, no matter what it costs?"},{"q":"The religious leaders hated Jesus for pointing out their hypocrisy, and hardened their hearts instead of repenting. When someone points out a gap between what you say and how you live, what’s your first reaction?"},{"q":"The Jewish leaders wanted a political and military deliverer, so rejected Jesus when he didn’t fit. Where have you expected Jesus to work a certain way and struggled when he didn’t?"},{"q":"Pastor Zac said underneath our problems are spiritual issues and we put band-aids on instead of dealing with the root. What does it look like to address the root rather than the symptom?"},{"q":"While the chief priests accused him, Jesus gave no answer. Peter says he “entrusted himself to him who judges justly.” When accused unfairly, what makes it hard to stay quiet and leave the outcome with God?"},{"q":"Saying “I believe in God” gets a friendly response, but adding that Jesus is God’s one and only Son and the only way quickly loses favor. When has naming Jesus specifically changed the temperature of a conversation?"},{"q":"Herod plied Jesus with many questions and got no answer. Zac called them smokescreen questions. How can you tell whether someone’s questions about faith are honest?"},{"q":"Pilate said three times he found no basis for a charge, then handed Jesus over. People are like Pilate when they know what’s right but do the opposite. What pressure most often keeps you from doing the right thing you already know?"},{"q":"Zac said our choices are loyalty, faith and integrity tests, and the leaders’ decision determined their own fate, not Jesus’. What is one decision in front of you where this group can help you stand with integrity and faith?"}]},{"id":"obey","tab":"Know & Obey","color":"#8a5a12","title":"To Know and Obey, Part 1","meta":"Zac Nazarian · Dec 28, 2025 · Hope Chapel","ref":"Matthew 25:1–30","verse":"“Then the kingdom of heaven will be like ten virgins who took their lamps and went to meet the bridegroom… ‘Lord, lord, open to us.’ But he answered, ‘Truly, I say to you, I do not know you.’” … “Well done, good and faithful servant. You have been faithful over a little; I will set you over much.”","big":"God did not save you merely to get you to heaven — he saved you to know him and obey him. On judgment day the test is “Do you know me?” and “Did you do my will?” — and obedience can only flow from relationship, never the other way around.","take":["The two parables of Matthew 25 frame two questions Christ will ask: do you know me, and did you do my will?","The “oil” in the Ten Virgins is the Holy Spirit; only those born again can truly know the bridegroom.","The unfaithful servant wasn’t punished for stealing but for burying what he was entrusted with.","“I’m saved by grace, so nothing else is required” misreads grace. Grace produces obedient people who know the Master.","Salvation is instantaneous and a process: “I am saved, I am being saved, I will be saved.”","Obedience is the fruit of knowing him, not a substitute for it.","Heaven is not the goal — relationship with Christ is the goal; heaven is a byproduct."],"scr":[["Matt. 25:1–13","Parable of the Ten Virgins — readiness to receive the bridegroom."],["Matt. 25:14–30","Parable of the Talents — faithful stewardship of what the master entrusted."],["John 3:7","“You must be born again.”"],["Titus 3:5","Saved “by the washing of regeneration and renewal of the Holy Spirit.”"],["Rom. 8:11","The Spirit who raised Jesus dwells in you and gives life to your mortal bodies."],["John 10:14","“I am the good shepherd. I know my own and my own know me.”"],["John 14:21, 23–24","“Whoever has my commandments and keeps them, he it is who loves me.”"],["1 John 2:3–4","Whoever says “I know him” but doesn’t keep his commandments is a liar."],["2 Cor. 5:10","We must all appear before the judgment seat of Christ."],["Gal. 6:7","God is not mocked; whatever one sows, that will he also reap."],["Matt. 7:21–23","“I never knew you; depart from me.”"],["John 17:3","“This is eternal life, that they know you, the only true God.”"],["Titus 2:11–14","Grace trains us to renounce ungodliness and be zealous for good works."]],"secs":[{"t":"Setting the Stage: Two Parables","h":"<p>Jesus has just answered his disciples’ question in chapter 24 about when he will return. Now he gives two parables about what readiness looks like: the <b>Ten Virgins</b> (five foolish, five wise — the foolish took no oil) and the <b>Talents</b> (five, two, and one talent entrusted “to each according to his ability”; two servants double theirs, the third buries his and is called “wicked and slothful”).</p><p>After the Christmas Eve celebration, Zac says he’s “here to lay it down” and asks the room to think, not answer aloud: <b>“Why did God save you?”</b> The title is the answer — to know and obey.</p><div class=\"key\">“Do you know me? Did you do my will? I think it all boils down to that.” The Virgins search the first question; the Talents search the second.</div>"},{"t":"Question 1: “Do You Know Me?” (Ten Virgins)","h":"<p>The oil speaks of <b>readiness</b>; Zac takes it as a picture of the Holy Spirit — only by the Spirit can anyone truly know the bridegroom (John 3:7; Titus 3:5; Rom. 8:11; John 10:14).</p><p><b>His testimony:</b> he was raised religious and knew about God, Jesus, and the resurrection — but there was a gap.</p><div class=\"q\">“I knew about Jesus. I knew about the resurrection. I just never knew Jesus. There’s a huge difference.”</div><p>Revelation 19: Christ returns to marry his bride, dressed in white linen of righteous deeds. Those without the Spirit’s oil have no light and can’t enter the feast.</p>"},{"t":"Question 2: “Did You Do My Will?” (Talents)","h":"<p>Each servant received “according to his ability” — every believer has gifts, abilities, and opportunities. The job of a servant is to know what the master requires. Most Christians know the broad strokes (don’t steal, lie, murder), but what about the particulars? <i>“What would you have of me today?”</i> The third servant didn’t bother to find out.</p><p><b>The common defense:</b> “I’m saved by grace. That’s my ticket to heaven. Nothing else is required.” Zac answers with Jesus’s own words (John 14:21, 23–24) and the three conditions of discipleship — deny yourself, take up your cross, follow him. Was Jesus kidding?</p><div class=\"q\">“I can’t say I know him. I can’t say I’m a believer. I can’t say I’m born again and ignore what he’s called me to be and to live.” <cite>— from 1 John 2:3–4</cite></div>"},{"t":"The Questions Are Linked; There Will Be an Accounting","h":"<p>You can’t separate knowing him from doing his will: obedience is the proof of relationship, and relationship is the source of obedience. The Bible is a book about relationships — vertical (God), then yourself, then others, then the environment God entrusted to you. If the first breaks, the others collapse.</p><p>People marry not just because they’re in love but because life feels incomplete alone — “This is what God wants. He wants us in his life to do life together.”</p><p><b>Judgment is real and personal</b> (2 Cor. 5:10; Gal. 6:7). Resist self-justification — the “but, but, you don’t understand” reflex. Better: <i>“Thank you for catching me. I needed that.”</i> People in your sphere are watching; admit it, repent, move on.</p>"},{"t":"Salvation Is a Process","h":"<p>Careful not to slide into works: we confess, repent, and receive Jesus as Savior and Lord — that’s the entry point, not the finish line. Then begins lifelong sanctification, being conformed to Christ’s likeness by the Spirit.</p><div class=\"key\">“Salvation is in fact instantaneous. It’s also a process. I am saved. I’m being saved. I will be saved.”</div>"},{"t":"Prayer: Stop Talking, Start Listening","h":"<p>Zac admits his long prayer list and “not my will but yours be done” — covering the bases. But most of his prayer time is spent <b>listening</b>.</p><div class=\"q\">“Most of my prayer time is spent listening, learning to hear him.”</div><p>He prays with his Bible open: the flesh wants to talk, the devil will quote Scripture too, and the Holy Spirit will speak — and he wants to discern which voice is which.</p>"},{"t":"Heaven Is Not the Goal","h":"<div class=\"key\">“Heaven is not the goal. Write that down.” Heaven is a byproduct; the goal is relationship with Christ.</div><p>From that knowing, obedience flows: we consult him, listen for his will in particular situations, and carry it out in ordinary and extraordinary ways.</p><div class=\"q\">“Obedience is a fruit. Obedience is a measuring rod of the quality of relationship that I have with him. Doesn’t work the other way around.”</div><p>You can’t reverse the order with dead religious works — and you won’t even know his will for a given situation unless the relationship is already there.</p>"},{"t":"The Most Terrifying Passage (Matt. 7:21–23)","h":"<p>“Lord, Lord, did we not prophesy in your name, and cast out demons… do many mighty works?” — “I never knew you; depart from me, you workers of lawlessness.” The works looked impressive; Jesus calls them evil — not because the deeds were bad but because no relationship stood behind them.</p><ul><li><b>Beware formulas.</b> “A plus B plus C… The kingdom of God is more than a formula.”</li><li><b>Beware quiet confidence.</b> “‘I got heaven in the bag.’ Don’t do that.”</li></ul><p>John 17:3: eternal life is knowing God. Today is the day of salvation — don’t procrastinate.</p>"},{"t":"Why God Saved Us & Invitation","h":"<p>Titus 2:11–14: grace trains us to renounce ungodliness and be zealous for good works.</p><div class=\"q\">“Why’d he save us? Because he wanted us. The Father wants children. Jesus wants brothers and sisters who are eager to be like him and to do what he wants.”</div><p>Relationship first; then we know what he wants. From obedient service we become salt and light where non-believers are watching.</p><p><b>Invitation:</b> if you don’t know the Lord, you can right now — confess, repent, ask Jesus to forgive you, fill you with his Spirit, and make you new. <i>“I can’t think of a better person in all existence to know than Jesus.”</i> Closing prayer asks God to search hearts for wrong understanding or unbelief, so the church comes to the table with clean hands.</p>"}],"qs":["Zac asked, “Why did God save you?” If you had to answer in one sentence right now, what would you say — and does it match how you actually live?","He distinguished knowing about Jesus from knowing Jesus. Where does your relationship sit on that line, and what would deepen the knowing this week?","The unfaithful servant was punished not for stealing but for burying what was entrusted, out of fear. Is there a gift, opportunity or stewardship you’ve buried?","“I can’t say I know him… and ignore what he’s called me to be and to live.” What is one specific area where Christ is asking you to obey and you’ve been delaying?","“Heaven is not the goal.” What would change about your daily life this week if relationship with Christ were your operating goal?","Zac spends most prayer time listening, with his Bible open. What would it look like to listen as much as you talk in prayer this week?","In Matthew 7:21–23, people listed impressive works and Jesus said, “I never knew you.” What might you be relying on as proof of relationship that is actually a substitute?","Who are the people in your spheres of influence watching how you live? What do you want them to see in you in 2026?"]},{"id":"eoh1","tab":"End of History 1","color":"#0f6e7a","title":"The End of History","meta":"Andrew Kelley · May 17, 2026 · Hope Chapel","ref":"Luke 21:25–28","verse":"“And there will be signs in sun and moon and stars… people fainting with fear and with foreboding of what is coming on the world… And then they will see the Son of Man coming in a cloud with power and great glory. Now when these things begin to take place, straighten up and raise your heads, because your redemption is drawing near.”","big":"Because history is headed toward a fixed end — the return of Christ in power and glory — his people can stand up straight and lift their heads with joyful anticipation, even as the world shakes and crumbles.","take":["Christianity insists history has a <i>telos</i> — a target — and will reach it.","The world that feels safe and strong will be exposed in judgment as confused and fragile; worldly wisdom and human strength both collapse.","Jesus is not merely a prophet — he is Yahweh himself, the Son of Man of Daniel 7, who will return in a cloud with power and great glory.","First coming: humble and obscure. Second coming: unmistakable and glorious.","Those in Christ have no judgment left to fear — it fell on Christ — so they meet his return with joy.","The delay of judgment is not God’s indifference or approval; it is his mercy."],"scr":[["Luke 21:25–28","The shaking of the world, the Son of Man coming, and “straighten up and raise your heads.”"],["1 Cor. 1:19–21","God makes foolish the wisdom of the world."],["James 3:13–15","Earthly, unspiritual, demonic “wisdom.”"],["Isa. 13:6–8","The day of the Lord: all hands feeble, every human heart melts."],["Jer. 17:5–6","Cursed is the man who trusts in man and makes flesh his strength."],["Ps. 33:16–17","The king is not saved by his great army."],["2 Pet. 3:8–10","The Lord is patient, not wishing that any should perish."],["Exod. 34:5–7; Ps. 104:1–3","Clouds as the presence of God himself."],["Dan. 7:13–14","One like a son of man comes with the clouds of heaven."],["Mark 14:61–64","Jesus: “I am, and you will see the Son of Man… coming with the clouds of heaven.”"],["1 Cor. 15:24–25","Christ’s authority over all."],["Rev. 19:11–16","Faithful and True on a white horse; King of kings and Lord of lords."],["2 Tim. 1:8–12","“I know whom I have believed.”"],["Rev. 21:1–6","New heaven and new earth; “Behold, I am making all things new.”"]],"secs":[{"t":"Opening: Monopoly Without Rules","h":"<p>Kids who play Monopoly before they know the rules make up their own, older kids bully younger ones, the money is meaningless, and the game never ends because no one has an end goal. Andrew made his own kids play properly — and crushed them. The point: our culture thinks of history like that, with no end in view.</p><div class=\"q\">“The game never ends because there’s no goals in mind. The money really is fake money. They don’t know how to use it.”</div><p>Christianity has a different view: the Greek word <i>telos</i> — history is pointed in a direction and will find an end.</p>"},{"t":"The Interpretive Challenge: Three Views","h":"<p>Last week covered the destruction of Jerusalem (vv. 20–24). Verse 25 seems to shift to the second coming — yet verse 32 says “this generation will not pass away until all has taken place.” Andrew read around fifty commentaries and found roughly a hundred answers.</p><ul><li><b>Full Preterist:</b> everything was fulfilled in 70 AD; the “coming” is God’s judgment via the Roman army.</li><li><b>Multiple fulfillment (Andrew’s view):</b> 70 AD first, then the repeated pattern of tribulation through history, ultimately Christ’s final return. “It accounts for the data the best.”</li><li><b>Generational type:</b> “this generation” is a type of people (wicked, righteous, believing), not a time period.</li></ul><div class=\"key\">“Regardless of your view, the application for our lives is the same — no matter what happens to us, we’re to joyfully anticipate the return of Christ.”</div>"},{"t":"The World Shakes (vv. 25–26)","h":"<p>This is a passage about judgment — uncomfortable. The target is “the world”: the system of people who persistently refuse Christ, with its habits, comforts, promises and hopes.</p><div class=\"q\">“A warning is always an act of mercy.”</div><p>(Like tornado-warning signs on Missouri hotel doors: mercy, not anger.)</p><p><b>The world is confused.</b> Our culture has “signed divorce papers with truth” — it lies about bodies, money, time, happiness — and will still claim to know the truth when judgment arrives (1 Cor. 1:19–21; James 3:13–15).</p><p><b>The world is weak with fear.</b> Building societies is good (Gen. 1 dominion), but we drift to thinking we did it alone — like rereading an email you thought was razor-sharp. Then God’s judgment meets what we thought was great (Isa. 13; Jer. 17; Ps. 33). Europe’s castles once housed people who thought they were extremely important; now they’re rocks on a tourist itinerary.</p><div class=\"key\">If you stand on your own power and achievements, judgment comes on those no matter how strong they seem, if you’ve not turned to Christ.</div><p><b>The delay is mercy</b> (2 Pet. 3:8–10): “The delay of judgment is not approval of your life. It is not indifference… It is not laziness on the part of God. It is mercy.”</p>"},{"t":"The Son Returns (v. 27)","h":"<p><b>On clouds.</b> Clouds mark God’s presence (Exod. 34; Ps. 104). Daniel 7:13–14 is the source of Jesus’s “Son of Man” — and the high priest understood it: when Jesus said “I am,” he tore his robes (Mark 14:61–64). We worship the Lord of the universe, embodied in Jesus, who will return in that body.</p><p><b>With power.</b> He made the world, saves it, will judge and restore it (1 Cor. 15:24–25). Andrew wryly asks who believes politicians will deliver:</p><div class=\"q\">“When Christ returns, he can do it all. He doesn’t need your vote. He doesn’t need your money. He can actually right all wrongs.”</div><p><b>With glory</b> (<i>doxa</i> — reputation, the weight of who you are). First coming: infant in a manger, no army, no home, rejected, betrayed, beaten, crucified. “The second time will not look like this.” (Rev. 19:11–16)</p><div class=\"key\">When he shows up, everyone will be on their knees either in worship or under the weight of judgment.</div>"},{"t":"The Church Anticipates (v. 28)","h":"<p>Followers and non-followers see the same events and respond completely differently: those who repented and trusted Christ have had their judgment spent — Christ bore it — so he has none left to give them.</p><p>To anyone who thinks “do good, go to heaven; do bad, go to hell”: the Bible teaches you were completely unable to gain God’s favor and needed someone to do it for you. Christ lived perfectly, died under wrath in our place, and all who turn and trust are declared righteous. Today is the day of salvation.</p><p><b>Bent but unbroken.</b> Paul writing from prison (2 Tim. 1:8–12). For those walking through illness, relational pain, financial strain, or the creeping losses of age — things taken that don’t come back — Christ’s return is not an interruption but a rescue (Rev. 21:1–6).</p>"},{"t":"Closing: Shackleton on Elephant Island","h":"<p>From the book <i>Endurance</i>: Shackleton’s trans-Antarctic attempt fails; the ship freezes in the ice. His men reach Elephant Island, and he leaves twenty-two behind while he takes five to find help. The twenty-two build a whole society — overturned lifeboats for shelter, hunting parties, watches — and survive four months. Everything they made was essential to survival.</p><div class=\"key\">“They see Shackleton and immediately all of it’s worthless. They can abandon camp. They can get on the boat.”</div><div class=\"q\">“I’m tempted to stay here, to build a permanent life. And the things here — they do matter. But I believe, like these men, when I see Christ, everything else becomes worthless.”</div><p><b>“Stand up straight. Stand up straight. Look to Christ. He’s coming back.”</b></p>"}],"qs":["Andrew says our culture thinks of history like kids playing Monopoly without rules — no end, no telos. How has that assumption shaped how you actually live day to day?","Which of the three interpretive views resonates most with you, and does it change the application Andrew draws?","“The delay of judgment is not approval of your life — it is mercy.” How does that reframe God’s patience right now?","Where are you most tempted to trust the world’s counsel over Scripture’s?","Andrew contrasts a humble first coming with a glorious second. What does that tell you about how Christ works, and how you wait for him now?","For those in Christ, his return is redemption, not judgment. Where do you still experience it as a threat? What would it look like to welcome it?","The men on Elephant Island abandoned their survival infrastructure the moment their rescuer arrived. What in your life is hardest to hold loosely?"]},{"id":"eoh2","tab":"End of History 2","color":"#6b4f2a","title":"The End of History, Part 2","meta":"Zac Nazarian · Hope Chapel","ref":"Luke 21:29–36","verse":"“Look at the fig tree, and all the trees. As soon as they come out in leaf, you see for yourselves and know that the summer is already near. So also, when you see these things taking place, you know that the kingdom of God is near… Heaven and earth will pass away, but my words will not pass away.”","big":"Because Jesus is returning — the fulfillment of every biblical promise — believers fix their eyes on him through the signs, stand firm on his unshakeable Word, and live in eager, watchful expectation.","take":["The second coming is “the most important of all biblical truths,” because every other truth finds its fulfillment there.","The signs aren’t meant to alarm but to focus our eyes on Jesus.","“This generation” most likely means those alive when the final signs occur — they will know the end is near.","Zac leans pre-tribulation, premillennial, and invites charitable disagreement.","The rapture and the second coming are two distinct events.","Heaven and earth will pass away, but Jesus’s Word stands forever."],"scr":[["John 14:15","“If you love me, you will obey me.”"],["Rom. 8:18–23","Creation groans, waiting in eager expectation for the revealing of the sons of God."],["Ps. 141:8; Heb. 12:2","Fix our eyes on the Lord / on Jesus."],["2 Tim. 3:1–4","Terrible times in the last days: lovers of self, money, pleasure."],["Dan. 11:31; 2 Thess. 2:3–4","The abomination of desolation; the man of lawlessness in God’s temple."],["Rev. 5:9–10","The new song of redemption in heaven."],["John 14:1–3","Jesus will come back and take his people to be with him."],["1 Cor. 15:51–52","Changed “in the twinkling of an eye.”"],["1 Thess. 4:16–18; 5:9","Caught up in the clouds; God did not appoint us to wrath."],["Zech. 14:4","At the second coming the Mount of Olives splits."],["2 Pet. 3:10–13","The heavens will disappear; we look for a new heaven and new earth."],["Rev. 21:1; Isa. 65:17","New heavens and new earth."]],"secs":[{"t":"Opening: Do You Love Jesus?","h":"<p>Zac opens with pointed questions: Do you love Jesus? How do you know? How does <i>he</i> know? Jesus gave the test himself.</p><div class=\"q\">“There’s only one test. What does he say? If you love me, you will — obey.”</div><p>Love for Jesus isn’t a warm feeling but faithfulness expressed in obedience. Are you concerned about his glory? Eagerly awaiting his return? He anchors this in Romans 8:18–23: the whole creation groans for what’s coming.</p>"},{"t":"The Most Important Biblical Truth","h":"<div class=\"key\">“I submit to you it’s the second coming of Jesus Christ… all other biblical truths find their fulfillment in his second coming. If he doesn’t come back, we got nothing.”</div><p>The return is the consummation of redemptive history and God’s eternal plan. Jesus’s fullest teaching on it is the Olivet Discourse (Matt. 24, Mark 13, Luke 21), given the Wednesday of his final week from the Mount of Olives.</p>"},{"t":"The Fig Tree: What Signs Do","h":"<ul><li><b>Signs can be seen.</b> Leaves announce summer. “If we’re not looking and thinking… we will miss the truth.” Jesus uses <i>know</i> (v. 31) deliberately — he doesn’t want his people to doubt or fall away.</li><li><b>Signs occur within one generation.</b> The 70 AD generation was warned, fled, and saw it happen exactly as said.</li><li><b>Signs are sure.</b> His words will not pass away.</li></ul><p><b>Signs focus our gaze</b> (Ps. 141:8; Heb. 12:2) — not to frighten but to direct us to Jesus.</p><p>Signs reviewed: false teachers and messiahs, wars, intensifying disasters, persecution, armies around Jerusalem, astronomical events — all growing in severity. 2 Tim. 3:1–4 shows the moral landscape. <i>“Things are getting worse. It’s a sign.”</i></p>"},{"t":"The Abomination of Desolation","h":"<p>Two specific signs mark the tribulation. First: midway through, the Antichrist — previously Israel’s protector — desecrates a rebuilt temple (Dan. 11:31; 2 Thess. 2:3–4). No such temple exists yet; Zac watches for any movement toward one.</p><p>The second half is the most severe outpouring of God’s wrath the world has seen; the Antichrist demands worship of his image on pain of death — yet those who comply face God’s wrath.</p>"},{"t":"“This Generation” — Who Is It?","h":"<p>Zac isn’t categorical, but reads it as most likely the generation alive when the final signs begin — not only 70 AD. As the first-century generation was warned to flee Jerusalem, the final generation will see the signs and know the Son of Man’s return is imminent. He believes that generation will be largely those saved after the church’s rapture.</p>"},{"t":"Where Zac Leans: Pre-Tribulation Rapture","h":"<p>He has studied about 25 commentaries and books and leans premillennial, pre-tribulation.</p><div class=\"q\">“I’m not setting it in cement. If you have a different view, God bless you. We’re not really going to know till it’s all over anyway.”</div><ul><li><b>1. Flow of Revelation.</b> The church is in chapters 1–3; in 4–5 the scene is heaven, with the 24 elders singing redemption (5:9–10); the church is absent from chapters 6–18 (tribulation); it returns with Christ in chapter 19.</li><li><b>2. No tribulation instructions for the church.</b></li><li><b>3. Key rapture passages:</b> John 14:1–3; 1 Cor. 15:51–52; 1 Thess. 4:16–18; 1 Thess. 5:9.</li><li><b>4. OT prefigurements:</b> Enoch (taken), Noah (delivered through the flood), Lot (rescued before Sodom’s judgment), Elijah (taken in a whirlwind). <i>“I just offer that to you for your consideration.”</i></li><li><b>5. Two distinct events:</b> at the rapture the church meets Jesus in the air; at the second coming it returns with him. Olives untouched vs. split (Zech. 14:4). Rapture is signless and imminent; the second coming has preceding signs. Rapture involves only the saved; the second coming, saved and lost.</li></ul>"},{"t":"Heaven and Earth Will Pass Away — His Word Won’t","h":"<p>Verse 33 isn’t hyperbole: the present heavens and earth will be destroyed; his Word stands forever.</p><div class=\"q\">“I stand on his word. Not that voice over there. Not that philosophy. Not that person. I stand on his word. That’s all I need.”</div><p>2 Pet. 3: the same word that made the heavens and flooded the world now reserves the present heavens and earth for fire. After the millennium — Jesus’s thousand-year reign — God makes a new creation (Rev. 21:1; Isa. 65:17).</p>"},{"t":"Closing","h":"<p>Zac returns to Romans 8’s golden chain: those God predestined he called; those he called he justified; those he justified he glorified. Already accomplished.</p><div class=\"key\">“He does it all. Our part is to trust him. Our part is to walk with him. Our part is to follow him. He’s faithful, and he will do it.”</div><p>He closes in prayer and leads the church to the Lord’s Table.</p>"}],"qs":["Zac says obedience is the one true test of love for Jesus. Where is God calling you to trust and obey even when it’s uncomfortable?","He calls the second coming “the most important of all biblical truths.” Does that surprise you? How much does Christ’s return shape your daily life?","The signs are meant to fix our gaze on Jesus, not frighten us. When you hear disturbing news, does it draw you to Christ or to anxiety?","Zac walks through Enoch, Noah, Lot and Elijah as possible prefigurements of the rapture. What do they have in common, and what does that suggest about those God rescues?","Which of the three — dissipation, drunkenness, cares of this life — is your most present temptation?","“Heaven and earth will pass away, but my words will never pass away.” What would building your life more firmly on that look like?","Zac ends: “Our part is to trust him… walk with him… follow him.” What is one concrete step you could take this week?"]},{"id":"eoh3","tab":"End of History 3","color":"#a0452c","title":"The End of History, Part 3","meta":"Zac Nazarian · Hope Chapel","ref":"Luke 21:34–36","verse":"“But watch yourselves lest your hearts be weighed down with dissipation and drunkenness and cares of this life, and that day come upon you suddenly like a trap… But stay awake at all times, praying that you may have strength to escape all these things that are going to take place, and to stand before the Son of Man.”","big":"Because Jesus’s return is imminent and his judgment certain, believers live in constant readiness — watchful, prayerful, and urgently sharing the gospel with those not yet ready.","take":["Jesus didn’t say when he’s coming, only that he is — and we must be dressed and ready.","The rapture is the next event on Jesus’s calendar: imminent, could happen without warning.","Three things weigh down hearts and rob readiness: dissipation, drunkenness, and anxiety.","Worry isn’t just understandable — Jesus commands us not to, and to trust God’s perfect plan.","Anticipating his return should produce holy living and urgent evangelism, not passive waiting.","Everyday evangelism: daily prayer, a prayer list of lost friends, and real time with non-believers."],"scr":[["Rev. 18:21–23","The fall of Babylon: no music, light, or voice of bridegroom and bride ever again."],["Rom. 1:7; 1 Thess. 1:10; 2 Thess. 2:1","Waiting fo
